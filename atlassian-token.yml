- name: getCapacityPlanAllocations
  description: 'Find who is allocated to what work in Individual Capacity Planning, across all capacity plans or scoped to a board, project, or capacity plan.

    USE WHEN the user asks what someone is working on, who is working on an issue or project, whether a contributor is on a given work item, how loaded or available someone is, or how staffed a work item is. People are contributors, not assignees: allocation is independent of the Jira assignee field - use the Jira tools for assignees.

    Pass contributorDataIds for the work those people are allocated to, workDataIds for who is allocated to those items, or both to check one contributor against one item. At least one is required; resolve non-project work ARIs with listCapacityPlanNonProjectWork rather than fabricating them.

    Returns contributor-work associations with contributor and work names/keys. expand adds ''contributions'' (allocated value per period), ''contributorAggregations'' (a contributor''s total contribution AND availability across all plans unless scoped - "how loaded is X") and ''workAggregations'' (total effort across all contributors on an item - "how staffed is PROJ-42"); both aggregations come back as separate top-level objects, and all three can be combined.

    IMPORTANT: contributionStartDate and contributionEndDate do NOT filter which associations are returned - they only set the window for the contribution and aggregation figures. To check whether a contributor is allocated during a period, request contributions for that window and see whether any come back.

    A baseline 40-hour working week means 5 days, 40 hours and 100 percent are the same amount - say so when reporting days or percentages.

    PAGINATION - YOU MUST CHECK THIS: results come back one page at a time. When the response has pageInfo.hasNextPage = true the allocations list is INCOMPLETE - more contributor-work associations exist that are not in this response. Do NOT draw conclusions (totals, counts, "that''s the whole team", "nobody else is allocated") from a single page when hasNextPage is true. To get the rest, call again with after set to pageInfo.endCursor and repeat until hasNextPage = false, then combine every page before answering. For a broad "everyone''s allocations for this range" request, keep paging until  hasNextPage = false.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    scopeId: Limits results to one capacity plan, identified by its board ARI (ari:cloud:jira-software:{cloudId}:board/{boardId}) or project ARI (ari:cloud:jira:{cloudId}:project/{projectId}) on the selected site - e.g. "the board 104 plan" is ari:cloud:jira-software:{cloudId}:board/104. Mutually exclusive with capacityPlanId; a capacity plan ARI goes in capacityPlanId instead. Omit both unless the user asks about a specific plan.
    capacityPlanId: Capacity plan ARI (starts with ari:cloud:capacity-planning:) that limits results to that plan. Use only when the user supplies a capacity plan ARI; for a board or project use scopeId. Mutually exclusive with scopeId. An unknown plan is rejected.
    scopeView: 'How plan membership is decided when scopeId or capacityPlanId is set: PEOPLE (used when omitted) keeps people who are members of the plan; WORK keeps work items that belong to the plan. Omit for an unscoped query.'
    contributorDataIds: Contributor ARIs shaped ari:cloud:identity::user/{accountId}, where {accountId} is an Atlassian account ID (e.g. ari:cloud:identity::user/5ea00a99d31fdf0c0d783dd5). Maximum 20. Finds the work these people are allocated to. At least one of contributorDataIds or workDataIds is required, and expand's contributorAggregations requires this one.
    workDataIds: 'Work item ARIs, maximum 20. Supported forms: Jira issues (ari:cloud:jira:{cloudId}:issue/{issueId}), Atlas projects (ari:cloud:townsquare:{cloudId}:project/{projectId}), and non-project work / custom contribution targets (ari:cloud:capacity-planning::custom-contribution-target/activation/{activationId}/{targetId}). Finds who is allocated to these items. At least one of contributorDataIds or workDataIds is required, and expand''s workAggregations requires this one.'
    contributionStartDate: 'Start of the window for the returned contribution and aggregation figures, as YYYY-MM-DD. Does NOT filter which associations are returned. Default window: no dates = one year either side of today, start only = two years forward, end only = two years back; when both are given they must be in order and span at most two years. The window also sets the default reporting period: weekly up to three months, monthly up to a year, quarterly beyond that.'
    contributionEndDate: End of that same window, as YYYY-MM-DD. Does NOT filter which associations are returned. See contributionStartDate for the default windows and the two-year limit.
    expand: 'Array of extras to include: ''contributions'' (allocated value per period in the contribution window, per allocation), ''contributorAggregations'' (per contributor, total contribution and availability across all plans unless scoped; requires contributorDataIds), and ''workAggregations'' (per work item, total contribution effort across ALL contributors; requires workDataIds, and carries totalContribution only, since work items have no availability). Both aggregations are returned as separate top-level objects. Combine freely, but omit expand entirely when the association itself is the answer, e.g. "is Chris on PROJ-42?" - each value costs extra work upstream. When scoped, totals cover only the targeted plan and follow its cadence settings.'
    contributionFormatOptions: 'Unit for every effort value returned - per-allocation contributions, contributor totals and availability, and work totals. Shape: { "valueType": "PERCENTAGE" | "HOURS" | "DAYS" }, default PERCENTAGE. Use HOURS or DAYS when the user asks about effort, PERCENTAGE for utilisation or how much of someone''s time is taken up. The response echoes the unit in its top-level valueType field. Applies whenever expand is set.'
    timeScale: 'Bucket granularity for the aggregation figures. Omitted means adaptive from the contribution window: weekly up to three months, monthly up to a year, quarterly beyond that. Only applies when expand includes contributorAggregations or workAggregations - per-allocation contributions always use the adaptive scale. When scoped, the plan''s cadence settings can override this and the aggregation window, so read timeScale, startDate and endDate from the response.'
    first: Page size for forward pagination. Mutually exclusive with last; pair with after for subsequent pages.
    after: Cursor for forward pagination. Pass pageInfo.endCursor from the previous response.
    last: Page size for backward pagination. Mutually exclusive with first; pair with before for previous pages.
    before: Cursor for backward pagination. Pass pageInfo.startCursor from the previous response.
- name: getCollaborators
  description: '(Beta) Find a person''s strongest collaborators across Atlassian work, ranked by collaboration score. Omit accountId, name, and email to use the current user; otherwise supply accountId or resolve one person with name and/or email. Limit controls the number returned.


    This tool is in beta and is not generally available. Usage is not billed during beta. Pricing details will be announced when the tool becomes generally available.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    accountId: Atlassian account ID to analyze
    name: Resolve the target user by display name
    email: Resolve the target user by email; combine with name to disambiguate
    limit: Maximum collaborators to return
- name: getConfluenceApproval
