- name: updateCapacityPlanAllocations
  description: 'Allocate people to a single work item over one or more time periods in Individual Capacity Planning.

    USE WHEN the user asks to put someone on a work item for a period, to change how much of their time it takes, to book leave, or to clear an allocation.

    Every person in contributorDataIds is assigned to the work item automatically, so it does not need to be assigned to them first, and every allocation is applied to every person - the number of writes is contributorDataIds x allocations, which must not exceed 100. Only one work item per call. Resolve a non-project work ARI with listCapacityPlanNonProjectWork rather than fabricating one.

    Each allocation covers a period and carries the TOTAL effort for that period, of any length. To express a RATE, send one allocation per interval: "2 days a week for three weeks" is three allocations of 2, NOT one allocation of 2 spanning three weeks. A single allocation spanning all of September means "this much effort across September", which the plan spreads over the weeks in it.

    Re-running the same periods REPLACES those allocations rather than adding to them, so the call is safe to repeat; set value to 0 to clear a period.

    Because value is the TOTAL for the period and re-running replaces it, any RELATIVE change - "add a day", "bump Chris to 3 days", "halve it" - needs the current figure first. Call getCapacityPlanAllocations with the same contributorDataIds and workDataIds, the same date window, and expand: ["contributions"], then send the new total. Writing the relative amount directly overwrites the existing allocation instead of adding to it. An absolute request ("put Chris on PROJ-42 at 50% in September") needs no prior read.

    This does NOT add anyone to a capacity plan and cannot create work items - contributors and work items are global, so an allocation written here shows up on every plan they belong to, matching the UI.

    Add ''contributions'' to expand to return the value written per period and confirm what landed, ''contributorAggregations'' for each person''s total contribution and availability across ALL their work in the allocated window (use this to report whether the change has pushed someone over capacity), and ''workAggregations'' for the work item''s total effort across ALL contributors. Both aggregations come back as separate top-level objects. Omit expand when a simple confirmation is enough - each value costs extra work upstream.

    Capacity plans assume a baseline 40-hour working week, so 5 DAYS, 40 HOURS, and 100 PERCENTAGE are all the same amount - say so when reporting days or percentages.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contributorDataIds: Array of contributor ARIs identifying the people to allocate, in the form ari:cloud:identity::user/{accountId} where {accountId} is an Atlassian account ID (e.g. ari:cloud:identity::user/5ea00a99d31fdf0c0d783dd5). Each person is assigned to the work item if not already, and every allocation is applied to every person. Maximum 100, and contributorDataIds x allocations must not exceed 100.
    workId: 'ARI of the single work item to allocate to. Supported forms: Jira issues (ari:cloud:jira:{cloudId}:issue/{issueId}), Atlas projects (ari:cloud:townsquare:{cloudId}:project/{projectId}), and non-project work / custom contribution targets (ari:cloud:capacity-planning::custom-contribution-target/activation/{activationId}/{targetId}). One work item per call - allocating the same people to a second work item needs a second call.'
    allocations: 'The periods to allocate, each applied to every person in contributorDataIds. Array of objects shaped { "startDate": "YYYY-MM-DD", "endDate": "YYYY-MM-DD", "value": 2 } - all three fields required, startDate not after endDate, value a number >= 0 where 0 clears that period. value is the TOTAL effort for the period in the unit given by valueType, so send one object per interval to express a rate. Periods must be distinct; two objects covering the same period is an error. Maximum 100, and contributorDataIds x allocations must not exceed 100.'
    valueType: Unit for every value in allocations and for all returned effort figures. Defaults to PERCENTAGE. Use PERCENTAGE when the request is about utilisation or how much of someone's time is taken up, HOURS or DAYS when it is about effort. A baseline working week is 40 hours, so 5 DAYS, 40 HOURS, and 100 PERCENTAGE are all the same amount.
    expand: 'Optional extra data to return after the write, as an array of strings. Supported values: ''contributions'' (the value written per period, per allocation, so the result can be confirmed back to the user), ''contributorAggregations'' (per person allocated, total contribution and availability across ALL of their work for the allocated window - returned as a separate top-level object; use it to report whether the change left someone over-allocated), and ''workAggregations'' (the work item''s total contribution effort across ALL contributors on it - a separate top-level object with totalContribution only). Combine freely, or omit when a simple confirmation is enough.'
- name: updateCapacityPlanNonProjectWork
  description: 'Rename an existing non-project work item in Individual Capacity Planning. "Non-project work" is a bucket of time that is not a Jira issue or an Atlas project, such as Leave, Run the Business (RtB), on-call, or training.

    USE WHEN the user asks to rename an existing non-project work item. This only changes the item''s name; it does not move allocations, add contributors, or delete anything. To change who is allocated or how much effort a period carries, use updateCapacityPlanAllocations instead.

    Resolve the item''s id first with listCapacityPlanNonProjectWork rather than fabricating one. Returns whether the update succeeded and any errors.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    id: Identifier of the non-project work item to rename. Resolve it with listCapacityPlanNonProjectWork rather than fabricating one.
    name: New display name for the non-project work item, e.g. "Annual Leave".
- name: updateConfluenceComment
  description: Update an existing Confluence footer or inline comment on a page or blog post
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    commentId: Numeric ID of the footer or inline comment to update. Confluence comment IDs are int64 values (max 19 digits).
    body: 'Replacement comment body object. Use { "format": "markdown" | "html", "value": "..." }. format is required and must be "markdown" or "html"; value is required, non-empty, and at most 4096 characters.'
    commentType: 'Optional type guard. When set, the target comment must match: "footer" for page-level comments or "inline" for anchored comments.'
    expectedVersion: Optional current version observed by the caller. Used for optimistic concurrency; stale values return version_conflict guidance.
- name: updateConfluenceCommentResolution
  description: Resolve or reopen a Confluence footer or inline comment
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    commentId: Numeric ID of the top-level footer or inline comment to resolve or reopen. Confluence comment IDs are int64 values (max 19 digits).
    resolved: Set to true to resolve the comment, or false to reopen it.
    commentType: Optional type guard. Set to "footer" for page-level comments or "inline" for anchored comments.
- name: updateConfluenceContent
  description: "Update Confluence docs, whiteboards, or databases.\nUse this tool for explicitly requested direct edits. For requests to add, push, submit, or otherwise send reviewable suggestions to an existing Confluence page, use addConfluenceContentSuggestions instead if available; find it with discover if it is not in your tool list. It may not yet be available. If discovery does not return the tool, ignore this suggestions-routing guidance and do not mention the missing tool to the user. For ambiguous requests for suggestions or improvements, give recommendations and check availability before asking whether to submit them to Confluence for review. Respect chat-only requests.\nFor edits to classic pages (type=page), fetch the full draft in the intended body format\nwith getConfluenceContent(draft=true, detail=full), and use that content and its returned snapshotToken.\nIf the token is missing, published-base or stale, refetch the draft and reapply the edit.\nUpdate draft=true saves the draft; omit it to publish, according to user intent.\n\nBefore choosing body.format or authoring an edit, call getContentFormatGuide\nwith executeRead (or execute) as name=getContentFormatGuide and inputs={toolName}.\nSet toolName to updateConfluencePage\nfor pages, blog posts, and live docs; updateConfluenceWhiteboard for\nwhiteboards; or updateConfluenceDatabase for databases.\n\nSpace instructions describe how to author content in a Confluence space.\nApply relevant guidance to the content you create or update. Follow this\ndecision rule:\n1. Before authoring, call getConfluenceSpace for the target space unless\n   getConfluenceContent returned metadata.hasSpaceInstructions=false for\n   content in that space. If getConfluenceSpace already returned for the\n   same cloudId and space during the current task, reuse its\n   spaceInstructions and do not call it again.\n2. When the value is true or unknown and instructions have not been\n   loaded, you must call getConfluenceSpace once before authoring through\n   executeRead (or execute) with name=getConfluenceSpace, top-level cloudId, and\n   inputs={spaceIdOrKey}.\n3. Apply any returned spaceInstructions. If a successful response omits\n   them, no instructions are configured; author with defaults and do not\n   block.\n\nAfter a successful getConfluenceSpace call, do not make a separate\ngetConfluenceSpaceInstructions call."
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric Confluence content ID. One of contentId or contentUrl is required.
    contentUrl: 'Full URL of the Confluence content. One of contentId or contentUrl is required.

      Clear Confluence URLs for pages/live docs (/pages/{id}), blogs

      (/blog/{id}), whiteboards (/whiteboard/{id}), databases

      (/database/{id}), and folders (/folder/{id}) are normalized to their

      numeric content ID before the update is sent, so URLs copied from the

      product should work directly.'
    snapshotToken: 'Opaque token from the most recent getConfluenceContent or updateConfluenceContent

      response for this content. Each successful update returns the current snapshot.token;

      pass it to the next update, because changes to the content make earlier tokens

      stale. On snapshot_stale, re-read the content with getConfluenceContent and reapply

      the change to the latest body before retrying; do not resend the same payload with

      currentSnapshot.token.

      Required for doc-type updates that mutate page/blog/live_doc content or contentWidth.

      Not used for whiteboard svg or database csv object updates.'
    title: New title for the content. 1-255 characters. Omit to keep existing title.
    body: 'Before composing this body, follow the space-instruction decision rule in the tool

      description. Reuse known instruction state and do not repeat the space lookup per write.

      Read the format guide once per task before you write this body or edit, also when you

      know HTML: Confluence HTML is not standard HTML. getContentFormatGuide is a valid

      operation name; you do not need discover.

      Body update object with format and value. Doc types accept format html or

      markdown. Prefer HTML. Use markdown only when you are confident the content needs

      only basic text formatting and has no rich Confluence elements to preserve or create,

      such as panels, layouts, media, whiteboard embeds, or Remixes. If unsure, use HTML.

      Re-read existing rich content as HTML before editing and preserve its content and embeds.

      Whiteboards accept format svg and should include

      context.content with the current SVG when applying a patch. Databases

      accept format csv and should include context.content with the current

      CSV when applying an edit envelope. Put the raw patch/envelope directly in

      value; do not wrap it in an extra JSON object or {"content": "..."}

      wrapper. For whiteboards, value is a patch, not a full SVG replacement.

      For databases, value is an edit envelope, not a create payload. Mutually

      exclusive with edits.'
    edits: 'Granular edit operations. Array of tool-call objects, each with name

      (replaceNode, insertNodeAfter, insertNodeBefore, deleteNode, removeNodes,

      moveNode, appendNodeToEnd, setAttrs), localId, value, and arguments.

      Mutually exclusive with body.'
    dryRun: 'If true, validate and preview the result without persisting. For edits,

      returns the resulting HTML. For body replacement, echoes the input.'
    draft: 'If true, update the draft version instead of current. Only supported

      for page and blogpost doc edits.'
    versionMessage: Optional version comment/message for the content update.
    minorEdit: Whether to mark the new content version as a minor edit.
    ownerId: 'Atlassian account ID of the new owner to transfer page ownership to. Optional.

      This is an account ID (e.g. 5b10ac8d82e05b22cc7d4ef5), never an email/username

      or a content ID. The new owner must already have edit permission.'
    contentWidth: 'Optional page width for doc types only: page, live_doc, and blogpost.

      Accepted values are narrow, wide, and max. The default width is narrow.

      Omit to keep the existing content width unchanged.

      A width-only update is valid and requires snapshotToken, but does not

      require title, body, or edits.

      Non-doc content types do not support this field.'
    headerImage: 'Page, live_doc, and blogpost header image. Omit to preserve.

      Use {clear: true} alone to remove the header, retaining its attachment.

      Set one of url (approved HTTPS Confluence gallery URL) or fileId (Media

      UUID from an image uploaded to this page), with optional position (0-100,

      default 50). Upload an image to this page before setting fileId.

      Supply position alone to reposition an existing image.

      Header-only updates do not require a snapshot or change the body version.'
- name: updateFocusArea
  description: Update one or more fields on an existing Focus area. Provide at least one of name, owner, startDate, description, or customFields — identifier-only calls fail upstream. Omitted fields are unchanged. Use createFocusAreaStatusUpdate for status, health, target date, or status summary changes. customFields sets or unsets custom field values (one or many per call, mixed sets and unsets allowed) and requires focusAreaIdentifier to be a focus area ARI; resolve definition ARIs and select option UUIDs with getFocusAreaCustomFields first — do not fabricate them. Multiple fields become separate mutations — a later failure can leave earlier fields already applied.
  params:
    focusAreaIdentifier: The focus area to update. Accepts a focus area UUID, a Mercury focus area ARI, or a Focus focus area page URL. Prefer values from a prior lookup over fabricating them. When reusing an identifier from an earlier response, pass its uuid field — not its id field.
    name: Optional new name for the focus area.
    owner: Optional Atlassian account ID (AAID) of the new focus area owner.
    startDate: 'Optional new projected start date. Object shape: { "date": "YYYY-MM-DDTHH:mm", "confidence": "DAY" | "MONTH" | "QUARTER" }. Both fields required when startDate is set. Example date: 2026-08-10T00:00 — bare calendar dates like 2026-08-10 are not accepted; append T00:00 when only the day is known. Requires focusAreaIdentifier to be a Mercury focus area ARI; UUID or URL identifiers fail this field — call getFocusArea and pass the returned ari.'
    description: Optional new about/description content in plain text or Markdown. An empty string clears the existing content. Value will overwrite existing content. Maximum 25,000 characters.
    customFields: 'Optional custom field values to set or unset, one item per field. Shape: [{ "customFieldDefinitionId": "<definition ARI>", "value": { "textValue": "..." } }]. The value object must contain exactly one key, and that key must match the field''s type from getFocusAreaCustomFields: textValue, numberValue, dateValue, booleanValue, option (one option UUID), options (option UUIDs), userId (one account ID), or userIds (account IDs). To unset a field, omit its value key entirely (a null or empty value object is treated the same) — empty options or userIds arrays are rejected rather than clearing the field. Sets and unsets can be mixed in one call. Requires focusAreaIdentifier to be a focus area ARI; UUID or URL identifiers fail this field — call getFocusArea and pass the returned ari. The response echoes the resulting values of set fields in customFields; cleared fields are not echoed back.'
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: updateJsmOpsAlert
  description: Update one Jira Service Management Operations alert by acknowledging, unacknowledging, closing, or escalating it. Escalation requires an escalation responder ID assigned to that alert. Optionally poll the asynchronous request status once.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    alertId: Alert ID to update.
    action: State-changing action to perform.
    escalationId: Required only when action is escalate. Must identify an escalation responder assigned to this alert.
    pollStatus: When true, poll asynchronous request status once after mutation. Defaults to false.
- name: updateLoomObjectMetadata
  description: Update the title or description of a Loom object, currently an async video or meeting recording. Provide at least one field; omit a field to leave it unchanged. Neither field may be empty. Identify the object by Loom video ARI, share URL, or embed URL. The response includes both resulting fields. Omit responseFields to keep the default result.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    identifier: Loom video or meeting recording ARI, share URL, or embed URL identifying what to update.
    title: New title for the Loom recording. Omit to leave it unchanged. Must be non-empty when provided. The returned title is nested at artifact.title.
    description: New description for the Loom recording. Omit to leave it unchanged. Must be non-empty when provided. The returned description is nested at artifact.description.
- name: updateLoomObjectVisibility
  description: Change who can access a Loom object, currently an async video or meeting recording. Set visibility to OWNER (only the owner), WORKSPACE (anyone in the workspace), or PUBLIC (anyone with the link). The change is immediate and does not notify specific people. Identify the object by Loom video ARI, share URL, or embed URL.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    identifier: Loom video or meeting recording ARI, share URL, or embed URL identifying what to update.
    visibility: 'Requested visibility: OWNER (only the owner), WORKSPACE (anyone in the workspace), or PUBLIC (anyone with the link).'
- name: updateTalentPositionFocusAreaMappings
  description: 'Allocate Talent positions to focus areas, or clear the focus area a position is allocated to. Each mapping sets the focus area of ONE position and REPLACES the focus area that position is allocated to now — a position is allocated to one focus area at a time, so this is not additive and it cannot add a second focus area to a position. Omit focusAreaId in a mapping to clear the allocation and leave that position unallocated. Every mapping is applied as a single all-or-nothing change, so one rejected ARI fails the whole call — keep batches small. Do not guess either ARI: take a position ARI from a searchTalentPositions result''s id or a getTalentPositionsByEntity result''s entityId, and take a focus area ARI from getTalentFields for the focus area field, or from searchFocusAreas. To see which positions a focus area is staffed by before or after the change, call getTalentPositionsByEntity with entity=focusArea.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    mappings: 'The allocations to apply, one object per position. Array of objects shaped { "positionId": "ari:cloud:radar:<cloudId>:position/<workspaceId>/<positionId>", "focusAreaId": "<focus area ARI>" }, where positionId is required and focusAreaId is optional. A mapping that omits focusAreaId clears the focus area of that position. Name each position once — two mappings for the same position leave the outcome undefined.'
- name: uploadAttachmentToJiraIssue
  description: 'Attach a single local file to a Jira issue. Two phases: (1) call with filePath only to get a local uploadCommand; run it from your shell to upload the bytes and obtain a fileId; (2) call again with that fileId to attach the file to the issue. To instead embed the uploaded file inline in a body, stop after phase 1 and pass the fileId (with its collection) to editJiraIssue/addOrEditJiraIssueComment via inlineFileId (appends at the end) or an HTML body media node (for positional placement) — do not also run phase 2 for the same file.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key (e.g. PROJ-123) or a Jira issue URL
    filePath: Local path of the file to attach (absolute, or relative to where uploadCommand is run). Provide for phase 1 to get an uploadCommand. Ignored when fileId is supplied.
    fileId: Media file ID returned by running the phase-1 uploadCommand. Provide for phase 2 to attach the uploaded file to the issue.
