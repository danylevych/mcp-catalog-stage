    expand: Optional details to include for a contentId. Values are progress and history. Up to 2 values. Not supported when listing pending approvals.
    cursor: Opaque pagination cursor returned from a previous expanded history response, or from a previous pending approvals list.
    limit: Maximum number of expanded history entries to return (1-100, default 25). When listing pending approvals, 1-50 (default 25).
