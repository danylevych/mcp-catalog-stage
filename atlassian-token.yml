- name: watchJiraIssue
  description: Add or remove the calling user as a watcher on a Jira issue. Always acts on you — it cannot add or remove another person, and it does not list who is watching. Watching only subscribes you to notifications about the issue; it does not assign it to you. To do that, set the issue's assignee field with editJiraIssue.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key (e.g. PROJ-123) or a Jira issue URL
    action: Whether to watch or unwatch the issue as the calling user. Defaults to "watch".
