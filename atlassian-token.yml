    repoId: Repository slug or UUID
    commitHash: Commit hash (full or short SHA)
    page: Page number
    pagelen: Page size
- name: listBitbucketRepoCommitReports
  description: List code-insights reports on a Bitbucket commit
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    commitHash: Commit hash the reports are attached to
    page: Page number for paginated results
    pagelen: Number of results per page, from 1 to 100. Defaults to 100.
- name: listBitbucketRepoCommits
  description: List commits in a Bitbucket repository
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    include: Branch, tag, or commit hash whose history to include. Defaults to the repository's default branch when omitted.
    exclude: Branch, tag, or commit hash whose history to exclude. Combine with include to list only commits reachable from include that are not reachable from exclude (e.g. include=feature, exclude=main).
    page: Page number
    pagelen: Page size, from 0 to 100. Defaults to 30.
    ctx: Opaque traversal cursor from a previous listBitbucketRepoCommits response. It pins the commit graph traversal to the ref tips resolved on page 1. Omit on the first request. When the previous response included ctx, pass it back unchanged with the next page for performance and consistency; omitting it starts a new commit graph traversal and re-resolves those refs, making the operation very expensive.
