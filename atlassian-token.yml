name: Atlassian (via token)
entryKey: atlassian-token
shortDescription: "Jira, Confluence and Bitbucket from every Atlassian organization your account belongs to, with one API token"
description: |
  The same Atlassian Rovo MCP server as the Atlassian connection, signed in with your email and an API token instead of OAuth.
  An OAuth connection is tied to one site; a token reaches every site and Bitbucket workspace your Atlassian account can open, so Jira and Bitbucket from different organizations work in one connection.

  ## What you'll need to connect

  - The email of your Atlassian account (filled in with the one you sign in with here; change it if your Atlassian account uses another).
  - A scoped API token for Atlassian MCP V2: [create one](https://id.atlassian.com/manage-profile/security/api-tokens?autofillToken&expiryDays=max&appId=mcp-v2&selectedScopes=all).

  **Important for Admins**: API token sign-in must be allowed for the Rovo MCP server in [Atlassian Administration](https://admin.atlassian.com) of each organization, otherwise every call answers that you have no permission to connect via API token.

  Code search and Teams tools are available only through the OAuth connection.
metadata:
  categories: "Developer Tools"
  basic-auth-username: ATLASSIAN_EMAIL
icon: https://avatars.githubusercontent.com/u/168166?s=200&v=4
repoURL: https://developer.atlassian.com/cloud/rovo-mcp/guides/configuring-authentication-via-api-token/
runtime: remote
remoteConfig:
  fixedURL: https://mcp.atlassian.com/v2/mcp?tools=all
config:
  - name: Atlassian account email
    description: The email of the Atlassian account that owns the API token.
    key: ATLASSIAN_EMAIL
    required: true
    sensitive: false
    usage: interpolated
  - name: Atlassian API token
    description: "A scoped API token for Atlassian MCP V2: [create one](https://id.atlassian.com/manage-profile/security/api-tokens?autofillToken&expiryDays=max&appId=mcp-v2&selectedScopes=all)."
    key: Authorization
    required: true
    sensitive: true
    prefix: "Basic "
    usage: header
toolPreview:
- name: addBitbucketRepoPullRequestComment
  description: Add a comment to a Bitbucket pull request
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    prId: Numeric pull request ID. Use the exact input key prId.
    content: Comment text (markdown)
    parentCommentId: Reply to an existing comment thread by its ID
    pending: Create as a pending/draft review comment instead of publishing immediately
    inlinePath: File path to anchor an inline or file-level comment. Path only (no line) = file-level comment.
    inlineToLine: Line on the new (added/modified) side. Requires inlinePath. Mutually exclusive with inlineFromLine.
    inlineFromLine: Line on the old (original/deleted) side. Requires inlinePath. Mutually exclusive with inlineToLine.
    inlineToLineStart: Start line for a multi-line comment on the new side. Requires inlineToLine; must be <= inlineToLine.
    inlineFromLineStart: Start line for a multi-line comment on the old side. Requires inlineFromLine; must be <= inlineFromLine.
- name: addConfluenceContentPermissions
  description: "Adds one or more content-level permission grants to a single Confluence\ncontent entity. Existing grants for other principals are preserved; to\nreplace the full set, use replaceConfluenceContentPermissions instead.\n\nThese are Specific access grants: operation `read` = Can view; `update` =\nCan edit and already includes view. A principal has exactly ONE level, so\nassigning `read` to a principal who currently has `update` is a downgrade\nto view-only. Never include the same principal under both operations.\nAdding a grant does NOT restrict others, make content private, or change\nGeneral access; use setConfluenceContentRestrictionState for that baseline.\nPrivate creation already gives the creator `update`. Do not add `read` for\nthat creator, because update already includes view. Existing-state and\nself-lockout rules are enforced by the Confluence monolith.\n\nEach grant pairs an operation with a list of principals. Pass the grants via\nthe `permissions` input, an array of objects shaped exactly like:\n  [\n    {\n      \"operation\": \"read\",\n      \"principals\": [\n        { \"principalType\": \"user\",  \"principalId\": \"<atlassian-account-id>\" },\n        { \"principalType\": \"group\", \"principalId\": \"<group-id>\" }\n      ]\n    }\n  ]\nEnums: operation is one of read | update; principalType is one of\nuser | group. For a user, principalId is the Atlassian account ID; for a\ngroup, principalId is the group ID."
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content entity (page, blog post, whiteboard, database, folder, etc.) to add permission grants to.
    permissions: 'Permission grants to add. Array of objects, each with an `operation`

      (read | update) and a `principals` array. Each principal has a

      `principalType` (user | group) and a `principalId` (Atlassian account ID

      for a user, group ID for a group). A principal must appear under only

      one operation across the entire request. Example:

      [{ "operation": "read", "principals": [{ "principalType": "user", "principalId": "5b10a..." }] }].'
- name: addConfluenceContentSuggestions
  description: Add reviewable edit or Remix suggestions to Confluence content without changing the content itself. Use this tool when the user explicitly asks to add, push, submit, or otherwise send suggestions to Confluence for review. If the user only asks for suggestions, or it is ambiguous whether they want a reply or an action, do not call this tool yet; ask whether they would like to push the suggestions to Confluence for review. Before building suggestions, invoke getContentFormatGuide with toolName=addConfluenceContentSuggestions. Call it directly if exposed; otherwise use discover, then run it through execute (or executeWrite when tiered runners are exposed).
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the existing Confluence page that will receive the suggestions.
    contentType: The target content type, matching the type returned when fetching the content.
    suggestions: 'Up to 50 suggestions. Each requires type, short_description, description,

      reasoning, and action. Edit actions require non-empty toolCalls; the first

      call''s arguments.localId sets the anchor. Remix actions require unique

      localIds, userPrompt, and launchOptions.dynamicUiType, and omit toolCalls.

      sources is optional; use it instead of deprecated source_aris.

      Call getContentFormatGuide for the complete action shapes, supported edit

      operations, source rules, and Confluence HTML format.'
    replacementMode: 'Pending suggestions to replace before adding this batch. SAME_SOURCE (the

      default) replaces suggestions with a matching source ARI or URL; source-less

      suggestions replace only source-less suggestions. NONE preserves all pending

      suggestions; use it only for an additive submission or a later batch whose

      source cohort was already cleared. ALL replaces all pending suggestions and

      should be used only for an intentional reset.'
- name: addConfluenceReaction
  description: Add emoji reaction to Confluence content
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric Confluence content ID (page, blog post, or comment).
    emojiId: Emoji ID as hex codepoint (e.g. 1f44d for 👍, 1f624 for 😤) or custom emoji UUID.
- name: addConnectionsToGoals
  description: Add one type of connection to one or more Atlassian Goals.
  params:
    goalIds: Goal ARIs to connect. The number of Goals multiplied by the number of targets must not exceed 50.
    connection: 'Connection type and targets to add. Provide { "type": "<type>", "targets": [...] }.

      Supported types are TAG, FOLLOWER, TEAM, PROJECT, and JIRA_WORK_ITEM.

      TAG targets contain exactly one tag id or name. FOLLOWER targets contain an

      Atlassian account id. All other targets contain the target ARI in id.'
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: addConnectionsToProjects
  description: Add one type of connection to one or more Atlassian Projects.
  params:
    projectIds: Project ARIs to connect. The number of Projects multiplied by the number of targets must not exceed 50.
    connection: 'Connection type and targets to add. Provide { "type": "<type>", "targets": [...] }.

      Supported types are TAG, FOLLOWER, USER_CONTRIBUTOR, TEAM_CONTRIBUTOR, GOAL,

      JIRA_WORK_ITEM, and EXTERNAL_LINK. TAG targets contain exactly one tag id or

      name. FOLLOWER and USER_CONTRIBUTOR targets contain an Atlassian account id.

      Other ID-based targets contain the target ARI in id. EXTERNAL_LINK targets

      contain a url and may include a name.'
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: addGraphContext
  description: Adds a relationship between two entities in the Teamwork Graph (e.g. linking two Jira work items, marking one as blocking another, attaching a remote link, or connecting a Jira work item to an Atlas project or goal).
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    relationshipType: Type of relationship to create. Determines which entity types 'objectIdentifier' and 'targetObjectIdentifier' must resolve to.
    objectIdentifier: Identifier of the source entity. Accepts an ARI, a full URL, or a stable key (e.g. ENG-123 for a Jira work item). Format depends on relationshipType.
    targetObjectIdentifier: Identifier of the target entity. Accepts an ARI, a full URL, or a stable key (e.g. ATLAS-20426 for an Atlas project). Format depends on relationshipType.
    title: Optional display label for the target. Used by relationships that surface a title (e.g. remote links); ignored otherwise.
- name: addLabelsToConfluenceContent
  description: Add labels to any Confluence content (page, blogpost, attachment, custom content)
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric Confluence content id (page / blogpost / attachment / custom content)
    labels: 'Labels to add. Provide 1-50 entries. Each array item is an object: { "name": "...", "prefix": "global" | "my" | "team" }. name is required, non-blank, at most 255 characters, and cannot contain whitespace. prefix is optional and defaults to "global" server-side.'
- name: addLoomInteraction
  description: Add a text comment or emoji reaction at a specific point in a Loom video or meeting recording. The timestamp is in milliseconds (for example 90000 for the 1:30 mark). Use interactionType COMMENT with body for a text comment, or REACTION with emoji for an emoji reaction. Identify the recording by Loom video ARI, share URL, or embed URL.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    identifier: Loom video or meeting recording ARI, share URL, or embed URL identifying where to add the interaction. The result has success and an interaction object. Omit responseFields for the default result; to filter, select success or interaction.id, interaction.type, interaction.timestampMs, interaction.body, or interaction.emoji.
    interactionType: COMMENT to add text feedback or REACTION to add an emoji reaction.
    timestampMs: Position in the video in milliseconds at which to add the interaction, for example 90000 for 1:30. Must be greater than or equal to 0.
    body: Plain-text content of the comment. Required when interactionType is COMMENT. Maximum 5000 characters.
    emoji: Emoji reaction to add, for example clap. Required when interactionType is REACTION.
- name: addOrEditJiraIssueComment
  description: 'Add a comment to a Jira issue, or edit an existing one: omit commentId to add, or pass one from listJiraIssueComments to edit. Returns the commentId, needed to edit or delete it later. When no file was appended through inlineFileId, it also returns the echoed body and its format (appliedContentFormat).'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key (e.g. PROJ-123) or a Jira issue URL
    commentBody: 'Comment text. Markdown by default; set contentFormat: html to pass HTML instead. Required unless adding a new comment purely to embed a file via inlineFileId. Editing replaces the whole comment body: pass the full intended text (fetch the current comment first to preserve it), or "" for media only. Editing a body that already contains inline media must use contentFormat: html — markdown drops it. For HTML body shapes (inline media, panels, tables), first get the format guide via the generic operation runner (execute) as name=getContentFormatGuide, inputs={toolName: "addOrEditJiraIssueComment"}.'
    contentFormat: Body format for commentBody. Defaults to markdown. html preserves inline media across a read-modify-write; a body fetched as HTML can be written straight back (Jira resolves media collection/filename server-side and omits them on read — not data loss). Requires the HTML content-format feature; when it is disabled the call is rejected rather than downgraded, because markdown would store the HTML tags as literal text and drop the media.
    commentVisibility: 'Restrict comment visibility to a Jira group or role. Shape: `{"type":"group"|"role","value":"<name>"}`.

      Role and group names are site-specific, so do not reuse a name from another site.

      On JSM this does not make a comment internal — a restricted comment stays customer-visible

      (`jsdPublic: true`). Use `jsmCommentType: "internalNote"` for that.'
    jsmCommentType: JSM comment type. Use internalNote for an internal note or publicComment for a customer-visible comment. Applies when adding or editing a JSM comment. Omit for existing Jira behavior.
    commentId: ID of an existing comment to edit. When omitted, a new comment is added.
    inlineFileId: 'Media file ID(s) from uploadAttachmentToJiraIssue to append inline to the comment, e.g. ["id1","id2"]. Requires contentFormat: html and a matching inlineFileCollection (paired by index). Appends at the end; for exact placement, author the media node in the HTML commentBody instead. A file already embedded in the body is rejected (would duplicate).'
    inlineFileCollection: Media collection(s) from the upload step, paired to inlineFileId by index (a single value applies to all). Required whenever inlineFileId is set.
    inlineFileName: 'Optional file name(s) (from the upload step''s fileName), paired to inlineFileId by index. Only selects the render shape: images render as a block image, other files as an inline chip. Omit to default to the image shape.'
    responseContentFormat: Format of the echoed comment body. Defaults to the format written, so an html write reads back as html. Bodies markdown cannot represent (media, panels, statuses, @mentions) are always echoed as HTML so a follow-up edit does not destroy them. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.
- name: addOrEditJiraIssueWorklog
  description: 'Log time spent on a Jira issue, or edit an existing worklog: omit worklogId to add, or pass one from listJiraIssueWorklogs to edit, which changes only the fields you pass. A new worklog is always logged as the calling user; an edit keeps its original author. Jira reduces the issue''s remaining estimate by the time logged (by the difference on an edit). To change the estimate itself, use editJiraIssue. Returns the worklog''s id, needed to edit it later, with the stored timeSpent and started.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key like PROJ-123
    timeSpent: Time spent like 2h 30m. Required when adding; optional when editing.
    comment: Work description (markdown by default, or HTML with contentFormat html; converted to ADF automatically)
    contentFormat: 'Body format for comment. Defaults to markdown. html preserves inline media across a read-modify-write: a note fetched from listJiraIssueWorklogs as html can be written straight back. For HTML body shapes, first get the format guide via the generic operation runner (execute) as name=getContentFormatGuide, inputs={toolName: "addOrEditJiraIssueWorklog"}. Requires the HTML content-format feature; when it is disabled the call is rejected rather than downgraded, because markdown would store the HTML tags as literal text.'
    started: Start time in ISO 8601 format (e.g. 2026-01-01T09:00:00.000+0000)
    visibility: 'Restrict the worklog to a Jira group or role. Shape: `{"type":"group"|"role","value":"<name>"}`.

      Examples: `{"type":"role","value":"Administrators"}`, `{"type":"group","value":"jira-software-users"}`.

      When omitted, the worklog is visible to everyone who can view the issue.'
    worklogId: ID of an existing worklog to edit. When omitted, a new worklog is added.
- name: approveBitbucketRepoPullRequest
  description: Approve a Bitbucket pull request
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    prId: Numeric pull request ID. Use the exact input key prId.
- name: approveJsmRequestResolverPlans
  description: Approve the current Request Resolver plans for explicitly selected JSM issue keys after the user has reviewed their plans with getJsmRequestResolverPlans and confirmed approval. Approval applies to each request's current plan at execution time, which may have changed since retrieval. The caller must be the request's human assignee or delegator. Returns one result per input in order; approved means approval was accepted, not that execution is complete. Output fields include requests[].issueKey, requests[].status, and approver.displayName; use these paths when selecting responseFields. Duplicate keys for the same request are submitted once per call. This is not idempotent across calls. For an unknown outcome, refresh the plan before any further approval; never automatically retry approval. Use getJsmRequestResolverPlans to check subsequent execution status. Does not decide customer-portal approvals.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueKeys: One to five issue keys selected for approval, for example HELP-123. Use the issueIdOrKey values from getJsmRequestResolverPlans when retrieving by key.
- name: archiveConfluenceContent
  description: Archive a single Confluence content entity
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content to archive.
- name: atlassianUserInfo
  description: Returns the accountId of the current user
  params: {}
- name: completeConfluenceTask
  description: Mark a Confluence inline task as complete
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    taskId: The ID of the Confluence inline task to mark complete.
- name: convertConfluenceContentMode
  description: Convert a Confluence page or live doc between classic page mode and live-doc mode
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric Confluence content ID. Provide either contentId or contentUrl.
    contentUrl: Full Confluence content URL. Provide either contentUrl or contentId.
    targetMode: Target mode to convert the content into.
- name: convertJiraIssueHierarchy
  description: 'Convert an existing Jira issue across hierarchy levels: a standard issue (Task, Bug, Story) into a sub-task under a parent, or a sub-task back into a standard issue. Mirrors Jira''s Move / Convert-to-sub-task wizard: preview destination compatibility (mode=preview_step1), preview field retain/remap/drop (mode=preview_step2), then execute (mode=confirm). Do not use this for same-level type edits such as Bug → Story — use editJiraIssue for those. Task → Sub-task: always ask the user for parentIssueKey before calling. Do not search for, infer, or pick a parent. If they did not name a parent, ask them instead of calling this tool. The parent must be a standard issue. If this result has CHILD_ISSUES_WILL_REPARENT, those children will get the same new parent — ask the user to accept that, then confirm with acknowledgeChildReparent=true. If this result has SOURCE_HAS_SUBTASKS, the convert is blocked; tell the user that. If this result has MOVE_PERMISSION_REQUIRED, the user lacks Jira Bulk change or Move permission — tell them to convert in the Jira UI. Do not retry. Do not mention another project style. If preview execution.method is bulk-move, or confirm returns MOVE_CONFIRMATION_REQUIRED, this is Jira''s Move wizard: list the destination project, statusMapping, and fieldPlan.dropped to the user and ask them to accept that status change and that those fields will be dropped. Do not convert until they accept, then retry with mode=confirm and acknowledgeMove=true. If they decline, stop. Sub-task → Task: no parent needed; confirm clears the parent. After convert, reply with this issue''s key, new type, and parent. If appliedChanges.dropped is present, also name those dropped fields. If appliedChanges.status is present, also name that status change. Do not mention bulk-move permissions or project-style notes unless this result has MOVE_PERMISSION_REQUIRED.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key or ID to convert (e.g. PROJ-123).
    targetIssueType: Destination issue type name or ID. Use a sub-task type to demote a standard issue, or a standard type (Task, Bug, Story) to promote a sub-task. Same-level changes (Bug → Story) are rejected.
    parentIssueKey: Parent issue key required when converting a standard issue into a sub-task. The user must provide this key — do not search for, infer, or pick a parent, including from other issues in the same project. The parent must be a standard issue in the destination project. Ignored when promoting a sub-task to a standard type.
    targetProjectKey: Optional destination project key. Omit to convert in the issue's current project. A different project uses Jira's bulk move API for this single issue (requires global Bulk change plus Move/Create issue permissions).
    fieldRemap: Optional values for fields that are required on the destination type and empty or incompatible on the source. Keys may be field names or customfield_* IDs. Call mode=preview_step2 first to see fieldPlan.requiresInput.
    mode: preview_step1 (default) returns destination compatibility without converting. preview_step2 adds the field retain/remap/drop plan. confirm executes the conversion. Omitting mode never mutates.
    confirm: When true, executes the conversion (same as mode=confirm). Prefer mode=confirm. Preview modes never convert, even if confirm is false.
    acknowledgeChildReparent: Required as true on mode=confirm when converting a team-managed issue that already has child sub-tasks. Those children become sub-tasks of the same new parentIssueKey (Jira does not nest sub-tasks). After preview, show CHILD_ISSUES_WILL_REPARENT and only set this after the user accepts that. Ignored on company-managed projects (those conversions are blocked) and when the source has no children.
    acknowledgeMove: Required as true on mode=confirm when this conversion uses Jira's Move instead of a direct issue edit (preview execution.method is bulk-move, or confirm returned MOVE_CONFIRMATION_REQUIRED). After preview, show the destination project, statusMapping, and any fieldPlan.dropped names and only set this after the user accepts that status change and that those fields will be dropped. Not needed when a same-project convert succeeds via a direct issue edit.
- name: copyConfluenceContent
  description: Copy a Confluence page, whiteboard, database, folder, or embed to a new parent
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: ID of the source Confluence content entity to copy. Numeric content ID (up to 19 digits).
    title: Explicit title for the copied content (1–255 chars).
    parentContentId: ID of the parent content entity to copy under. Provide this OR destinationSpaceKey, not both. Numeric content ID (up to 19 digits).
    destinationSpaceKey: Key of the destination space to copy to the root of. Provide this OR parentContentId, not both.
- name: createBitbucketRepoBranch
  description: Create a Bitbucket branch
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    name: New branch name
    target: Target commit hash, or an existing branch/tag name to branch from
- name: createBitbucketRepoCommit
  description: Create a Bitbucket commit
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    message: Commit message
    files: 'Map of file path to file content, e.g. { "src/app.ts": "console.log(1)" }'
    branch: Branch to commit to. Defaults to the repository's main branch when omitted.
    parents: Parent commit hashes (advanced; usually omit to commit on top of the branch tip)
- name: createBitbucketRepoPullRequest
  description: Create a Bitbucket pull request
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    title: PR title
    sourceBranch: Source branch name. The branch must already exist; create it with createBitbucketRepoBranch and add changes with createBitbucketRepoCommit.
    targetBranch: Target branch name (default to the configured main branch configured on Bitbucket)
    description: PR description
    reviewers: 'Reviewers as objects with a uuid (Bitbucket user UUID), account_id (Atlassian account ID), or username (Bitbucket username) field, e.g. [{ "uuid": "{...}" }, { "account_id": "..." }, { "username": "..." }].'
    closeSourceBranch: Close the source branch after merge
    draft: Create as a draft PR
- name: createBitbucketRepoPullRequestTask
  description: Create a task on a Bitbucket pull request
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    prId: Numeric pull request ID. Use the exact input key prId.
    taskContent: The task text (the TODO/checkbox text shown on the PR)
    parentCommentId: Anchor the task to an existing comment by its ID
- name: createCapacityPlanNonProjectWork
  description: 'Create a non-project work item in Individual Capacity Planning. "Non-project work" is a bucket of time that is not a Jira issue or an Atlas project, such as Leave, Run the Business (RtB), on-call, or training.

    USE WHEN the user asks to create a new non-project work item, or a category of work that does not already exist as a Jira issue or Atlas project. Search first with listCapacityPlanNonProjectWork to avoid creating a duplicate - the match is on name and is case-insensitive.

    Non-project work is owned by Capacity Planning and exists nowhere else in Atlassian, so it can only be created through this tool. A contributor must be supplied: the new work item is created together with a work association for that person, so it is immediately allocatable to them. Allocate additional people or set the effort per period afterwards with updateCapacityPlanAllocations, using the ARI returned here as workId.

    On success, nonProjectWork contains the created item''s name and ari - use that ari as workId for updateCapacityPlanAllocations rather than fabricating one.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    name: Display name for the new non-project work item, e.g. "Leave" or "Run the Business". Search first with listCapacityPlanNonProjectWork to avoid creating a duplicate of an existing item.
    contributorDataId: ARI of the contributor to associate the new work item with, in the form ari:cloud:identity::user/{accountId} where {accountId} is an Atlassian account ID (e.g. ari:cloud:identity::user/5ea00a99d31fdf0c0d783dd5). The work item is created with a work association for this person so it is immediately allocatable to them.
- name: createConfluenceAttachment
  description: Prepare a Confluence attachment upload and return a local curl command
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content that will own the attachment. Confluence content IDs are int64 values (max 19 digits).
    localFilePath: Absolute or relative local file path to upload. This is used only to build uploadCommand; it is not sent to Confluence during prepare.
    fileSize: Optional local file size in bytes. Used by Confluence to fail fast if the file is too large.
    comment: Optional attachment version comment to include in the returned uploadCommand.
- name: createConfluenceComment
  description: Create or reply to a comment on a Confluence page or blog post
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Page or blog post ID. Required for top-level comments. Omit for replies.
    commentType: 'Top-level comment type: "footer" for page-level comments or "inline" for anchored comments. Required for top-level comments; inferred for replies.'
    body: 'Comment body object. Use { "format": "markdown" | "html", "value": "..." }. format is required and must be "markdown" or "html"; value is required, non-empty, and at most 4096 characters.'
    inlineSelection: 'Required only for top-level inline comments. Omit for replies. Object shape: { "selectedText": "...", "matchIndex": 0, "matchCount": 1 }. selectedText is required and non-empty; matchIndex is required and zero-based; matchCount is required and must be at least 1.'
    parentCommentId: ID of a top-level comment to reply to. Required for replies. Must reference a top-level comment, not a reply. When set, omit contentId and commentType.
- name: createConfluenceContent
  description: "Create a new Confluence page, blog post, live doc, whiteboard, database,\nembed, smart link, or folder.\n\nBefore choosing body.format or authoring a body, call getContentFormatGuide\nwith executeRead (or execute) as name=getContentFormatGuide and inputs={toolName}.\nSet toolName to createConfluencePage\nfor pages, blog posts, and live docs; createConfluenceWhiteboard for\nwhiteboards; or createConfluenceDatabase for databases.\n\nSpace instructions describe how to author content in a Confluence space.\nApply relevant guidance to the content you create or update. Follow this\ndecision rule:\n1. Before authoring, call getConfluenceSpace for the target space unless\n   getConfluenceContent returned metadata.hasSpaceInstructions=false for\n   content in that space. If getConfluenceSpace already returned for the\n   same cloudId and space during the current task, reuse its\n   spaceInstructions and do not call it again.\n2. When the value is true or unknown and instructions have not been\n   loaded, you must call getConfluenceSpace once before authoring through\n   executeRead (or execute) with name=getConfluenceSpace, top-level cloudId, and\n   inputs={spaceIdOrKey}.\n3. Apply any returned spaceInstructions. If a successful response omits\n   them, no instructions are configured; author with defaults and do not\n   block.\n\nAfter a successful getConfluenceSpace call, do not make a separate\ngetConfluenceSpaceInstructions call."
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    parent: 'Parent destination for the new content.


      Use { "spaceId": "<numeric-space-id>" } to create at the homepage / sidebar root.

      Use { "spaceId": "<numeric-space-id>", "parentContentId": "<numeric-content-id>" }

      to create under an existing content item.

      Use { "parentContentId": "<numeric-content-id>" } when the parent content ID

      should be resolved to its space before creation.

      Use { "parentContentUrl": "<confluence-content-url>" } when the parent

      content URL should be resolved before creation.


      Supported parentContentUrl paths include /pages/{id}, /blog/{id},

      /whiteboard/{id}, /database/{id}, and /folder/{id}.


      If the destination is described only by space key or title, resolve it first

      to one of the supported parent shapes above.'
    contentType: 'Type of content to create. One of: page, live_doc, blogpost, whiteboard,

      database, embed, smart_link, folder, slide.


      Prefer live_doc for pages and docs. Use page for explicit classic-page

      requests, space requirements, knowledge bases/customer-facing help, or

      page-only workflows such as unpublished drafts.'
    title: Title for the new content. 1-255 characters.
    body: 'Before composing this body, follow the space-instruction decision rule in the tool

      description. Reuse known instruction state and do not repeat the space lookup per write.

      Read the format guide once per task before you choose page elements, also when you

      know HTML: Confluence HTML is not standard HTML, and the guide lists the supported

      markup and the page components enabled for this user. getContentFormatGuide is a

      valid operation name; you do not need discover.

      Body content. For whiteboard and database it is technically optional, but only omit it

      when the user explicitly asked for an empty/blank board or database. Never omit body as a

      fallback because you could not load the authoring guidance — load it first with

      executeRead (or execute) as

      name=getContentFormatGuide, inputs={toolName} (createConfluencePage /

      createConfluenceWhiteboard / createConfluenceDatabase), then build a real body.

      A blank whiteboard

      (no shapes, stickies, connectors, or layout) is almost never the intended result.

      For doc types (page, live_doc, blogpost): format is html or markdown, value is the content string.

      Prefer HTML. Use markdown only when you are confident the content needs only basic text

      formatting and has no rich Confluence elements to create, such as panels, layouts, media,

      whiteboard embeds, or Remixes. If unsure, use HTML.

      For embed and smart_link: format must be url, value must be the URL to embed (e.g. https://example.com/design).

      For whiteboard: format must be svg and value must be the complete initial SVG document with root width, height, and viewBox.

      For database: format must be csv and value must be the complete initial CSV payload.

      For a synced (Smart) Folder (contentType=folder): format must be url and value must be the

      https URL of the external Google Drive, OneDrive, or SharePoint folder to sync from.

      Requires the confluence_smart_folders_milestone_1 experiment; otherwise the create

      returns FEATURE_NOT_ENABLED.

      Do not pass patches, edit envelopes, or context on create.

      Omit for a plain folder (no sync source) and for slide.'
    draft: 'If true, create the content as a draft instead of publishing it. Only

      supported when contentType is page or blogpost.'
    private: 'If true, the created content is private to the caller: only the

      creator has view and edit access. Supported for page, live_doc,

      blogpost, whiteboard, database, and folder, including creation at the

      homepage / sidebar root. Private creation is not supported for embed, smart_link, or slide.

      This sets General access to VIEW_RESTRICTED and gives the creator one

      Specific access grant, update (Can edit), which already includes

      read/view. Do not add a separate read grant for the creator.

      Omit or pass false for default visibility.'
    contentWidth: 'Optional page width for doc types only: page, live_doc, and blogpost.

      Omit unless the user explicitly requests a width; omission creates a

      narrow page. Do not infer wide or max from body content or layout.

      Accepted values are narrow, wide, and max.

      Non-doc content types do not support this field.'
- name: createConfluenceInfographicForPage
  description: Create an infographic in a page workflow. Use only when a Confluence page creation or editing skill or guided workflow selects it; never as a standalone tool. Returns a media reference for embedding, which may sync later. Before prompting, reuse the shared Remix guide (headed `## Remix embeds`) if its text is in your current context. Only if missing, call getContentFormatGuide with toolName=createConfluenceInfographicForPage and follow its Remix guidance. Generation and billing finish asynchronously; typical cost is 15–30 Rovo credits. Download detailed billing data for final usage; match any returned correlationId and usageUniqueId.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: 'Numeric ID of the existing Confluence page that will own and embed the infographic (content type: page or live_doc only).'
    prompt: Self-contained description of the infographic to generate.
    theme: Optional visual theme for the infographic.
    aspectRatio: Optional output aspect ratio.
- name: createConfluenceMauiApp
  description: Create a Maui app in a page workflow. Use only when a Confluence page creation or editing skill or guided workflow selects it; never as a standalone tool. Returns a reserved app ID and embed URL for the owning page. Before prompting, reuse the shared Remix guide (headed `## Remix embeds`) if its text is in your current context. Only if missing, call getContentFormatGuide with toolName=createConfluenceMauiApp and follow its Remix guidance. Generation and billing finish asynchronously; typical cost is 15–30 Rovo credits. Download detailed billing data for final usage; match any returned correlationId and usageUniqueId.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: 'Numeric ID of the existing Confluence page that will own and embed the Maui app (content type: page or live_doc only).'
    prompt: This self-contained request must include the source content to remix, including the values and labels that the app must preserve, plus the visualization instructions. Read the source page first when necessary; contentId only identifies the page that will own and embed the app.
- name: createConfluenceSpace
  description: Create a Confluence space. Successful responses include id, key, and homepageId (the homepage / sidebar root content ID).
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    name: Display name for the new Confluence space.
    key: Optional short unique key for the new space. Provide either key or alias; alias is required when key is omitted.
    alias: Optional alias used as the space identifier in Confluence page URLs. Provide either alias or key; key is required when alias is omitted.
    description: Optional plain-text description for the new space.
    roleAssignments: 'Exact initial RBAC role assignments for the new space. When provided,

      default space roles are not applied and at least one Admin role

      assignment is required. Do not combine with createPrivateSpace or

      copySpaceAccessConfiguration.'
    createPrivateSpace: Set to true only when the user explicitly asks for a private space. Do not combine with roleAssignments or copySpaceAccessConfiguration.
    copySpaceAccessConfiguration: Existing numeric space ID to copy access configuration from. Do not combine with roleAssignments or createPrivateSpace.
    templateKey: Optional Confluence space template key.
- name: createFocusArea
  description: Create a new Focus area in a workspace. Call getFocusAreaTypes first and use an enabled type UUID for focusAreaTypeId — do not fabricate it. Optionally set parentFocusAreaIdentifier (UUID, ARI, or Focus page URL); if set, the parent's type must be a higher hierarchy level than the type being created. Optionally set startDate and targetDate as { date, confidence } where date is YYYY-MM-DDTHH:mm (e.g. 2026-08-10T00:00; bare dates are not accepted) and confidence is DAY, MONTH, or QUARTER. Omit owner to default to the creating user. Returns the created focus area (identifiers, type, owner, parent, dates, status, health, timestamps). Use getFocusArea for expansions such as aboutContent, statusUpdates, or subFocusAreas. When passing both cloudId and a parent ARI, they must refer to the same site.
  params:
    focusAreaTypeId: UUID of an enabled Focus area type in the target workspace. Fetch a valid value first with getFocusAreaTypes rather than fabricating it — via execute as name=getFocusAreaTypes when it is not a top-level tool.
    name: Name of the new focus area.
    parentFocusAreaIdentifier: Optional parent focus area (UUID, ARI, or Focus page URL). If omitted, the new focus area has no parent. When set, the parent's type must be a higher hierarchy level than focusAreaTypeId (see getFocusAreaTypes).
    startDate: 'Projected start date. Object shape: { "date": "YYYY-MM-DDTHH:mm", "confidence": "DAY" | "MONTH" | "QUARTER" }. Both fields required when startDate is set. Example date: 2026-08-10T00:00 — bare calendar dates like 2026-08-10 are not accepted; append T00:00 when only the day is known.'
    targetDate: 'Projected target date. Object shape: { "date": "YYYY-MM-DDTHH:mm", "confidence": "DAY" | "MONTH" | "QUARTER" }. Both fields required when targetDate is set. Example date: 2026-08-10T00:00 — bare calendar dates like 2026-08-10 are not accepted; append T00:00 when only the day is known.'
    owner: Optional Atlassian account ID (AAID) of the focus area owner. Defaults to the creating user when omitted.
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: createFocusAreaStatusUpdate
  description: Create a status update on a focus area, or save it as a draft. A status update is a change to one or more of status, health, summary, target date. Changing status needs an id discovered first with getFocusArea and include.statusTransitions; health does not. Passing only focusAreaIdentifier still posts a visible, empty update when publishing, so never call this tool speculatively. Field-level behavior for status, health, summary, target date, and draft constraints is documented on the inputs.
  params:
    focusAreaIdentifier: The focus area to post the update on. Accepts a focus area UUID, a focus area ARI, or a focus area page URL. Saving a draft (isDraft true) requires a focus area ARI; UUID and URL cannot be used. If only a UUID or URL is known, call getFocusArea first and pass the returned ari. When reusing an identifier from an earlier response, pass its uuid field — not its id field — unless you need the ARI for a draft.
    isDraft: When true, save the status update as a draft instead of publishing it. Drafts do not change the focus area's live status, health, or target date; transition and target-date values are stored on the draft until published. Requires focusAreaIdentifier to be a focus area ARI. Retrieve a saved draft later with getFocusArea and include.latestDraftUpdate; publish it by calling this tool again without isDraft. Defaults to false (publish).
    statusTransitionId: 'Status transition to apply when publishing. Obtain it by calling getFocusArea with include.statusTransitions and passing the id of the chosen entry. Sets status only: to change health, pass healthId instead, including when health is the only thing being changed. Statuses are configurable per workspace, so this id must come from that lookup for this focus area — never guess it, reuse one from another focus area or site, or pass a status or health name here. Publish only; use statusId when isDraft is true. Omit to leave the current status unchanged.'
    statusId: Status to record on a draft. Obtain it by calling getFocusArea with include.statusTransitions and passing status.id of the chosen entry, in whatever form it is returned. Use status.id, not status.key — key is a display slug such as "paused" on some statuses and is not a usable id. Draft only; use statusTransitionId when isDraft is false or omitted. Omit to leave the draft's status unset.
    healthId: 'The only input that sets health. Health has three fixed values, the same on every site: "2001" for Off track, "2002" for At risk, and "2003" for On track. Pass one of those ids directly — unlike statuses, health is not configurable, so it does not need to be looked up first and will not appear in statusTransitions on sites with configurable statuses. Health applies independently of status, so it can be set on its own, with no status input at all, or alongside a status change. Never pass a health name such as "at risk" here, or into statusTransitionId. Omitting it leaves the current health unchanged; to remove health when publishing, set clearHealth instead.'
    clearHealth: 'The only way to remove a focus area''s health. Set this to true only when asked to clear, remove, or unset health. A status change never implies it: transitions on sites with configurable statuses carry no health object at all, and that absence says nothing about the focus area''s current health, so an ordinary status-only request leaves both this and healthId omitted. Omitting healthId does not clear health — it leaves the current health unchanged — so clearing must be requested explicitly with this field. Cannot be combined with healthId: to change health to a different value, pass healthId instead. Publish only — a draft records whatever healthId it is given, so omitting healthId already leaves a draft with no health.'
    statusTransition: 'Last resort; do not reach for this first. Prefer statusTransitionId (or statusId for drafts): include.statusTransitions returns usable ids on every site, so that path works everywhere, while this legacy vocabulary fails on sites that have adopted configurable statuses. This field is also coarser — each value sets both status and health at once: ON_TRACK, AT_RISK, and OFF_TRACK set health to that value and set status to IN_PROGRESS; PENDING, PAUSED, and COMPLETED set that status and clear health. Cannot be combined with statusTransitionId, statusId, healthId, or clearHealth. Omit to leave the current status and health unchanged. See isDraft for draft behavior.'
    summary: Optional progress summary as plain text or Markdown; it is converted to rich content. Maximum 25,000 characters.
    newTargetDate: 'Optional new target date for the focus area. Object shape: { "date": "YYYY-MM-DDTHH:mm", "confidence": "DAY" | "MONTH" | "QUARTER" }. Both fields required when newTargetDate is set. Example date: 2025-07-05T00:00 — bare calendar dates like 2025-07-05 are not accepted; append T00:00 when only the day is known. Omit to leave the existing target date unchanged. See isDraft for draft behavior.'
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: createGoal
  description: Create an Atlassian Goal or Success Measure using an enabled Goal Type.
  params:
    name: Name of the Goal.
    goalTypeId: ARI of an enabled Goal Type returned by getGoalTypes.
    description: Optional Goal description in plain text or Markdown.
    ownerAccountId: Atlassian account ID of the owner. Defaults to the current user.
    parentGoalId: ARI of the parent Goal. Required when the selected Goal Type requires a parent.
    targetDate: Projected target date with date and confidence (DAY, MONTH, or QUARTER).
    accessLevel: Goal visibility and editing access. Defaults to the site's Goal access setting.
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: createGoalUpdate
  description: Create a progress update for an existing Atlassian Goal.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    goalId: ARI of the Goal receiving the update.
    summary: Progress summary in plain text or Markdown. Rendered text is limited to 280 characters.
    phaseStatus: Lifecycle phase or in-progress health status of the Goal.
    score: Exact progress score. The score determines the resulting health status.
    targetDate: Updated target date with date and confidence (DAY, MONTH, or QUARTER).
    notes: Notes to include. Each item has an optional title and required body in plain text or Markdown.
    metricUpdates: Metric measurements for this update. Provide one item with targetId, value, and optional measuredAt.
    highlights: Learnings, risks, or decisions. Each item has type, summary, and Markdown-capable description.
- name: createJiraBoard
  description: 'Create a new company-managed Jira Software board (scrum or kanban) from an existing filter. Requires a filter ID the user can view. When location is omitted, the board is filed in the single company-managed project from the filter''s JQL. Team-managed (TMP) locations are always rejected: TMP projects are 1:1 project to board (one built-in board at project creation, no way to add another). User locations are also rejected. The response includes a url that opens the board. The filter decides which issues the board shows; location only decides where the board is filed in navigation.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    name: Display name for the new board. Must be less than 255 characters.
    type: 'Company-managed board type: scrum or kanban.'
    filterId: ID of a Jira filter the user can view. This filter's JQL determines which issues appear on the board — pick or create one that targets the intended project, since location does not restrict the issue set. Board sharing follows the filter's sharing; without Create shared objects permission a private board may be created instead.
    location: 'Optional board container, controlling only where the board is filed in navigation — not which issues it shows. When omitted (or {}), defaults to the single project in the filter''s JQL. Object with type "project" and projectKeyOrId set to a company-managed project key or numeric ID. Team-managed (TMP) locations are always rejected (TMP is 1:1 project to board). User locations are also rejected. Example: {"type":"project","projectKeyOrId":"PROJ"}.'
- name: createJiraIssue
  description: 'Create a new Jira issue. Custom fields go in additional_fields: keyed by field name, values are resolved automatically, so no field lookup is needed first (user fields take accountIds); keyed by customfield_* ID, pass the value in Jira''s format. A rejected create returns a repairHint and names the field at fault where there is one, with its allowedValues when known, so retry from that. If sprint assignment fails, the response still has the new issue''s key and sprintAssignment.assigned: false — do not create it again.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    projectKey: Project key (e.g. PROJ).
    summary: Issue summary / title.
    issueType: Issue type name (e.g. Bug, Task, Story, Epic). Use listJiraProjectIssueTypesMetadata to list valid types for this project if unsure.
    description: Issue description in markdown, or HTML with contentFormat html. Converted to Jira ADF automatically.
    contentFormat: 'Body format for description. Defaults to markdown; html adds panels, tables and status lozenges. For HTML body shapes, first get the format guide via the generic operation runner (execute) as name=getContentFormatGuide, inputs={toolName: "createJiraIssue"}. Inline media needs an existing issue: create first, then embed with editJiraIssue. When the HTML content-format feature is disabled the call is rejected rather than downgraded, because markdown would store the HTML tags as literal text.'
    priority: Priority name (e.g. High, Medium, Low, Highest, Lowest).
    assignee: Account ID of the assignee. Resolve a name with listJiraIssueAssignableUsers, which returns only users who can be assigned in this project; lookupJiraAccountId resolves any user and does not check that.
    labels: List of label strings (e.g. ["bug", "needs-triage"]).
    parent: Parent issue key for sub-tasks or child issues (e.g. PROJ-10).
    additional_fields: "Additional Jira fields. Keys can be human-readable field names or raw customfield_* IDs. Values can be human-readable (resolved automatically) or already-correct Jira shapes. Examples:\n  {\"Story Points\": 8}                          ← number field by name\n  {\"Team\": \"Backend\"}                          ← option/select by name\n  {\"Reviewers\": [\"alice@acme.com\", \"bob@acme.com\"]}  ← multi-user by accountId\n  {\"Component Area\": \"Platform / Auth\"}        ← cascading select as \"Parent / Child\"\n  {\"customfield_10010\": 8}                     ← raw ID (no resolution needed, fastest)\n  {\"components\": [{\"name\": \"Backend\"}]}        ← system array field (raw shape)\n  {\"fixVersions\": [{\"name\": \"v2.0\"}]}          ← system array field (raw shape)\nOn error, the response includes allowedValues and a repairHint for self-correction."
    assignToSprint: Optional sprint assignment after the issue is created. Accepts a numeric sprint ID, an exact sprint name, or "active" to resolve an active sprint. Numeric sprint IDs assign directly and do not need board lookup. When omitted, createJiraIssue behaves exactly as before and does not make sprint calls.
- name: createJiraIssueLink
  description: 'Create a link between two existing issues — blocks, duplicates, clones, relates. Hierarchy is not a link: a parent or epic is the issue''s parent field. To link an issue to anything outside Jira — a page, a document, any URL — use createJiraIssueRemoteIssueLink.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    linkType: Link type name e.g. Blocks, Relates, Duplicates. Use listJiraIssueLinkTypes for valid names.
    inwardIssue: Inward issue key e.g. PROJ-1. The link reads inwardIssue to outwardIssue using the link type's outward description, so with linkType "Blocks" inwardIssue blocks outwardIssue.
    outwardIssue: Outward issue key e.g. PROJ-2. With linkType "Blocks" this is the issue that is blocked by inwardIssue.
    comment: Optional comment on the outward issue (plain text or markdown, converted to ADF automatically).
- name: createJiraIssueRemoteIssueLink
  description: Create a native web link in a Jira issue's Web links section for a Confluence page or external HTTP(S) URL. Not a URL custom field; for an issue-to-issue dependency use createJiraIssueLink.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Target Jira issue key or ID, for example PROJ-123
    url: Absolute HTTP or HTTPS URL to add to the issue
    title: Optional display text; defaults to the URL when omitted or blank
    summary: Optional short summary of the linked content
    relationship: Optional relationship label; Jira uses "links to" when omitted or blank
- name: createJsmRequest
  description: Create a Jira Service Management customer-request work item using an explicit JSM service desk ID, JSM request type ID, and request field values. Do not use Jira issue type IDs or generic Jira create-issue workflows. First use getJsmRequestCreationOptions to select a JSM request type, then getJsmRequestTypeFields to build requestFieldValues.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    serviceDeskId: ID of the JSM service desk where the request will be created.
    requestTypeId: ID of the JSM request type to use when creating the request.
    requestFieldValues: Field values required by the selected JSM request type.
    form: Optional form values required by the selected JSM request type.
- name: createLoomObjectFolder
  description: Create a new folder in the current Loom workspace, optionally nested under a parent folder or placed in a space. Returns the new folder's id, which you can pass to moveLoomObjectToFolder. To list existing folders instead of creating one, use listLoomObjectFolders.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    name: Name for the new folder.
    parentFolderId: Optional ARI of an existing folder to nest this one under, ari:cloud:loom:{siteId}:folder/activation/{activationId}/{folderId}.
    spaceId: Optional ARI of a Loom space to create the folder in, ari:cloud:loom:{siteId}:space/activation/{activationId}/{spaceId}.
    visibility: Optional, top-level folders only. One of owner or workspace. Ignored for space or nested folders.
- name: createLoomObjectUpload
  description: Step 1 of 2 for creating a Loom object from a local video file. Return a short-lived direct-upload recipe; this step does not transfer the bytes or publish the object. Transfer the bytes before calling publishLoomObject with the returned completionPayload.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    fileName: Name of the local video file, including its extension, for example demo.mp4.
    contentType: MIME type of the local file. Defaults to video/mp4.
    fileSizeBytes: Optional positive byte-size hint for the local file.
- name: createProject
  description: Create an Atlassian Project.
  params:
    name: Name of the Project.
    description: Content for the Project About tab. Supported fields are what, why, and measurement; plain text and Markdown are accepted.
    ownerAccountId: Atlassian account ID of the owner. Defaults to the current user.
    startDate: Planned start date in YYYY-MM-DD format.
    targetDate: Projected completion date with date and confidence (DAY, MONTH, or QUARTER).
    private: Whether the Project is restricted to its contributors.
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: createProjectUpdate
  description: Post a progress update on an existing Atlassian Project, or save it as an unposted draft with isDraft. Posting is immediately visible on the Project and notifies its followers, so only post when the user asked to; use isDraft to leave it for them to review and post themselves. The response carries isDraft so you can tell which happened, and a draft returns fewer fields than a posted update.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    projectId: ARI of the Project receiving the update.
    isDraft: 'When true, save the update as an unposted draft instead of publishing it. Nothing becomes visible on the Project and no followers are notified. Omit it to post the update immediately, which cannot be undone.

      A Project holds one draft per update period and saving never overwrites it: if a draft already exists the save is rejected. There is no way to amend a draft from here, so tell the user to post or discard the existing one in Atlas; read it first with getProject include=draftUpdate if they want to see what it says. The rejection can come back as an empty result rather than an error, so treat an empty response to a draft save as "a draft already exists" rather than success.'
    summary: Progress summary in plain text or Markdown. Rendered text is limited to 280 characters.
    phaseStatus: Lifecycle phase or in-progress health status of the Project.
    targetDate: Updated target date with date and confidence (DAY, MONTH, or QUARTER).
    notes: Additional context for the update. Provide one item with an optional title and required Markdown-capable body.
    highlights: Learnings, risks, or decisions. Each item has type, summary, and Markdown-capable description.
- name: decideJsmRequestApproval
  description: Approve or decline a pending approval on an existing Jira Service Management request. Provide the request issue ID/key and an explicit decision of approve or decline. approvalId is optional; when omitted, the tool discovers pending request approvals and proceeds only when exactly one answerable approval is unambiguous. Use this for approval decisions, not workflow transitions, field edits, or comments.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: JSM request issue ID or key, for example HD-123.
    decision: Approval decision to apply. Must be approve or decline.
    approvalId: Optional approval ID. Prefer reading getJsmRequestActionMetadata with include=[approvals] and passing the chosen pending approval's ID. If omitted, each call selects the current answerable pending approval; repeating the call can decide a newly created approval stage. After an uncertain result, refresh approvals before retrying and keep the original approvalId. Deciding a new stage requires fresh user intent.
- name: declineBitbucketRepoPullRequest
  description: Decline a Bitbucket pull request
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    prId: Numeric pull request ID. Use the exact input key prId.
    message: Explanation for declining the pull request; returned as its reason
- name: diffConfluenceContentVersions
  description: Compute a unified diff between two versions of a Confluence page, live doc, or blog post
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence page, live doc, or blog post.
    from_version: Positive version number for the earlier side of the comparison. List version numbers with listConfluenceContentVersions.
    to_version: Positive version number for the later side of the comparison.
    content_format: Body format used to compute the diff. Defaults to markdown.
- name: disableConfluencePublicLink
  description: Disable the external public link (anonymous share) for a Confluence page
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence page to disable the public link for.
- name: downloadConfluenceAttachment
  description: Get a Confluence attachment download URL and return a local curl command
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    attachmentId: Numeric or att-prefixed ID of the Confluence attachment to download. The numeric portion may contain up to 19 digits.
    outputPath: Optional absolute or relative local path where the downloaded file should be saved. If omitted, the tool derives a relative path from the download URL filename and falls back to ./attachment-<attachmentId>. This is used only to build downloadCommand.
    version: Optional attachment version. Omit to download the latest version.
- name: downloadJiraIssueAttachment
  description: Get a short-lived download URL for a Jira attachment and return a local downloadCommand. Run it from your shell to save the file.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    attachmentId: 'Numeric ID of the Jira attachment to download. Get it from getJiraIssue with fields: ["attachment"], which returns id, filename, size and mimeType per attachment. This is the numeric attachment ID, not a filename and not the media UUID that appears in comment or description bodies.'
    outputPath: Optional local path where the file should be saved (used only to build downloadCommand). Prefer a path relative to your current working directory (e.g. "./report.pdf"); avoid temp directories. Defaults to the attachment's filename in the current directory when omitted.
- name: editConfluenceInfographicForPage
  description: Edit an infographic in a page workflow. Use only when a Confluence page editing skill or guided workflow selects it; never as a standalone tool. Regenerates the existing infographic and returns a new placeholder media reference for embedding. Before prompting, reuse the shared Remix guide (headed `## Remix embeds`) if its text is in your current context. Only if missing, call getContentFormatGuide with toolName=editConfluenceInfographicForPage and follow its Remix guidance. Generation and billing finish asynchronously; typical cost is 15–30 Rovo credits. Download detailed billing data for final usage; match any returned correlationId and usageUniqueId.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: 'Numeric ID of the existing Confluence page containing the infographic (content type: page or live_doc only).'
    mediaFileId: ID of the existing infographic being edited.
    prompt: Detailed description of the regenerated infographic.
    theme: Optional visual theme for the infographic.
    aspectRatio: Optional output aspect ratio.
- name: editConfluenceMauiApp
  description: Edit a Maui app in a page workflow. Use only when a Confluence page editing skill or guided workflow selects it; never as a standalone tool. Regenerates the existing app and returns a new placeholder Maui ID and embed URL. Before prompting, reuse the shared Remix guide (headed `## Remix embeds`) if its text is in your current context. Only if missing, call getContentFormatGuide with toolName=editConfluenceMauiApp and follow its Remix guidance. Generation and billing finish asynchronously; typical cost is 15–30 Rovo credits. Download detailed billing data for final usage; match any returned correlationId and usageUniqueId.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: 'Numeric ID of the existing Confluence page containing the Maui app (content type: page or live_doc only).'
    mauiId: ID of the existing Maui app being edited.
    prompt: Detailed description of the regenerated Maui app.
- name: editJiraEntityProperty
  description: Sets a single property (technical key/value store) on a specific Jira entity (issue, issueComment, issueWorklog, dashboardItem, user), creating or overwriting it. Returns {key, entityType, status}, status being "created" or "updated"; the value you wrote is not returned — read it back with getJiraEntityProperty.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    entityType: Which Jira entity type to set the property on. Determines the required identifier(s). Irrelevant identifiers are ignored.
    propertyKey: The full property key to set. Must be namespaced under "atlassian-mcp." prefix (e.g. "atlassian-mcp.config") or call is rejected. This keeps MCP-written properties isolated from app-written keys.
    value: 'Full property value to store; replaces any existing value for the key. Accepts any valid JSON — object, array, string, number, or boolean (e.g. {"enabled": true, "level": 3}, [1, 2, 3], "dark", or 42). Must be non-empty: null and blank strings are rejected.'
    issueIdOrKey: Issue key (PROJ-123) or a Jira issue URL. Required for entityTypes "issue" and "issueWorklog".
    commentId: ID of an existing comment. Required when entityType is "issueComment".
    worklogId: ID of a worklog for a specific issue. Required when entityType is "issueWorklog".
    dashboardId: ID for a dashboard. Required when entityType is "dashboardItem".
    itemId: Dashboard gadget/item ID. Required when entityType is "dashboardItem".
    accountId: User account ID. Required when entityType is "user" (including for the calling user's own properties)
- name: editJiraIssue
  description: 'Edit an existing Jira issue. Custom fields go in additional_fields: keyed by field name, values are resolved automatically (user fields take accountIds); keyed by customfield_* ID, pass the value in Jira''s format. Every field is set, not appended: send the full list for labels, components and other multi-value fields. Change status or move to a sprint with transitionJiraIssue, and convert Task↔Sub-task with convertJiraIssueHierarchy. Empty description or environment with "". When editing a body that holds inline media, use contentFormat: html, or the media is dropped. Reorder on a board with rankBeforeIssue or rankAfterIssue; fields are saved first, so a failed reorder leaves the edit applied and returns ranking.ranked: false. The response shows only getJiraIssue''s default fields, so other fields you set are not echoed back.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key (e.g. PROJ-123).
    fields: 'Jira fields payload to set, keyed by field name or customfield_* ID. To clear a field, pass explicit null (e.g. {"resolution": null}). assignee and reporter accept an email, display name, or accountId; an ambiguous or unknown value returns an error with candidates rather than being silently dropped. Rich-text fields (description/environment) default to markdown; set contentFormat: html to author them in HTML. Editing a body that already contains inline media must use contentFormat: html — markdown drops it. For HTML body shapes (inline media, panels, tables), first get the format guide via the generic operation runner (execute) as name=getContentFormatGuide, inputs={toolName: "editJiraIssue"}.'
    additional_fields: "Additional Jira fields. Keys can be human-readable field names or raw customfield_* IDs. Values can be human-readable (resolved automatically) or already-correct Jira shapes. Examples:\n  {\"Story Points\": 8}                          ← number field by name\n  {\"Team\": \"Backend\"}                          ← option/select by name\n  {\"Reviewers\": [\"alice@acme.com\", \"bob@acme.com\"]}  ← multi-user field by email,\n                                                   display name, or accountId\n  {\"Component Area\": \"Platform / Auth\"}        ← cascading select as \"Parent / Child\"\n  {\"customfield_10010\": 8}                     ← raw ID (no resolution needed, fastest)\n  {\"components\": [{\"name\": \"Backend\"}]}        ← system array field (raw shape)\n  {\"fixVersions\": [{\"name\": \"v2.0\"}]}          ← system array field (raw shape)\nAn ambiguous or unknown user value returns an error with candidates rather than being silently dropped. On error, the response includes allowedValues and a repairHint for self-correction."
    inlineFileId: 'Media file ID(s) from uploadAttachmentToJiraIssue to append inline to the description, e.g. ["id1","id2"]. Requires contentFormat: html and a matching inlineFileCollection (paired by index). Appends at the end, keeping existing content; for exact placement, author the media node in the HTML description instead. A file already embedded in the body is rejected (would duplicate).'
    inlineFileCollection: Media collection(s) from the upload step, paired to inlineFileId by index (a single value applies to all). Required whenever inlineFileId is set.
    inlineFileName: 'Optional file name(s) (from the upload step''s fileName), paired to inlineFileId by index. Only selects the render shape: images render as a block image, other files as an inline chip. Omit to default to the image shape.'
    contentFormat: Body format for rich-text fields (description/environment). Defaults to markdown. html preserves inline media across a read-modify-write; a body fetched as HTML can be written straight back (Jira resolves media collection/filename server-side and omits them on read — not data loss). Requires the HTML content-format feature; when it is disabled the call is rejected rather than downgraded, because markdown would store the HTML tags as literal text and drop the media.
    responseContentFormat: Output format for rich-text fields in the returned issue. Defaults to markdown. Bodies markdown cannot represent (media, panels, expands, statuses, @mentions) are always returned as HTML, so a follow-up edit does not destroy them. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.
    rankBeforeIssue: Optional. Rank this issue immediately before the given issue key or ID (LexoRank relative anchor). Mutually exclusive with rankAfterIssue. When omitted, editJiraIssue does not make ranking calls.
    rankAfterIssue: Optional. Rank this issue immediately after the given issue key or ID (LexoRank relative anchor). Mutually exclusive with rankBeforeIssue. When omitted, editJiraIssue does not make ranking calls.
    rankCustomFieldId: Optional. Numeric Rank field id for this rank call (e.g. 10020). Pass only when the user explicitly provides a Rank field id, or asks to reorder on a specific board's Rank field. For a named board, call getJiraBoardConfig first and use ranking.rankCustomFieldId. Do not invent or guess this id. Omit for ordinary reorders so Jira uses its default Rank field. Ignored unless rankBeforeIssue or rankAfterIssue is also set.
    actionSource: Optional invocation attribution. Jira MCP cards set jira_mcp_card; omit for model/tool-loop calls.
