- name: listBitbucketWorkspaceProjects
  description: List projects in a Bitbucket workspace
  params:
    workspaceId: Workspace slug or UUID
    q: BBQL filter expression (e.g. 'name ~ "platform"')
    sort: Sort field (e.g. "name" or "-updated_on")
    page: Page number, from 1 to 10000. Defaults to 1.
    pagelen: Page size, from 0 to 100. Defaults to 10.
- name: listBitbucketWorkspacePullRequests
  description: List pull requests across accessible repositories in a Bitbucket workspace; all supplied filters must match
  params:
    workspaceId: Workspace slug or UUID
    state: Filter by pull request state; omitted means all states
    authorUuid: Filter by the author's Bitbucket user UUID, always brace-wrapped; not an Atlassian account ID. Copy values[].author.uuid from workspace PR results. For your own PRs, use listMyBitbucketPullRequests.
    reviewerUuid: Filter by a reviewer's Bitbucket user UUID, always brace-wrapped; not an Atlassian account ID. Copy values[].user.uuid from getBitbucketRepoDefaultReviewers or values[].reviewers[].uuid from workspace PR results. For your review requests, use listMyBitbucketReviewRequests. Includes already-approved reviews.
    titleContains: Text that the pull request title must contain, such as a Jira issue key (e.g. PROJ-123). Matches the title only, not the branch, description or commits.
    sourceBranch: Exact source branch name
    destinationBranch: Exact destination branch name
    draft: False excludes draft PRs; true returns only drafts; omit to include both, subject to the other filters
    sort: Sort field; defaults to most recently updated first
    page: Page number, from 1 to 10000
    pagelen: Number of pull requests per page, from 1 to 100. Defaults to 25.
- name: listBitbucketWorkspaces
  description: List Bitbucket workspaces the user is a member of
  params:
    sort: Sort field (e.g. "name")
    administrator: When true, only workspaces the user administers
    page: Pagination cursor
    limit: Page size
- name: listCapacityPlanNonProjectWork
  description: 'Search the non-project work items on a site. "Non-project work" is the user-facing name for a custom contribution target - the buckets of time that are not a Jira issue or an Atlas project, such as Leave, Run the Business (RtB), on-call, or training.

    Non-project work is an entity that belongs to Capacity Planning: it is defined and stored in Capacity Planning itself, and exists nowhere else in Atlassian. Capacity can be allocated to three kinds of work item - Jira issues, Atlas projects, and non-project work - and only the third is owned by Capacity Planning, so it can only be found through this tool. There is no Jira or Confluence equivalent to look up instead.

    USE WHEN you need the ARI of a non-project work item before allocating someone to it, or when the user asks what non-project work categories exist. The returned ari is what feeds workId on updateCapacityPlanAllocations and workDataIds on getCapacityPlanAllocations - resolve it here rather than fabricating one.

    The query is case-insensitive and matches on name; omit it to list everything. Paginate with first/after or last/before.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    query: Case-insensitive name filter for non-project work items, e.g. "leave". Omit to list every item on the site.
    first: Page size for forward pagination. Mutually exclusive with last; pair with after for subsequent pages.
    after: Cursor for forward pagination. Pass pageInfo.endCursor from the previous response.
    last: Page size for backward pagination. Mutually exclusive with first; pair with before for previous pages.
    before: Cursor for backward pagination. Pass pageInfo.startCursor from the previous response.
- name: listConfluenceAttachments
  description: List attachment metadata for a Confluence content item
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content whose current attachments should be listed. Confluence content IDs are int64 values (max 19 digits).
    cursor: Optional pagination cursor from a previous listConfluenceAttachments result.
    limit: Optional maximum number of attachments to return. Must be between 1 and 250.
    sort: Optional attachment sort order, following the Confluence v2 attachment API semantics.
    status: Optional attachment status filter, for example current, archived, or a comma-separated list such as current,archived.
    mediaType: Optional media type filter, for example image/png.
    filename: Optional filename filter. For a persisted Remix infographic, use its mediaFileId to resolve the attachment ID.
- name: listConfluenceComments
  description: List comments on a Confluence page or blog post
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    content-id: ID of the page or blog post to list comments for.
    comment-type: 'Filter by surface: "footer" (page-level) or "inline" (anchored). Omit to return both.'
    limit: Max top-level comments per page (1–250, default 50).
    cursor: Pagination cursor from a previous response's nextCursor. Omit for the first page.
    sort: Sort by creation date. "+created-date" = oldest first (default), "-created-date" = newest first.
    status: Filter by content status.
    resolution-status: Filter top-level comments by resolution status ("open" or "resolved"). Applies to both footer and inline comments, so combine with comment-type to narrow to one surface. "open" also includes reopened comments and inline comments whose anchor text was lost.
    body-format: Response body format (default markdown).
    include-replies: Include replies as a flat descendant list on each top-level comment (default false).
    content-type: Hint to skip content-type probing when the container type is already known.
- name: listConfluenceContent
  description: List Confluence content of one type within a single space (page, blog post, live doc, whiteboard, database, embed, smart link, folder, slide)
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    type: 'Type of content to list. One of: page, live_doc, blogpost, whiteboard,

      database, embed, smart_link, folder, slide.'
    spaceId: Numeric space ID.
    status: 'Content status filter. Defaults to current. Hierarchical types only

      support current or archived.'
    cursor: Opaque pagination cursor returned by a previous call.
    limit: Max number of items to return per page (1-250). Defaults to 25.
- name: listConfluenceContentVersions
  description: List version history for a Confluence page, live doc, or blog post, newest first
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence page, live doc, or blog post.
    limit: Maximum number of versions to return (1-250). The service returns newest versions first.
    cursor: Cursor from a previous response for the next page of versions.
- name: listConfluenceSpaces
  description: List Confluence spaces accessible to the caller
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    ids: Space ids to fetch directly, as an array (["123","456"]) or a comma-separated string ("123,456"). Up to 250 ids per call.
    keys: Space keys to fetch directly, as an array (["DEV","OPS"]) or a comma-separated string ("DEV,OPS"). Up to 250 keys per call.
    type: Filter by space type.
    status: Filter by space status. Defaults to current.
    labels: Labels to filter spaces by, as an array (["team","docs"]) or a comma-separated string ("team,docs"). Returns spaces that have any of the listed labels.
    limit: Max number of spaces to return per page (1-250). Defaults to 25.
    cursor: Opaque pagination cursor returned by a previous call. Omit to start from the first page.
- name: listConfluenceTasks
  description: List Confluence inline tasks, optionally scoped to a page or blog post and filtered by status
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    page-id: Optional numeric page ID to scope the query to a single page.
    blogpost-id: Optional numeric blog post ID to scope the query to a single blog post.
    spaceId: Optional numeric space ID (or comma-separated list) to scope the query.
    status: Task status filter. One of `complete`, `incomplete`. Omit to include both.
    assigned-to: Account ID (or comma-separated list) of the user to whom the task is assigned.
    created-by: Account ID (or comma-separated list) of the user who created the task.
    completed-by: Account ID (or comma-separated list) of the user who completed the task.
    cursor: Opaque pagination cursor returned by a previous call.
    limit: Max number of tasks per page (1-250). Defaults to 25.
- name: listConfluenceTemplates
  description: List Confluence templates and blueprints
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    space_id: Numeric Confluence space ID. Required when scope is space or available.
    scope: Template scope to list. Use global for global templates, space for templates in the specified space, or available for templates available when creating in the specified space.
    template_type: Template kind to list. Defaults to all.
    query: Optional case-insensitive search across template id, name, and description. Use terms such as meeting notes to find matching templates.
    cursor: Opaque pagination cursor returned in _links.next by a previous call. Omit to start from the first page.
    limit: Optional maximum number of templates to return per page. Must be between 1 and 250; defaults to 25.
- name: listJiraBoardSprints
  description: List a board's sprints — past, active or upcoming — or resolve a sprint name to the numeric sprintId that transitionJiraIssue and manageJiraSprint take. Not needed before createJiraIssue, whose assignToSprint accepts a sprint name or "active" directly. For the active sprint plus its issues and progress in one call, use getJiraBoardSprintData.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    boardId: Numeric ID of the Scrum board. Get from listJiraBoards.
    state: Optional sprint state filter. Use all or omit to return all sprint states.
    startAt: Index of the first result to return (page offset). Defaults to 0.
    maxResults: Maximum results to return per page. Jira defaults to 50.
- name: listJiraBoards
  description: List Jira boards visible to the current user. Use it to get board IDs for getJiraBoardIssueData, getJiraBoardConfig and listJiraBoardSprints; getJiraBoardSprintData can resolve a board by name directly. Returns each board's ID, name, type, edit/privacy/favourite flags and location. Page with startAt until isLast is true. projectKeyOrId matches boards whose JQL references that project, not boards located in it. includePrivate appends private boards, but Jira omits their name and type.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    startAt: Index of the first result to return (page offset). Defaults to 0.
    maxResults: Maximum results to return per page. Jira defaults to 50.
    type: Optional board type filter. Use all to omit Jira's type filter, CMPScrum for company-managed Scrum boards, CMPKanban for company-managed Kanban boards, and TMP for Jira's "simple" boards. TMP can include both team-managed Scrum and team-managed Kanban boards; inspect board features/details when you need to distinguish them.
    name: Optional partial board name filter.
    projectKeyOrId: Optional project key or numeric ID used to find boards relevant to a project.
    includePrivate: When true, append private boards to the end of the result list.
    negateLocationFiltering: When true, negates location-based filters such as project or project type.
    orderBy: Optional sort order. Supported values are name, -name, or +name.
    expand: Optional comma-separated expand tokens such as admins or permissions.
    projectTypeLocation: Optional list of project type locations such as software or service_desk.
    filterId: Optional filter ID used to find boards relevant to a Jira filter.
- name: listJiraDashboards
  description: Returns Jira dashboards visible to the current user for discovery and linking workflows. Use this to find dashboard IDs, names, and links that can be shared or opened. This tool is intentionally lightweight and does not fetch dashboard gadget data. Page with startAt until isLast is true.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    dashboardName: Optional dashboard name filter (maps to Jira dashboardName).
    accountId: Optional owner account ID filter (preferred over deprecated owner username).
    groupname: Optional group name filter for shared dashboards (prefer groupId when available).
    groupId: Optional group ID filter for dashboards shared to a specific group. Do not combine with groupname.
    projectId: Optional project ID filter for dashboards shared to a specific project.
    status: Optional status filter. Allowed values are active, archived, or deleted.
    orderBy: Optional sort order. Supported values include name, -name, owner, -owner, +owner, favorite_count, -favorite_count, +favorite_count, id, -id, +id, description, -description, +description, is_favorite, -is_favorite, and +is_favorite.
    startAt: Index of the first result to return (page offset). Defaults to 0.
    maxResults: Maximum results to return per page (default 50, max 100).
- name: listJiraFilters
  description: Search saved Jira filters visible to the current user, returning their IDs and JQL. To get the matching issues, run a filter's jql through searchJiraIssuesUsingJql; to build a board, pass its id as createJiraBoard's filterId. projectId finds filters shared with that project, not filters whose JQL mentions it.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    filterName: Optional filter name to match. Partial matches are returned unless isSubstringMatch is false. Must be 255 characters or fewer.
    projectId: Optional numeric project ID used to return filters scoped to a project. Use listJiraProjects to resolve a project key to its ID.
    accountId: Optional owner account ID used to return filters owned by that user.
    id: Optional list of specific filter IDs to return. Jira accepts at most 200 IDs per call (`id=10000&id=10001`).
    orderBy: Optional sort order. Defaults to Jira's own ordering when omitted.
    startAt: Index of the first result to return (page offset). Defaults to 0.
    maxResults: Maximum results to return per page. Jira defaults to 50.
    expand: Comma-separated expand tokens on GET /rest/api/3/filter/search. jql, owner, and description are expand-only. Defaults to description,jql,owner.
- name: listJiraIssueAssignableUsers
  description: List the users who can actually be assigned work in a project or on an issue. Filters by assign permission, which a plain name search does not, so prefer it when choosing an assignee for editJiraIssue or createJiraIssue.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    project: Project key (e.g. PROJ) whose assignable users to list. Pass this or issueKey — with neither, Jira rejects the request.
    query: Narrow the result to users whose display name or email matches this term. Omit it to list every assignable user. Only assignable users are searched — for a site-wide search by name or email, use lookupJiraAccountId.
    issueKey: Issue key (e.g. PROJ-123) whose assignable users to list. More accurate than project for an issue that already exists, because permission and security-level rules are evaluated against that issue.
    actionSource: Optional invocation attribution. Jira MCP cards set jira_mcp_card; omit for model/tool-loop calls.
- name: listJiraIssueChangelogs
  description: 'Get a Jira issue''s field-change history — field edits only — paginated oldest-first with no ordering options. For the current value or most recent change, read total (which counts entries, not items) and request startAt = max(0, total - your page size); for counts or patterns across the history, page from startAt 0. A field''s original value is in the first item that changed it; fields never changed leave no trace, and the log starts at the first edit, not at creation. On an item, from/to are IDs or raw values and are absent on text and array fields; fromString/toString are display text, and on array fields like labels each side is the complete set (space-joined, sorted) — diff the two sides, never read one as a delta. Jira omits from and fromString together when the field had no previous value, and to and toString together when it was cleared (so an assignee item with no to/toString is an unassignment). Match items on field, not position: order within an entry varies. Do not infer automation from author.accountType — a script running under a person''s token reads "atlassian".'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key (PROJ-123), numeric ID, or a Jira issue URL
    startAt: Zero-based index of the first changelog entry to return (for pagination). Defaults to 0.
    maxResults: Maximum changelog entries per page (1-50). Defaults to 20; larger pages risk exceeding the client's token limit and failing the call. Use maxResults=1 as a cheap probe to read total before jumping to the end of the history.
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: listJiraIssueComments
  description: 'Get a paginated list of comments for a Jira issue. Use this instead of getJiraIssue when an issue has many comments — getJiraIssue embeds at most 20 and cannot page them. Page with startAt until isLast is true; total is the full comment count. Each comment reports any visibility restriction on it and, on JSM, whether it is internal (jsdPublic: false) — check both before quoting or summarising a comment. Comments are returned as a flat list: a non-null parentId means the comment is a reply, and parentId identifies its root/parent comment. Group comments by parentId to reconstruct threads. Set reactionDetail when emoji reaction data is needed. For the issue''s own fields, use getJiraIssue.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key (PROJ-123), numeric ID, or a Jira issue URL
    startAt: Zero-based index of the first comment to return (for pagination). Defaults to 0.
    maxResults: 'Maximum number of comments to return per page (1-100). Defaults to 100. Read total from the response for the full count. With view: "full" the page is capped at 20, because a larger full-view page can exceed the client''s token limit and fail the whole call; the response echoes the effective value.'
    orderBy: Order comments by created date — "created"/"+created" (oldest first) or "-created" (newest first).
    expand: Comma-separated list of extra data to include on each comment, e.g. "renderedBody" (HTML-rendered body) or "properties".
    responseContentFormat: 'Format for comment bodies. Defaults to markdown. Set html to receive HTML, which is lossless, so a body can be passed straight back to addOrEditJiraIssueComment with contentFormat: html. Fetch as html before editing any comment, since markdown drops images, panels and expands and returns statuses/@mentions as literal text. A page holding any such comment is returned as HTML automatically. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.'
    reactionDetail: Reaction enrichment level. "none" (default) returns comments only, with no Reactions API call. "summary" adds emoji counts and whether the current user reacted. "users" also names who reacted — ask for it only when attribution is requested, since it costs an extra request per distinct emoji and reports when it could not expand every one.
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence", "full". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: listJiraIssueLinkTypes
  description: List the issue link types configured on this site, each with its name and its inward and outward wording (name "Blocks", inward "is blocked by", outward "blocks"). Call it before createJiraIssueLink, which takes the name, when the user has described a link by its inward/outward wording. Issue linking must be enabled site-wide; where it is turned off this operation and createJiraIssueLink both fail.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: listJiraIssueRemoteIssueLinks
  description: 'List the Confluence pages and external URLs linked from an issue''s Web links section. These are not issue-to-issue links: for those call getJiraIssue with view "evidence", which returns fields.issuelinks. Check here before calling createJiraIssueRemoteIssueLink: the same URL added twice becomes two separate links, and no operation removes one.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key like PROJ-123
    globalId: Return only the link with this globalId — the creating system's identifier for the remote item, e.g. "appId=456&pageId=12345" for a Confluence page. It is not the id this tool returns, and the response never includes a globalId, so pass one only when the user supplied it. Pass it raw — the value is URL-encoded for you.
- name: listJiraIssueTransitions
  description: 'List the workflow transitions this issue can take right now, for the calling user. Pass a transition''s id to transitionJiraIssue. A transition''s name and the status it leads to are separate fields: when the user names a target status, match the status a transition leads to, not the transition''s name. For every status a project defines, rather than this issue''s currently valid moves, use listJiraStatuses.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key (e.g. PROJ-123) or numeric ID
    transitionId: Return only the transition with this ID
    expand: Comma-separated expand tokens for extra detail. Use "transitions.fields" to include the fields shown on each transition's screen (for use with transitionJiraIssue).
    skipRemoteOnlyCondition: When true, include transitions hidden by the "Hide From User" condition (default false)
    includeUnavailableTransitions: When true, include transitions that currently fail a condition (default false)
    sortByOpsBarAndStatus: When true, sort by ops-bar sequence then status category (Todo, In Progress, Done); otherwise by ops-bar sequence only (default false)
    actionSource: Optional invocation attribution. Jira MCP cards set jira_mcp_card; omit for model/tool-loop calls.
- name: listJiraIssueWorklogs
  description: Get a paginated list of worklogs (logged time) for a Jira issue. Ordered by worklog creation time, not by when the work started — so the last page is not the most recent work. To find recent work, filter with startedAfter/startedBefore, or read every page and sort by `started`.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key (PROJ-123), numeric ID, or a Jira issue URL
    startAt: Zero-based index of the first worklog to return (for pagination). Defaults to 0.
    maxResults: 'Maximum number of worklogs to return per page (1-100). Defaults to 100. Read total from the response for the full count. With view: "full" the page is capped at 20, because a larger full-view page can exceed the client''s token limit and fail the whole call; the response echoes the effective value.'
    startedAfter: 'Only return worklogs whose work started at or after this time, as a UNIX timestamp in milliseconds. Inclusive: a worklog starting exactly on this timestamp is returned.'
    startedBefore: 'Only return worklogs whose work started strictly before this time, as a UNIX timestamp in milliseconds. Exclusive: a worklog starting exactly on this timestamp is not returned. Pairs with startedAfter as a half-open range, so [dayStart, dayStart+86400000) is exactly one day with no double-counting or gaps between adjacent windows.'
    expand: Extra data to include on each worklog. The only supported value is "properties" (worklog properties).
    responseContentFormat: 'Format for worklog notes. Defaults to markdown. Set html to receive HTML, which is lossless, so a note can be passed straight back to addOrEditJiraIssueWorklog with contentFormat: html. A page holding any note markdown cannot represent (media, panels, statuses, @mentions) is returned as HTML automatically. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.'
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence", "full". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: listJiraProjectComponents
  description: List a Jira project's components with their ids, names, lead and assignee settings, and issueCount — 0 means no issues use a Jira component; Compass results list only components already linked to issues. realAssignee is who actually receives issues when the configured assignee cannot be used. Use it to find a valid component name before setting components on createJiraIssue or editJiraIssue.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    projectIdOrKey: Jira project key or numeric project ID whose components should be listed.
    query: Optional case-insensitive literal filter that matches component name or description.
    componentSource: 'Optional component source filter: jira (default Jira components), compass (connected Compass components), or auto (Compass components when the project is opted into Compass, otherwise Jira components).'
    orderBy: Optional sort order. Sort by description, issueCount, lead, or name. Prefix with - for descending or + for ascending.
    startAt: Pagination offset. Use 0 for the first page and previous startAt + maxResults for the next page.
    maxResults: Maximum components to return per page. Use a smaller value when the user asks for a limited sample.
- name: listJiraProjectIssueTypesMetadata
  description: Returns all issue types available in a Jira project, useful for knowing which issue types can be created. Each entry gives the issue type's id, name, description and subtask flag; pass that id as issueTypeId to getJiraIssueTypeMetaWithFields to get the type's create fields. Page with startAt until it covers total.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    projectIdOrKey: Project ID or key (e.g. PROJ or 10000)
    startAt: Index of the first issue type to return (page offset). Defaults to 0.
    maxResults: Maximum issue types to return per page (max 200, default 50).
- name: listJiraProjects
  description: Find the Jira projects the calling user can see — use it to resolve the projectKey that createJiraIssue requires, or the project a JQL search filters on. For a project's releases use getJiraProjectVersions; for its statuses, use listJiraStatuses.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    query: Filter results by a literal string matching project key or name (case insensitive).
    action: 'Filter by the action the user can perform on the project: view, browse, edit, or create. Defaults to view when omitted.'
    startAt: Index of the first result to return (page offset). Defaults to 0.
    maxResults: Maximum results to return per page (max 100, default 50).
    expand: 'Comma-separated list of extra data to include per project. Options: description, url, projectKeys, lead (project lead account), issueTypes (issue types available in the project), insight (total issue count and last update time). Example: "issueTypes,lead".'
- name: listJiraStatuses
  description: List the statuses a Jira issue can be in — for a project (per work type), for one status looked up by ID or name, or across the whole site by name or category. Takes a PROJECT key (or project ID), not an issue key. For what a specific issue can do right now, use listJiraIssueTransitions instead; a status existing in a project does not mean a given issue can move to it.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    mode: Which question to answer. "project" lists a project's statuses per work type (e.g. what statuses a Bug can be in for PROJ) — pass issueType to narrow to one work type. "status" resolves a single status you saw elsewhere (changelog, JQL, user phrasing) to its ID, name, and category. "site" searches statuses across the site by nameContains and/or statusCategory, returning ID and name only — use mode "status" for the full detail on any one of them.
    projectKey: Project key (e.g. PROJ) or numeric project ID — not an issue key. Required when mode is "project".
    issueType: Only with mode "project". Narrows the result to one work type, matched by name or ID (e.g. "Bug"), so the statuses returned are exactly that work type's. Omit to get every work type in the project.
    statusIdOrName: Only with mode "status". Numeric status ID (preferred) or status name. Names are not unique in Jira, so a name returns one match with a warning — use mode "site" with nameContains to see every status sharing a name.
    nameContains: Only with mode "site". Case-insensitive substring match on the status name. Combine with statusCategory to narrow further. Omitting both filters returns a capped sample of the site's statuses rather than all of them.
    statusCategory: 'Only with mode "site". Restricts results to one status category: "new" (not started), "indeterminate" (in progress), or "done".'
- name: listLoomObjectFolders
  description: List folders in the current Loom workspace. Returns each folder's id, name, and parent space. Use this to find a destination folder id before calling moveLoomObjectToFolder. Pass query to filter folders by name; omit it to list all folders.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    query: Optional text to filter folders by name. Omit to list all available folders in the workspace. Each result has id, name, and parentSpaceId. Omit responseFields for the default result; to filter, select these fields directly, without an items or folders prefix.
- name: listLoomObjects
  description: Browse Loom objects you own, that were shared directly with you, or that are visible in your workspace. Supported objects are videos and meeting recordings, filterable by type or creation date. Each result includes its generated description summary by default. `availableComponents` names content that can be fetched with `getLoomObjectsContent.expand`; that content is not included here. Returns `{ items, hasNextPage, nextOffset }`; recording metadata is inside `items`, not `objects`. Omit `executeRead.responseFields` to keep the default envelope, or select `items`, `hasNextPage`, and `nextOffset`. Results use offset pagination.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    scope: MINE for Loom recordings you own, SHARED_WITH_ME for recordings shared directly with you, or ALL for every recording you can view in the workspace.
    artifactTypes: Optional Loom content types to include. Omit to include both async videos and meeting recordings.
    createdAtRange: Optional inclusive ISO-8601 creation-time range.
    sort: Sort order by creation time. Defaults to CREATED_DESC (newest first).
    limit: Maximum Loom recordings to return per page. Defaults to 10 and is capped at 25.
    offset: Offset for the current page. When hasNextPage is true, pass back the previous response's nextOffset rather than computing this yourself. A page can contain fewer than limit items or no items while more results remain. Continue even after an empty page; stop only when hasNextPage is false.
- name: listMyBitbucketPullRequests
  description: List Bitbucket pull requests authored by you across a workspace; defaults to open PRs
  params:
    workspaceId: Workspace slug or UUID
    state: Filter by pull request state; defaults to OPEN
    draft: False excludes draft PRs; true returns only drafts; omit to include both, subject to the other filters
    sort: Sort field; defaults to most recently updated first
    page: Page number, from 1 to 10000
    pagelen: Number of pull requests per page, from 1 to 100. Defaults to 25.
- name: listMyBitbucketReviewRequests
  description: List Bitbucket pull requests where you are a reviewer; defaults to open PRs and includes already-approved reviews
  params:
    workspaceId: Workspace slug or UUID
    state: Filter by pull request state; defaults to OPEN
    draft: False excludes draft PRs; true returns only drafts; omit to include both, subject to the other filters
    sort: Sort field; defaults to most recently updated first
    page: Page number, from 1 to 10000
    pagelen: Number of pull requests per page, from 1 to 100. Defaults to 25.
- name: lookupJiraAccountId
  description: Look up a Jira user account ID by display name or email — skip it if you already have the accountId. Returns only accountId, displayName and active, plus emailAddress when profile visibility allows it; for time zone, locale, groups, or application roles, pass the accountId on to getJiraUser. To choose an assignee use listJiraIssueAssignableUsers instead, which returns only users who can be assigned.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    query: User name or email to search for
    maxResults: Max results (default 10)
    actionSource: Optional invocation attribution. Jira MCP cards set jira_mcp_card; omit for model/tool-loop calls.
- name: manageConfluenceApproval
  description: Request, decide, cancel, clear, or update a Confluence page approval. Approvals support pages only, not live docs or blog posts.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric Confluence page identifier, up to 19 digits. Approvals support pages only, not live docs or blog posts.
    contentStatus: Content version whose approval should be managed.
    action: Approval operation to perform. The tool maps approve to the backend decision value APPROVED and requestChanges to DENIED.
    reviewId: Active approval review identifier; required except when action is request.
    reviewers: Reviewer list for request. Do not infer or reuse reviewers from earlier conversation context; if the user has not explicitly provided a reviewer for this approval request, ask for one before calling this tool. Each reviewer is a user and includes an account ID. Include displayName when known so responses can use names instead of only IDs. Use 1-10 unique reviewers; reviewer ids must be non-blank strings of at most 128 characters.
    addReviewers: Users to add when action=update. Include displayName when known so responses can say who was added.
    removeReviewers: Users to remove when action=update. Include displayName when known so responses can say who was removed.
    message: Optional request message or replacement message for reviewers.
    dueDate: Optional date-only due date, formatted as YYYY-MM-DD. Use with action=update to set or replace the due date.
    clearDueDate: Set true with action=update to clear the existing due date. Do not send dueDate when clearDueDate is true.
    comment: Optional comment attached to an approve or requestChanges decision. Prompt for this before approving or requesting changes when the user has not already provided or declined a comment.
- name: manageJiraProjectVersion
  description: 'Create, update, release, or archive a Jira project version (release or fix version). create returns the version id the other actions need. If release uses moveUnfixedIssuesTo, setting released: false later does not move those issues back. Otherwise release and archive change only the version, not its issues, and update can reverse either. To view or list versions, or read their release driver and approvers, use getJiraProjectVersions.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    action: The version operation to perform.
    projectIdOrKey: Project key (e.g. "PROJ") or numeric ID. Required for "create".
    versionId: ID of the version. Required for "update", "release", "archive".
    name: Version name (e.g. "v2.1.0"). Required for "create", optional for "update".
    description: Description of what this version includes. Used by "create" and "update".
    releaseDate: Release date in yyyy-mm-dd format (ISO 8601). Used by "create", "update", and "release".
    startDate: Start date in yyyy-mm-dd format (ISO 8601). Used by "create" and "update".
    released: Whether the version is released. Used by "create" and "update".
    archived: Whether the version is archived. Used by "create" and "update".
    driver: Atlassian account ID (AAID) of the version driver, not a name. Used by "create" and "update". Use lookupJiraAccountId (query = a name or email) to find the AAID to pass here. When set, the response echoes back the driver's resolved display name so you can confirm it.
    moveUnfixedIssuesTo: Version ID to move any unresolved issues to when releasing. Used by "release" only; reassigns the fixVersion of open issues from this version to the given one.
- name: manageJiraProjectVersionRelatedWork
  description: Create or update related work links on a Jira project version (release). To read a version's existing related work, use getJiraProjectVersionRelatedWork. Both actions return the relatedWorkId a later update requires, with the stored category, title and url.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    action: The related work operation to perform.
    versionId: ID of the version. Use manageJiraProjectVersion or getJiraProjectVersions to find the ID.
    relatedWorkId: ID of an existing related work item. Required for "update"; it must match an item that already exists on the version (validated before the update is applied). Use getJiraProjectVersionRelatedWork to list existing items and obtain their relatedWorkId values.
    title: Display title for the related work link. Used by "create" and "update". Optional on "create" — when omitted or blank, the URL is used as the title. On "update", omitting it leaves the title unchanged; passing an empty/blank string clears the title and resets the display back to the URL.
    url: URL of the related work link. Any valid http(s) URL is accepted — a runbook, dashboard, change record, or a link to any other system. Required for "create"; on "update" it is optional and, when omitted, the existing URL is left unchanged.
    category: 'Category of the related work. Required for "create"; on "update" it is optional and, when omitted, the existing category is left unchanged. It cannot be cleared — passing an empty/blank value is rejected. Examples: "Designs", "Testing".'
- name: manageJiraSprint
  description: Create, add issues to, start, update, or close a Jira sprint; get a sprintId from listJiraBoardSprints. create returns the new sprint's id, which every later action needs. update rewrites the whole sprint, so any of name, goal, startDate or endDate you omit is cleared — resend the ones to keep; start and close keep them. Closing is one-way. addIssues returns movedIssues, as does start when given issueIdsOrKeys; both add estimatedIssues, with the field each estimate was written to, when storyPoints are passed.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    action: Which sprint lifecycle action to perform.
    boardId: Numeric Jira board ID. Required for "create".
    sprintId: Numeric Jira sprint ID. Required for "start", "update", and "close".
    name: Sprint name. Required for "create"; optional for "start" and "update".
    goal: Sprint goal. Used by "create", "start", and "update".
    startDate: Sprint start date/time in ISO 8601 format (e.g. 2026-08-03T09:00:00.000+0000).
    endDate: Sprint end date/time in ISO 8601 format (e.g. 2026-08-14T18:00:00.000+0000).
    issueIdsOrKeys: 'Issue keys or IDs to move into the sprint when action = "addIssues" or "start". Example: ["PROJ-123", "PROJ-456"].'
    storyPoints: 'Optional issue-key → estimate map to apply before adding issues to the sprint or starting it. Example: {"PROJ-123": 8, "PROJ-456": 3}. The handler resolves the correct Story Points custom field automatically for each issue.'
- name: mergeBitbucketRepoPullRequest
  description: Merge a Bitbucket pull request
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    prId: Numeric pull request ID. Use the exact input key prId.
    message: Merge commit message
    mergeStrategy: Merge strategy. The repository's settings may permit only a subset of these.
    closeSourceBranch: Close the source branch after merge
- name: moveConfluenceContent
  description: Move a Confluence page, whiteboard, database, folder, or embed to a new parent or sibling position
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    id: Numeric ID of the Confluence content to move (page, whiteboard, database, embed, or folder).
    position: 'Where to place the content relative to `targetId`. One of: `append` (under targetId as a child), `before` (immediately before targetId as a sibling), `after` (immediately after targetId as a sibling).'
    targetId: Numeric ID of the target content. For `append` this is the new parent; for `before`/`after` it is the sibling.
- name: publishLoomObject
  description: Step 2 of 2 for creating a Loom object from an uploaded video file. Finalize only after transferring the bytes with createLoomObjectUpload's direct-upload recipe. Use keyPath and fileName from its completionPayload. Return the published object's ARI and share URL.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    keyPath: Upload key path returned in completionPayload.keyPath by createLoomObjectUpload.
    fileName: File name returned in completionPayload.fileName by createLoomObjectUpload.
    folderId: Optional Loom folder ARI where the published recording should appear.
- name: queryAssetsObjectSchemaAttributes
  description: Query attributes for one or more Assets object schemas in the selected site.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    id: Object schema ID
- name: queryAssetsObjectTypes
  description: Query Assets object types by schema in the selected site.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    schemaId: Schema ID, matching-workspace ARI or exact schema name
    excludeAbstract: Exclude abstract object types
- name: queryAssetsObjects
  description: Query Assets objects with generated AQL for one object type in the selected site.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    objectType: Assets object type, for example Service or Hardware
    accountId: Atlassian account ID or IdentityUser ARI; accepts multiple people
    person: Compatibility alias for accountId; accepts multiple people
    personField: Assets user attribute to query
    field: Exact Assets attribute filter in name=value form
    fieldLike: Assets LIKE attribute filter in name=pattern form
    limit: Maximum number of results to return
- name: queryAssetsObjectsUsingAql
  description: Query Assets objects with raw or generated AQL in the selected site.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    inputParts: Compatibility alias for the AQL query
    aql: Raw AQL query string
    objectType: Assets object type, for example Service or Hardware
    accountId: Atlassian account ID or IdentityUser ARI; accepts multiple people
    person: Compatibility alias for accountId; accepts multiple people
    personField: Assets user attribute to query
    field: Exact Assets attribute filter in name=value form
    fieldLike: Assets LIKE attribute filter in name=pattern form
    limit: Maximum number of results to return
- name: queryAssetsReferenceTypes
  description: Query global or schema-scoped Assets reference types in the selected site.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    schemaId: Object schema ID
    includeAll: Include all reference types
- name: removeConfluenceContentPermissions
  description: 'Removes content-level permission grants from a single Confluence content

    entity. Optionally narrow what is removed by operation,

    principal-type, and/or principal-id. Omitting all three filters clears ALL

    Specific access grants on the content. This does not change General access.


    This can revoke access. The server protects against the current user locking

    themselves out of their own content.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content entity (page, blog post, whiteboard, database, folder, etc.) to remove permission grants from.
    operation: 'Only remove grants for this operation. One of: read, update. Omit to match any operation.'
    principal-type: 'Only remove grants for this principal type. One of: user, group. Omit to match any principal type.'
    principal-id: Only remove grants for this principal ID (Atlassian account ID for a user, group ID for a group). Omit to match any principal.
- name: reopenBitbucketRepoPullRequestComment
  description: Reopen a resolved comment thread on a Bitbucket pull request
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    prId: Numeric pull request ID. Use the exact input key prId.
    commentId: ID of the resolved comment thread to reopen
- name: reopenConfluenceTask
  description: Reopen a completed Confluence inline task (mark it incomplete)
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    taskId: The ID of the completed Confluence inline task to reopen.
- name: replaceConfluenceContentPermissions
  description: "Replaces ALL content-level permission grants on a single Confluence content\nentity with the supplied set. Grants not present in the\nrequest are removed, so this can revoke access — prefer\naddConfluenceContentPermissions when you only intend to add grants.\n\nPass the full desired grant set via the `permissions` input, an array of\nobjects shaped exactly like:\n  [\n    {\n      \"operation\": \"update\",\n      \"principals\": [\n        { \"principalType\": \"user\",  \"principalId\": \"<atlassian-account-id>\" },\n        { \"principalType\": \"group\", \"principalId\": \"<group-id>\" }\n      ]\n    }\n  ]\nEnums: operation is one of read | update; principalType is one of\nuser | group. For a user, principalId is the Atlassian account ID; for a\ngroup, principalId is the group ID.\n\noperation `read` = can view, `update` = can edit (edit includes view). A\nprincipal has only ONE effective level, so listing a principal under `read`\nwhen they should keep editing leaves them view-only — list them under\n`update` to preserve edit. Never list the same principal under both\noperations. Replacing Specific access does not change General access.\nBecause this REPLACES the whole set, always\ninclude yourself with `update` if the content is (or is becoming)\nEDIT_RESTRICTED / VIEW_RESTRICTED. The server protects against locking the\ncurrent user out of their own content."
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content entity (page, blog post, whiteboard, database, folder, etc.) whose permission grants should be fully replaced.
    permissions: 'The complete desired set of permission grants. Array of objects, each

      with an `operation` (read | update) and a `principals` array. Each

      principal has a `principalType` (user | group) and a `principalId`

      (Atlassian account ID for a user, group ID for a group). Grants not

      listed here are removed. A principal must appear under only one

      operation across the entire request. Example:

      [{ "operation": "update", "principals": [{ "principalType": "group", "principalId": "<group-id>" }] }].'
- name: requestChangesOnBitbucketRepoPullRequest
  description: Request changes on a Bitbucket pull request
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    prId: Numeric pull request ID. Use the exact input key prId.
- name: resolveBitbucketRepoPullRequestComment
  description: Resolve a comment thread on a Bitbucket pull request
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    prId: Numeric pull request ID. Use the exact input key prId.
    commentId: ID of the comment thread to resolve, must be a top-level comment on the pull request or anchored to the diff, not a reply
- name: resolveConfluenceContentMacros
  description: Resolve supported Confluence macro wrappers into per-macro HTML displayed in Confluence web. Use after getConfluenceContent when a full document read returns wrappers instead of visible content, especially for Include Page, Excerpt Include, and Jira macros. Use the returned HTML bodies to supplement the base document; this operation does not reconstruct the full page.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Positive numeric Confluence content ID that contains the macros to resolve.
    macroIds: 'One or more unique, non-blank macro IDs to resolve. Use this for

      explicit macro selection and omit all. The Confluence server owns the

      current explicit-ID limit, so MCP does not declare a maxItems cap.'
    all: 'Set true to resolve all supported macros, up to 10, in document order.

      Use this all-mode selector only when macroIds is omitted.'
- name: restoreConfluenceContentVersion
  description: Restore an earlier version of a Confluence page, live doc, or blog post as a new latest version
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence page, live doc, or blog post.
    versionNumber: Positive historical version number to restore.
    message: Optional message recorded on the newly created latest version.
    restoreTitle: Also restore the title from the selected historical version. Defaults to false.
- name: runBitbucketRepoPipeline
  description: Run a Bitbucket pipeline
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    target: 'The ref to run against. Provide "ref_type" (e.g. "branch" or "tag") and "ref_name" (e.g. "main"), and optionally "commit": { "hash": "<sha>" } to check out a specific commit instead of the ref''s latest revision. Example: { "ref_type": "branch", "ref_name": "main" }. The pipeline definition is read from bitbucket-pipelines.yml on that ref. (You do not set the target "type" — the tool derives it.)'
    selector: 'Which pipeline definition to run. Omit to run the default branch pipeline for the ref. To run a manually-triggered custom pipeline, set { "type": "custom", "pattern": "<name>" } where "pattern" is the exact name listed under the "custom:" section of bitbucket-pipelines.yml. Omitting this for a custom-only pipeline causes a "bitbucket-pipelines.yml not found" error. For pull-request pipelines use { "type": "pull-requests", "pattern": "**" }.'
    variables: 'Variables passed to this run, as [{ "key": "NAME", "value": "...", "secured": true }]. Set "secured" to true to mask/secure the value (e.g. secrets); it defaults to false. Commonly used with custom pipelines.'
- name: search
  description: Semantically search Jira, Confluence, and connected third-party content using Rovo Search. ALWAYS use this tool to search for Jira and Confluence content unless CQL or JQL is specified. The utilisation of this tool may consume up to 10 Rovo Credits. If the user or organization does not have any Rovo Credits available, the tool call will fail.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    query: The search query. Put exact identifiers such as issue keys or error codes in double quotes (e.g. "PROJ-123" rollback). Quoted text must match exactly, so leave ordinary words and phrases unquoted.
    targetApp: Filter results by product. ALL searches everything. JIRA returns only Jira issues/boards/projects. CONFLUENCE returns only Confluence pages/blogs/spaces. THIRD_PARTY returns content from ready connected external sources.
    limit: ''
- name: searchAssetsObjects
  description: Search Assets objects by name or query-builder filters in the selected site.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    inputParts: Natural text to match against Assets object names
    query: Natural text to match against Assets object names
    aql: Raw AQL query string
    objectType: Assets object type, for example Laptop or Hardware
    field: Exact Assets attribute filter in name=value form
    fieldLike: Assets LIKE attribute filter in name=pattern form
    accountId: Atlassian account ID or IdentityUser ARI; accepts multiple people
    person: Compatibility alias for accountId; accepts multiple people
    personField: Assets user attribute to query
    limit: Maximum number of results to return
- name: searchConfluence
  description: Search Confluence content with CQL
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    cql: 'CQL query string (max 4096 chars). Examples:

      `type = page AND space = "DEV"`,

      `title ~ "onboarding" AND lastmodified > "2025-01-01"`,

      `creator = currentUser() AND type IN (page, blogpost) ORDER BY lastmodified DESC`.'
    cqlcontext: JSON-encoded execution context, e.g. {"spaceKey":"DEV"}. Restricts the search to the supplied scope.
    expand: 'Comma-separated list of content properties to expand on each result.

      Common values: `space`, `version`, `body.view`, `metadata.labels`,

      `ancestors`. Use sparingly to avoid large responses.'
    limit: Max number of results to return per page (1-100). Defaults to 25.
    cursor: Opaque pagination cursor returned by a previous call. Omit to start from the first page.
- name: searchFocusAreas
  description: Search focus areas using text and structured filters with optional pagination and sorting. Omitting query and filters lists/browses focus areas. Exact lookup by ARI, UUID, or URL should use getFocusArea instead. getFocusArea also returns more detail per focus area than search results do — startDate, archived/draft/starred/watching flags, created and updated timestamps, and direct child focus areas — so follow up with it once a specific focus area is identified. Set include.aboutContent to true to fetch about content, and/or pass include.statusUpdates for latest status updates per result. Paginate with first/after using pageInfo.endCursor. Custom field filtering is supported through filters.customFields (resolve field searchKeys and select option UUIDs with getFocusAreaCustomFields first); filtering for focus areas where a custom field has no value is not supported — do not retry with other operators to express it.
  params:
    query: Plain-text focus area search.
    filters: 'Structured filters for focus area search. Shape: { "status": "IN_PROGRESS", "health": "AT_RISK", "starred": true, "following": true, "owner": "<accountId>", "archived": false, "customFields": [{ "field": "<searchKey>", "operator": "EQUALS", "value": "..." }] } — all fields optional, combined with AND. status is one of PENDING, IN_PROGRESS, PAUSED, COMPLETED; health is one of OFF_TRACK, AT_RISK, ON_TRACK; starred accepts only true (focus areas the current user has starred); following returns focus areas followed by the current user, accepts only true, and is independent of starred; owner is an Atlassian account ID; archived is a boolean. Each customFields item has field (the definition''s searchKey from getFocusAreaCustomFields — definition ARIs are not accepted, and searchKeys are case-sensitive and may be mixed-case; do not fabricate them), operator, and value (single value) or values (array, for IN/NOT_IN only). operator is one of EQUALS, CONTAINS, GT, GTE, LT, LTE, IN, NOT_IN, validated against the field''s type: EQUALS applies to all types; CONTAINS to TEXT only; GT, GTE, LT, LTE to NUMBER and DATE; IN and NOT_IN to select and user fields. Select field values are option UUIDs (not labels) and user field values are Atlassian account IDs, both from getFocusAreaCustomFields. Filtering for focus areas where a custom field has no value is not supported.'
    sort: 'Sort order for focus areas. Shape: [{ "field": "targetDate", "direction": "asc" }]. Each item must have field (one of name, status, health, targetDate, focusAreaType) and direction (asc or desc). When omitted, results default to name descending upstream.'
    first: The number of focus areas to return in a paginated result.
    after: Cursor for the next page. Pass pageInfo.endCursor from the previous response.
    include: 'Optional focus area details to include. Shape: { "aboutContent": true, "statusUpdates": {} }. aboutContent is a boolean (defaults to false). statusUpdates is an object, not a boolean — pass an empty object ({}) to include it with its defaults. statusUpdates.first defaults to 1 (max 20); statusUpdates.includeTransitions defaults to true (previous/new status and health).'
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: searchGoals
  description: Find Atlassian Goals by text and structured filters.
  params:
    query: Plain-text Goal search, not raw TQL.
    filters: Optional filters. Supported fields are archived, teamId, ownerAccountId, followerAccountId, statusPhases, and tag.
    sort: Up to three sort criteria in priority order. Each item has field and direction (asc or desc).
    limit: Maximum number of Goals to return.
    cursor: Use pageInfo.endCursor from the previous response to fetch the next page.
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: searchJiraIssuesUsingJql
  description: 'Search for Jira issues using JQL, with an optional approximate count. Use view: "evidence" to fetch and map custom fields. Page with nextPageToken until isLast is true. For one known issue, use getJiraIssue. JQL only returns issues; inferring anything else from issue rows is silently incomplete. Use the purpose-built operation for sprints, boards, board config, field history, worklogs, releases, accountIds, issue types, projects and statuses. Searches span all projects unless you add a project clause; for cross-team or related-work questions, leave it out or use `project in (A, B)`.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    jql: JQL query string e.g. "project = PROJ AND status = 'In Progress'", or across all projects 'text ~ "PROJ-123" ORDER BY updated DESC'. If the tool returns a repairHint, follow it and retry.
    searchResultMode: Default "issues". Never count for normal search or if nextPageToken used. If total for same query is known, reuse it. Use "count" only when no trusted count exists and either the user asks or a downstream step needs it. Use "all" only if both count and issues required.
    maxResults: Maximum results to return (default 50, max 100)
    fields: 'Fields per issue (e.g. ["summary", "status", "customfield_10010"]). customfield_* IDs are site-specific — discover the correct id for story points etc. on this Cloud site. Honoured exactly when supplied. Values map to issues[].fields.customFields (human labels), not raw customfield_* keys. The default "compact" view omits custom fields; use view: "evidence" for velocity/sprint JQL (fetches and maps all custom fields) or pass explicit customfield_* IDs.'
    nextPageToken: Pagination token from a previous response to fetch the next page
    responseContentFormat: Format for rich-text bodies (description, environment, comments) when the view returns them. Defaults to markdown; html is lossless for a later editJiraIssue. Issues holding anything markdown cannot represent (media, panels, expands, statuses, @mentions) are returned as HTML automatically, decided per issue. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.
    actionSource: Optional invocation attribution. Jira MCP cards set jira_mcp_card; omit for model/tool-loop calls.
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence", "full". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: searchJsmRequests
  description: Search one bounded page of caller-visible Jira Service Management requests. Use JQL for project, request type, assignee, status, approval, text, due-date, and ordering filters. Use this tool when JSM requests, issues, or work items need your attention, when you need urgency signals from SLA state or sentiment, or when you need to identify auto-resolvable work items after approval. Returns summary, status, assignee, request type, sentiment, SLA state, card display data (issue-type icon, status category, assignee and requester avatars), URLs, and compact resolver-plan availability. This tool does not return full request details or plan steps. When the upstream request search ranks rows, it preserves the total score, each score component, and evidence so clients can render and explain urgency consistently.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    jql: 'Optional Jira JQL expression for filtering and ordering requests, including project selection. Example: project = ITSM AND assignee = currentUser() AND statusCategory != Done ORDER BY updated DESC. Omit to use the default open-request search.'
    first: Maximum request rows in one page. Defaults to 10; maximum 10. Continue with nextPageToken for more.
    nextPageToken: Token from a previous response for the same filters.
- name: searchProjects
  description: Find Atlassian Projects by text and structured filters.
  params:
    query: Plain-text Project search, not raw TQL.
    filters: Optional filters. Supported fields are archived, teamId, ownerAccountId, contributorAccountId, followerAccountId, reportingLineAccountId, statusPhases, linkedGoalKey, and tag.
    sort: Sort criteria in priority order. Each item has field and direction (asc or desc).
    limit: Maximum number of Projects to return.
    cursor: Use pageInfo.endCursor from the previous response to fetch the next page.
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: searchTalentPositions
  description: Search Talent positions by their own attributes using an RQL filter, returning a paginated list of positions with their requested field values (each position's ARI is the `id`, so this is how you obtain ARIs for getTalentPosition). Use this for flat attribute filters — job title, country, level, status, job family, tenure. Use getTalentPositionsByEntity INSTEAD when scoping to a reporting line or a focus area, and getTalentGroupMetrics INSTEAD when you only need counts rather than the positions themselves. RQL field IDs and their valid values are workspace-specific and must not be guessed — call getTalentFields to resolve them. The common built-ins are positionJobTitle, positionCountry, positionLevel, positionStatus, positionRole, positionManager, positionTenure, positionJobFamily, positionEmploymentType, positionWorker and team; for anything else, or for a field's valid values, go through getTalentFields. If a filter returns nothing, suspect the field ID or its value and check it with getTalentFields rather than adding more filters.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    rql: Radar Query Language filter and ordering that scopes which positions are returned. Field IDs and values are workspace-specific — resolve them with getTalentFields rather than guessing. Omit to search across all positions the caller can see.
    count: Maximum number of positions to return in this page, 1-100. Defaults to 25.
    after: Forward pagination cursor from a previous response's endCursor.
    fieldIdIsIn: Array of position field ID strings to return for each position, as returned by getTalentFields. When omitted, a default set of position fields is returned.
- name: searchTalentSkillTaxonomy
  description: Search the Talent skill taxonomy (domains, specializations and skills) to resolve skill-category terms into concrete skill IDs. Use this when category-level skill requests (for example "backend", "security", or "machine learning") cannot be resolved reliably from worker skill value lookup alone. Use scope=DOMAINS to list taxonomy roots, scope=SKILLS for direct leaf-skill name search, and domainIds with default/ALL scope to fetch full domain subtrees that include specialization-level nodes.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    rql: Optional Radar Query Language filter for taxonomy rows, such as name substring matching or skillParent IN (...) expansion queries.
    scope: Which taxonomy rows to return. ALL returns full taxonomy rows in scope; use with domainIds to retrieve complete domain subtrees including specialization-level nodes. DOMAINS returns only top-level domain nodes. SKILLS returns only assignable leaf-skill nodes.
    domainIds: Optional list of taxonomy domain IDs used to constrain results to those domains and return each domain's subtree.
    count: Maximum number of taxonomy rows to return in this page, 1-100. Defaults to 25.
    after: Forward pagination cursor from a previous response's endCursor.
- name: setBitbucketRepoPullRequestTaskState
  description: Resolve or reopen a Bitbucket pull request task
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    prId: Numeric pull request ID. Use the exact input key prId.
    taskId: Task ID to update
    taskState: New task state
- name: setConfluenceContentRestrictionState
  description: "Sets the high-level restriction state for a single Confluence content entity.\nProvide `state` as one of:\n  OPEN            — \"Open, Anyone in this space can edit\": everyone with space access can VIEW and EDIT.\n  EDIT_RESTRICTED — \"Open, Anyone in this space can view\": everyone with space access can VIEW; only Specific access update principals can edit.\n  VIEW_RESTRICTED — \"Restricted, Only specific people can view or edit\": only Specific access read/update principals can VIEW; only update principals can edit.\n\nHOW GENERAL AND SPECIFIC ACCESS WORK TOGETHER: the state is the General\naccess baseline. Moving away from OPEN removes broad access. Permission\ngrants are Specific access exceptions that add access for individual users\nor groups; they do not remove General access or make content private by\nthemselves. A principal has exactly ONE Specific access level — update,\nread, or none — and update includes read/view. Changing the state does not\ncreate or modify Specific access grants.\n\nSELF-LOCKOUT: when leaving OPEN, the caller must retain `update`; `read` is\nnot sufficient for editing. Private creation already performs the safe\nVIEW_RESTRICTED + creator update setup. Existing-state and self-lockout\nvalidation belongs to the Confluence monolith, and this tool never disables it."
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content whose restriction state should be set.
    state: 'New General access state. OPEN = anyone in the space can edit;

      EDIT_RESTRICTED = anyone in the space can view; VIEW_RESTRICTED = only

      Specific access principals can view or edit.'
- name: setConfluenceContentStatus
  description: Set the content state (status) of a Confluence page or blog post
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content whose state should be set.
    status: 'Which version of the content to update: `current` (default) or

      `draft`. Lowercase only.'
    id: ID of an existing content state to apply. Wins over name+color.
    name: 'Name of a custom content state (1-20 chars). Sent together with

      `color`. Ignored when `id` is provided.'
    color: 'Hex color of the custom content state (e.g. `#FF8B00`). Sent

      together with `name`. Ignored when `id` is provided.'
- name: setConfluenceSpaceInstructions
  description: Set the space instructions for a Confluence space
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    spaceKey: Confluence space key, for example DEV or ~accountId for a personal space. Provide either spaceKey or spaceId.
    spaceId: Numeric ID of the Confluence space. Resolved to the space key before the request. Provide either spaceKey or spaceId.
    body: Non-empty space instructions body to store.
    body_format: Instruction body format to store. Use markdown or html. Do not send storage or ADF.
- name: setJsmAgentAvailability
  description: Set one Jira Service Management Workforce Management agent's availability for a service project. Use this for "set me available", "set me on break", or an explicitly supplied agentAccountId when you are authorized to update that agent. Status accepts AVAILABLE or ON_BREAK and TWG-compatible aliases available, active, online, away, on-break, or unavailable. This is not for reading availability, bulk team updates, project defaults, assignment, or Live Chat status.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    projectKey: Jira Service Management project key or numeric project ID. Do not guess the project.
    agentAccountId: Optional Atlassian account ID of the agent to update. Omit only to update the authenticated agent; do not infer an agent from a name or email.
    status: Availability status to set. Use AVAILABLE or ON_BREAK; aliases available, active, online, away, on-break, and unavailable are accepted.
- name: shareLoomObject
  description: Send a Loom object, currently an async video or meeting recording, to specific Atlassian users by notification, with an optional message. This does not change overall visibility; use updateLoomObjectVisibility for that. Identify the object by Loom video ARI, share URL, or embed URL, and provide exactly one recipient list.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    identifier: Loom video or meeting recording ARI, share URL, or embed URL identifying what to share.
    userAris: List of 1 to 100 Atlassian user ARIs, formatted as ari:cloud:identity::user/{aaid}. Provide exactly one of userAris or recipientQueries.
    recipientQueries: List of 1 to 100 exact names or email addresses of active workspace members. Every value must resolve to exactly one member. Provide exactly one of recipientQueries or userAris.
    message: Optional message to include in the share notification sent to recipients.
- name: showConfluenceEditor
  description: Show a Confluence page or live doc as a card in the chat that the user can open to keep editing in Confluence. Use it only for pages and live docs. Call it when the user asks to work on, open, or help update an existing page or live doc, as soon as you know which one, before asking what to change. By default, also call it after createConfluenceContent and after an updateConfluenceContent that rewrites a page or live doc. Skip it after appends or prepends, for content whose card you already showed in this conversation, and when one task writes several pieces of content. Changes nothing.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the content to show.
    webUrl: 'The content''s link, such as content.webUrl from a createConfluenceContent or

      updateConfluenceContent result: a path under the site''s /wiki base, or a link on the same

      site. Optional: without it, the card links the page or live doc from its ID.'
- name: starConfluenceContent
  description: Star a Confluence content item for the current user
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric Confluence content ID.
- name: starConfluenceSpace
  description: Star a Confluence space for the current user
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    spaceKey: Confluence space key. Provide either spaceKey or spaceId.
    spaceId: Numeric ID of the Confluence space. Resolved to the space key before the request. Provide either spaceId or spaceKey.
- name: transitionJiraIssue
  description: Move a Jira issue through its workflow and/or into a sprint or the backlog — at least one is required. Take transitionId from listJiraIssueTransitions; transitionName is the transition's own name, not the target status. Returns the status the issue actually landed in, so no read-back is needed. If the sprint/backlog move fails after the status change succeeds, the status change stays — retry the move alone, not the whole call.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key like PROJ-123
    transitionId: Transition ID (get from listJiraIssueTransitions). Provide either transitionId or transitionName.
    transitionName: Name of the transition itself, not the target status — the two often differ, so "Done" does not match a transition named "Review->Done". Provide only one of transitionId, transitionName, transition, or targetStatus.
    fields: Optional Jira field values to apply during the workflow transition.
    update: Optional Jira field update operations to apply during the workflow transition. A comment passed here may be dropped without error — the transition reports success and no comment is created. Use addOrEditJiraIssueComment instead.
    historyMetadata: Optional issue history metadata to attach to the workflow transition.
    sprintId: Assign the issue into this sprint. Mutually exclusive with assignToBacklog.
    assignToBacklog: Set true to assign the issue to the backlog, mutually exclusive with sprintId. Optionally use boardId to target a specific board's backlog.
    boardId: 'Legacy board id: targets this board''s backlog when assignToBacklog is true (board IDs from listJiraBoards). Does not scope the sprint name lookup — use board for that. Superseded by board; mutually exclusive with board. Ignored for a plain transition.'
    actionSource: Optional invocation attribution. Jira MCP cards set jira_mcp_card; omit for model/tool-loop calls.
- name: transitionJsmRequest
  description: Perform one customer/request-portal-visible Jira Service Management request transition selected from getJsmRequestActionMetadata. This is for help-seeker/customer portal transitions, not agent-side queue or generic Jira workflow transitions. It returns compact execution metadata only; use getJsmRequest afterwards when refreshed request state is needed.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: JSM customer request issue ID or key, for example HD-123.
    transitionId: Customer/request-portal transition ID returned by getJsmRequestActionMetadata. Do not provide a transition name.
    additionalComment: Optional public, customer-facing comment to include with the transition. Maximum 5000 characters. Do not use for an internal note.
- name: unarchiveConfluenceContent
  description: Unarchive (restore) a single Confluence content entity
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content to unarchive.
- name: unstarConfluenceContent
  description: Remove a star from a Confluence content item for the current user
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric Confluence content ID.
- name: unstarConfluenceSpace
