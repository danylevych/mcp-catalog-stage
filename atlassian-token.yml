- name: getConfluenceContent
  description: 'REQUIRED: Supply at least one content locator: content_id or content_url.

    Read any Confluence content (page, blog, live doc, comment, whiteboard, embed, database, folder).'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    content_id: 'Required when content_url is omitted. Numeric Confluence content ID, or a

      Confluence tiny link key (the encoded part

      from /wiki/x/ URLs, e.g. 4_sXAQ). Recognized Confluence content URLs are also

      accepted and converted to the content ID, but prefer content_url for URLs.

      One of content_id or content_url is required.'
    content_url: 'Required when content_id is omitted. Full URL of the Confluence content.

      Supported: pages/live docs

      (/pages/{id}), blog URLs (/blog/{id}), whiteboards

      (/whiteboard/{id}), databases (/database/{id}), folders (/folder/{id}),

      embeds (/embed/{id}), and TinyUrl (/wiki/x/{key}). Prefer this for URLs copied from Confluence.

      One of content_id or content_url is required.'
    detail: 'Response shape for document-style reads. summary = title + excerpt + counts

      (default, cheap). ai_summary = the generated AI summary when available, otherwise

      null; it does not fall back to the standard excerpt. outline = heading tree (cheap,

      for navigation). full = body in the requested format (use when intending to edit).

      Non-document content such as whiteboards, databases, folders, and embeds does not support detail;

      content_format is a separate representation selector for

      formats such as whiteboard svg/png, database csv, or embed url.'
    content_format: 'Body format. Doc types: html (default) or markdown. Document HTML can contain

      supported macro wrappers instead of content displayed in Confluence web. When

      visible macro content is required, use resolveConfluenceContentMacros with the

      returned numeric content ID and all=true; use discover if its full contract is

      needed. Whiteboards support only svg and png: use svg to inspect content or

      prepare edits, or png for a screenshot. Never use html or markdown for a

      whiteboard. PNG is read-only and returns a short-lived presigned URL in

      body.value, not the image content. Databases: csv.

      URL-backed content such as embeds: url. For an embed or Smart Link, including a

      Smart Folder child, explicitly request content_format=url and omit detail to read

      the destination URL in body.value. Then follow retrievalGuidance to read the target.

      Omitting content_format preserves the existing envelope-only embed read.'
    draft: 'If true, read the draft version instead of current. Only supported for

      pages and blog posts.'
- name: getConfluenceContentAnalytics
  description: 'Return per-user Confluence viewer rows for one supported content item (page, live doc, or blog post), including each viewer''s engagement category, the latest version viewed, and last viewed time. Always present results as a horizontal table, even for one viewer, with exactly these columns in this order: People and agents, Engagement, Latest version viewed, Last viewed, Views. When dates are omitted, Confluence uses the same default range as the Viewers table. Use the relative last-viewed value, such as "7 minutes ago", instead of the exact timestamp. For an AGENT row with both names, present People and agents as "<displayName> with <relatedUserDisplayName>". Keep the Engagement column; if engagement is missing, put "-" rather than inventing another category.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    content_id: Numeric Confluence content ID for a page, live doc, or blog post.
    limit: Max viewer rows to return per page (1-100, default 25).
    fromDate: Inclusive start date, at most 12 months ago in the user's timezone.
    toDate: Inclusive end date, not in the future in the user's timezone.
    cursor: Opaque nextCursor for the same content. Omit when sending dates; it preserves the original range.
- name: getConfluenceContentAncestors
  description: List the ancestor chain (parent, grandparent, …) of a Confluence content entity
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content whose ancestors should be listed.
    limit: Maximum number of ancestors to return (1-250). Defaults to 25.
- name: getConfluenceContentDescendants
  description: List descendants of a Confluence content entity (page, folder, whiteboard, database, embed, or slide)
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content entity whose descendants to list. For a whole space's page tree, pass the space's homepageId from getConfluenceSpace.
    depth: How many levels of descendants to return (1 = direct children only). Defaults to 2; maximum 10.
    limit: Maximum number of descendant entries to return per page (1-250). Defaults to 25.
    cursor: Opaque pagination cursor extracted from the previous response's `_links.next` URL.
- name: getConfluenceContentPermissions
  description: 'Lists the explicit content-level permission grants on a single Confluence

    content entity. Each grant pairs an operation (read or update) with a principal

    (a user or a group). Optionally filter by operation, principal-type, or principal-id,

    and paginate with cursor and limit.


    Use this to audit who has been granted read or update access before adding,

    replacing, or removing grants. To read the higher-level restriction state

    (OPEN / EDIT_RESTRICTED / VIEW_RESTRICTED), use

    getConfluenceContentRestrictionState instead.


    Specific access rows: `read` = Can view and `update` = Can edit (which

    already includes view). Each principal has one

    level: read, update, or none. These grants add principal access; they do

    not restrict other people or change General access. General access is

    controlled by the restriction state, not direct grants.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content entity (page, blog post, whiteboard, database, folder, etc.) whose permission grants should be listed.
    operation: 'Filter by operation. One of: read, update.'
    principal-type: 'Filter by principal type. One of: user, group.'
    principal-id: Filter by principal ID. For users this is the Atlassian account ID; for groups it is the group ID.
    cursor: Opaque pagination cursor returned in _links.next by a previous call. Omit to start from the first page.
    limit: Max number of grants to return per page (1–250). Defaults to 100.
- name: getConfluenceContentRestrictionState
  description: "Reads General access for a single Confluence content entity. The\nrestriction states are:\n  OPEN                 — \"Open, Anyone in this space can edit\".\n  EDIT_RESTRICTED      — \"Open, Anyone in this space can view\"; only Specific access update principals can edit.\n  VIEW_RESTRICTED      — \"Restricted, Only specific people can view or edit\"; Specific access read/update grants determine access.\n\nUse this for a quick read of the overall restriction posture; use\ngetConfluenceContentPermissions to enumerate the individual user/group grants."
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content entity (page, blog post, whiteboard, database, folder, etc.) whose restriction state should be read.
- name: getConfluenceContentStatus
  description: Read the content state (status) of a Confluence page or blog post
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence content whose state should be read.
    status: current (default, published badge) or draft. Lowercase only.
- name: getConfluenceContentSuggestions
  description: List existing edit, informational, and Remix suggestions for a Confluence page, including their sources. Content in edit tool calls is returned as Confluence HTML by default.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the existing Confluence page whose suggestions should be retrieved.
    contentType: The target content type, matching the type returned when fetching the content.
    status: Optional lifecycle status filter. Omit to retrieve suggestions in any status.
    toolCallFormat: 'Format for content-bearing tool-call values. html preserves local IDs in

      data-local-id attributes and is the default. Use adf for minified ADF JSON.'
- name: getConfluenceContentVersion
  description: Get one historical version of a Confluence page, live doc, or blog post
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence page, live doc, or blog post.
    versionNumber: Positive version number to retrieve.
    content_format: Optional historical body format. Omit to return version metadata without rendering the body.
- name: getConfluenceMauiApp
  description: Retrieve the source and metadata for a Maui app owned by a Confluence page.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: 'Numeric ID of the Confluence page that owns the Maui app (content type: page or live_doc only).'
    mauiId: ID of the Maui app to retrieve.
- name: getConfluencePersonalSpace
  description: Get the current user's Confluence personal space
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: getConfluencePublicLinkStatus
  description: Get the external public-link (anonymous share) status of a Confluence page
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric ID of the Confluence page to read the public-link status for.
- name: getConfluenceReactions
  description: Get emoji reactions on Confluence content
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    contentId: Numeric Confluence content ID (page, blog post, or comment).
- name: getConfluenceSpace
  description: Get one Confluence space by id or key, including enabled content types, optional labels, and instructions when configured. Reuse the result for the same cloudId and space during the current task instead of reading the space before every write. If spaceInstructions is omitted, no instructions are configured; normal authoring does not require a separate getConfluenceSpaceInstructions call.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    spaceIdOrKey: Numeric Confluence space id or space key, for example 123456, DEV, or ~accountId for a personal space.
    includeLabels: If true, include the space labels in the response. Defaults to false.
- name: getConfluenceSpaceInstructions
  description: Get the space instructions for a Confluence space
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    spaceKey: Confluence space key, for example DEV or ~accountId for a personal space. Provide either spaceKey or spaceId.
    spaceId: Numeric ID of the Confluence space. Resolved to the space key before the request. Provide either spaceKey or spaceId.
    body_format: Instruction body format to return. Defaults to markdown. Use html for Confluence HTML. Do not request ADF.
- name: getConfluenceTask
  description: Get a single Confluence inline task by its ID
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    taskId: The ID of the Confluence inline task to fetch.
- name: getConfluenceTemplate
  description: Get a Confluence template body
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    templateId: ID of the Confluence template or blueprint to fetch. Use templateId returned by listConfluenceTemplates.
- name: getContentFormatGuide
  description: Get the content-format guide for authoring a rich content body or constructing a Confluence Remix prompt. Pass `toolName` to receive the canonical guidance for that operation. For generic Confluence content writes, pass the content-specific key (for example `createConfluencePage`, not `createConfluenceContent`). For Remix, pass the exact create/edit operation you are about to call. Use this before authoring or editing rich Confluence content, constructing a Remix generation/edit prompt, or writing a Jira issue/comment body in HTML. First call with only `toolName`; if the returned guidance references follow-up documents, call this operation again with the same `toolName` and `reference` set to a single referenced path to load that additional guidance. Fetch one document per call.
  params:
    toolName: 'The content-specific operation key to fetch guidance for, never a bare content type such as `whiteboard`. For generic Confluence content authoring/editing, this is NOT `createConfluenceContent` or `updateConfluenceContent`; use the create/update key for the target content type: `createConfluencePage`/`updateConfluencePage` (pages, blog posts, live docs), `createConfluenceWhiteboard`/`updateConfluenceWhiteboard`, or `createConfluenceDatabase`/`updateConfluenceDatabase`, or `addConfluenceContentSuggestions` for content suggestions. For Remix prompt construction, use the exact operation: `createConfluenceInfographicForPage`, `editConfluenceInfographicForPage`, `createConfluenceMauiApp`, or `editConfluenceMauiApp`. For authoring Jira issue/comment bodies in HTML (contentFormat: html) the value is `editJiraIssue` or `addOrEditJiraIssueComment`. The response lists the supported values if an unknown one is passed.'
    reference: Optional provider-specific reference for alternate or follow-up guidance content. Use a value referenced by the initial description response when fetching additional guidance after the initial `toolName` lookup. Accepts a single path string; fetch one document per call.
- name: getFocusArea
  description: Get a focus area by identifier, with optional expansions. Use when the exact focus area UUID, ARI, or page URL is known. For text search or listing, use searchFocusAreas instead. Optional include expansions cover about content, the current user's latest draft status update, status updates, sub-focus areas, linked goals, linked work, and custom field values.
  params:
    focusAreaIdentifier: The focus area to retrieve. Accepts a focus area UUID, a focus area ARI, or a focus area page URL. When reusing an identifier from an earlier response, pass its uuid field — not its id field.
    include: 'Optional focus area details to include. Shape: { "aboutContent": true, "latestDraftUpdate": true, "statusTransitions": true, "customFields": true, "statusUpdates": {}, "subFocusAreas": {}, "linkedGoals": {}, "linkedWork": {} }. aboutContent, latestDraftUpdate, statusTransitions and customFields are booleans (all default to false). latestDraftUpdate includes the current user''s latest saved draft status update for this focus area, if one exists. statusTransitions lists the status changes this focus area currently allows, and is the required first step before changing its status: createFocusAreaStatusUpdate takes ids from this list. customFields returns the focus area''s stored custom field values as customFields[] entries with definitionId (the definition ARI, usable in updateFocusArea customFields), name, searchKey (usable in searchFocusAreas filters.customFields), type, and the typed value: textValue, numberValue, dateValue, booleanValue, option { id, label }, options, userId, or userIds (user values are flat Atlassian account IDs). Only fields with a stored value are returned — a field absent from customFields is unset. statusUpdates and subFocusAreas are objects, not booleans — pass an empty object ({}) to include one with its defaults. statusUpdates.first defaults to 3 (max 20); statusUpdates.after paginates via statusUpdates.pageInfo.endCursor; statusUpdates.includeTransitions defaults to true. subFocusAreas returns direct children — subFocusAreas.query is optional plain text; subFocusAreas.first defaults to 10 (max 50); subFocusAreas.after paginates via subFocusAreas.pageInfo.endCursor; subFocusAreas.sort is an array like [{ "field": "targetDate", "direction": "asc" }], where field is one of name, status, health, targetDate, focusAreaType and direction is asc or desc. linkedGoals and linkedWork are objects, not booleans — pass {} to include defaults. linkedGoals.first defaults to 10 (max 50) and linkedGoals.after paginates via linkedGoals.pageInfo.endCursor. linkedWork supports optional query plus first/after pagination (first defaults to 10, max 50). linkedWork.sort is an array like [{ "field": "targetDate", "direction": "asc" }], where field is one of name, key, status, type, source, sourceStatus, applicationName, targetDate and direction is asc or desc. linkedWork results are filtered to the resolved cloud ID input. include.linkedGoals requires focusAreaIdentifier to be a focus area ARI; if only a UUID or URL is known, call getFocusArea first and pass the returned ari. include.linkedWork also requires a focus area ARI; if only a UUID or URL is known, call getFocusArea first and pass the returned ari.'
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: getFocusAreaCustomFields
  description: 'List the custom field definitions configured for Focus areas in a workspace: definition ARI, name, description, type (TEXT, NUMBER, DATE, SINGLE_SELECT, MULTI_SELECT, BOOLEAN, SINGLE_USER, MULTI_USER), searchKey, visibility, and for select fields the available options as { id, label }.

    USE WHEN resolving a custom field by name before writing values with updateFocusArea customFields or filtering with searchFocusAreas filters.customFields — writes need the definition ARI, search filters need the searchKey, and select fields need option UUIDs; all come from this tool, do not fabricate them. Returns definitions only, not the values on a focus area.'
  params:
    query: Optional plain-text filter matching definition names containing the text. Omit to list all definitions.
    first: The number of definitions to return in a paginated result.
    after: Cursor for the next page. Pass pageInfo.endCursor from the previous response.
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: getFocusAreaTypes
  description: 'Get the configured Focus area type hierarchy for a workspace.

    USE WHEN the user needs the valid Focus area types for a site — for example before creating a Focus area, or to understand hierarchy levels and parent type relationships.

    Returns each type with identifiers, hierarchy level, parent hierarchy references, and associated Focus area counts.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: getGoal
  description: Retrieve one Atlassian Goal by its exact Goal ARI or key, with optional related details.
  params:
    identifier: Exact Goal ARI or key. A key may contain multiple hyphens and must end in a numeric segment.
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    include: Optional details to include. Allowed values are description, updates, tags, teams, projects, parentGoal, subGoals, metricTargets, and highlights. Metric targets include the target IDs required for metric updates. Highlights are the learnings, risks, and decisions recorded on the Goal, including any attached to a Goal update.
    subGoalKind: Filter the subGoals expansion by kind. Applies only when subGoals is included.
    highlightType: Filter the highlights expansion by type. Applies only when highlights is included; omit it to return every type.
    noUpdateAttached: Return only highlights that are not attached to any Goal update. Applies only when highlights is included; omit it to return every highlight.
    limits: Optional per-connection page sizes for updates, tags, teams, projects, subGoals, metricTargets, and highlights. Each defaults to 5 and accepts 1-20.
    cursors: Optional pagination cursors keyed by updates, tags, teams, projects, subGoals, metricTargets, or highlights.
- name: getGoalTypes
  description: Get the Goal Types available in an Atlassian site for creating Goals and Success Measures.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    includeDisabled: Whether to include disabled Goal Types. Disabled types cannot be used to create Goals.
    limit: Maximum number of Goal Types to return.
    cursor: Pagination cursor returned by a previous call.
- name: getGoalUpdate
  description: Retrieve one Atlassian Goal update by its exact Goal Update ARI, with optional related details.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    updateId: Exact Goal Update ARI in the form ari:cloud:townsquare:{cloudId}:goal-update/{resourceId}.
    include: Optional details to include. Allowed values are comments, notes, highlights, and metricUpdates.
    limits: Optional per-connection page sizes for comments, notes, highlights, and metricUpdates. Each defaults to 5 and accepts 1-20.
    cursors: Optional pagination cursors keyed by comments, notes, highlights, or metricUpdates.
- name: getGraphContext
  description: 'Retrieves connected context from Teamwork Graph for any Atlassian entity. Returns all relationships and linked objects within one traversal – including cross-product and third-party connections. Use when the answer requires connections between entities, not just a single entity''s fields.


    Supported entry points:


    Jira: issues, projects, sprints, versions, comments


    Confluence: pages, blogposts, whiteboards, databases, spaces


    Goals, Projects, Focus Areas, Tags and updates


    People: users, teams, organisations


    DevOps: PRs, repos, deployments, services, builds, designs


    Loom: videos, meetings


    Compass: components


    Assets: objects


    Incidents, conversations, calendar events, external documents


    After calling this tool, call getGraphObject on returned ARIs to get full content.


    The utilisation of this tool may consume up to 10 Rovo Credits. If the user or organization does not have any Rovo Credits available, the tool call will fail.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    objectType: Type of object to fetch context for.
    objectIdentifier: Identifier for the object. It could be a key (e.g. ENG-1234), ID, ARI, or full URL; format depends on objectType.
    detailLevel: '''summary'' (counts/metadata) or ''full'' (detailed content).'
    relationshipTypes: Filter full results to specific relationship types to save tokens (e.g. 'jira-work-item-links-external-build' for Jira work items).
    targetObjectTypes: Filter results to only include relationships targeting specific object types (e.g. AtlassianUser, ConfluenceComment).
    timeRange: Optional time range to filter relationships by creation or update time.
    first: Max number of related items to return.
    after: Pagination cursor for fetching the next page of results.
- name: getGraphObject
  description: Fetches the entire available data for one or more objects (Atlassian or third-party) using their ARIs or URLs. Use for the objects gathered from getGraphContext tool.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    objects: A list of object identifiers to hydrate. Supports both ARIs (e.g. 'ari:cloud:jira::issue/123') and full browser URLs (e.g. 'https://mysite.atlassian.net/browse/PROJ-1'). At most 25 per call.
- name: getJiraBoardConfig
  description: Returns the configuration for a Jira board; filter, column layout, and each column's mapped statuses with their id, name and category. For the issues on the board, use getJiraBoardIssueData.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    boardId: Numeric ID of the board. Get from listJiraBoards.
- name: getJiraBoardIssueData
  description: Get the issues on a Jira board, its backlog, or all of them, with optional count and JQL filtering. For an issue search that is not scoped to a board, use searchJiraIssuesUsingJql. For one sprint's issues with progress metrics, use getJiraBoardSprintData — on a Scrum board dataset "board" spans current and future sprints, not just the active one.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    boardId: Numeric ID of the board. Get from listJiraBoards.
    dataset: 'Which issues to return. "board": issues on the active board (for scrum boards, those in current/future sprints). "backlog": backlog issues (for scrum boards, those with no sprint). "all": every issue on the board and backlog. Kanban boards have no backlog.'
    searchResultMode: Never count for a normal listing or if nextPageToken is used. If the total for the same board/dataset/JQL is already known, reuse it. Use "count" only when no trusted count exists and either the user asks or a downstream step needs it. Use "all" only if both count and issues are required.
    jql: Optional JQL to further filter the issues, e.g. "status = 'In Progress' AND assignee = currentUser()". To filter by epic, add ("Epic Link" = <epicId> OR parent = <epicId>); OR-join one such clause per epic for multiple epics. To filter for no epics, use ("Epic Link" is EMPTY AND parent is EMPTY). If the tool returns a repairHint, follow it and retry.
    maxResults: Maximum number of issues to return (default 50, max 100).
    fields: 'Fields per issue (e.g. ["summary", "status", "customfield_10010"]). customfield_* IDs are site-specific — discover the correct id for story points etc. on this Cloud site. Honoured exactly when supplied. Values map to issues[].fields.customFields (human labels), not raw customfield_* keys. The default "compact" view omits custom fields; use view: "evidence" (fetches and maps all custom fields) or pass explicit customfield_* IDs.'
    nextPageToken: Pagination token from a previous response to fetch the next page.
    responseContentFormat: Format for rich-text bodies (description, environment, comments) when the view returns them. Defaults to markdown; html is lossless for a later editJiraIssue. Issues holding anything markdown cannot represent (media, panels, expands, statuses, @mentions) are returned as HTML automatically, decided per issue. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence", "full". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: getJiraBoardSprintData
  description: Resolve a Jira board plus its sprint data in one call. Supports board lookup by name, sprint lookup by name, and defaults to the active sprint when sprintId and sprintName are omitted. Returns the board, the resolved sprint, all sprint metadata on that board, and — unless includeIssues is false — the sprint's issues with computed focus and progress slices such as assigned-to-me and at-risk items. If the requested sprint name or ID is not found, the tool returns the resolved board plus the available sprint names to help the agent repair the request. To only list a board's sprints or filter them by state, use listJiraBoardSprints. For board or backlog issues that are not scoped to a single sprint, use getJiraBoardIssueData.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    boardId: Jira board ID. Preferred when already known because it avoids board-name ambiguity.
    boardName: Jira board name to resolve when boardId is unknown. Uses an exact case-insensitive name match when possible; narrow with projectKeyOrId or boardType if multiple boards share a similar name.
    projectKeyOrId: Optional Jira project key or numeric project ID used to narrow board lookup.
    boardType: Optional board type filter for board lookup. Use all to omit Jira's type filter, CMPScrum for company-managed Scrum boards, CMPKanban for company-managed Kanban boards, and TMP for Jira's "simple" boards. TMP can include both team-managed Scrum and team-managed Kanban boards; inspect board features/details when you need to distinguish them.
    sprintId: Specific sprint ID to resolve on the selected board.
    sprintName: Specific sprint name to resolve on the selected board. When omitted, the tool resolves the board's active sprint by default.
    includeIssues: When true (default), also fetch every issue in the resolved sprint and compute assigned-to-me, at-risk, and progress metrics. Pass false for a lighter metadata-only response.
- name: getJiraCurrentUser
  description: Get the calling user's own Jira profile. Use it to turn "me" or "my" into an accountId, and to read the user's time zone before resolving relative dates. For a JQL search, skip this tool and write assignee = currentUser() in the query instead. For anyone else use lookupJiraAccountId or getJiraUser.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    expand: 'Comma-separated list of extra data to include. Options: groups (all groups you belong to) and applicationRoles (application roles you are assigned). Example: "groups,applicationRoles". Both are omitted from the response unless requested here.'
- name: getJiraEntityProperty
  description: 'Returns a single property (technical key/value store) from a specific Jira entity (issue, issueComment, issueWorklog, dashboardItem, user), or lists all its property keys when propertyKey is omitted. With propertyKey it returns {key, value} with the stored JSON, null-valued fields generally dropped except assignee; without one, {keys: [...]} — key names only, no values.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    entityType: Which Jira entity to read the property from. Determines the required identifier(s). Irrelevant identifiers are ignored.
    propertyKey: The exact property key to fetch (a single known key; no wildcards). Omit to list all property keys on the entity instead.
    issueIdOrKey: Issue key (PROJ-123) or a Jira issue URL. Required for entityTypes "issue" and "issueWorklog".
    commentId: ID of an existing comment. Required when entityType is "issueComment".
    worklogId: ID of a worklog for a specific issue. Required when entityType is "issueWorklog".
    dashboardId: ID for a dashboard. Required when entityType is "dashboardItem".
    itemId: Dashboard gadget/item ID. Required when entityType is "dashboardItem".
    accountId: User account ID. Required when entityType is "user" (including for the calling user's own properties)
- name: getJiraIssue
  description: Get a Jira or JSM issue by key or ID. Use for one known issue; use searchJiraIssuesUsingJql to find or list many issues. Reports how many comments an issue has, not the comments themselves — for those use listJiraIssueComments. View "evidence" also returns the issue's links to other issues.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: Issue key (PROJ-123), numeric ID, or a Jira issue URL
    fields: 'Custom Jira field IDs to fetch (e.g. ["customfield_10010", "customfield_10020"]). Overrides the view''s fetch strategy. For custom fields in normal use, prefer view: "evidence", which fetches and maps them automatically. Use ["*all"] to fetch every field (expensive — prefer view: "full" instead).'
    includeEditableFields: 'When true, also return compact metadata for fields the authenticated user can edit on this issue, including type, allowed values, and operations. Omit unless preparing an edit: this makes an extra Jira REST call.'
    fieldsByKeys: When true, each entry in `fields` is interpreted as a Jira field key (e.g. "summary", "description") instead of a field id. Matches the Jira REST `fieldsByKeys` query parameter. Ignored when `fields` is omitted (default field list uses ids).
    expand: Additional Jira expand tokens (comma-separated), e.g. "renderedFields,changelog". Merged with any expand the server adds for custom-field mapping (e.g. "names"); duplicate tokens removed. Note "changelog" here returns only the newest page, sorted newest-first, and it accepts startAt/maxResults then ignores them — so it cannot be paged and reports a longer history as complete. Use listJiraIssueChangelogs to read all of it (oldest-first); do not mix their orderings.
    properties: Issue entity property keys to return (Jira `properties` query param, repeated per key). Omit unless you rely on app-specific issue properties.
    failFast: When true, forwards Jira's `failFast` query flag for this GET. Omit for Jira default behavior.
    responseContentFormat: 'Format for rich-text bodies — description and environment, plus any comment bodies the view returns. Defaults to markdown. Set html to receive HTML, which is lossless, so you can pass it straight back to editJiraIssue/addOrEditJiraIssueComment with contentFormat: html. Bodies holding anything markdown cannot represent — inline media, panels, expands, layouts, statuses, @mentions, dates, emoji — are returned as HTML automatically, because markdown would drop those nodes or turn them into literal text on write-back. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.'
    actionSource: Optional invocation attribution. Jira MCP cards set jira_mcp_card; omit for model/tool-loop calls.
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence", "full". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: getJiraIssueTypeMetaWithFields
  description: 'Returns the schema and field metadata for a specific issue type in a project, useful for creating issues with correct fields. Get issueTypeId from listJiraProjectIssueTypesMetadata first. Each entry in fields gives the fieldId, its name, whether it is required, schema.type — with schema.items naming the element type on arrays — and allowedValues on fields whose value must come from a predefined list. Only required fields are returned unless you pass requiredFieldsOnly: false.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    projectIdOrKey: Project ID or key (e.g. PROJ or 10000)
    issueTypeId: Issue type ID
    startAt: Index of the first field to return (page offset). Defaults to 0.
    maxResults: Maximum fields to return per page (max 200, default 50).
    requiredFieldsOnly: When true (default), returns only the fields that are required to create an issue of this type, reducing response size. Set to false to return all available fields (both required and optional).
- name: getJiraProjectVersionRelatedWork
  description: 'List the related work on a Jira project version (release): the designs, test plans, runbooks and change records teams attach to it. Use an item''s relatedWorkId to edit it with manageJiraProjectVersionRelatedWork; Jira''s own release-note item has no relatedWorkId and cannot be edited.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    versionId: ID of the version. Use getJiraProjectVersions to find the ID.
- name: getJiraProjectVersions
  description: List a Jira project's releases/versions (pass projectIdOrKey), or fetch a single version (pass versionId) — provide exactly one. Results come back in a paginated envelope (values[]); in single-version mode the list-only inputs (startAt, maxResults, query, status, orderBy) are ignored. Optionally set include to add the "driver" and/or "approvers" to every version returned, but leave it unset unless the user explicitly asks for them. To create, update, or release a version, use manageJiraProjectVersion instead.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    projectIdOrKey: The project key (e.g. PROJ) or numeric project ID to list versions for. Use listJiraProjects to find the key if not known. Provide either projectIdOrKey or versionId (not both); required when versionId is omitted.
    versionId: The numeric ID of a single version (release) to fetch. Provide either versionId or projectIdOrKey (not both); required when projectIdOrKey is omitted. In this mode the pagination/filter inputs are ignored and a single-entry envelope is returned.
    startAt: Pagination offset (default 0). List mode only; ignored when versionId is provided.
    maxResults: Maximum results per page (default 50). List mode only; ignored when versionId is provided.
    query: Filter versions by name or description (case-insensitive substring match). List mode only.
    status: 'Filter by version status. Array of any of: "released", "unreleased", "archived". Example: ["released", "unreleased"]. List mode only.'
    orderBy: 'Order results by a field. Options: description, name, releaseDate, sequence, startDate. Prefix with ''-'' for descending. Example: ''-releaseDate''. List mode only.'
    include: 'Extra sections to add to every version returned. Allowed values: "driver" (the resolved driver display name) and "approvers" (approvers with displayName, status, description, declineReason). Only set this when the user explicitly asks for the driver or approvers; otherwise omit it. In list mode one call enriches all versions, so never call per version.'
- name: getJiraUser
  description: Get a Jira user's profile by account ID, including time zone, locale and active status, plus groups and application roles when asked for via expand. If you do not have the accountId, use lookupJiraAccountId or listJiraIssueAssignableUsers first. For the calling user's own profile use getJiraCurrentUser instead.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    accountId: The account ID of the user to retrieve.
    expand: 'Comma-separated list of extra data to include. Options: groups (all groups the user belongs to) and applicationRoles (application roles the user is assigned). Example: "groups,applicationRoles". Both are omitted from the response unless requested here.'
- name: getJsmAgentAvailability
  description: Read Jira Service Management Workforce Management availability for agents in a service project. Workforce Management uses agent availability alongside capacity, skills, and shift coverage when routing work. Returns project-level availability counts by default. Set includeSelf to read the authenticated agent's project-scoped status, or set includeAgents to true to list individual agents, statuses, teams, or paginated results. This is read-only; it does not assign work or change availability. Output fields include summary for project counts, agents[] for individual agents, and myAvailability for includeSelf; use those names when selecting responseFields.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    projectKey: JSM service project key, for example HELP.
    teamIds: Optional Workforce Management team IDs to filter by.
    agentIds: Optional agent IDs to filter by.
    statuses: Optional repeatable status filters. Use AVAILABLE or ON_BREAK. TWG aliases such as available, active, online, away, on-break, or unavailable are normalized before forwarding.
    includeAgents: Set true to include individual project agent rows and pageInfo.
    includeSelf: Set true to include the authenticated user's project-scoped availability. Cannot be combined with includeAgents.
    first: Number of agent rows to return when includeAgents is true (default 20, maximum 100).
    after: Pagination cursor, used only when includeAgents is true.
- name: getJsmOpsAlerts
  description: Get one Jira Service Management Operations alert by ID or alias, or list and search alerts with optional query, time window, and pagination. If multiple selectors are supplied, id takes precedence, then alias, otherwise list/search inputs are used.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    id: Alert ID. Takes precedence over alias and query when more than one is supplied.
    alias: Alert alias. Used when id is not supplied.
    query: Optional alert search query, for example priority:P1 AND status:open.
    from: Optional ISO 8601 lower time bound. Use with to.
    to: Optional ISO 8601 upper time bound. Use with from.
    offset: Starting alert index. Defaults to 0.
    size: Maximum alerts to return. Defaults to 20; maximum 100.
- name: getJsmOpsScheduleInfo
  description: 'Get Jira Service Management Operations schedule information: list schedules, get a specific schedule by ID, or retrieve current or next on-call responders for a schedule. Use action="schedule" to list schedules or get schedule details. Use action="oncall" with scheduleId to get on-call responders.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    action: Use schedule to list or get schedules. Use oncall to get current or next on-call responders.
    scheduleId: Schedule ID. In schedule mode, returns that schedule when supplied; in oncall mode, this is required.
    query: Optional schedule-name query used when listing schedules.
    offset: Starting index for schedule pagination. Defaults to 0.
    size: Maximum schedules to return. Defaults to 25; maximum 50.
    next: In oncall mode, return next on-call responders when true; otherwise return current responders.
    flat: In oncall mode, return flattened user responders when true; otherwise return the responder tree.
- name: getJsmOpsTeamInfo
  description: 'Get Jira Service Management Operations team information: list all teams or get escalation policies for a specific team. Use action="teams" to retrieve a list of all teams based on the user''s role. Use action="escalations" to list escalation policies for a team and obtain escalationId values used by updateJsmOpsAlert.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    action: Action to perform. Use "teams" to list all teams. Use "escalations" to list escalation policies for a team. Default is "teams".
    teamId: Team ID (UUID). Required when action="escalations".
    offset: Starting index (offset) for pagination. Default is 0. Only used when action="escalations".
    size: Maximum number of items to return per page. Default is 20. Only used when action="escalations".
- name: getJsmRequest
  description: Get details and the current customer-facing state of an existing Jira Service Management (JSM) customer request by issue key or ID. Returns requestType (request type), serviceDesk (service desk), reporter (requester), requestParticipants (participants), requestFields (request fields), status, agentUrl (request link), and nextActions. Use these exact output names when selecting responseFields. Supports summary and detail views. For editable fields on the underlying Jira issue, call getJiraIssue with includeEditableFields=true. Use this read-only tool to understand a request; use request action-metadata tools for transitions, editable fields, and valid options. Approvals are returned only when explicitly requested.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: JSM request issue ID or key, for example HD-123.
    include: Optional related data to retrieve. Supported value is approvals.
    view: 'Output view preset. Default: "detail". Options: "detail", "summary". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: getJsmRequestActionMetadata
  description: Discover customer-visible request-portal actions for an existing Jira Service Management request before a follow-up write. Returns compact customer transitions by default and can explicitly include request type fields metadata or approvals. Uses JSM customer transitions, not Jira workflow transitions, and never mutates the request. The output field is customerTransitions (an array of id, name, and description); select customerTransitions, not transitions.*, when using responseFields.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdOrKey: JSM customer request issue ID or key, for example HD-123.
    serviceDeskId: Optional service desk ID already known from getJsmRequest, avoiding context repair for request type fields.
    requestTypeId: Optional request type ID already known from getJsmRequest, avoiding context repair for request type fields.
    include: Optional companion metadata. Supported values are requestTypeFields and approvals; neither is fetched by default.
- name: getJsmRequestCreationOptions
  description: Prepare creation of a Jira Service Management customer-request work item for a project. Use this first to return its service desk and available request types. Select a request type, then use getJsmRequestTypeFields before createJsmRequest. Requires projectKey, the key of an accessible JSM service desk project (for example ITSM), not a numeric project ID. JSM request types are not Jira issue types.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    projectKey: JSM project key, for example ITSM.
- name: getJsmRequestResolverPlans
  description: Retrieve a concise snapshot of Request Resolver plans for selected Jira Service Management requests by issue key or ID. Returns one result per distinct input in first-selection order, containing loading state, plan status, readable steps, runbook links or an error. Ready plans remain available when other requests are loading or fail. Excludes internal IDs, sources and reasoning. isLoading can mean generating or executing; a missing plan alone does not imply loading. Requires Jira read access to resolve ticket and project IDs. Does not approve or execute plans.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    issueIdsOrKeys: One to twenty non-blank issue keys or numeric issue IDs, for example IT-123.
- name: getJsmRequestTypeFields
  description: Get field IDs, required flags, and allowed values for selected Jira Service Management work-item request type. Use getJsmRequestCreationOptions first, then build createJsmRequest.requestFieldValues from these fields.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    serviceDeskId: Service desk ID returned by getJsmRequestCreationOptions.
    requestTypeId: Request type ID returned by getJsmRequestCreationOptions.
- name: getLoomObjectsContent
  description: Read one or more known Loom objects by ARI, share URL, or embed URL. Supported objects currently include async videos and meeting recordings. Use expand to request transcripts, agent briefs, action items, comments, attached links, or developer context logs. Each identifier gets its own status and result in request order.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    identifiers: One to ten Loom ARIs, share URLs, or embed URLs to retrieve. Do not pass a bare video ID (the 32-character hex string); it is rejected. If you only have a video ID, send https://www.loom.com/share/{videoId}, or take the ari or url from listLoomObjects. Send at most five identifiers when expand includes transcript. Results preserve this request order and duplicates.
    expand: Optional content components to include for each Loom recording. "links" is every link attached to the video — manually set, a workspace default, or auto-detected. "logs" is developer context logs (console, network, and desktop grounding rows merged into one paged sequence; bug-report and action-log recordings only).
    resume: Opaque nextCursor values from prior component responses. Pass each value exactly as returned. Never write, edit or combine cursors. Include the matching component in expand.
- name: getLoomVideoDownloadUrl
  description: 'Get a time-limited signed URL to download the actual MP4 file of a Loom video. This is the tool to use when the user wants the video file itself (to download, re-upload, or process), not its transcript or metadata. MP4 generation is asynchronous: the response includes a status and, when not yet ready, a retryAfterSeconds hint — poll this tool until status is READY, then use the returned url before expiresAt. Identify the video by ARI or share URL.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    videoAri: ARI of the Loom video, formatted as ari:cloud:loom:{siteId}:video/activation/{activationId}/{videoId}. Provide this or videoUrl.
    videoUrl: Loom share URL for the video, for example https://www.loom.com/share/{videoId}. Used when videoAri is not supplied; a supporting action resolves the URL to an ARI.
- name: getMyWork
  description: Read the signed-in user's recent Jira, Confluence, Goals, Projects and Loom activity on one site. Returns things worked on or viewed, newest activity first, with titles, URLs and activity timestamps. Uses Activity Platform with no enriched graph-context or Cypher calls. Assigned work is not part of this feed. The lookback is configurable and defaults to 90 days.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    type: Which activity type to fetch. One call returns one type.
    product: Filter worked-on activity to Goals or Projects. Omit for the shared multi-product feed. Cannot be combined with viewed activity.
    limit: Maximum number of activity items to request (1-50).
    sinceDays: Include activity from this many days before the first page's request (1-3650). Keep this value unchanged when continuing with a cursor.
    cursor: Opaque nextCursor from the previous response for the same site, user, activity type, product and sinceDays. Preserves the first page's absolute lookback boundary. Invalid or legacy cursors require restarting without a cursor.
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence", "full". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: getPeopleInfo
  description: '(Beta) Get people’s profiles and optional immediate reporting relationships. Provide cloudId and exactly one selector: identifier (an array of 1–10 Atlassian account IDs or IdentityUser ARIs), name, or email. Name and email each resolve one person; use name: "me" for yourself. If a name is ambiguous, use the returned candidates to disambiguate with an account ID or exact email; do not guess. The profile is always requested. Set manager: true, directReports: true, or both in one call. Results contain identity and requested reporting facets, each with a status. Use successful results when others fail; partial or unavailable data does not establish that a relationship is absent. Reporting relationships do not establish expertise, ownership, or delivery responsibility.


    This tool is in beta and is not generally available. Usage is not billed during beta. Pricing details will be announced when the tool becomes generally available.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    identifier: One or more Atlassian account IDs or IdentityUser ARIs (maximum 10). Cannot be combined with name or email.
    name: Resolve target user by name, or "me" for the current user. Ambiguous names require disambiguation.
    email: Resolve target user by exact email, or "me" for the current user.
    directReports: Request direct reports alongside the profile. Can be combined with manager.
    manager: Request the immediate manager alongside the profile. Can be combined with directReports.
- name: getProject
  description: Retrieve one Atlassian Project by its exact Project ARI or key, with optional related details.
  params:
    identifier: Exact Project ARI or key. A key may contain multiple hyphens and must end in a numeric segment.
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    include: Optional details to include. Allowed values are description, updates, tags, teams, goals, dependencies, links, contributors, followers, highlights, and draftUpdate. Highlights are the learnings, risks, and decisions recorded on the Project, including any attached to a Project update. draftUpdate returns your most recent unposted draft update for this Project, using the same fields createProjectUpdate accepts so it can be posted as-is. It is omitted when no draft is saved, and only fields you filled in are present.
    updateFilters: Optional updates expansion filters with createdAtOrAfter and createdAtOrBefore ISO timestamps.
    linkType: Filter the links expansion by type. Applies only when links is included.
    highlightType: Filter the highlights expansion by type. Applies only when highlights is included; omit it to return every type.
    noUpdateAttached: Return only highlights that are not attached to any Project update. Applies only when highlights is included; omit it to return every highlight.
    limits: Optional per-connection page sizes for updates, tags, teams, goals, dependencies, links, contributors, followers, and highlights. Each defaults to 5 and accepts 1-20.
    cursors: Optional pagination cursors keyed by updates, tags, teams, goals, dependencies, links, contributors, followers, or highlights.
- name: getProjectUpdate
  description: Retrieve one Atlassian Project update by its exact Project Update ARI, with optional related details.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    updateId: Exact Project Update ARI in the form ari:cloud:townsquare:{cloudId}:project-update/{resourceId}.
    include: Optional details to include. Allowed values are comments, notes, highlights, and milestones.
    limits: Optional per-connection page sizes for comments, notes, highlights, and milestones. Each defaults to 5 and accepts 1-20.
    cursors: Optional pagination cursors keyed by comments, notes, highlights, or milestones.
- name: getPullRequests
  description: '(Beta) Query graph-indexed pull requests for the current user, another person, an organization''s reporting chain, or all users. Supply at most 10 account IDs or org roots per call. Filter by relationship role, state, and date. When scope and person selectors are omitted, scope defaults to me. State defaults to open; scope all requires a lower-bound date filter. Set hydrate to full for available reviewer approval evidence. Date filters select pull requests by creation or update date, not merge, review, or approval events.


    This tool is in beta and is not generally available. Usage is not billed during beta. Pricing details will be announced when the tool becomes generally available.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    text: Optional PR title/description text, GitHub PR URL, or GitHub repository URL
    scope: 'Search scope: "me", "user", "org", or "all"'
    accountId: User account IDs or user ARIs; maximum 10 identifiers per call, including org roots
    name: Resolve user/org root by name, or "me" for the current user
    email: Resolve user/org root by email, or "me" for the current user
    author: Select an author by account ID, user ARI, name, or email; "me" selects the current user. Sets role to author and defaults scope to user.
    reviewer: Select a reviewer by account ID, user ARI, name, or email; "me" selects the current user. Sets role to reviewer and defaults scope to user.
    role: PR relationship role
    state: PR lifecycle state; open includes draft PRs, while draft selects only drafts
    createdSince: Only include PRs created on/after this date
    createdBefore: Only include PRs created before this date
    updatedSince: Only include PRs updated on/after this date
    updatedBefore: Only include PRs updated before this date
    workspace: Bitbucket workspace slug or UUID
    repo: Repository slug or UUID from a Bitbucket or GitHub PR URL
    query: Filter PR title/description text
    limit: Maximum hydrated PRs returned after role merge/deduplication; total counts ignore this limit
    hydrate: 'Hydration level: "none", "summary" (default), or "full" (AGG PR details, including reviewer approval status)'
    onlyCounts: Return total counts only and skip item hydration.
    themes: Include lightweight local theme extraction from PR titles/descriptions
- name: getTalentFields
  description: 'Discover the workspace''s queryable Talent fields, or resolve the valid filter values for a specific field. Call BEFORE authoring RQL: with no fieldId it lists the available field IDs (including custom fields), grouped by what they describe (position, worker, team, skill, focus area, focus area type, proposal, proposed movement and view fields), excluding hidden fields; with a fieldId it returns that field''s valid values, paginated. Field IDs and values are workspace-specific and must not be guessed.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    fieldId: ID of a single Talent field whose distinct values should be listed, as returned by this tool's list mode. Omit to list the workspace's configured field IDs instead.
    count: Values mode only — maximum number of field values to return in this page. 1-100, defaults to 100. Ignored when fieldId is omitted.
    rql: Values mode only — optional RQL filter restricting which positions contribute field values. Ignored when fieldId is omitted.
    cursor: Values mode only — forward pagination cursor from a previous response's endCursor. Ignored when fieldId is omitted.
- name: getTalentGroupMetrics
  description: 'Aggregate Talent positions into COUNTS grouped by one to four position field IDs — headcount by country, by status, by level, by job family, by manager, or any nesting of those. Returns only the grouped counts and their field values, never the positions themselves: when the underlying list is wanted use searchTalentPositions, when the breakdown is by reporting line or focus area use getTalentPositionsByEntity, which groups by entity rather than by field, and when the question is about change over time use getTalentPositionHistory. Grouping field IDs are workspace-specific, must be groupable, and must not be guessed — call getTalentFields to resolve them. The common built-ins are positionCountry, positionStatus, positionLevel, positionRole, positionJobFamily, positionJobTitle, positionEmploymentType, positionManager and team.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    groupingFieldIds: Ordered array of one to four unique groupable field ID strings to group the counts by, as returned by getTalentFields. Always pass an array, even for a single field, for example ["positionStatus"]. Supplying more than one produces nested groupings, for example ["positionCountry", "positionLevel"]. Passing more than four returns an empty result rather than an error, so keep to four or fewer.
    rql: Radar Query Language filter that scopes which positions are aggregated over. Field IDs and values are workspace-specific — resolve them with getTalentFields rather than guessing. Omit to group across all positions the caller can see.
    first: Maximum number of grouped rows to return, 1-100. Defaults to 50.
    after: Forward pagination cursor from a previous response's endCursor.
- name: getTalentPosition
  description: 'Read a single Talent position by its ARI, returning its selected position field values and, optionally, field values for the worker filling it. Use this only when you already have the position ARI: take it from a searchTalentPositions result''s id, or from a getTalentPositionsByEntity result''s entityId — NOT that tool''s id, which is a connection node identifier and is not accepted here. To FIND a position rather than read a known one, use searchTalentPositions. To identify the worker filling the position, request positionWorker in positionFieldIdIsIn — that yields the worker''s id, name and accountId. Do not rely on workerFieldIdIsIn for more than that: the backing action accepts it but does not currently return the requested worker field values, so attributes like skills or email will not come back here. Field IDs are workspace-specific and must not be guessed — call getTalentFields to resolve them. Common position built-ins are positionJobTitle, positionCountry, positionLevel, positionStatus, positionManager and positionWorker.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    positionAri: ARI of the Talent position to fetch. Take it from a searchTalentPositions result's id, or from a getTalentPositionsByEntity result's entityId. Do NOT pass a getTalentPositionsByEntity result's id — that identifies the row within its connection and returns an empty result here.
    positionFieldIdIsIn: Array of position field ID strings to return, as returned by getTalentFields. When omitted, a default set of position fields is returned.
    workerFieldIdIsIn: Array of worker field ID strings for the position's worker, as returned by getTalentFields. Accepted by the backing action but currently ineffective — the requested values are not returned, so expect only the worker id, name and accountId that positionWorker already provides. Omit unless you are deliberately probing this.
- name: getTalentPositionHistory
  description: 'Month-by-month COUNT of Talent positions over a date range, optionally broken down by ONE position field — how headcount or open roles changed over time, as a chronological series of months each with its count and optional per-field breakdown, never the positions themselves. Only one breakdown field fits per call, so for a breakdown by level AND country call once per level with an rql filter such as positionLevel = "<value>" and breakdownFieldId positionCountry, then combine. Each count is a snapshot of the positions that existed in that month, not an increment: never add months together for a period headcount — report the period-end month, compare the first and last months, or state an average, and label any sum as position-months. Use getTalentGroupMetrics INSTEAD for current counts with no time dimension, and searchTalentPositions for the positions themselves. Months with no history snapshot are absent, not zero. Field IDs and RQL values are workspace-specific and must not be guessed — resolve them with getTalentFields. Requires the position history permission in the Talent workspace.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    fromMonth: First month of the series, inclusive, as YYYY-MM such as "2025-04". Defaults to 24 months before toMonth. For "the past 2 quarters" use the first month of the earlier quarter.
    toMonth: Last month of the series, inclusive, as YYYY-MM. Defaults to the current month. Must not be earlier than fromMonth.
    breakdownFieldId: Single groupable position field ID to split each month's count by, as returned by getTalentFields, such as positionCountry, positionLevel, positionStatus or positionJobFamily. Omit for a plain monthly total. Only one breakdown field is supported per call; put any further dimension into rql and call once per value.
    rql: Radar Query Language filter that scopes which positions are counted in every month, such as positionStatus = 'Not filled' to count only open headcount, or manager = UNDER('<position UUID>') to scope to a reporting line, where the value is the bare position UUID from searchTalentPositions, never a position ARI or a name. Field IDs and values are workspace-specific — resolve them with getTalentFields rather than guessing. Do not filter on positionsHistoryAsOfYearMonth or add ORDER BY here; use fromMonth and toMonth, and months are always returned oldest first.
    first: Maximum number of months to return, 1-100. Defaults to 50.
    after: Forward pagination cursor from a previous response's endCursor.
- name: getTalentPositionsByEntity
  description: 'List the Talent positions attached to an entity — the direct reports of a manager position (entity=position with that manager''s ARI as fieldValue), or the positions rolled up to a focus area (entity=focusArea). This is the tool for walking the org chart and for breaking staffing down across focus areas or reporting lines, because it is the only one that can scope to those entities; it returns the underlying positions, paginated forward with after + endCursor. The two entities are scoped by DIFFERENT inputs: entity=position scopes with fieldValue, entity=focusArea scopes with rql. fieldValue is ignored when entity=focusArea, so a focus area passed there returns every row unfiltered — use rql "focusArea = ''<focus area ARI>''" for that one area, or rql "focusAreaParent = ''<focus area ARI>''" for its direct children. Use getTalentGroupMetrics INSTEAD when you want counts grouped by a position FIELD and not the positions themselves, and searchTalentPositions INSTEAD for a flat attribute filter that is not entity-scoped. Each returned position carries both an entityId and an id: entityId is the position identifier to pass to getTalentPosition, while id identifies the row within this connection and is NOT accepted as a position ARI. Field IDs and RQL values are workspace-specific and must not be guessed — resolve them with getTalentFields; focusArea and focusAreaParent are standard field IDs and are safe to use exactly as written. Useful built-ins are positionWorker, team, positionJobTitle, positionRole, positionStatus, aiMonthlyUsageCostSelfTotal and aiMonthlyUsageTokenSelfTotal.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    entity: Entity to scope the positions by. Use position for a reporting-line search, focusArea for a focus-area search. Defaults to position. Each value is scoped by a different input — position scopes with fieldValue, focusArea scopes with rql.
    fieldValue: ID of the specific entity to scope to. Honored only when entity=position — pass a manager's position ARI to return that manager's direct reports, or omit to return top-level positions that have no manager. IGNORED when entity=focusArea, where passing it returns every row unfiltered; scope a focus area through rql instead.
    rql: Radar Query Language filter and ordering applied to the positions returned. Field IDs and values are workspace-specific — resolve them with getTalentFields rather than guessing. For entity=focusArea this is the ONLY way to scope to an area, because fieldValue is ignored there. Use focusArea = '<focus area ARI>' to match that one area, or focusAreaParent = '<focus area ARI>' to match its direct children. Both are standard field IDs, so use them exactly as written, and quote the ARI with single quotes.
    aggregateRql: Radar Query Language filter applied to aggregate fields requested through fieldIdIsIn, such as AI usage period, provider or model filters.
    count: Maximum number of positions to return in this page, 1-100. Defaults to 25.
    after: Forward pagination cursor from a previous response's endCursor.
    before: Backward pagination cursor from a previous response's startCursor. Prefer forward paging with after — backward paging is accepted by the backend but has been observed to return an empty page.
    fieldIdIsIn: Array of position field ID strings to return for each position, as returned by getTalentFields. When omitted, a small default set of human-readable fields is returned. Useful field IDs include positionWorker, team, positionJobTitle, aiMonthlyUsageCostSelfTotal and aiMonthlyUsageTokenSelfTotal.
- name: getTalentUser
  description: 'Resolve the calling user''s own place in the Talent workspace: their position entity ID, their manager''s position entity ID, and their role. Call this FIRST to anchor any self-referential request ("my team", "my reports", "who do I report to") before using the other Talent tools. Note this returns entity IDs, not position ARIs — to get a position ARI for getTalentPosition or getTalentPositionsByEntity, look the position up with searchTalentPositions.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: getWorkActivity
  description: '(Beta) Get authored or explicitly selected work activity for the current user, up to 10 people by identifiers, or one person by name or exact email. Defaults to the last seven days with counts and up to five summary items per section. Filter using activity, types, and time bounds; countsOnly omits previews.


    This tool is in beta and is not generally available. Usage is not billed during beta. Pricing details will be announced when the tool becomes generally available.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    scope: 'Work scope: "me" by default; use "user" with identifiers. Name/email selects "user" when scope is omitted'
    identifiers: 'User identifier: raw AAID, IdentityUser ARI, or gated IdentityThirdPartyUser ARI. Accepts at most 10 user identifiers per call.'
    name: Resolve one person by name using the same resolver as people.describe. Mutually exclusive with email and other person selectors. Ambiguous names return candidates without retrieving work. Omit scope or use user.
    email: Resolve one person by exact, case-insensitive email using the same resolver as people.describe. Mutually exclusive with name and other person selectors. Omit scope or use user.
    actorIdentifiers: Up to 25 pre-expanded identifiers for one logical actor hierarchy; this is not a batch.
    since: 'How far back to look (default: 7d)'
    from: Inclusive activity lower bound. YYYY-MM-DD means UTC; supply an ISO datetime with an explicit offset for a local calendar window.
    to: Exclusive activity upper bound. YYYY-MM-DD means UTC; supply an ISO datetime with an explicit offset for a local calendar window.
    query: Compatibility fuzzy topic input
    search: Compatibility fuzzy topic input
    includeViewed: Add private passive browsing counts/items for your own work; invalid when scope is user
    countsOnly: Return full-window counts without item previews or hydration
    hydrate: 'Item detail: summary (default), full product hydration, or none (IDs/tags only)'
    types: 'Comma-separated section names: jira,pr,projects,goals,docs,calendar,videos,dev,comments. The alias meetings also selects calendar.'
    activity: 'Exact comma-separated activity selectors (default: authored): authored, reviewed, commented, updated, contributed, assigned, owned, mentioned, all. Event selectors: created (creator and creation date), resolved (current-assignee resolution cohort with actor evidence), merged (authored PR merge date). Selectors form a union; all retains legacy relationship semantics.'
    itemsPerSection: 'Maximum item previews returned and hydrated per section (default: 5)'
    ranked: Order each returned section by heuristic importance before applying itemsPerSection
    batchConcurrency: 'Concurrent user work reads in an identifiers batch (default: 5, max: 20)'
    strict: Fail an identifiers batch if any user work read fails
    topic: topic
- name: getWorkPortfolio
  description: '(Beta) Returns native and inferred projects, owned goals, and focus areas for up to 10 root identifiers per call, including their immediate reports by default. Includes project ownership and contribution relationships, status, and updates.


    This tool is in beta and is not generally available. Usage is not billed during beta. Pricing details will be announced when the tool becomes generally available.'
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    view: full keeps original output. compact shares coverageRef via data.coverage and evidenceRefs/representativeRef via data.evidence. Missing section failures/coverage reasons mean none; equal title/name, ari/id and record/representative URLs appear once. Refs are portfolio-local.
    identifiers: Select 1–10 roots by account ID or IdentityUser ARI, returning a batch with one portfolio per root, including for a single entry. Use "me" for yourself, including alongside other roots, or omit all selectors for a single current-user portfolio. Each also includes its immediate reports by default; do not add those reports as roots again. Use includeDirectReports=false for a flat batch. Cannot combine with name or email.
    name: Resolve one person by name. If multiple people match, use the returned candidates to identify the intended person; ask the user if unclear, then retry with email set to the candidate's exact email, or identifiers set to [candidate.accountId]. Omit name from the retry request.
    email: Resolve one person by exact email.
    includeDirectReports: true returns the root AND each immediate report’s work in this call. false returns only the selected root(s). Never includes grandchildren for a single root.
    kinds: 'Nonempty subset of projects, goals, focusAreas. Default: all three.'
    projectRoles: 'Project relationships: owner and/or contributor. Default: both. Goals and focus areas are owned.'
    includeInferredProjects: Include active inferred projects with their linked evidence, independently of native project filters.
    atlasProjectStatus: Atlassian project filter; default in progress. Does not filter inferred-project health.
    goalStatus: Omit for in-progress OR pending goals. An explicit status selects only that state; active excludes pending.
    focusAreaStatus: Omit for in-progress OR pending focus areas. An explicit status selects only that state; active excludes pending.
    includeLinks: Include directly linked native goals/projects with separate relationship coverage.
    limitPerCollection: Records per person per source collection, 1–100. Atlassian and inferred projects have independent limits.
    reportLimit: Maximum direct reports to query, 1–100; omitted reports remain explicit in coverage.
- name: linkToFocusArea
  description: 'Link one of either goals, work items, or sub-focus areas to a focus area. Add exactly one connection type per call. Prefer identifiers from a prior lookup, or call a lookup to get them; do not fabricate ARIs. Useful lookup helpers: getGoal for goal ARIs, getJiraIssue for Jira work ARIs, and getProject for Atlassian project ARIs. In this tool, WORK_ITEM means one of the supported work ARI families: Jira/JPD issues or Atlassian projects. focusAreaIdentifier accepts a focus area UUID, ARI, or page URL. Linking GOAL or WORK_ITEM requires focusAreaIdentifier to be a focus area ARI; if only a UUID or URL is known, call getFocusArea and pass the returned ari. connection must specify exactly one type: GOAL with goalAris, WORK_ITEM with workAris, or FOCUS_AREA with focusAreaIdentifiers.'
  params:
    focusAreaIdentifier: Exact focus area UUID, ARI, or page URL identifying the focus area that will receive the new connections. Linking GOAL or WORK_ITEM requires a focus area ARI; if only a UUID or URL is known, call getFocusArea and pass the returned ari. This requirement applies only for GOAL and WORK_ITEM connections; FOCUS_AREA connections accept UUID, ARI, or URL for focusAreaIdentifier.
    connection: 'The connection to add. Provide exactly one type per call: GOAL, WORK_ITEM, or FOCUS_AREA. Include only the fields for that type. Exactly one of goalAris, workAris, or focusAreaIdentifiers must be present, matching connection.type; all other target fields must be omitted. For GOAL or WORK_ITEM, see focusAreaIdentifier requirements. Shape: { "type": "GOAL", "goalAris": ["ari:cloud:townsquare:{siteId}:goal/{goalUuid}"] } OR { "type": "WORK_ITEM", "workAris": ["ari:cloud:jira:{siteId}:issue/{issueId}" | "ari:cloud:townsquare:{siteId}:project/{projectUuid}"] } OR { "type": "FOCUS_AREA", "focusAreaIdentifiers": ["<uuid|ari|url>"] }. Arrays must be non-empty and deduplicated. For GOAL use only goal ARIs (use getGoal to look them up when needed); for WORK_ITEM use only supported work ARIs: Jira/JPD issue ARIs (ari:cloud:jira:{siteId}:issue/{issueId}), or Atlassian project ARIs (ari:cloud:townsquare:{siteId}:project/{projectUuid}) — for example from getJiraIssue or getProject. For FOCUS_AREA, focusAreaIdentifiers must not include focusAreaIdentifier.'
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
- name: listAssetsObjectSchemas
  description: List all Assets object schemas in the selected site's workspace.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    includeCounts: Include object and object-type counts
- name: listAssetsObjectTypeAttributes
  description: List attributes for one or more Assets object types in the selected site.
  params:
    cloudId: Atlassian site UUID, hostname, or URL. If unknown, list accessible resources.
    typeId: Object type ID
