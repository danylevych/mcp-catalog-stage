name: Atlassian Preview
entryKey: atlassian-preview
serverUserType: singleUser
shortDescription: "Preview access to Atlassian MCP: manage Jira issues, Confluence pages, comments, worklogs, and search with Rovo"
description: |
  The preview endpoint for the official Atlassian Model Context Protocol (MCP) server. It connects AI assistants directly to your Atlassian Cloud organization, providing comprehensive real-time access to Jira, Confluence, and Rovo intelligence.

  ## Key Capabilities

  ### Jira Issue & Workflow Management
  - **Full Issue Lifecycle**: Create, retrieve, update, and transition issues through custom workflows with full ADF, Markdown, and custom field support.
  - **Collaboration & Time Tracking**: Add comments with role/group visibility controls and log worklogs with precise time tracking.
  - **Issue Linking & Remote Links**: Create issue relationships (blocks, duplicates, relates) and manage remote web links.
  - **Project & Field Discovery**: Inspect project schemas, retrieve issue types, query required field metadata, and resolve user account IDs.
  - **JQL Search**: Execute advanced JQL queries with flexible field projection, pagination, and result counting.

  ### Confluence Content & Knowledge Base
  - **Rich Page Operations**: Create, read, and update pages and blog posts with support for structured HTML, Markdown, and Atlassian Document Format (ADF).
  - **Space & Hierarchy Navigation**: Browse global/personal spaces, list pages within spaces, and traverse page descendant trees.
  - **Collaborative Feedback**: Manage footer comments, create targeted inline comments anchored to specific text, and handle threaded replies.
  - **CQL Querying**: Search across pages, blogposts, comments, and attachments using Confluence Query Language (CQL).

  ### Atlassian Rovo Intelligence
  - **Unified Semantic Search**: Search across both Jira and Confluence using natural language queries powered by Atlassian Rovo.
  - **ARI Resource Hydration**: Retrieve details for any Atlassian resource directly by its Atlassian Resource Identifier (ARI).
  - **Multi-Site Discovery**: Automatically resolve accessible Cloud IDs and site resources for the authenticated user.

  ## What you'll need to connect

  **No Setup Required**: Authentication is handled automatically through OAuth2 workflow.

  **Important for Admins**: To enable OAuth with Agentic Coworker, your Atlassian organization admin must authorize the MCP endpoint:
  1. Go to [Atlassian Administration](https://admin.atlassian.com) and select your organization
  2. Navigate to **Apps > AI settings > Rovo MCP server**
  3. Add your Agentic Coworker domain (e.g., `https://your-agentic-coworker-domain/**`)

  ## Example Usage

  Ask your AI assistant to:
  - **Jira Management** - "Create a Bug in project ENG with High priority and assign it to Alice" or "Transition PROJ-101 to Done and log 1h 30m of work"
  - **Confluence Authoring** - "Create an onboarding guide in the Engineering space under the Team Docs parent page"
  - **Inline Feedback** - "Add an inline comment on the 'Architecture Overview' section of page 12345 suggesting a diagram"
  - **Advanced Search** - "Search Confluence via CQL for meeting notes modified in the last 2 weeks"
  - **Rovo Search** - "Find all Jira issues and Confluence pages discussing OAuth migration"

metadata:
  categories: "Developer Tools"
  allow-multiple: "true"
icon: https://avatars.githubusercontent.com/u/168166?s=200&v=4
repoURL: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/getting-started-with-the-atlassian-remote-mcp-server/
runtime: remote
remoteConfig:
  fixedURL: https://mcp.atlassian.com/v1/mcp/preview
toolPreview:
  - name: getAccessibleAtlassianResources
    description: Returns the cloudId(s) available to the current user
    params: {}
  - name: atlassianUserInfo
    description: Returns the accountId of the current user
    params: {}
  - name: getConfluenceContent
    description: Read any Confluence content (page, blog, live doc, comment, whiteboard, embed, database, folder)
    params:
      cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
      content_format: "Body format. Doc types: html (default) or markdown. Document HTML can contain supported macro wrappers instead of content displayed in Confluence web. When visible macro content is required, use resolveConfluenceContentMacros with the returned numeric content ID and all=true; use discover if its full contract is needed. Whiteboards: svg or png (png is read-only and returns a short-lived presigned URL to the file in body.value, not the image content). Databases: csv. URL-backed content such as embeds: url."
      content_id: Numeric Confluence content ID, or a Confluence tiny link key (the encoded part from /wiki/x/ URLs, e.g. 4_sXAQ). Recognized Confluence content URLs are also accepted and converted to the content ID, but prefer content_url for URLs. One of content_id or content_url is required.
      content_url: "Full URL of the Confluence content. Supported: pages/live docs (/pages/{id}), blog URLs (/blog/{id}), whiteboards (/whiteboard/{id}), databases (/database/{id}), folders (/folder/{id}), and TinyUrl (/wiki/x/{key}). Prefer this for URLs copied from Confluence. One of content_id or content_url is required."
      detail: Response shape for document-style reads. summary = title + excerpt + counts (default, cheap). ai_summary = the generated AI summary when available, otherwise null; it does not fall back to the standard excerpt. outline = heading tree (cheap, for navigation). full = body in the requested format (use when intending to edit). Non-document content such as whiteboards, databases, folders, and embeds does not support detail; content_format is a separate representation selector for formats such as whiteboard svg/png, database csv, or embed url.
      draft: If true, read the draft version instead of current. Only supported for pages and blog posts.
      include_metadata: Include extended metadata block (for example version, author, content state, and total view counts when available).
  - name: createConfluenceContent
    description: "Create a new Confluence page, blog post, live doc, whiteboard, database, embed, smart link, or folder. Before authoring a body, call getContentFormatGuide through execute with name=getContentFormatGuide and inputs={toolName}. Use createConfluencePage for pages, blog posts, and live docs; createConfluenceWhiteboard for whiteboards; or createConfluenceDatabase for databases. Space instructions are durable guidance configured for a Confluence space. When present, they are authoritative and override authoring defaults on conflict. Follow this decision rule: 1. Before authoring, call getConfluenceSpace for the target space unless getConfluenceContent returned metadata.hasSpaceInstructions=false for content in that space. If getConfluenceSpace already returned for the same cloudId and space during the current task, reuse its spaceInstructions and do not call it again. 2. When the value is true or unknown and instructions have not been loaded, you must call getConfluenceSpace once before authoring through execute with name=getConfluenceSpace, top-level cloudId, and inputs={spaceIdOrKey}. 3. Apply any returned spaceInstructions. If a successful response omits them, no instructions are configured; author with defaults and do not block. After a successful getConfluenceSpace call, do not make a separate getConfluenceSpaceInstructions call."
    params:
      body: "Before composing this body, follow the space-instruction decision rule in the tool description. Reuse known instruction state and do not repeat the space lookup per write. Body content. For whiteboard and database it is technically optional, but only omit it when the user explicitly asked for an empty/blank board or database. Never omit body as a fallback because you could not load the authoring guidance — load it first via getContentFormatGuide through the generic operation runner (execute) as name=getContentFormatGuide, inputs={toolName} (createConfluencePage / createConfluenceWhiteboard / createConfluenceDatabase), then build a real body. A blank whiteboard (no shapes, stickies, connectors, or layout) is almost never the intended result. For doc types (page, live_doc, blogpost): format is html or markdown, value is the content string. For embed and smart_link: format must be url, value must be the URL to embed (e.g. https://example.com/design). For whiteboard: format must be svg and value must be the complete initial SVG document with root width, height, and viewBox. For database: format must be csv and value must be the complete initial CSV payload. For a synced (Smart) Folder (contentType=folder): format must be url and value must be the https URL of the external Google Drive, OneDrive, or SharePoint folder to sync from. Requires the confluence_smart_folders_milestone_1 experiment; otherwise the create returns FEATURE_NOT_ENABLED. Do not pass patches, edit envelopes, or context on create. Omit for a plain folder (no sync source) and for slide."
      cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
      contentType: "Type of content to create. One of: page, live_doc, blogpost, whiteboard, database, embed, smart_link, folder, slide."
      contentWidth: "Optional page width for doc types only: page, live_doc, and blogpost. Omit unless the user explicitly requests a width; omission creates a narrow page. Do not infer wide or max from body content or layout. Accepted values are narrow, wide, and max. Non-doc content types do not support this field."
      draft: If true, create the content as a draft instead of publishing it. Only supported when contentType is page or blogpost.
      parent: "Parent destination for the new content. Use { \"spaceId\": \"<numeric-space-id>\" } to create at the homepage / sidebar root. Use { \"spaceId\": \"<numeric-space-id>\", \"parentContentId\": \"<numeric-content-id>\" } to create under an existing content item. Use { \"parentContentId\": \"<numeric-content-id>\" } when the parent content ID should be resolved to its space before creation. Use { \"parentContentUrl\": \"<confluence-content-url>\" } when the parent content URL should be resolved before creation. Supported parentContentUrl paths include /pages/{id}, /blog/{id}, /whiteboard/{id}, /database/{id}, and /folder/{id}. If the destination is described only by space key or title, resolve it first to one of the supported parent shapes above."
      private: "If true, the created content is private to the caller: only the creator has view and edit access. Supported for page, live_doc, blogpost, whiteboard, database, and folder, including creation at the homepage / sidebar root. Private creation is not supported for embed, smart_link, or slide. This sets General access to VIEW_RESTRICTED and gives the creator one Specific access grant, update (Can edit), which already includes read/view. Do not add a separate read grant for the creator. Omit or pass false for default visibility."
      title: Title for the new content. 1-255 characters.
  - name: updateConfluenceContent
    description: "Update Confluence docs, whiteboards, or databases. Before authoring an edit, call getContentFormatGuide through execute with name=getContentFormatGuide and inputs={toolName}. Use updateConfluencePage for pages, blog posts, and live docs; updateConfluenceWhiteboard for whiteboards; or updateConfluenceDatabase for databases. Space instructions are durable guidance configured for a Confluence space. When present, they are authoritative and override authoring defaults on conflict. Follow this decision rule: 1. Before authoring, call getConfluenceSpace for the target space unless getConfluenceContent returned metadata.hasSpaceInstructions=false for content in that space. If getConfluenceSpace already returned for the same cloudId and space during the current task, reuse its spaceInstructions and do not call it again. 2. When the value is true or unknown and instructions have not been loaded, you must call getConfluenceSpace once before authoring through execute with name=getConfluenceSpace, top-level cloudId, and inputs={spaceIdOrKey}. 3. Apply any returned spaceInstructions. If a successful response omits them, no instructions are configured; author with defaults and do not block. After a successful getConfluenceSpace call, do not make a separate getConfluenceSpaceInstructions call."
    params:
      body: "Before composing this body, follow the space-instruction decision rule in the tool description. Reuse known instruction state and do not repeat the space lookup per write. Body update object with format and value. Doc types accept format html or markdown. Whiteboards accept format svg and should include context.content with the current SVG when applying a patch. Databases accept format csv and should include context.content with the current CSV when applying an edit envelope. Put the raw patch/envelope directly in value; do not wrap it in an extra JSON object or {\"content\": \"...\"} wrapper. For whiteboards, value is a patch, not a full SVG replacement. For databases, value is an edit envelope, not a create payload. Mutually exclusive with edits."
      cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
      contentId: Numeric Confluence content ID. One of contentId or contentUrl is required.
      contentUrl: Full URL of the Confluence content. One of contentId or contentUrl is required. Clear Confluence URLs for pages/live docs (/pages/{id}), blogs (/blog/{id}), whiteboards (/whiteboard/{id}), databases (/database/{id}), and folders (/folder/{id}) are normalized to their numeric content ID before the update is sent, so URLs copied from the product should work directly.
      contentWidth: "Optional page width for doc types only: page, live_doc, and blogpost. Accepted values are narrow, wide, and max. The default width is narrow. Omit to keep the existing content width unchanged. A width-only update is valid and requires snapshotToken, but does not require title, body, or edits. Non-doc content types do not support this field."
      draft: If true, update the draft version instead of current. Only supported for page and blogpost doc edits.
      dryRun: If true, validate and preview the result without persisting. For edits, returns the resulting HTML. For body replacement, echoes the input.
      edits: Granular edit operations. Array of tool-call objects, each with name (replaceNode, insertNodeAfter, insertNodeBefore, deleteNode, removeNodes, moveNode, appendNodeToEnd, setAttrs), localId, value, and arguments. Mutually exclusive with body.
      minorEdit: Whether to mark the new content version as a minor edit.
      ownerId: Atlassian account ID of the new owner to transfer page ownership to. Optional. This is an account ID (e.g. 5b10ac8d82e05b22cc7d4ef5), never an email/username or a content ID. The new owner must already have edit permission.
      snapshotToken: Opaque token from a prior getConfluenceContent response. Required for doc-type updates that mutate page/blog/live_doc content or contentWidth. Not used for whiteboard svg or database csv object updates.
      title: New title for the content. 1-255 characters. Omit to keep existing title.
      versionMessage: Optional version comment/message for the content update.
  - name: searchConfluence
    description: Search Confluence content with CQL
    params:
      cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
      cql: "CQL query string (max 4096 chars). Examples: `type = page AND space = \"DEV\"`, `title ~ \"onboarding\" AND lastmodified > \"2025-01-01\"`, `creator = currentUser() AND type IN (page, blogpost) ORDER BY lastmodified DESC`."
      cqlcontext: JSON-encoded execution context, e.g. {"spaceKey":"DEV"}. Restricts the search to the supplied scope.
      cursor: Opaque pagination cursor returned by a previous call. Omit to start from the first page.
      expand: "Comma-separated list of content properties to expand on each result. Common values: `space`, `version`, `body.view`, `metadata.labels`, `ancestors`. Use sparingly to avoid large responses."
      limit: Max number of results to return per page (1-100). Defaults to 25.
  - name: getJiraIssue
    description: Get a Jira or JSM issue by key or ID. Use for one known issue; use searchJiraIssuesUsingJql to find or list many issues. Reports how many comments an issue has, not the comments themselves — for those use listJiraIssueComments.
    params:
      cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
      expand: Additional Jira expand tokens (comma-separated), e.g. "renderedFields,changelog". Merged with any expand the server adds for custom-field mapping (e.g. "names"); duplicate tokens removed. Note "changelog" here returns only the newest page, sorted newest-first, and it accepts startAt/maxResults then ignores them — so it cannot be paged and reports a longer history as complete. Use listJiraIssueChangelogs to read all of it (oldest-first); do not mix their orderings.
      failFast: When true, forwards Jira's `failFast` query flag for this GET. Omit for Jira default behavior.
      fields: "Custom Jira field IDs to fetch (e.g. [\"customfield_10010\", \"customfield_10020\"]). Overrides the view's fetch strategy. For custom fields in normal use, prefer view: \"evidence\", which fetches and maps them automatically. Use [\"*all\"] to fetch every field (expensive — prefer view: \"full\" instead)."
      fieldsByKeys: When true, each entry in `fields` is interpreted as a Jira field key (e.g. "summary", "description") instead of a field id. Matches the Jira REST `fieldsByKeys` query parameter. Ignored when `fields` is omitted (default field list uses ids).
      includeEditableFields: "When true, also return compact metadata for fields the authenticated user can edit on this issue, including type, allowed values, and operations. Omit unless preparing an edit: this makes an extra Jira REST call."
      issueIdOrKey: Issue key (PROJ-123), numeric ID, or a Jira issue URL
      properties: Issue entity property keys to return (Jira `properties` query param, repeated per key). Omit unless you rely on app-specific issue properties.
      responseContentFormat: "Format for rich-text bodies — description and environment, plus any comment bodies the view returns. Defaults to markdown. Set html to receive HTML, which is lossless, so you can pass it straight back to editJiraIssue/addOrEditJiraIssueComment with contentFormat: html. Bodies holding anything markdown cannot represent — inline media, panels, expands, layouts, statuses, @mentions, dates, emoji, smart links — are returned as HTML automatically, because markdown would drop those nodes or turn them into literal text on write-back. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got."
      view: "Output view preset. Default: \"compact\". Options: \"compact\", \"evidence\", \"full\". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response."
  - name: searchJiraIssuesUsingJql
    description: "Search for Jira issues using JQL, with an optional approximate count. Use view: \"evidence\" to fetch and map custom fields. Page with nextPageToken until isLast is true. For one known issue, use getJiraIssue. JQL only returns issues; inferring anything else from issue rows is silently incomplete. Use the purpose-built operation for sprints, boards, board config, field history, worklogs, releases, accountIds, issue types, projects and statuses."
    params:
      cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
      fields: "Fields per issue (e.g. [\"summary\", \"status\", \"customfield_10010\"]). customfield_* IDs are site-specific — discover the correct id for story points etc. on this Cloud site. Honoured exactly when supplied. Values map to issues[].fields.customFields (human labels), not raw customfield_* keys. The default \"compact\" view omits custom fields; use view: \"evidence\" for velocity/sprint JQL (fetches and maps all custom fields) or pass explicit customfield_* IDs."
      jql: JQL query string e.g. "project = PROJ AND status = 'In Progress'"
      maxResults: Maximum results to return (default 50, max 100)
      nextPageToken: Pagination token from a previous response to fetch the next page
      responseContentFormat: Format for rich-text bodies (description, environment, comments) when the view returns them. Defaults to markdown; html is lossless for a later editJiraIssue. Issues holding anything markdown cannot represent (media, panels, expands, statuses, @mentions) are returned as HTML automatically, decided per issue. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.
      searchResultMode: Default "issues". Never count for normal search or if nextPageToken used. If total for same query is known, reuse it. Use "count" only when no trusted count exists and either the user asks or a downstream step needs it. Use "all" only if both count and issues required.
      validation: Validation mode. "none" runs the search without parser preflight. "strict" validates the JQL before searching and fails fast on parser errors. When the query is valid, the response may include a validation block with warnings returned during preflight.
      view: "Output view preset. Default: \"compact\". Options: \"compact\", \"evidence\", \"full\". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response."
  - name: createJiraIssue
    description: Create a new Jira issue. Put custom fields in additional_fields, keyed by field name or customfield_* ID; values are resolved automatically, so no field lookup is needed first. A rejected create returns the required fields and their allowed values, so retry from that.
    params:
      additional_fields: "Additional Jira fields. Keys can be human-readable field names or raw customfield_* IDs. Values can be human-readable (resolved automatically) or already-correct Jira shapes. Examples: {\"Story Points\": 8} ← number field by name {\"Team\": \"Backend\"} ← option/select by name {\"Reviewers\": [\"alice@acme.com\", \"bob@acme.com\"]} ← multi-user by accountId {\"Component Area\": \"Platform / Auth\"} ← cascading select as \"Parent / Child\" {\"customfield_10010\": 8} ← raw ID (no resolution needed, fastest) {\"components\": [{\"name\": \"Backend\"}]} ← system array field (raw shape) {\"fixVersions\": [{\"name\": \"v2.0\"}]} ← system array field (raw shape) On error, the response includes allowedValues and a repairHint for self-correction."
      assignToSprint: Optional sprint assignment after the issue is created. Accepts a numeric sprint ID, an exact sprint name, or "active" to resolve an active sprint. Numeric sprint IDs assign directly and do not need board lookup. When omitted, createJiraIssue behaves exactly as before and does not make sprint calls.
      assignee: Account ID of the assignee. Use lookupJiraAccountId to find it by name.
      cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
      contentFormat: "Body format for description. Defaults to markdown; html adds panels, tables and status lozenges. For HTML body shapes, first get the format guide via the generic operation runner (execute) as name=getContentFormatGuide, inputs={toolName: \"createJiraIssue\"}. Inline media needs an existing issue: create first, then embed with editJiraIssue. When the HTML content-format feature is disabled the call is rejected rather than downgraded, because markdown would store the HTML tags as literal text."
      description: Issue description in markdown, or HTML with contentFormat html. Converted to Jira ADF automatically.
      issueType: Issue type name (e.g. Bug, Task, Story, Epic). Use listJiraProjectIssueTypesMetadata to list valid types for this project if unsure.
      labels: List of label strings (e.g. ["bug", "needs-triage"]).
      parent: Parent issue key for sub-tasks or child issues (e.g. PROJ-10).
      priority: Priority name (e.g. High, Medium, Low, Highest, Lowest).
      projectKey: Project key (e.g. PROJ).
      summary: Issue summary / title.
  - name: editJiraIssue
    description: "Edit an existing Jira issue; only fields editable on this issue can be set. Clear a field by passing explicit null, e.g. {\"resolution\": null}. Put custom fields in additional_fields, keyed by field name or customfield_* ID; values are resolved automatically, so no field lookup is needed first. Reorder the issue on a board or sprint with rankBeforeIssue or rankAfterIssue (the neighbour's issue key); the two are mutually exclusive. Pass rankCustomFieldId only when the user supplies a Rank field id, or asks to rank on a specific board — then call getJiraBoardConfig first and use ranking.rankCustomFieldId. Otherwise omit it so Jira uses its default Rank field."
    params:
      additional_fields: "Additional Jira fields. Keys can be human-readable field names or raw customfield_* IDs. Values can be human-readable (resolved automatically) or already-correct Jira shapes. Examples: {\"Story Points\": 8} ← number field by name {\"Team\": \"Backend\"} ← option/select by name {\"Reviewers\": [\"alice@acme.com\", \"bob@acme.com\"]} ← multi-user by accountId {\"Component Area\": \"Platform / Auth\"} ← cascading select as \"Parent / Child\" {\"customfield_10010\": 8} ← raw ID (no resolution needed, fastest) {\"components\": [{\"name\": \"Backend\"}]} ← system array field (raw shape) {\"fixVersions\": [{\"name\": \"v2.0\"}]} ← system array field (raw shape) On error, the response includes allowedValues and a repairHint for self-correction."
      cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
      contentFormat: Body format for rich-text fields (description/environment). Defaults to markdown. html preserves inline media across a read-modify-write; a body fetched as HTML can be written straight back (Jira resolves media collection/filename server-side and omits them on read — not data loss). Requires the HTML content-format feature; when it is disabled the call is rejected rather than downgraded, because markdown would store the HTML tags as literal text and drop the media.
      fields: "Jira fields payload to set, keyed by field name or customfield_* ID. To clear a field, pass explicit null (e.g. {\"resolution\": null}). Rich-text fields (description/environment) default to markdown; set contentFormat: html to author them in HTML. Editing a body that already contains inline media must use contentFormat: html — markdown drops it. For HTML body shapes (inline media, panels, tables), first get the format guide via the generic operation runner (execute) as name=getContentFormatGuide, inputs={toolName: \"editJiraIssue\"}."
      inlineFileCollection: Media collection(s) from the upload step, paired to inlineFileId by index (a single value applies to all). Required whenever inlineFileId is set.
      inlineFileId: "Media file ID(s) from uploadAttachmentToJiraIssue to append inline to the description, e.g. [\"id1\",\"id2\"]. Requires contentFormat: html and a matching inlineFileCollection (paired by index). Appends at the end, keeping existing content; for exact placement, author the media node in the HTML description instead. A file already embedded in the body is rejected (would duplicate)."
      inlineFileName: "Optional file name(s) (from the upload step's fileName), paired to inlineFileId by index. Only selects the render shape: images render as a block image, other files as an inline chip. Omit to default to the image shape."
      issueIdOrKey: Issue key (e.g. PROJ-123).
      rankAfterIssue: Optional. Rank this issue immediately after the given issue key or ID (LexoRank relative anchor). Mutually exclusive with rankBeforeIssue. When omitted, editJiraIssue does not make ranking calls.
      rankBeforeIssue: Optional. Rank this issue immediately before the given issue key or ID (LexoRank relative anchor). Mutually exclusive with rankAfterIssue. When omitted, editJiraIssue does not make ranking calls.
      rankCustomFieldId: Optional. Numeric Rank field id for this rank call (e.g. 10020). Pass only when the user explicitly provides a Rank field id, or asks to reorder on a specific board's Rank field. For a named board, call getJiraBoardConfig first and use ranking.rankCustomFieldId. Do not invent or guess this id. Omit for ordinary reorders so Jira uses its default Rank field. Ignored unless rankBeforeIssue or rankAfterIssue is also set.
      responseContentFormat: Output format for rich-text fields in the returned issue. Defaults to markdown. Bodies markdown cannot represent (media, panels, expands, statuses, @mentions) are always returned as HTML, so a follow-up edit does not destroy them. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.
  - name: transitionJiraIssue
    description: Transition a Jira issue to a new status, and/or assign it to a sprint or backlog
    params:
      assignToBacklog: Set true to assign the issue to the backlog, mutually exclusive with sprintId. Optionally use boardId to target a specific board's backlog.
      boardId: "Only used when assignToBacklog is true: targets this specific board's backlog (board IDs from listJiraBoards). Ignored otherwise."
      cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
      fields: Optional Jira field values to apply during the workflow transition.
      historyMetadata: Optional issue history metadata to attach to the workflow transition.
      issueIdOrKey: Issue key like PROJ-123
      sprintId: Assign the issue into this sprint. Mutually exclusive with assignToBacklog.
      transitionId: Transition ID (get from listJiraIssueTransitions). Provide either transitionId or transitionName.
      transitionName: Name of the transition itself, not the target status — the two often differ, so "Done" does not match a transition named "Review->Done". Provide either transitionId or transitionName.
      update: Optional Jira field update operations to apply during the workflow transition. A comment passed here may be dropped without error — the transition reports success and no comment is created. Use addOrEditJiraIssueComment instead.
  - name: addOrEditJiraIssueComment
    description: Add a comment to a Jira issue, or edit an existing comment. Omit commentId to add a new comment; provide commentId to edit that comment. Comment text (commentBody) supports markdown. To edit, first get the commentId from listJiraIssueComments.
    params:
      cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
      commentBody: "Comment text. Markdown by default; set contentFormat: html to pass HTML instead. Required unless adding a new comment purely to embed a file via inlineFileId. Editing replaces the whole comment body: pass the full intended text (fetch the current comment first to preserve it), or \"\" for media only. Editing a body that already contains inline media must use contentFormat: html — markdown drops it. For HTML body shapes (inline media, panels, tables), first get the format guide via the generic operation runner (execute) as name=getContentFormatGuide, inputs={toolName: \"addOrEditJiraIssueComment\"}."
      commentId: ID of an existing comment to edit. When omitted, a new comment is added.
      commentVisibility: "Restrict comment visibility to a Jira group or role. Shape: `{\"type\":\"group\"|\"role\",\"value\":\"<name>\"}`. Role and group names are site-specific, so do not reuse a name from another site. On JSM this does not make a comment internal — a restricted comment stays customer-visible (`jsdPublic: true`). Use `jsmCommentType: \"internalNote\"` for that."
      contentFormat: Body format for commentBody. Defaults to markdown. html preserves inline media across a read-modify-write; a body fetched as HTML can be written straight back (Jira resolves media collection/filename server-side and omits them on read — not data loss). Requires the HTML content-format feature; when it is disabled the call is rejected rather than downgraded, because markdown would store the HTML tags as literal text and drop the media.
      inlineFileCollection: Media collection(s) from the upload step, paired to inlineFileId by index (a single value applies to all). Required whenever inlineFileId is set.
      inlineFileId: "Media file ID(s) from uploadAttachmentToJiraIssue to append inline to the comment, e.g. [\"id1\",\"id2\"]. Requires contentFormat: html and a matching inlineFileCollection (paired by index). Appends at the end; for exact placement, author the media node in the HTML commentBody instead. A file already embedded in the body is rejected (would duplicate)."
      inlineFileName: "Optional file name(s) (from the upload step's fileName), paired to inlineFileId by index. Only selects the render shape: images render as a block image, other files as an inline chip. Omit to default to the image shape."
      issueIdOrKey: Issue key (e.g. PROJ-123) or a Jira issue URL
      jsmCommentType: JSM comment type. Use internalNote for an internal note or publicComment for a customer-visible comment. Applies when adding or editing a JSM comment. Omit for existing Jira behavior.
      responseContentFormat: Format of the echoed comment body. Defaults to the format written, so an html write reads back as html. Bodies markdown cannot represent (media, panels, statuses, @mentions) are always echoed as HTML so a follow-up edit does not destroy them. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.
  - name: getLoomVideo
    description: "Reads a Loom video's core metadata and optionally its transcript, comments, AI agent briefs, AI-extracted meeting action items, or attached links in one call via the expand input. USE WHEN the user asks about a specific Loom video — its title, description, duration, owner, view/comment/reaction counts, what was said in it (pass expand: [\"transcript\"]), what feedback or comments people left on it (pass expand: [\"comments\"]), what the AI summarised as key points (pass expand: [\"agentBriefs\"]), or what follow-up tasks or action items the AI extracted from a meeting recording (pass expand: [\"meetingActionItems\"]), or which links are attached to it (pass expand: [\"links\"]). DO NOT USE to get the downloadable MP4 file — use getLoomVideoDownloadUrl for that. To find a video's ARI first, use listLoomVideos or listLoomVideosSharedWithMe."
    params:
      cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
      commentsAfter: Pagination cursor to fetch the next page of comments when comments is included via expand.
      commentsFirst: Maximum number of comments to return when comments is included via expand (1-100).
      expand: Optional list of extra data to include in the response, in addition to core metadata. Any subset of "transcript", "comments", "agentBriefs", "meetingActionItems", "links". Omit for core metadata only — nothing is included by default.
      linksAfter: Pagination cursor to fetch the next page of links when links is included via expand.
      linksFirst: Maximum number of links to return when links is included via expand (1-50).
      transcriptFormat: Transcript response shape when expand includes "transcript". Use "text" for summaries, extraction, implementation instructions, and general "what was said" questions. Use "phrases" only when timestamps, speaker/chunk structure, or quote-to-time answers are needed. Use "both" only when the caller explicitly needs both representations.
      videoAri: ARI of the Loom video, formatted as ari:cloud:loom:{siteId}:video/activation/{activationId}/{videoId}. Provide this or videoUrl.
      videoUrl: Loom share URL for the video, for example https://www.loom.com/share/{videoId}. Used when videoAri is not supplied; a supporting action resolves the URL to an ARI.
  - name: discover
    description: Find Atlassian operations that are not already in your tool list. Searches ~241 operations across Jira, Confluence, Compass, Bitbucket, Focus, Goals, Projects, Loom, Talent, Teams. Returns up to 5 matches with the exact name and inputs needed to call the matching execute-family tool (executeRead, executeWrite, or executeDestructive), then a briefer name-and-summary list of further matches — re-query with narrower terms to get one of those in full. Read all 5 before choosing. Only use an operation name from discover results or one already in your tool list; never guess, assume, or invent a name — when unsure, call discover first.
    params:
      query: "What you want to do, as a verb plus the object and, if you know it, the product: \"transition a jira issue\", \"list confluence spaces\", \"get pull request comments\". Naming the product scopes the searchAsk for one thing per call; for a goal spanning two products, call discover once per product. If nothing fits, re-query using the product's own noun (issue, page, space, repository, sprint) rather than a synonym."
  - name: executeRead
    description: Run a read-only Atlassian operation by name across all Atlassian products. Only use an operation name from discover results or one already in your tool list; never guess, assume, or invent a name — when unsure, call discover first. If the user provides a Jira/Confluence URL, pass it directly as cloudId — no need to call getAccessibleAtlassianResources. Pass all inputs as a flat object — the server routes each to the right location (path, query, or body) automatically. Use responseFields for field filtering, e.g. ["key","fields.summary","fields.status.name"]. Use view to select a named output preset (e.g. "compact", "evidence", "full") when the operation supports views.
    params:
      cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
      inputs: Flat input object — pass all parameters here. The server routes each to path, query, or body automatically.
      name: Operation name to run. Only use an operation name from discover results or one already in your tool list; never guess, assume, or invent a name — when unsure, call discover first.
      responseFields: Dot-notation fields to return, e.g. ["key","fields.summary"]. Filters response.
      view: Named output view preset (e.g. "compact", "evidence", "full"). Only applies when the operation declares views. Overridden by responseFields if both are supplied.
