name: Amplitude
entryKey: amplitude
serverUserType: singleUser
shortDescription: Query Amplitude analytics, charts, dashboards, experiments, and the tracking plan with Amplitude's official MCP server
description: |
  Analyze product data and manage Amplitude content through [Amplitude's hosted MCP server](https://amplitude.com/docs/en/amplitude-ai/amplitude-mcp).

  See Amplitude's [official MCP documentation](https://amplitude.com/docs/en/amplitude-ai/amplitude-mcp) for setup instructions, permissions, and current capabilities.

  ## Features
  - **Analytics**: Run segmentation, funnel, and retention queries, and read charts, dashboards, and notebooks
  - **Experiments and flags**: Read experiment results, create and update experiments, metrics, and feature flags
  - **Tracking plan**: Read and manage events, properties, and taxonomy
  - **Users and replays**: Look up cohorts, user data, and session replays
  - **Data warehouse**: List import sources, export destinations, and job history

  ## What you'll need to connect
  - An Amplitude account in the **US data center**. EU-resident organizations need a separate entry pointing at `https://mcp.eu.amplitude.com/mcp`.
  - The **Use MCP (read)** permission, which every role has by default. Write tools also need **Use MCP (write)**, granted by the Member, Manager, and Admin roles.
  - MCP enabled for the organization (Settings > Content Access > MCP), which it is by default.

  When you connect, Amplitude asks you to sign in and authorize Obot. Tool calls use your Amplitude identity and its permissions.

  ## Important considerations
  - The server does not ingest event data.
  - Large charts may be truncated, and dashboard queries may ignore saved dashboard filters.
  - Deletes ask for confirmation in two steps. Custom and labeled events are deleted permanently.
metadata:
  categories: Data & Analytics, SaaS & API Integrations
