- name: manage_amp_taxonomy
  description: 'Manage tracking-plan branches for a project: create, update, delete, merge, refresh and review. One tool selected by `action`. To read branches and workspace settings (naming conventions, `mainProtected`, environments), use `get_amp_taxonomy` (`action: workspace`).


    TYPICAL FLOW (most common production path):

    1. `get_amp_taxonomy` (`action: workspace`) first — learn `mainProtected`, naming conventions, approval workflow, environments and existing branch names before changing the plan.

    2. If `mainProtected` is true (or the user wants an isolated change), `create_branch` — do not mutate main. Check the `workspace` branch list first so you do not recreate an existing name.

    3. Apply tracking-plan edits with `manage_amp_events` / `manage_amp_properties` (or the create_* / update_* tools where those are listed) and pass `branchName` / `branchId` to target that branch — those tools are separate from this one.

    4. Finish with `merge_branch` (two-step `confirmed`) when the user wants changes on main, or `delete_branch` (two-step `confirmed`) to abandon. Many sessions stop after step 3 with work left on the feature branch — that is normal.

    5. Less common: `refresh_branch` (pull main into the feature branch; two-step), `review_branch` (approve/unapprove when approvals are required), `update_branch` (description only).


    ACTIONS:

    - `create_branch`: create a branch off main. Requires `name`.

    - `update_branch`: update a branch description (not name). Requires `branchName` or `branchId` + `description`.

    - `delete_branch`: delete a non-main branch. Two-step: call once, then again with `confirmed: true` after the user acknowledges.

    - `merge_branch`: merge a feature branch into main. Two-step with `confirmed`. If approvals are required and missing, reports status instead of merging.

    - `refresh_branch`: pull latest main into a feature branch. Two-step with `confirmed`; conflicts overwrite the feature-branch version.

    - `review_branch`: approve or unapprove a branch for merge. Pass `reviewDecision` ("approve" | "unapprove"). Prefer after the branch has pending changes — empty branches cannot be approved.


    PROJECT ID:

    - Pass numeric `projectId` (e.g. "123456"). Get it from `get_amplitude_context` if you do not already have one.

    - If omitted and the user has exactly one accessible project, that project is used automatically.

    - Do not invent project ids. Do not use project names.


    DO NOT USE FOR:

    - General org/user/project discovery → `get_amplitude_context`

    - Creating or updating events/properties → `manage_amp_events` / `manage_amp_properties` (or the create_* / update_* tools where those are listed) with `branchName` when on a feature branch

    - Reading branches, settings, events or properties → `get_amp_taxonomy`'
  params:
    action: 'Branch operation. To read branches or workspace settings, use get_amp_taxonomy (action: workspace).'
    projectId: Numeric Amplitude project ID (e.g. "123456"). Get it from get_amplitude_context. Optional only when the user has exactly one accessible project.
    name: 'create_branch: unique name for the new branch.'
    description: 'create_branch: optional branch description. update_branch: new description (required for that action).'
    branchId: Branch ID for update/delete/merge/refresh/review. Use either branchId or branchName.
    branchName: Branch name for update/delete/merge/refresh/review. Use either branchId or branchName.
    confirmed: 'delete_branch / merge_branch / refresh_branch: set true only after the user explicitly confirms.'
    reviewDecision: 'review_branch: whether to approve or withdraw approval. Defaults to approve.'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: use_amplitude_data_connections
  description: 'Unified entry point for everything to do with a project''s data connections — ingestion sources, import/export job history, Snowflake credentials, live Snowflake warehouse browsing, and Amplitude import-config recommendations. Replaces 10 previously separate tools (get_data_ingestion_sources, get_data_source_details, get_data_warehouse_jobs, get_data_warehouse_health, get_falcon_integrations, get_snowflake_warehouse_databases/_schemas/_tables/_columns/_rows, recommend_falcon_import_config).


    ROUTES (action=''read'', selected by `view`):

    - omit `dataSourceId` and `view` → list every configured source for the project (''data_connections.list (get_data_ingestion_sources)''). Start here.

    - `dataSourceId` set, `view` omitted or ''summary'' → detail for that one source (''data_connections.summary (get_data_source_details)'').

    - `view: ''connections''` → list the project''s Snowflake credentials/integrations (''data_connections.connections (get_falcon_integrations)''). Use this to find an `integrationId` for the browsing views below.

    - `view: ''jobs''` → import/export batch job history for one connection (''data_connections.jobs (get_data_warehouse_jobs)''). Requires `dataSourceId` in `vacuum:{id}` / `falcon:{id}` / `gyrfalcon:{id}` form (as returned by the list route; `gyrfalcon:` answers `supported: false` — no per-run history yet, not "never ran"); auto-resolved when the project has exactly one configured source.

    - `view: ''health''` → project-wide health of EVERY import and export connection in one call (''data_connections.health (get_data_warehouse_health)''): which are failing, degraded, running, healthy, idle or unknown, worst first, with last-success age per connection. No `dataSourceId`. Optional `direction` (imports or exports only), `since` (failure-counting window, default 7 days) and `maxConnections`. Use this instead of listing sources and destinations and then calling ''jobs'' per connection.

    - `view: ''databases'' | ''schemas'' | ''tables'' | ''columns'' | ''rows''` → live Snowflake warehouse browsing, one drill-down level at a time (''data_connections.databases (get_snowflake_warehouse_databases)'' etc.). Needs a connection reference (`integrationId` or `sourceDestinationId`) — auto-resolved via ''connections'' when the project has exactly one Snowflake credential. Snowflake-only today; other warehouse types will extend this enum, not rename the tool.


    ROUTES (action=''recommend_import''):

    - Generates a heuristic Amplitude import config + ready-to-run SQL for one or more warehouse tables (''data_connections.recommend_import (recommend_falcon_import_config)''). This is the ONLY correct way to produce warehouse-import SQL — never hand-write it.


    WHEN TO USE:

    - Anything about "what''s sending data into my project", "did this import/export succeed", "are any of my pipelines failing / is anything broken or stale" (that is ''health''), "what Snowflake credentials/connections exist", "what''s in my Snowflake warehouse", or "generate an import config/SQL for this table".


    INSTRUCTIONS:

    - Always provide `projectId`.

    - Prefer omitting `dataSourceId`/connection refs on the first call in a session — this tool auto-resolves the connection when there''s exactly one, and only asks you to disambiguate when there are several.

    - For ''jobs'', pass the prefixed `dataSourceId` from the list route (e.g. `vacuum:42`, `falcon:abc-123`, `gyrfalcon:c-9`) — not a bare numeric id.

    - For ''health'', omit `dataSourceId`; it inspects every connection. If the response says `truncated: true`, raise `maxConnections` or narrow with `direction` before concluding the project is healthy.

    - For browsing views, drill down one level per call: ''databases'' → ''schemas'' (needs `database`) → ''tables'' (needs `database`+`schema`) → ''columns''/''rows'' (needs a read-only `sql` SELECT).

    - For ''recommend_import'', provide `tables` (fully qualified dotted names) and either `sourceDestinationId` (preferred — lets Amplitude introspect the warehouse; NOT the same id as `integrationId` from ''connections'') or `warehouseKind` for a dry run with caller-supplied `columns`/`sampleRows`.


    EXAMPLES:

    - List sources: { "projectId": "123456" }

    - Job history: { "projectId": "123456", "view": "jobs", "dataSourceId": "vacuum:42" }

    - Health of every connection: { "projectId": "123456", "view": "health" }

    - Browse tables: { "projectId": "123456", "view": "tables", "database": "ANALYTICS", "schema": "PUBLIC" }

    - Recommend import: { "projectId": "123456", "action": "recommend_import", "sourceDestinationId": "789", "tables": [{"fullyQualifiedName": "ANALYTICS.PUBLIC.EVENTS"}] }


    NOTES:

    - Sensitive credential fields are never returned; empty strings stand in for secrets.

    - Databricks/BigQuery/GA4 warehouse-native browsing isn''t implemented yet — only classic Snowflake. `recommend_import` returns a `WAREHOUSE_NOT_SUPPORTED_YET` error for other kinds; surface it without retrying.'
  params:
    projectId: The project ID (appId) to operate on. Call get_amplitude_context first if unknown — never guess.
    dataSourceId: The data source id. Omit for the list route. For 'summary' pass the id from the list route (e.g. `library:ios-swift`, `vacuum:42`). For 'jobs' pass the prefixed id (`vacuum:{id}` or `falcon:{id}`).
    view: Which read outcome to fetch. Omit for the list/summary route. 'connections' lists Snowflake credentials. 'jobs' is batch job history for ONE connection; 'health' is a project-wide status report across every connection. 'databases'|'schemas'|'tables'|'columns'|'rows' drill into a live Snowflake connection one level at a time.
    action: Defaults to 'read' (use `view` to pick the outcome). Set to 'recommend_import' to generate an Amplitude import config + SQL for warehouse tables — ignores `view`.
    status: '''jobs'' view only. Filter by unified job status. Defaults to no filter.'
    jobMode: '''jobs'' view, export connections only. Defaults to ''automatic'' (scheduled). Use ''manual'' for manual/backfill export jobs.'
    direction: '''jobs'' and ''health'' views. On ''jobs'' it overrides the inferred connection direction; only pass it if the inference is wrong. On ''health'' it restricts the report to import sources or export destinations.'
    limit: '''jobs'' view only. Max jobs per page (1-100, default 25).'
    cursor: '''jobs'' view only. Opaque pagination token from a previous call.'
    maxConnections: '''health'' view only. Max connections to inspect in one call (1-50, default 25).'
    since: '''jobs'' and ''health'' views. Inclusive lower bound on job time, as a date or ISO-8601 date-time. A value with no timezone is read as UTC. On ''health'' it scopes the failure-counting window.'
    until: '''jobs'' view only. Exclusive upper bound on job time, same formats as `since`.'
    sourceDestinationId: 'Browsing views: an import source/destination id identifying the Snowflake connection, or integrationId may be used instead. recommend_import: REQUIRED connection identifier — integrationId is not accepted here, they are different ids.'
    integrationId: Browsing views ONLY. A Snowflake credential id from the 'connections' view. Provide this or sourceDestinationId — auto-resolved when the project has exactly one. NOT valid for recommend_import (use sourceDestinationId there instead).
    database: '''schemas''/''tables'' views. The Snowflake database to drill into.'
    schema: '''tables'' view. The Snowflake schema to list tables for.'
    includeSystemSchemas: '''schemas'' view only. Include account-metadata schemas such as INFORMATION_SCHEMA. Off by default.'
    sql: '''columns''/''rows'' views. A read-only Snowflake SELECT statement (e.g. SELECT * FROM DB.SCHEMA.TABLE).'
    numRows: '''rows'' view only. Max sample rows to fetch (default 10 if omitted), capped at 1000.'
    tables: One or more tables to generate import recommendations for.
    warehouseKind: Warehouse kind, required only when no connection exists yet (dry run from caller-supplied inputs). Provide exactly one of sourceDestinationId or warehouseKind. Only SNOWFLAKE_IMPORT is implemented today.
    options: Optional tuning for sampling, ranking, and diagnostics.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_data_warehouse_destinations
  description: 'List the Data Warehouse export destinations configured for a project.


    WHEN TO USE:

    - You want to see where a project exports its data (Snowflake, BigQuery, S3, etc.), their type, status, and last-export timing.

    - You need a destination''s connection id to inspect its export jobs by passing that id to use_amplitude_data_connections (view: ''jobs'', as dataSourceId) — or to get_data_warehouse_jobs if that standalone tool is available in this session.

    - This is the export-side counterpart of the ingestion-source listing (which lists the import sources feeding the project).


    INSTRUCTIONS:

    - Provide the projectId (appId) to list all configured export destinations.

    - Narrow the list with the optional `type` (matches `eventDestinationType` case-insensitively, whole value, so "SNOWFLAKE" does NOT match SNOWFLAKE_EXPORT_DATASHARE) and `enabled` filters instead of listing everything and scanning client-side. When either is set the response carries `filteredFrom`, the pre-filter count: an empty `destinations` with a non-zero `filteredFrom` means "none matched your filter", NOT "this project has no destinations". Report it that way.

    - Each destination''s `id` is a ready-to-use `falcon:{id}` — pass it as the dataSourceId to use_amplitude_data_connections (view: ''jobs''), or as the connectionId to the standalone get_data_warehouse_jobs tool if that is the one available, to see that destination''s export jobs.


    TIMING FIELDS (three different measurements — NOT three views of one job, and NOT reconcilable 1:1 with get_data_warehouse_jobs):

    - latestSuccessfulJobStartTime / latestFailedJobStartTime: START (enqueue) time of the most recent successful/failed automatic job, INCLUDING successful runs that exported 0 rows. Format ''YYYY-MM-DD HH:MM:SS'' with fractional seconds and no timezone (effectively UTC).

    - latestExportCompletionTime: a data-export watermark — the COMPLETION time of the most recent successful run that actually exported data. Empty (0-row) successes and failures do NOT advance it, so it can legitimately lag latestSuccessfulJobStartTime by days or months when no new data has arrived. ISO-8601 with ''T'' separator, no timezone designator (effectively UTC) — a different format from the two fields above.

    - RECONCILIATION CAVEAT: get_data_warehouse_jobs hides successful export jobs that exported 0 rows, so a destination can show latestSuccessfulJobStartTime = today while get_data_warehouse_jobs returns no recent SUCCESS job for the same connection. That is expected, not a contradiction. Do not treat these fields as ground truth against the jobs list, and do not conclude from them alone that a data-bearing export ran recently — use latestExportCompletionTime together with the jobs list to confirm actual data delivery.


    NOTES:

    - Destinations only (exports); import/ingestion sources are listed separately.

    - Two kinds of destination are returned. `falcon:{id}` supports job history; `gyrfalcon:{id}` (Snowflake CUSTOM_EVENTS / EVENT_TRANSFORMATIONS, Databricks) does NOT yet — asking for its jobs returns `supported: false`, which does NOT mean it never ran. Judge those on latestSuccessfulJobStartTime / latestFailedJobStartTime / `latestError` (present only on gyrfalcon rows with a recorded error; its absence elsewhere means the backend cannot report one, not that all is well).

    - If `note` is present, part of the list could not be fetched — say so rather than reporting it as complete.

    - Responses never include credential fields — only type, status, timing (see TIMING FIELDS), and count fields when Falcon has populated them (see COUNT FIELDS).

    - COUNT FIELDS: `latestRowsUnloadedCount` / `latestResolvedUserCount` come from Falcon and are often unset. Null is omitted from the response (not a failure). For export row counts, inspect job history via use_amplitude_data_connections (view: ''jobs'') or get_data_warehouse_jobs if that standalone tool is available — do not chase missing destination-level counts.'
  params:
    projectId: The project ID (appId) to list export destinations for.
    type: 'Optional: keep only destinations whose eventDestinationType matches this value, case-insensitively (e.g. "SNOWFLAKE", "BIGQUERY", "AMAZON_S3"). Exact match on the whole value — "SNOWFLAKE" does NOT match SNOWFLAKE_EXPORT_DATASHARE.'
    enabled: 'Optional: keep only destinations whose enabled flag equals this. Destinations reporting a null enabled flag are excluded by either value, since neither true nor false is known to hold.'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_amp_user_data
  description: 'Look up Amplitude users. One tool with modes selected by `include` (default `profile`).


    TWO KINDS OF "USER":

    - Product users (default): people in project analytics data — use amplitudeId / userId / email / deviceId.

    - Org teammates (`include=''org''`): people with Amplitude login accounts in your org — emails for sharing charts/dashboards/notebooks.


    PRODUCT LOOKUPS — identify with exactly one of:

    - `amplitudeId` → exact lookup (fastest, no resolution step).

    - `userId` → your product''s user id; resolved to an amplitudeId first.

    - `email` → resolved to an amplitudeId (most projects use the email as the user id; a fallback search covers the rest).

    - `deviceId` → resolved via device-id match (anonymous / pre-login users).

    - `amplitudeIds` → batch form (max 10); profile mode only.


    OUTPUT MODES (`include`):

    - `id` → ''resolve_user_id'': resolve identifier to amplitudeId only.

    - `profile` (default) → ''get_user_profile'': identity, properties, groups, usage stats.

    - `timeline` → ''get_user_timeline'': recent event stream.

    - `both` → profile + timeline.

    - `org` → ''get_org_users'': list org login emails/names for sharing. No product identifier or projectId needed. Pass returned `loginId` values to share tools. For large orgs, pass `limit` and follow `pagination.nextCursor`; omit both for the full directory.


    INSTRUCTIONS:

    - `projectId` is required for product modes (id/profile/timeline/both); omit it for `include=''org''`.

    - If a product identifier matches multiple users, the response lists candidates (status ''ambiguous'') — re-call with `amplitudeId`.

    - Experiment-prefixed properties/events are excluded by default; set `includeExperimentData` when debugging experiments.


    DO NOT USE FOR:

    - Enumerating product users who performed an event → use ''use_amplitude_cohorts'' (action=''find'').

    - Aggregate counts or trends → use ''query_dataset''.

    - Org role / group / RBAC admin reads → use ''get_org_users'' with the matching admin action.'
  params:
    projectId: Project ID (appId). Required for product modes; omit when include='org'.
    amplitudeId: Amplitude ID for exact lookup (provide exactly one identifier).
    userId: Your product's user id; resolved to an amplitudeId first.
    email: Email address to resolve to an amplitudeId.
    deviceId: Device ID to resolve to an amplitudeId (anonymous users).
    amplitudeIds: Batch of Amplitude IDs (max 10); profile mode only.
    include: 'What to return: ''id'', ''profile'' (default), ''timeline'', ''both'', or ''org'' (org teammate directory for sharing).'
    limit: 'include=''org'' only: max users per page (1-100). Omit limit and cursor to return the full org directory. When continuing with cursor without limit, page size defaults to 25.'
    cursor: 'include=''org'' only: pagination cursor from a prior response pagination.nextCursor.'
    eventLimit: 'timeline/both: number of events to return (default 50, max 1000).'
    timestamp: 'timeline/both: ISO 8601 timestamp to anchor the timeline — events before it are returned (default: now).'
    filterEvents: 'timeline/both: only include events with these exact event types.'
    includeEventProperties: 'timeline/both: include full event properties (default false for concise output).'
    includeExperimentData: Include [Experiment]-prefixed properties (profile) and assignment events (timeline). Default false.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_agent_results
  description: 'Retrieve results from AI agents that have analyzed your dashboards or session replays.


    This is NOT for searching dashboards, charts, or notebooks — use ''search'' for that.

    This is specifically for retrieving the AI-generated insights and analyses that agents produced.


    This tool handles both searching for agent analyses and fetching full results in a single call.


    MODES:

    1. **Search mode** (no session_id): Search agent analyses with filters. Returns preview summaries.

    2. **Direct fetch mode** (session_id provided): Fetch full artifact data for a specific session.

    3. **Auto-expand**: If search returns exactly 1 session, full artifacts are included automatically.


    SEARCH STRATEGY (important — follow this order):

    1. If you have a specific session_id, use direct fetch mode.

    2. For dashboard analyses, pass agent_params with dashboard_id (cheap exact-match).

    3. For session replay insights, use agent_params with category and/or impact (cheap exact-match).

    4. Use "query" ONLY for natural language / fuzzy search when exact filters aren''t sufficient.


    WHEN TO USE:

    - "What are my dashboard agents?" → agent_type: dashboard_explorer

    - "Show my agent results" → agent_type: dashboard_explorer (or session_replay_explorer)

    - "What agents have I run?" → agent_type: dashboard_explorer

    - "What analyses exist for dashboard xyz?" → agent_type: dashboard_explorer, agent_params: { dashboard_id: "xyz" }

    - "Show me high-impact session replay insights" → agent_type: session_replay_explorer, agent_params: { impact: "High" }

    - "Friction hotspots in the checkout flow" → agent_type: session_replay_explorer, agent_params: { category: "Friction Hotspots" }, query: "checkout flow"

    - "What did the AI find about rage clicks?" → agent_type: session_replay_explorer, query: "rage clicks"

    - "Any dashboard insights about revenue?" → agent_type: dashboard_explorer, query: "revenue"

    - "Show me insights from last week" → agent_type: session_replay_explorer, created_after: "2026-03-16T00:00:00Z"

    - "What did I analyze recently?" → agent_type: dashboard_explorer


    DO NOT USE FOR:

    - Finding or listing dashboards, charts, or notebooks → use ''search'' instead

    - Running new analyses or queries → use ''query_dataset'' or ''query_charts'' instead

    - Creating dashboards → use ''create_dashboard'' instead


    RETURNS:

    - Search mode: List of analysis sessions with preview summaries, URLs, and pagination info

    - Direct fetch mode: Full artifact data for the session

    - Links to view each session in the Amplitude UI are included'
  params:
    agent_type: Type of agent analysis to search for. "dashboard_explorer" finds AI-generated dashboard analysis summaries. "session_replay_explorer" finds AI-generated UX insights from session replay analysis.
    session_id: Specific session ID to fetch full artifacts for. When provided, returns full artifact data and other filters are ignored. Get session IDs from a previous search.
    agent_params: 'Agent-type-specific filter parameters as a JSON object. For dashboard_explorer: { "dashboard_id": "xyz" }. For session_replay_explorer: { "category": "Friction Hotspots", "impact": "High" }. Valid categories: Journeys & Navigation, Forms & Input, Content, Conversion, Friction Hotspots, Retention. Valid impacts: Low, Medium, High.'
    query: 'Free-text semantic search query (uses vector embeddings). Best for natural language discovery: "rage clicks on save button", "dashboard showing revenue drop", "friction in onboarding flow". This is EXPENSIVE (generates an embedding) — prefer exact filters when you have specific values.'
    created_after: 'ISO 8601 date string. Only return sessions with analysis artifacts created after this date. Filters by artifact time, not session creation time. Example: "2025-03-01T00:00:00Z" for analyses run since March 2025.'
    created_before: ISO 8601 date string. Only return sessions with analysis artifacts created before this date. Use with created_after for a date range.
    limit: 'Maximum number of results to return (default: 10).'
    offset: Pagination offset. Use with limit to page through results. Start at 0 (default).
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: use_amp_guides_surveys
  description: 'List Guides and Surveys or get one by ID. Use `action: "list"` for filtered discovery and rollout summaries; use `action: "get"` for full content, targeting, variants, steps, and rollout details. Both require `projectId`; get also requires `nudgeId`.'
  params:
    action: 'Discriminator: determines which set of parameters applies (list | get)'
    projectId: Project ID (appId) to list Guides and Surveys for. Prompt the user if not specified.
    types: Types to include. Defaults to both Guides and Surveys.
    platform: Filter by target platform. 'web' also matches rows with no platform set.
    createdAfter: ISO 8601 lower bound on created timestamp (inclusive).
    createdBefore: ISO 8601 upper bound on created timestamp (inclusive).
    createdBy: Filter by the email (or login id) of the user who created the guide/survey. Exact match against the stored `createdBy` value.
    includeArchived: Include archived (soft-deleted) items. Defaults to false.
    limit: Maximum number of items to return per page. Defaults to 50, capped at 200.
    cursor: Opaque cursor from a previous response's `nextCursor`. Omit for the first page.
    rationale: Why this Guides and Surveys read is needed.
    nudgeId: ID of the nudge (guide or survey) to retrieve.
