- name: get_group_types
  description: 'List available group types for a project. Group types are the categories of groups (e.g., "Company", "Team", "Account") — NOT the properties/attributes of those groups.


    WHEN TO USE:

    - Use this tool to discover what group types exist (e.g., "Company", "Team").

    - Use get_properties with propertyType "group" instead if the user is generally asking for group properties (e.g., company_name, plan_tier).


    NOTES:

    - Returns group types from the latest staging version of the default branch.

    - createdAt is when the group type was added to the tracking plan. Group types have no firstSeen, lastSeen or updatedAt.'
  params:
    projectId: Project ID (appId) to list group types for. Prompt the user if not specified.
