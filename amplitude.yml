toolPreview:
- name: run_amp
  description: "Run an `amp` CLI command against the Amplitude Developer API when no dedicated MCP tool covers it.\n\nHeatmaps and zoning have no dedicated tool: `heatmaps click-map`, `heatmaps scroll-map`, `zoning zone-metrics`.\n\nGuide and survey writes have no dedicated tool: `guides create|update|archive`, `surveys create|update|archive`. `update` needs `latest-version` from `guides get` / `surveys get` with `include-unpublished-changes`. Writes only change the draft; publishing happens in the Amplitude UI. For reads, prefer `use_amp_guides_surveys` when it is listed.\n\nDISCOVER COMMANDS — do not guess a name:\n- Full catalog: { \"command\": [\"help\"] }. `--json` is injected, so this returns every command.\n- One surface: { \"command\": [\"help\", \"heatmaps\"] }. One command's parameters: { \"command\": [\"help\", \"heatmaps\", \"click-map\"] }.\n- Help is a command, not a flag. Wrong: { \"command\": [\"--help\"] }, { \"command\": [\"users\", \"--help\"] }, { \"flags\": { \"help\": true } }.\n\nCOMMAND SHAPE — most calls fail here:\n- `command` is the full subcommand only. No `amp` prefix, no dashes, no flag values.\n  Right: { \"command\": [\"heatmaps\", \"click-map\"], \"flags\": { \"project\": \"12345\", \"page-url\": \"https://example.com/pricing\" } }\n  Wrong: { \"command\": [\"events\", \"list\", \"--project\", \"12345\", \"--limit\", \"5\"] }\n  Wrong: { \"command\": [\"amp\", \"events\", \"list\"] }\n- A group name alone is not a command. `[\"flags\"]`, `[\"charts\"]`, `[\"events\"]`, and `[\"export\"]` fail. Call `[\"help\", \"<surface>\"]` instead of guessing the verb.\n- Every option goes in `flags`, keys without dashes: { \"project\": \"12345\" }, not { \"--project\": \"12345\" }.\n- `base-url`, `env`, `region`, `token`, `profile`, `json`, and `yes` cannot be set. The MCP session pins the host and credential.\n\nDO NOT CALL:\n- `auth` / `logout` / `skills` / `version` — unavailable through run_amp. Help marks availability; authenticate outside MCP.\n- `charts`, `charts update`, `dashboards list` — not amp commands. Use `query_amplitude_data`, `query_dataset`, or the dashboard tools. Confirm the name with `[\"help\"]` before inventing one.\n- `export`, `annotations`, `cohorts`, `users` — not amp commands. Use the cohort, taxonomy, or org-user MCP tool when the catalog lists one.\n- Analytics queries (counts, DAU, funnels, retention) → `query_dataset` / `query_amplitude_data`. Click maps, scroll depth, and zone metrics are not analytics queries; they belong here.\n- Dedicated MCP tools when they are listed (flags, events, cohorts).\n\nOTHER:\n- DELETE commands, including `agent-analytics datasets remove-sessions`, require `allowDestructive: true`. Prefer `flags: { \"dry-run\": true }` first when the command supports it.\n- Dataset/evaluator discovery and inspection: use `get_amplitude_agent_analytics_info` with `view: \"schema\"`, `include: [\"filter_options\"]`, `filterOptionTypes: [\"datasets\", \"evaluators\"]`, and `projectId`. Dataset membership uses `view: \"sessions\"` with `datasetId`.\n- Evaluator updates use the stable ID; eval-run evaluator_ids use version IDs returned by create/update. Inactive evaluators can be explicitly evaluated; these writes do not activate them.\n- Array flag values are strings: string arrays accept comma-separated IDs or a JSON array; object arrays use a JSON array string matching the help item schema. Example tags: `[{\"id\":\"true\",\"label\":\"True\",\"description\":\"Helpful\"},{\"id\":\"false\",\"label\":\"False\",\"description\":\"Not helpful\"}]`.\n- `idempotency-key` is accepted on writes; header acceptance does not guarantee deduplication. Do not assume retrying an ambiguous failure is safe.\n- Uses the caller's MCP OAuth/PAT credentials."
  params:
    command: Full subcommand, no amp prefix and no dashes. ["help"] lists commands. ["help", "heatmaps"] lists one surface. ["heatmaps", "click-map"] runs one. Do not put --project or --help in this array.
    flags: 'Flag names without leading dashes, e.g. { "project": "12345", "limit": "5" }. Not { "--project": "12345" } and not { "help": true }. Discover commands with command: ["help"].'
    allowDestructive: Allow DELETE commands, including dataset remove-sessions. Supplies the pinned --yes flag. Defaults to false; supported dry-run calls do not require approval.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_amplitude_charts
  description: 'Read saved Amplitude charts by ID, or look up the chart-type schema. One tool with five output modes selected by `include` (default `link`).


    OUTPUT MODES:

    - `link` (default) → ''get_chart_link'': validates each id exists, then returns the chart''s URL(s). Does not run the chart — cheap id lookup only.

    - `typed` → ''lower_chart'': returns the chart as typed UI-shaped parameters (`kind` + events/where/group_by/…) — the same shape `query_amplitude_data`''s `chart` parameter accepts. Prefer this when creating a variant of an existing chart or preparing a modification: edit the typed object, then call `query_amplitude_data` with `chart` (+ `chartId` to fork/modify the saved chart).

    - `definition` → ''get_charts'': returns the full raw Amplitude definition object(s). Use when `typed` cannot lower the chart (advanced features) or you need fields the typed model does not cover.

    - `data` → ''query_charts'': runs the chart(s) and returns the result data. Use when you need the numbers.

    - `guide` → ''get_chart_definition_params'': no ids needed. Pass `chartType` to get that type''s parameter schema, valid enum values, and a working example definition — use BEFORE calling `query_amplitude_data` if you are unsure of the shape, or to look up valid enum values (e.g. funnel modes, segmentation metrics). Omit `chartType` to list all supported chart types. NOTE: This schema describes chart STRUCTURE only (params, enums, example) — it does NOT validate event or property names against your project''s taxonomy. An unrecognized event/property key will NOT error; it silently returns a chart with empty data. Before building, confirm exact spelling via ''search'', ''get_properties'' (propertyType="event"), or get_amplitude_charts include=''definition'' on a similar existing chart — never guess a key name.


    PREREQUISITES (required):

    - For `link` / `typed` / `definition` / `data`: you MUST have at least one concrete `chartIds` or `chartEditIds` entry. Do not call speculatively. Resolve ids FIRST via `search` (by name), `get_from_url` (from a chart link), or `query_amplitude_data` (for ad-hoc analysis, which returns a chart edit id).

    - For `guide`: no ids required; `chartType` is optional (omit to list all supported types).


    INSTRUCTIONS:

    - Create a new chart: `search` (taxonomy) → build typed `chart` → `query_amplitude_data`.

    - Modify / fork a saved chart: `search` (find chart) → `get_amplitude_charts include=''typed''` → edit the returned `chart` → `query_amplitude_data` with that `chart` and `chartId` set to the saved chart id.

    - Saved charts → `chartIds`. Chart edits (links ending in /chart/new/<edit_id> or /chart/<chart_id>/edit/<edit_id>) → `chartEditIds`.

    - `typed` and `definition` modes support `chartIds` only. For a chart edit''s data use `data` mode.

    - `data` mode accepts up to 3 ids/edits combined.

    - The data params (`groupByLimit`, `excludeIncompleteDatapoints`, `timeSeriesLimit`) only apply when `include = ''data''`. `chartType` only applies when `include = ''guide''`.


    DO NOT USE FOR:

    - Ad-hoc analysis without a saved chart → use ''query_amplitude_data''.

    - Finding charts by name → use ''search''.'
  params:
    chartIds: Saved chart IDs to read.
    chartEditIds: Chart edit IDs to read (data mode only).
    include: 'What to return: ''link'' (default, URL only — free), ''typed'' (UI-shaped chart params for query_amplitude_data), ''definition'' (raw chart config), ''data'' (run the chart), or ''guide'' (chart-type parameter schema/enums/example — no ids needed, use chartType).'
    groupByLimit: 'data mode only: max group-by values to return (1-1000, default 10).'
    excludeIncompleteDatapoints: 'data mode only: exclude the current (incomplete) interval. Default false.'
    timeSeriesLimit: 'data mode only: max group-by values that include per-interval rows (default 6; 0 = totals only).'
    chartType: 'guide mode only: the chart type to get parameter schema/enums/example for. Supported: eventsSegmentation, funnels, metricExplorer, retention, revenueLtv, sessions, stickiness. Omit to list all supported types instead.'
    vis: 'data mode only: override the eventsSegmentation visualization type (line, area, bar, pie, stackedbar). Used by the chart widget vis switcher.'
    theme: 'data mode only: fetch only this theme of an eventsSegmentation Highcharts config. Used by the chart widget for active-theme-first rendering.'
    includeAdditionalInfo: 'data mode only: additional render-only information. Omit for compact analytics data; the chart app passes ["chartConfig"].'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: query_amplitude_data
  description: "Run analytics queries to answer data questions about users, events, funnels, and retention — and to create or modify charts via the typed `chart` parameter.\n\nPREFERRED: pass the typed `chart` parameter (segmentation | funnel | retention | sessions | data_table). It is a small, UI-shaped model (events, where, group_by, measured_as, segments, date_range) that is deterministically compiled server-side into a validated chart definition — compile errors come back with a fix-oriented hint, so you never need to hand-build raw definition JSON.\n\nFALLBACK: pass a raw `definition` only for chart types the typed model does not cover (composition, revenueLtv) or advanced params the typed model has no field for. Raw definitions are validated inline; on failure the response includes chartTypeSchema with the parameter schema, valid enums, a working example, and coercion rules.\n\nProvide exactly one of `chart` or `definition`.\n\n# WHEN TO USE - Answer questions like:\n- \"How many active users did we have last week?\"\n- \"Show me a funnel from sign up to purchase\"\n- \"What is the retention rate for new users?\"\n- \"Create a chart…\" / \"Modify chart X to…\"\n- Any question asking for metrics, counts, trends, funnels, or retention analysis\n\n# DO NOT USE FOR:\n- Heatmaps and zoning for a page URL (click map, scroll depth, zone metrics such as click rate or rage clicks per zone) → use 'run_amp' (`heatmaps click-map`, `heatmaps scroll-map`, `zoning zone-metrics`). Chart queries cannot serve them.\n- Finding existing charts/dashboards → use 'search' or 'get_amplitude_charts' instead\n- Project settings (timezone, currency) → use 'get_amplitude_context' with projectId instead\n\n# STRATEGIES\n1. Discover the exact event name with 'get_events', then query directly. For semantic/fuzzy taxonomy lookup (you know the concept, not the exact name), use 'search' or 'search_amp_data_taxonomy'. Use event-scoped property discovery only when the requested analysis actually needs a filter or group-by property — never page the project-wide property catalogue after a query error.\n2. Create: build the typed `chart` (events + date_range required; add where/group_by/segments as asked) → call this tool.\n3. Modify / fork a saved chart: `search` to find the chart id → `get_amplitude_charts include='typed'` → edit the returned `chart` → call this tool with that `chart` AND `chartId` set to the saved chart id (links the edit to the parent; parent params fill gaps the typed model omits — including `date_range`, which may be left out to keep the parent's window).\n4. Call query_amplitude_data — compile and validation errors are actionable; fix the named field and retry.\n5. To show the result visually, call 'render_amplitude_chart' with the returned chartEditId.\n\n# GENERAL GUIDELINES\n- Read saved metric definitions with get_metrics or use_amplitude_metrics action=\"get_metrics\" before building a chart from them.\n- Don't guess event or property names — discover them first, and use the exact name and scope returned.\n- ALWAYS set a descriptive \"name\" (becomes the chart title) and an explicit date_range (except when modifying with chartId and the parent's window should be kept).\n- Relative date_range windows support an Offset suffix for day-over-day / historical comparisons: \"Last 0 Days Offset 1\" (yesterday), \"Last 0 Days Offset 7\" (same day last week), \"Last 7 Days Offset 7\" (the prior week).\n- On errors, follow the hint in the message; the compiler names the offending field.\n\nChart types supported by raw `definition`: eventsSegmentation, funnels, metricExplorer, retention, revenueLtv, sessions, stickiness\n\n\n\nRESPONSE FORMAT:\nReturns {isCsvResponse: bool, csvResponse or jsonResponse, definition}. Only ONE response type present.\nWhen jsonResponse is present, \"seriesNames\" (string[]) gives the human-readable name of each timeSeries entry in order — use it instead of the numeric seriesLabels for ungrouped segments.\n\"seriesKeys\" (string[], same order) gives each series' customSerieLabels key; use it verbatim to rename a legend.\nCheck the isCsvResponse flag to determine which response format to parse\n\nCRITICAL — NON-ADDITIVE METRICS (uniques, pct_dau):\n- These metrics cannot be summed across intervals. The chart UI plots per-interval values, not a running total.\n- Additive metrics (totals, sums) CAN be summed across intervals.\n\nHow to read the JSON response, by metric type:\n\n1. COUNT metrics (\"uniques\"):\n   - Use \"overallSeries\" — it is the TRUE deduped unique count across the full date range.\n   - Do NOT sum \"timeSeries\" values — that overstates the count due to user overlap across intervals.\n\n2. RATIO metrics (\"pct_dau\" only):\n   - Use \"timeSeriesAverage\" (mean of per-interval values) — this matches what the chart UI displays.\n     For \"current\" reporting, also consider the most recent N intervals from \"timeSeries\".\n   - Do NOT use \"overallSeries\" for pct_dau over multi-interval ranges. For pct_dau, \"overallSeries\"\n     is a long-range aggregate (deduped numerator over the full range / deduped denominator over the\n     full range). Over many intervals the denominator dedupes a much larger pool than the numerator,\n     which compresses the ratio — typically reporting roughly half of the per-interval values the chart\n     shows. This is mathematically valid as a long-range aggregate but is NOT what users see in the chart.\n   - Do NOT sum \"timeSeries\" values — ratios cannot be summed.\n\nCSV Response Structure (when isCsvResponse is true):\n- Header rows: The top rows contain metadata including chart name, description, events, formulas, and other chart configuration details\n- Data header row: A single row containing column labels for the data points below (typically includes dates or time periods)\n- Data rows: Each row contains:\n  * Label columns: First few columns contain row labels identifying the data series\n  * Value columns: Numerical data organized under the corresponding date/time columns from the data header row\n- Parse by: Skip metadata rows, identify the data header row, then extract labels from first columns and values from remaining columns\n- Cells in the CSV response are delimited by commas and may be prepended with a \t character\nExample below measures uniques of custom event \"Valuable Tweaking\" over 3 days (2025-08-23, 2025-08-24, 2025-08-25) for all users.\nThe data points are 614, 1769, and 4132 for the 3 days respectively.\nIMPORTANT: The overall unique users is 5642 (NOT 614+1769+4132=6515), because users overlap across days.\ndata:\n\"\tExample chart name\"\n\"\tFormula\",\"\tUNIQUES(A)\"\n\"\tA:\",\"\t[Custom] 'Valuable Tweaking'\"\n\n\"\tSegment\",\"\t2025-08-23\",\"\t2025-08-24\",\"\t2025-08-25\"\n\"\tAll Non-Amplitude Users\",\"614\",\"1769\",\"4132\"\ndefinition: {\n    \"app\": \"APP_ID\",\n    \"params\": {\n        \"countGroup\": \"User\",\n        \"end\": 1756166399,\n        \"events\": [\n            {\n                \"event_type\": \"ce:'Valuable Tweaking'\",\n                \"filters\": [],\n                \"group_by\": []\n            }\n        ],\n        \"groupBy\": [],\n        \"interval\": 1,\n        \"metric\": \"uniques\",\n        \"segments\": [],\n        \"start\": 1755907200,\n    },\n    \"type\": \"eventsSegmentation\",\n}\n\nJSON Response Structure (when isCsvResponse is false):\n- Parse using the following structure:\n  - timeSeries: Array of arrays, each containing data points for a given time period with a \"value\" property and, when present, \"setId\"/\"setIds\" identifying the users at that point. For microscope drill-down, call create_cohort_from_set_ids with those set IDs (or use_amplitude_cohorts with action create_from_set_ids when consolidated) — not create_cohort (behavioral definition) or get_users (requires event.event_type)\n  - overallSeries: Array of arrays, each containing the overall data point across the entire range under the \"value\" property.\n    IMPORTANT — interpretation depends on the metric:\n      * For \"uniques\" (count): this is the TRUE deduped unique count over the full date range. Use this.\n      * For \"pct_dau\" (ratio): this is a long-range aggregate ratio (deduped numerator\n        over range / deduped denominator over range). It does NOT match the per-interval values the\n        chart UI plots and is typically much smaller. Do NOT report it as the headline number — use\n        \"timeSeriesAverage\" instead.\n  - timeSeriesAverage: Present only for \"pct_dau\". Array of arrays, one per series, each\n    containing a single {value} that is the mean of \"timeSeries\" values for that series. Use this as the\n    headline ratio when the chart spans multiple intervals — it matches what users see in the chart UI.\n  - seriesMetadata: Array of objects containing metadata for each series\n  - xValuesForTimeSeries: Array of strings representing the x-axis values (dates) for the time series\n- Use the dataset definition to be able to parse referenced events, properties, and segments.\n\nExample below is a JSON response is for the same query as the CSV example above.\n{\n  \"timeSeries\": [[{\"value\": 614}, {\"value\": 1769}, {\"value\": 4132}]],\n  \"overallSeries\": [[{\"value\": 5642}]],\n  \"seriesMetadata\": [{\"segmentIndex\": 0, \"formulaIndex\": 0, \"formula\": \"UNIQUES(A)\"}],\n  \"xValuesForTimeSeries\": [\"2025-08-23T00:00:00\", \"2025-08-24T00:00:00\", \"2025-08-25T00:00:00\"]\n}\nNote: 614+1769+4132=6515, but overallSeries shows 5642. This is because unique users overlap across days. For \"uniques\", always use overallSeries for the total.\n\nExample below is a \"pct_dau\" query over 3 weeks (a ratio metric):\n{\n  \"timeSeries\": [[{\"value\": 0.1402}, {\"value\": 0.1421}, {\"value\": 0.1444}]],\n  \"overallSeries\": [[{\"value\": 0.0712}]],\n  \"timeSeriesAverage\": [[{\"value\": 0.1422}]],\n  \"seriesMetadata\": [{\"segmentIndex\": 0, \"formulaIndex\"\
    : 0, \"formula\": \"PCT_DAU(A)\"}],\n  \"xValuesForTimeSeries\": [\"2026-04-06T00:00:00\", \"2026-04-13T00:00:00\", \"2026-04-20T00:00:00\"]\n}\nNote: the chart UI shows ~14% per week. timeSeriesAverage (14.22%) matches that. overallSeries (7.12%) is the\ndeduped 3-week aggregate ratio and would HALVE the reported value if used as the headline — never report it\nas \"the number\" for \"pct_dau\". Always use timeSeriesAverage for \"pct_dau\".\n\nEvent Segmentation with Insights (anomaly detection / confidence intervals):\n- When params.insights.isOn is true, Event Segmentation charts queried via query_charts or query_dataset\n  return jsonResponse with joinable band data.\n- To also receive chartConfig (Highcharts), explicitly pass includeAdditionalInfo: [\"chartConfig\"].\n- jsonResponse.seriesIntervals maps stringified seriesMetadata keys to { low, high, yhat } arrays\n  (parallel to xValuesForTimeSeries). Use seriesMetadata + xValuesForTimeSeries to join bands to series.\n- Metric Explorer charts with Insights return seriesIntervals inside each data[] entry instead."
  params:
    projectId: Project ID to query data from
    definition: "FALLBACK — prefer the typed `chart` parameter. Raw chart definition for types/params the typed model does not cover (e.g. composition, revenueLtv). Validated inline — on failure the response includes chartTypeSchema (params, enums, example, coercion rules) so you can fix and retry.\n\nUse canonical chart types only:\n- \"eventsSegmentation\"\n- \"funnels\"\n- \"retention\"\n- \"sessions\"\n- \"revenueLtv\"\n- \"dataTableV2\"\n\nDo not use aliases like:\n- \"segmentation\"\n- \"event_segmentation\"\n- \"events\"\n- \"funnel\"\n\nTIME RANGE — three accepted shapes, mutually exclusive with each other:\n- \"range\" preset (e.g. \"Last 30 Days\", \"Last 12 Weeks\", \"This Month\", \"Yesterday\")\n- \"start\" + \"end\" for a bounded custom range\n- \"start\" alone for an open-ended \"since <date>\" range (renders as Amplitude's \"Since\" view)\n- Timestamps may be Unix seconds, ISO 8601 strings, or relative strings like \"now-7d\" / \"now\"\n- Do not combine \"range\" with \"start\"/\"end\". Do not provide \"end\" without \"start\"\n- Do not use invalid placeholders like \"Custom\", \"Daily\", or \"All Time\"\n\nVISUALIZATION TYPE (top-level \"vis\", optional):\n- Set \"vis\" when the user explicitly asks for a specific chart shape (e.g. \"as a bar chart\", \"show as a pie\", \"stacked bar by country\"). Otherwise omit and the system picks a sensible default.\n- Valid values for eventsSegmentation: \"line\" (default trend), \"area\", \"bar\" (vertical), \"column\" (horizontal), \"stackedbar\", \"pie\", \"kpi\" (single number).\n- Valid values for funnels: \"line\", \"bar\".\n- Valid values for sessions: \"line\", \"bar\", \"totalSessions\", \"average\".\n- \"vis\" goes at the TOP LEVEL of the definition, NOT inside \"params\".\n\nLEGEND NAMES (eventsSegmentation, optional):\n- Segment legend: set \"label\" on the segment, e.g. {\"label\":\"Mobile\",\"conditions\":[...]}. \"name\" is not shown as the legend.\n- Any other series (e.g. formulas): set top-level \"customSerieLabels\" to {\"<seriesKey>\":\"<legend name>\"}. Copy each key verbatim from \"seriesKeys\" in a previous response for the same chart; a key that does not match exactly is ignored.\n\nCOMMON GUARDRAILS:\n- \"dataTableV2\" requires \"params.table\"\n- \"sessions\" requires \"params.sessions\"\n- \"customerJourney\" has a maximum of 5 steps when using PATH_TREE or SINGLE_PATH visualization\n- event lists should use canonical event objects with \"event_type\", \"filters\", and \"group_by\"\n- include a descriptive top-level \"name\" whenever possible\n\nMINIMAL EXAMPLES:\n- eventsSegmentation (default line):\n  {\"type\":\"eventsSegmentation\",\"app\":\"123\",\"name\":\"Active Users Last 30 Days\",\"params\":{\"range\":\"Last 30 Days\",\"events\":[{\"event_type\":\"_active\",\"filters\":[],\"group_by\":[]}],\"metric\":\"uniques\",\"countGroup\":\"User\",\"groupBy\":[],\"interval\":1,\"segments\":[{\"conditions\":[]}]}}\n- eventsSegmentation as bar chart (user said \"show as a bar chart\"):\n  {\"type\":\"eventsSegmentation\",\"app\":\"123\",\"name\":\"Purchases by Country\",\"vis\":\"bar\",\"params\":{\"range\":\"Last 30 Days\",\"events\":[{\"event_type\":\"Purchase\",\"filters\":[],\"group_by\":[{\"type\":\"event\",\"value\":\"country\"}]}],\"metric\":\"totals\",\"countGroup\":\"User\",\"groupBy\":[],\"interval\":1,\"segments\":[{\"conditions\":[]}]}}\n- funnels:\n  {\"type\":\"funnels\",\"app\":\"123\",\"name\":\"Signup Funnel\",\"params\":{\"range\":\"Last 30 Days\",\"events\":[{\"event_type\":\"View Signup\",\"filters\":[],\"group_by\":[]},{\"event_type\":\"Complete Signup\",\"filters\":[],\"group_by\":[]}],\"countGroup\":\"User\",\"segments\":[{\"conditions\":[]}]}}\n- revenueLtv (cumulative revenue from users NEW in the selected date range — empty results usually mean no new users were acquired in the period, not broken revenue instrumentation):\n  {\"type\":\"revenueLtv\",\"app\":\"123\",\"name\":\"Revenue LTV - Total Revenue\",\"vis\":\"line\",\"params\":{\"range\":\"Last 90 Days\",\"metric\":\"2\",\"event\":{\"event_type\":\"_any_revenue_event\",\"filters\":[],\"group_by\":[]},\"revenueProperty\":\"$revenue\",\"groupBy\":[],\"countGroup\":\"User\",\"interval\":1,\"segments\":[{\"conditions\":[]}]}}"
    groupByLimit: Maximum number of group by values to return (1-1000, defaults to 10)
    excludeIncompleteDatapoints: Optional flag to exclude incomplete data points from results. When true, the current time interval will be excluded from the results to avoid incomplete data points. Defaults to false.
    chartId: 'Optional parent chart ID for modify/fork. When provided, the parent chart''s params (segments, filters, countGroup, groupBy, etc.) are used as defaults — only params you explicitly provide will override. Typical modify flow: get_amplitude_charts include=''typed'' → edit `chart` → query_amplitude_data({ chart, chartId }).'
    timeSeriesLimit: Maximum number of group-by values that include per-interval time-series rows in the CSV response. All group-by values always include their aggregate "Total" row. Groups beyond this limit only return their Total row, which dramatically reduces response size for charts with many group-by values over long date ranges. Set to 0 for totals-only. Defaults to 3.
    includeAdditionalInfo: Additional render-only information to include. Omit for compact analytics data.
    chart: PREFERRED. Typed, UI-shaped chart parameters, discriminated on `kind` (segmentation | funnel | retention | sessions | data_table). Compiled server-side into a validated definition — no raw definition JSON needed. Provide exactly one of `chart` or `definition`.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: render_amplitude_chart
  description: "Render an interactive Amplitude chart UI for a saved chart or a chart edit by ID. This is the way to SHOW a chart to the user — it spins up the chart widget; the widget fetches the chart's data itself and draws it.\n\n## SUPPORTED CHART TYPES\neventsSegmentation, funnels, retention, metricExplorer.\n- dataTableV2 CANNOT be rendered in the chart widget. Present query results directly instead.\n\n## WHEN TO USE\n- The user wants to SEE a chart and you already have a `chartId` (saved chart) or `chartEditId` (ad-hoc chart edit).\n- Right after `query_dataset` returns a `chartEditId` for a non-empty result — pass that `chartEditId` here to render it.\n- Right after `search` / `get_from_url` resolves a saved `chartId` the user asked to see.\n\n## WHEN NOT TO USE — DO NOT CALL WITHOUT AN ID\n- You do NOT have a `chartId` or `chartEditId` yet. Resolve one FIRST:\n  - `query_dataset` (returns a `chartEditId` for an ad-hoc definition)\n  - `search` with `entityTypes: [\"CHART\"]` (finds a saved `chartId`)\n  - `get_from_url` (parses an id out of an Amplitude chart URL)\n- The query you ran returned empty / all-zero data — tell the user, do NOT render an empty chart.\n\n## INSTRUCTIONS\n- Provide exactly one of `chartId` (saved chart) or `chartEditId` (chart edit). If you have both, prefer `chartEditId`.\n- When rendering a chart edit from `query_dataset`, pass its returned `title` so the widget displays the requested chart title.\n- This tool does NOT return chart data to you — it only renders the widget. To reason about the numbers, call `get_amplitude_charts` (include='data') / `query_dataset` for the data."
  params:
    chartId: Saved chart ID to render (e.g. from search or get_from_url).
    chartEditId: Chart edit ID to render. Returned by query_dataset, or parsed from links ending in /chart/new/<edit_id> or /chart/<chart_id>/edit/<edit_id>.
    title: Chart title to display. Pass the title returned by query_dataset when rendering a chart edit.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: use_amplitude_chart_monitors
  description: 'Read and manage chart alert monitors. One tool with eight actions selected by `action` (default `get_alerts`).


    ACTIONS:

    - `get_alerts` (default) → recent alert anomalies for a chart (`chartId`) or project (`projectId`).

    - `list` → custom chart monitors you created or are subscribed to (email / Slack / Teams). Includes ones others created if you are a recipient. Chart name + short summary + alertsLast30Days. Optional `projectId`. Does not need `chartId`.

    - `get_config` → a chart''s monitor configuration + subscribers when `chartId` is set. Omit `chartId` to list (same as `list`). Charts with no monitor return hasMonitor=false — then use `create`.

    - `create` → add a monitor on a chart that does not have one. Requires `chartId`. Defaults to smart anomaly detection (99% CI, above or below) and emails the current user.

    - `history` → audit trail of monitor config changes (who changed what, when). Requires `monitorId` or `chartId`. Not alert firings — use `get_alerts` for those.

    - `subscribe` / `unsubscribe` → add/remove an alert subscription (email for the current user, or a Slack/Teams channel). Requires `monitorId` and `deliveryMethod`.

    - `update` → enable or disable a monitor. Requires `monitorId` and `enabled`.


    INSTRUCTIONS:

    - If the user asks what chart alerts or monitors they have, call `list` (or `get_config` without chartId). That returns monitors they created or are subscribed to — not every monitor in the org.

    - If `get_config` returns hasMonitor=false, call `create` with that `chartId` instead of telling the user to use the Amplitude UI.

    - Resolve a `monitorId` first with `get_config` (from a `chartId`) before `subscribe` / `unsubscribe` / `update`. For `history`, you may pass `chartId` directly instead of `monitorId`.

    - For `get_alerts` and `list`, `projectId` is optional when you have access to exactly one project; otherwise provide it to scope. Pass `chartId` to scope `get_alerts` to one chart.

    - Email subscriptions only manage the current user; for Slack/Teams pass `deliveryChannel` (and `deliveryWorkspaceId` when needed).


    DO NOT USE FOR:

    - Reading chart data → use ''get_amplitude_charts'' (include=''data'') or ''query_dataset''.'
  params:
    action: 'What to do: ''get_alerts'' (default), ''list'', ''get_config'', ''create'', ''history'', ''subscribe'', ''unsubscribe'', or ''update''.'
    chartId: Chart ID. Scopes get_alerts to one chart; required for create; for get_config, omit to list monitors. Optional for history (resolves monitorId).
    projectId: Project ID. Scopes get_alerts and list. Optional with single-project access.
    limit: 'get_alerts: max alerts (default 20). list: max monitors per group (default 50). 1-100.'
    includeUnseen: 'get_alerts: return only alerts not yet marked seen.'
    monitorId: 'history / subscribe / unsubscribe / update: the monitor to act on. For history, chartId is an alternative to monitorId.'
    name: 'create: optional monitor name. Defaults to the chart name.'
    frequency: 'create: ''daily'' (default) or ''hourly''.'
    conditions: 'create: alert conditions. Defaults to smart anomaly detection at 99% CI, above or below.'
    emailRecipients: 'create: emails to notify. Defaults to the current user. Pass [] for none.'
    deliveryMethod: 'subscribe / unsubscribe: delivery method (email, slack, or teams).'
    deliveryChannel: 'subscribe / unsubscribe: Slack channel ID or Teams conversation ID (omit for email).'
    deliveryWorkspaceId: 'subscribe / unsubscribe: optional workspace/tenant context for Slack or Teams.'
    enabled: 'update: true enables the monitor, false disables it.'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: save_chart_edits
  description: "Promote chart edits to saved charts — Save as (new chartId) or Save in place (same chartId).\n\nWHEN TO USE:\n- You have a chartEditId from query_amplitude_data and need a permanent chartId\n- The user asked to update an existing chart and keep the same chartId / links\n\nMODES (per item in charts[]):\n- **Save as** (default): omit chartId → creates a new unpublished chart in personal space\n- **Save in place**: chartId + expectedLastModified → overwrites that chart (same chartId; updates all dashboards/notebooks referencing it)\n  → ONLY when the user explicitly asked to update the existing chart — never infer from context\n  → Requires a two-step confirm flow (probe, then confirm) — see workflow below\n\nWORKFLOW — save as new:\n1. query_amplitude_data → chartEditId\n2. save_chart_edits({ charts: [{ editId, name }] })\n3. Use returned chartId in dashboards/notebooks\n\nWORKFLOW — update existing chart (two-step — always confirm with the user):\n1. get_amplitude_charts({ chartIds, include: \"definition\" }) → lastModified\n2. query_amplitude_data({ chart, chartId }) → chartEditId\n3. **Probe** (no confirm flags): save_chart_edits({ charts: [{ editId, name, chartId, expectedLastModified }] })\n   → returns overwriteImpact (chart name, URL, dashboards, published status)\n   → present this to the user and ask whether to update in place or save as new\n4. **Confirm** (only if user explicitly wants in-place): re-call with confirmOverwrite: true\n   → if requiresSharedChartConfirmation, also add confirmSharedImpact: true after user reviews sharedChartImpact\n\nIMPORTANT:\n- Never set confirmOverwrite on the first in-place call — the probe response exists so you can double-check with the user\n- Default to save-as-new unless the user clearly wants the same chartId updated\n- Having chartId from a URL or prior query does NOT mean in-place save is allowed\n- Save-as-new charts default to unpublished in your personal space until a human publishes\n- To collaborate on save-as-new, pass destination {\"kind\":\"space\",\"spaceId\":\"...\"} using a space id from the user or a shared-space URL. You must have permission to add to that space. To create a space or move already-saved charts, use manage_amp_entities\n- The response echoes where charts landed in savedTo (kind, spaceName, published, notified). Report that to the user rather than assuming the requested destination was used\n- In-place save requires edit access, matching edit provenance, and a fresh expectedLastModified (409 conflict if stale)\n- Prefer save in place when the user explicitly asks to update a chart others reference; use save as for new analyses"
  params:
    charts: 'Chart edits to promote. Omit chartId on each item to save as new. For in-place update: probe with chartId + expectedLastModified (no confirm flags), show impact to the user, then re-call with confirmOverwrite.'
    destination: Where to save. Omit for the personal space (previous behavior).
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: rename_chart
  description: 'Rename a chart that has already been saved


    WHEN TO USE:

    - A chart was saved (e.g. via save_chart_edits) and the user wants a different name on that same chart


    IMPORTANT:

    - Updates the existing chart in place and records a version-history entry; it does not create a copy

    - Requires edit access to the chart and write access to its project

    - To save a new chart from an ad-hoc edit, use save_chart_edits instead'
  params:
    chartId: ID of the saved chart to rename (e.g. from /chart/abc123)
    name: New name for the chart
    description: New description. Omit to leave the existing one untouched
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: use_amplitude_cohorts
  description: 'Work with Amplitude cohorts end to end. One tool with twelve actions selected by `action` (default `list`).


    DISCOVER & READ:

    - `list` (default) → browse/search the project''s cohorts by name (`projectId` required, optional `query`). Use this FIRST when you don''t have cohort ids — never guess or use placeholder ids.

    - `get` → full cohort definitions/metadata for known ids (`cohortIds`, max 50).

    - `find` → ad-hoc audience: individual users who performed an event (`projectId`; optional `event`, defaults to any active user; optional `timeRange`, `limit`). Returns user records + session replays, without creating a cohort.

    - `membership` → is a user in these cohorts? (`cohortIds` max 5 + one of `amplitudeId` / `userId` / `email`).


    CREATE:

    - `create` → save a dynamic cohort (`projectId`, `name`, `definition`). Top-level `cohortType` defaults to "redshift", including for funnels; inner funnel conditions use `type: "funnel"` and `converted: true/false`.

    - `create_from_set_ids` → microscope drill-down from chart point set IDs (`projectId`, `setIds`, `microscopeCohortType`, optional `chartId` / `chartEditId`). Creates a cohort and returns a sample of users. Set IDs come from a chart widget "View users" action — never guess them.


    SYNC & EXPORT:

    - `get_destinations` → configured sync destinations for a project (`projectId`). Call BEFORE `sync`.

    - `get_syncs` → sync jobs + status (`projectId` for the whole project, or `cohortIds`).

    - `get_history` → execution logs for one cohort''s syncs (`cohortId`, `projectId`, `target`).

    - `sync` → trigger a one-time sync now (`cohortId` + `targetId` from get_destinations; `partner` too for classic integrations). Two-step confirm: first call returns a preview, re-call with `confirmed: true`. Cohorts under 10k sync synchronously; 10k+ return `submitted` — tell the user it was queued, then poll `get_history`.

    - `export_submit` → start a CSV export of members (`cohortId`), returns `exportRequestId`.

    - `export_download` → poll export status / fetch CSV url (`cohortId` + `exportRequestId`).


    INSTRUCTIONS:

    - Resolve cohort ids with `list` before `get`/`membership`/`sync`/`export_*`.

    - For `create`: use andClauses, optionally mirrored by one identical outer orClauses group. Do not use the chart userdata_cohort filter inside the definition. Omitted or null group_by_filters are saved as [].

    - Creation remains pending verification: use `get` on the returned ID to confirm dynamic type, matching definition, isComputing false, and numeric size (0 is valid; null is unverified) before analysis.

    - Report failed verification/comparison as incomplete; preserve membership criteria and read the existing ID on retry instead of recreating it.

    - For `sync`: always call `get_destinations` first — a targetId is only unique within a partner.

    - `membership` accepts `userId`/`email` directly (resolved to an amplitudeId automatically, cached).


    DO NOT USE FOR:

    - Aggregate counts/trends over a cohort → use ''query_dataset'' with a cohort segment filter.

    - One user''s profile or event timeline → use ''get_amp_user_data''.'
  params:
    action: 'What to do: ''list'' (default), ''get'', ''find'', ''membership'', ''create'', ''create_from_set_ids'', ''get_destinations'', ''get_syncs'', ''get_history'', ''sync'', ''export_submit'', or ''export_download''.'
    projectId: Project/app ID. Required for list / find / create / get_destinations; required for get_syncs when cohortIds is omitted; required for get_history.
    cohortIds: Cohort IDs for get (max 50), membership (max 5), or to scope get_syncs (max 10). Resolve real ids via list first — never pass placeholders.
    cohortId: Single cohort ID for sync / get_history / export_submit / export_download.
    query: 'list: text to match against cohort names (omit to browse by recency).'
    limit: 'list: max cohorts to return (default 20). find: max users to return (default 10).'
    event: 'find: event the users performed (defaults to "_active" — any active user). Call get_events first to confirm exact event names.'
    timeRange: 'find: time window (defaults to Last 30 Days).'
    amplitudeId: 'membership: Amplitude ID of the user to check.'
    userId: 'membership: user id to check (resolved to an amplitudeId automatically).'
    email: 'membership: email to check (resolved to an amplitudeId automatically).'
    name: 'create: name of the new cohort.'
    definition: 'create: cohort definition (andClauses of condition sets, countGroup, version).'
    cohortType: 'create: top-level saved cohort type; defaults to "redshift", including for funnel cohorts. Put type "funnel" and converted true/false inside definition; never use top-level "funnels".'
    cohortOwner: 'create: owner of the cohort (defaults to the current user).'
    target: 'get_history: sync destination to read logs for (e.g. "braze", "s3", "salesforce").'
    targetId: 'sync: destination target from get_destinations (with partner for classic integrations; alone for Connector Manager destinations). get_history: optional instance filter.'
    partner: 'sync: partner/integration type of a classic destination (e.g. "braze"), from get_destinations. Omit for Connector Manager destinations.'
    confirmed: 'sync: set true only after the user reviewed the confirmation preview returned by the first call.'
    exportRequestId: 'export_download: the id returned by export_submit.'
    includeProperties: 'export_submit: include user properties in the CSV (may slow the export).'
    propKeys: 'export_submit: specific user properties to include.'
    pageNumber: 'get_history: page number (default 1).'
    pageSize: 'get_history: results per page (default 20, max 100).'
    errorOnly: 'get_history: only return failed sync executions.'
    setIds: 'create_from_set_ids: set IDs from a chart microscope point (required for that action).'
    microscopeCohortType: 'create_from_set_ids: microscope cohort type for the chart (events_segmentation, funnels, retention, overview_composition).'
    chartId: 'create_from_set_ids: saved chart ID, when available (helps Dash resolve the query).'
    chartEditId: 'create_from_set_ids: chart edit ID, when available.'
    datasetDefinition: 'create_from_set_ids: dataset definition when neither chartId nor chartEditId is available.'
    metadata: 'create_from_set_ids: optional microscope metadata passed through to Dash.'
    userLimit: 'create_from_set_ids: number of users to return after cohort creation (max 50, default 20).'
    countGroup: 'create_from_set_ids: count group for the cohort (defaults to User).'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_amplitude_context
  description: 'Unified entry point for Amplitude context. Routes to one of two underlying tools based on whether a `projectId` is provided.


    ROUTES:

    - No `projectId` → ''get_context'' route: returns the current user, organization (including org-level AI context), and the LIST of accessible projects as `{ appId, appName }`. Use this to discover which projects exist and their ids.

    - `projectId` provided → ''get_project_context'' route: returns that single project''s details — description, timezone, currency, session definition, source projects, project-level AI context, and data view definition when applicable.


    WHEN TO USE:

    - Session start, "what projects do I have access to?", "show me my org details", "what is my role?" → call with no arguments.

    - "what timezone / currency / session settings does project X use?", "describe project X" → pass `projectId`.


    CONTEXT DOCUMENTS (uploaded files):

    - `org.aiContext` / project `aiContext` are short text fields only. Customers also upload context files (CSV data dictionaries, PDFs, process docs) in Settings → AI Controls; those are indexed for search and never returned in full — only titles (opt-in) or search snippets.

    - `listContextDocuments: true` adds `contextDocuments` — document titles and ids only, no file contents. Use it when `aiContext` references an uploaded file by name (e.g. "always check <file> before answering").

    - `searchContextDocuments` runs semantic search over the uploaded documents'' contents and adds `contextDocumentSearch` with matching text snippets. Use specific terms from the user''s question (event names, property names, column names).

    - Scope for both: without `projectId`, org-level documents only; with `projectId`, org-level plus that project''s documents.


    EXAMPLES:

    - Session start: {}

    - Project settings: {"projectId": 12345}

    - aiContext says "check the event dictionary file" → {"projectId": 12345, "listContextDocuments": true}

    - Look up a term from uploaded docs: {"projectId": 12345, "searchContextDocuments": "envelope_event_type_id"}


    NOTES:

    - `projectId` is optional on purpose. Omit it to get the project list first, then call again with a real id from that list — do NOT guess project ids.

    - The two layers are meant to be loaded together: call once without `projectId` at session start for org context, then with a `projectId` to drill into a project. On conflict, project-level context overrides org-level.

    - Omit `listContextDocuments` and `searchContextDocuments` at session start — they add latency and are only useful once you know what to look for.

    - A data view is a governed, filtered subset of a source project. Use its projectId for analysis to preserve its filters. The returned dataView.sourceAppId describes lineage, not a replacement query target.


    DO NOT USE FOR:

    - Running analytics queries → use ''query_dataset''.

    - Finding charts/dashboards/cohorts → use ''search''.'
  params:
    projectId: The project/app id to fetch detailed context for. Omit to get org context plus the list of projects you can access (the 'get_context' route); provide it to fetch one project's settings (the 'get_project_context' route).
    listContextDocuments: 'When true, adds contextDocuments: titles and ids of the customer''s uploaded context files (no file contents). Without projectId lists org-level documents; with projectId also includes that project''s documents. Omit at session start.'
    searchContextDocuments: Semantic search query over the contents of uploaded context documents. Adds contextDocumentSearch with matching text snippets. Without projectId searches org-level documents; with projectId also searches that project's documents.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: manage_amp_context
  description: 'Manage AI context. Actions: `set_org_context` and `set_project_context` replace customer AI context. Use `get_amplitude_context` to read your current org, projects, and context.'
  params:
    action: 'Discriminator: determines which set of parameters applies (set_org_context | set_project_context)'
    context: New org AI context.
    projectId: Project ID.
- name: use_amp_skill
  description: 'Load an Amplitude skill — a workflow playbook describing the optimal sequence of Amplitude tools for a task.


    Consult a skill BEFORE improvising a multi-step Amplitude workflow (analysis, chart or dashboard creation, experiment review, replay debugging, instrumentation).


    Actions:

    - list: every available skill with its description. Use to browse what exists, or to find the name of the skill you want.

    - get: exact skill name or skill:// URI → that skill''s full instructions.'
  params:
    action: 'What to do: ''list'' everything, or ''get'' one skill by name.'
    skillName: Exact skill name (e.g. 'analyze-chart') or full skill:// URI. Required when action is 'get'.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: use_amp_dashboards
  description: 'Read and manage Amplitude dashboards. One outcome-based tool selected by `action`.


    ACTIONS:

    - `get`: read up to three dashboards by `dashboardIds` before editing. Resolve IDs with `search_amp_entities` (entityTypes: DASHBOARD). Pass layoutMode from page context only for the matching dashboard ID, reading that dashboard separately; otherwise omit it to use the rollout flag. A dashboard without initialized block layout returns grid even when block was requested. Copy the returned layoutMode into edits. On timestamp conflict, read again with the original preference. Saved blockLayout is returned whenever present alongside grid rows; its presence does not indicate which layout the UI displays. Block IDs are opaque; source.kind/source.id reference content. Canonical non-chart content is returned in items when blockLayout is present. Never convert block positions into rows; follow the edit tool’s supported operations.

    - `create`: create a dashboard. Row items accept saved chart IDs and temporary chart edit IDs interchangeably in `chartId`; edit IDs are saved as permanent charts automatically before the dashboard is created. Optionally pass `chartEdits` to control the saved name and description of each edit. If the events the user asked about are not instrumented, explain the gap and confirm before building a proxy dashboard from substitute events. Never pass placeholder or invented chart IDs.

    - `edit`: update dashboard metadata or layout. Pass layoutMode from get with content/placement edits. For block mode, use insert_item (content plus placement), update_item (content), remove_item (content and block), or update_layout (placement patches). insert_item pushes overlapping blocks down and remove_item closes the gap it leaves; update_layout applies placements exactly. For grid mode use row operations; they keep block-only content and block references valid. Never infer mode from blockLayout presence. If a block edit reports no saved block layout, read again and use the returned mode. insert_item requires saved chart IDs; save draft charts first. Read the dashboard first and pass its `lastModified` as `expectedLastModified`. Rows in `set_rows` / `update_row` / `insert_row` accept saved chart IDs and temporary chart edit IDs interchangeably, same as `create` — use this to add a freshly queried chart to an existing dashboard. Optionally pass `chartEdits` to control the saved name and description of edit IDs referenced by the layout edit. Pass `dryRun: true` to preview without saving — no chart edits are promoted and no dashboard change is applied.

    - `replace_properties`: discover or replace chart properties across a dashboard.

    - `subscribe` / `edit_subscription`: create or edit a recurring email, Slack, or Teams dashboard delivery.


    SUBSCRIPTIONS:

    - Use top-level `notificationType`, `sendWeek`, `sendDay`, and `sendHourUtc`; do not send nested JSON strings.

    - For email, `email` defaults to the current user; never ask the user for their own email address. For Slack or Teams, provide `recipientType` and `recipientId`; Teams also needs `recipientTeamId`.

    - If the user has not given a delivery channel or cadence, ask instead of assuming defaults.


    DO NOT USE FOR:

    - Finding dashboards by name: use `search`.

    - Creating a shared space, changing space members, or moving an existing dashboard into a space: use `manage_amp_entities`.

    - Creating or querying chart data: use the chart tools.'
  params:
    action: 'Discriminator: determines which set of parameters applies (get | create | edit | replace_properties | subscribe | edit_subscription)'
    layoutMode: Arrangement to target for these dashboards. Use matching dashboard page context or an explicit user choice; otherwise omit to evaluate the rollout flag.
    dashboardIds: 'Dashboard IDs to read (array of 1 to 3 strings, e.g. [''abc1234'']). Resolve with search_amp_entities (entityTypes: [''DASHBOARD'']).'
    name: Dashboard name.
    description: Dashboard description.
    rows: Dashboard layout rows. Item chartId accepts a saved chart ID or a temporary chart edit ID; edit IDs are saved automatically.
    chartEdits: Optional names and descriptions for chart edits referenced in rows. Without an entry, an edit referenced in rows is saved using the name from its definition.
    chartMetas: Optional display configuration keyed by saved chart ID.
    destination: Where to save. Omit for the personal space (previous behavior).
    dashboardId: 'Dashboard ID. Resolve dashboard IDs with search_amp_entities (entityTypes: [''DASHBOARD'']).'
    expectedLastModified: lastModified returned by get. Read the dashboard first.
    metadata: Dashboard metadata updates.
    edit: One layout operation from the dashboard returned by get.
    dryRun: Preview the edit without saving. No chart edits are promoted and no dashboard changes are applied.
    replacements: Array of replacement definitions from discovery mode.
    confirmSharedChartImpact: Confirm updates to charts used elsewhere.
    notificationType: Delivery channel.
    email: Email recipient. Defaults to the current user's email when omitted.
    attachCsv: Attach CSV to email deliveries.
    recipientType: Slack or Teams recipient type.
    recipientId: Slack or Teams recipient ID.
    recipientTeamId: Teams team ID.
    sendWeek: Delivery cadence week.
    sendDay: Delivery weekday.
    sendHourUtc: UTC delivery hour.
    subscriptionId: Subscription ID.
- name: use_amp_comments
  description: 'Read and add plain-text comments on Amplitude charts, dashboards, and notebooks. One outcome-based tool selected by `action`.


    ACTIONS:

    - `get`: read comments for `source` + `id`. Dashboards/notebooks also roll up comments from charts inside them.

    - `add`: leave a plain-text comment (`content`). Prefixed with the AI client name automatically.


    INSTRUCTIONS:

    - `source`, `id`, and `projectId` are required on every call. Resolve the object with `search_amp_entities`, then pass its id as `id` with source CHART, DASHBOARD, or NOTEBOOK. `projectId` comes from `get_amplitude_context`.

    - Call get before add to avoid duplicates.

    - Comments are plain text only (no mentions/reactions).


    DO NOT USE FOR:

    - Opportunity / Wave comments: use opportunity tools.

    - Sharing access: use `share_amp_entities`.'
  params:
    action: 'Discriminator: determines which set of parameters applies (get | add)'
    source: 'Object type: CHART, DASHBOARD, NOTEBOOK.'
    id: Chart, dashboard, or notebook ID from search_amp_entities.
    projectId: Amplitude project ID from get_amplitude_context.
    content: Plain-text comment body.
- name: use_amp_flags
  description: 'Unified entry point for feature flags and deployments. Replaces get_flags, create_flags, update_flag, and get_deployments.


    ACTIONS:

    - `get` (default): fetch flags by `flagIds` (numeric IDs or flag keys).

    - `create`: create one or more flags (`flags` array — same shape as create_flags). Supports evaluationMode, bucketingKey, percentage, rolloutWeights, targetSegments, testers, deploymentIds, tags (attached in a follow-up update after creation).

    - `update`: update a flag or experiment (`flagId` + only the fields to change). Supports flagConfig (name/description/enabled), evaluationMode, bucketingKey, percentage, rolloutWeights, targetSegments, variants, testers, deployments, links, tags (add/remove by name, not a full replace). Experiments are flags — use this for shell/rollout changes on experiments too.

    - `list_deployments`: list deployments (API keys) for the current project. Deployments are shared by flags and experiments — this is the only place to list them.


    INSTRUCTIONS:

    - Resolve IDs with `search` (entityTypes: ["FLAG"] or ["EXPERIMENT"]) before get/update.

    - Use `list_deployments` before create/update when associating deployment IDs.

    - Only include update sections you intend to change.

    - Enabling an experiment enables variant delivery only; it does not start analysis or set experimentStartDate. To start an experiment, use `use_amp_experiments` action `start`. Check returned analysis dates and warnings before claiming the experiment started.

    - evaluationMode is "local" or "remote"; bucketingKey is "user_id", "device_id", or "amplitude_id".

    - For update rollout: `percentage` / `rolloutWeights` apply to "All Other Users"; omit `targetSegments` to keep existing conditional segments, pass `[]` to clear them, or pass a full array to replace them.

    - To GA a flag: `{"action":"update","flagId":"...","percentage":100,"rolloutWeights":{"on":1}}` (optionally `"targetSegments":[]` to drop prior segments).


    DO NOT USE FOR:

    - Experiment analysis → `use_amp_experiments` action `analyze`.

    - Attaching experiment metrics → `use_amp_experiments` action `update`.

    - Creating experiments → `use_amp_experiments` action `create`.'
  params:
    action: 'Flag operation: ''get'' | ''create'' | ''update'' | ''list_deployments''. Defaults to get.'
    flagIds: 'get: flag IDs or keys to retrieve.'
    flags: 'create: flags to create (same shape as create_flags).'
    flagId: 'update: ID of the flag or experiment to update.'
    flagConfig: Flag configuration updates
    evaluationMode: 'Evaluation mode: "local" or "remote".'
    bucketingKey: Property used to bucket users into variants. One of "user_id", "device_id", "amplitude_id". Group-level bucketing (group_id/group_name) requires bucketingGroupType and is not supported via MCP yet.
    percentage: Default rollout percentage for "All Other Users" (0-100). Set to 100 to enable for everyone.
    rolloutWeights: 'Default variant weight distribution for "All Other Users" (e.g., {"on": 1} for 100% to "on" variant).'
    targetSegments: Target segments for conditional rollout. Replaces existing conditional segments when provided; omit to keep them; pass [] to clear them.
    variants: Variant operations
    testers: Tester operations
    deployments: Deployment operations
    links: Link operations
    tags: 'update: add or remove tags by name (not a full replace). create attaches tags via the per-flag `tags` field in `flags` instead.'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: use_amp_experiments
  description: 'Unified entry point for feature-flag experiments (SDK/code bucketing): read, analyze, create, set metrics, and start. Replaces get_experiments, query_experiment, create_experiment, and update_experiment. Not for Amplitude Web Experiments (visual editor, page targeting, DOM/CSS variants).


    ACTIONS:

    - `get` (default): fetch experiments by `ids`.

    - `analyze`: run experiment analysis for `id` (same as query_experiment). Omit metricIds unless the user asks for specific/secondary metrics.

    - `create`: create a feature-flag A/B test across projects (SDK/code bucketing; same fields as create_experiment). This does not create an Amplitude Web Experiment (visual editor, page targeting, DOM/CSS variants). If the user asked for a web experiment, website experiment, or WebXP, do not use this action and do not describe a feature experiment as the web experiment.

    - `update`: replace experiment metrics (`experimentId` + `metrics`). For name/variants/testers/deployments/links on an experiment, use `use_amp_flags` action `update` — experiments are flags.

    - `start`: start the experiment (`experimentId`, optional ISO 8601 `startDate` / `endDate`): enables variant delivery and sets the analysis window, like Start Experiment in the UI. Use this when the user asks to start/launch/run an experiment, or when an enabled experiment has no analysis start date (`EXPERIMENT_NOT_STARTED`). Use only when the user has authorized starting the experiment. Analysis dates do not schedule delivery; delivery is enabled now.


    INSTRUCTIONS:

    - Resolve experiment IDs with `search` (entityTypes: ["EXPERIMENT"]) before get/analyze/update/start.

    - Resolve deployment IDs with `use_amp_flags` action `list_deployments` before passing `deploymentIds`.

    - Resolve metric IDs with `use_amplitude_metrics` before passing `metrics` or `projectMetrics`.

    - On `create`, strongly prefer setting `proxyExposureEvent` to the event where users hit the tested surface. Without it, pre-launch planning falls back to Any Active Event and can wildly overstate the required duration.

    - ALWAYS reference queried experiments by their Amplitude link in analyses.

    - Metrics for `update` fully replace the existing set; create metrics first via `use_amplitude_metrics`.


    DO NOT USE FOR:

    - Feature flags → `use_amp_flags`.

    - Metric definitions → `use_amplitude_metrics`.

    - Chart / dataset queries → chart query tools.

    - Web Experiments (visual editor, page URL, DOM/CSS variants), including a website experiment or WebXP. `create` only provisions a feature-flag A/B test.'
  params:
    action: 'Experiment operation: ''get'' | ''analyze'' | ''create'' | ''update'' | ''start''. Defaults to get.'
    ids: 'get: experiment IDs to retrieve.'
    id: 'analyze: experiment ID to query.'
    metricIds: 'analyze: ONLY if the user explicitly requests specific or all metrics. Omit for primary/recommended metric only.'
    groupBy: 'analyze: optional group-by, e.g. [{"type":"user","value":"device type","group_type":"User"}].'
    filters: 'analyze: optional metric filters.'
    projectIds: 'create: project IDs (prompt the user if unspecified).'
    key: 'create: unique experiment key.'
    name: 'create: human-readable experiment name.'
    description: Experiment description explaining what is being tested
    variants: 'create: variants (defaults to control + treatment if omitted).'
    evaluationMode: Defaults to "remote". Set to "local" if specified by the user
    bucketingKey: Property used to bucket users into variants. One of "user_id", "device_id", "amplitude_id". Omit unless the user asks — Amplitude then picks the right default ("amplitude_id" for remote, "device_id" for local). Group-level bucketing (group_id/group_name) requires bucketingGroupType and is not supported via MCP yet.
    projectMetrics: Metrics to attach to the experiment for analysis
    links: Links to associate with the experiment (e.g., design docs, tickets, PRs). Each link requires a url and title.
    deploymentIds: 'create: deployment (API key) IDs to associate. List available IDs with use_amp_flags action list_deployments. Single-project creates only.'
    proxyExposureEvent: 'Proxy exposure event used for pre-launch planning (duration estimator, control mean, sample size). Set it to the event where users first encounter the tested surface (e.g. the screen-viewed event for the screen being changed). Strongly recommended for funnel/conversion metrics: without it, planning falls back to Any Active Event and denominates the baseline against all active users. Does not change the running experiment''s exposure event.'
    experimentId: 'update: experiment ID whose metrics to replace. start: experiment ID to start.'
    startDate: 'start: analysis start as ISO 8601. Defaults to now.'
    endDate: 'start: analysis end as ISO 8601. Omit for no end date.'
    metrics: 'update: full replacement metric set. Empty array clears metrics.'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: use_amp_notebooks
  description: 'Read and manage Amplitude notebooks. One outcome-based tool selected by `action`.


    ACTIONS:

    - `get`: read notebooks by `notebookIds` (or singular `notebookId`). Resolve IDs with `search_amp_entities` (entityTypes: NOTEBOOK).

    - `create`: create a notebook with `name` + `rows`. Chart cells accept saved chart IDs and temporary chart edit IDs interchangeably in `chartId`; edit IDs are saved as permanent charts automatically. Optionally pass `chartEdits` to control the saved name and description of each edit.

    - `edit`: update name and/or one layout edit. Call get first and pass its `lastModifiedAt` as `expectedLastModifiedAt`. Rows accept edit IDs the same way `create` does — use this to add a freshly queried chart to an existing notebook. Optionally pass `chartEdits` to control the saved name and description of edit IDs referenced by the layout edit.


    ROW ITEMS:

    - Types: `chart`, `rich_text` (markdown content), `session_replay`, `video`, `image`, `cohort`. Use `rich_text`, not `markdown`.

    - Width 3–12 columns per item; row total ≤ 12; max 4 items per row.


    DO NOT USE FOR:

    - Finding notebooks by name: use `search`.

    - Creating a shared space, changing space members, or moving an existing notebook into a space: use `manage_amp_entities`.

    - Sharing / comments: use `share_amp_entities` / `use_amp_comments`.'
  params:
    action: 'Discriminator: determines which set of parameters applies (get | create | edit)'
    notebookIds: 'Notebook IDs to read. Resolve with search_amp_entities (entityTypes: [''NOTEBOOK'']).'
    notebookId: Singular notebook ID alias for notebookIds:[id].
    name: Notebook name.
    rows: Notebook layout rows.
    chartEdits: Optional names and descriptions for chart edits referenced in rows. Without an entry, an edit is saved using the name from its definition.
    destination: Where to save. Omit for the personal space (previous behavior).
    expectedLastModifiedAt: lastModifiedAt returned by get. Read the notebook first.
    metadata: Optional metadata updates (e.g. name).
    edit: Optional single structural layout edit.
- name: use_amplitude_metrics
  description: 'Unified entry point for metric definitions, goals, and goal alerts in a project. Replaces get_metrics, create_metric, update_metric, delete_metric, get_metric_goals, the five goal write tools, and the four goal-alert CRUD tools.


    WHEN TO USE:

    - Anything about defining metrics, setting targets on metrics, listing goals/pacing, or configuring goal alerts.

    - NOT for querying metric *values* over time — use query_metric or query_dataset instead.


    INSTRUCTIONS:

    - Select the operation with `action`.

    - Metric defs: resolve metricIds with search first; create_metric needs projectId, name, and metricType plus type-specific fields (same rules as the legacy create_metric tool).

    - Goals: use get_goals to discover goalIds before update / archive / restore / delete / alert actions.

    - update_metric may be two-step when changing a metric definition with dependents; delete_metric and delete_goal may also be two-step when dependents exist. For any of these operations, first call without confirmed, show the returned dependency payload to the user, then retry with confirmed: true only after user confirmation.

    - get_goals accepts either metricId OR projectId, not both.


    DO NOT USE FOR:

    - Chart or experiment metric *values* → query_metric / query_dataset.

    - Experiments and flags → get_experiments / get_flags / create_experiment.'
  params:
    action: 'What to do — metric defs: ''get_metrics'', ''create_metric'', ''update_metric'', ''delete_metric''; goals: ''get_goals'', ''create_goal'', ''update_goal'', ''archive_goal'', ''restore_goal'', ''delete_goal''; alerts: ''get_goal_alert'', ''create_goal_alert'', ''update_goal_alert'', ''delete_goal_alert''.'
    metricIds: 'get_metrics: metric IDs to fetch (required for get_metrics).'
    projectId: 'create_metric / update_metric / delete_metric: project ID. get_goals: list all goals in project (mutually exclusive with metricId).'
    metricId: 'update_metric / delete_metric: target metric. get_goals: list goals on one metric. create_goal: metric to attach the goal to.'
    name: Human-readable name for the metric
    description: Description of what this metric measures
    metricType: 'Type of metric. UNIQUES: unique users who performed the event. TOTALS: total event count. FORMULA: custom formula combining multiple events (supports PROPCOUNT, PROPMIN, PROPMAX, etc. as formula terms). PROPSUM: sum of a numeric property. PROPAVG: average of a numeric property. RETENTION: retention metrics. CONVERSION: funnel / multi-step conversion metrics. AMPSQL_METRIC: SQL-defined metric; use only when explicitly requested or standard metrics cannot express the calculation, such as net value per order by joining purchases and refunds on order_id. Requires ampsql and AmpSQL metric write access.'
    ampsql: Full definition for AMPSQL_METRIC only. For query authoring, follow the ampsql-metric-authoring skill when available. Validated by the same save mutation as the metric UI; saving does not prove query execution.
    event: Event definition for single-event metrics (UNIQUES, TOTALS, PROPSUM, PROPAVG).
    aggregationProperty: Property to aggregate for PROPSUM and PROPAVG metrics. Specifies which numeric event/user/group property to compute the aggregation on.
    events: Array of event definitions for FORMULA metrics. Each event is referenced by letter (A, B, C...) in the formula.
    formula: 'Formula string for FORMULA metrics. Reference events by letter: A, B, C... Available functions: UNIQUES(A), TOTALS(A), PROPSUM(A), PROPAVG(A), PROPMIN(A), PROPMAX(A), PROPCOUNT(A), PROPCOUNTAVG(A), REVENUETOTAL(A). Example: "TOTALS(B)/TOTALS(A)"'
    startEvent: Start event definition for RETENTION metrics.
    returnEvent: Return event definition for RETENTION metrics.
    returnOn: Number of days to return on for RETENTION metrics (1–30).
    returnOnInterval: 1 is for daily retention, 7 is for weekly retention, 30 is for monthly retention.
    funnelEvents: Ordered funnel steps for CONVERSION metrics (minimum 2 events). Each step is an event with optional filters. Not used for FORMULA — use "events" for formula metrics.
    funnelMode: 'How funnel steps relate: "ordered" (this order), "unordered" (any order), "sequential" (exact order).'
    conversionSeconds: Maximum time window to complete the funnel, in seconds (e.g. 86400 = 1 day, 604800 = 7 days).
    funnelPathsToCollect: 'CONVERSION only: "UNIQUES" measures unique users who complete the funnel; "TOTALS" measures total conversion path counts.'
    funnelConstantProperties: 'CONVERSION only: properties held constant across funnel steps (same as funnel "holding constant" in the UI).'
    funnelComputeProperty: 'CONVERSION only: numeric property on the last funnel step to aggregate (e.g. revenue). Use with funnelComputePropFunction.'
    funnelComputePropFunction: 'CONVERSION only: how to aggregate funnelComputeProperty on the last step — "SUM" (default when property set) or "AVG".'
    isExperimentMetric: Set to true when this metric is intended for use in an experiment. Enables experiment-specific formula validation rules.
    countGroup: What to count. "User" for unique users (default), "Event" for event totals.
    isOfficial: Whether to mark this metric as official. Requires elevated permissions.
    includeArchived: 'get_goals: include archived goals when metricId is set.'
    goalId: Goal-scoped actions and goal alert actions.
    targetValue: The numeric value the metric should hit over the timeframe.
    comparator: 'Success direction: "gte" = metric should be at or above targetValue, "lte" = at or below.'
    startsAt: Start of the goal timeframe, as a Unix timestamp in seconds.
    endsAt: End of the goal timeframe, as a Unix timestamp in seconds. Must be after startsAt.
    confirmed: 'update_metric when changing a metric definition with dependents / delete_metric / delete_goal: set true only after the user confirms.'
    shouldAlertOnGoalReached: Send an alert when the goal target is reached.
    shouldAlertOnDip: Send an alert when the metric dips by the configured threshold.
    dipThresholdPct: Metric dip percentage that triggers an alert. Required when shouldAlertOnDip is true.
    alertDelivery: Full replacement of alert delivery channels. Omit to preserve delivery, pass null to clear all channels, or pass an object containing every desired channel.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: share_amp_entities
  description: 'Manage sharing and org invites for Amplitude entities. One outcome-based tool selected by `action`.


    ACTIONS:

    - `get`: list owners/viewers for a CHART / DASHBOARD / NOTEBOOK / COHORT (`objectId` + `objectType`).

    - `share`: add users as viewers (`userIds` or singular `userId`). Existing editors are not downgraded.

    - `update_role`: set one user''s role to CAN_EDIT / CAN_VIEW / NOT_ADDED (`userId` + `shareRole`).

    - `invite`: invite people to the org by email (optional chart access at invite time). Requires org role Manager or higher.


    INSTRUCTIONS:

    - Resolve object IDs with `search_amp_entities` first. Object types are uppercase enums (not "space").

    - Resolve recipients with `get_amp_user_data` include=`org`. Pass returned `loginId` emails as recipients. If the user did not name a teammate, ask for an email instead of guessing.

    - Prefer `update_role` with CAN_EDIT to promote a viewer to editor; `share` only adds viewers.

    - Callers need edit access on the object to share or change roles.


    DO NOT USE FOR:

    - Creating a shared space, renaming it, changing space members, or moving content into a space: use `manage_amp_entities`.

    - Comments on objects: use `use_amp_comments`.

    - Product analytics end-user lookup: use `get_amp_user_data` with include id/profile/timeline.'
  params:
    action: 'Discriminator: determines which set of parameters applies (get | share | update_role | invite)'
    objectId: Entity ID. Resolve the entity with search_amp_entities, then pass its id as objectId with objectType CHART, DASHBOARD, NOTEBOOK, or COHORT.
    objectType: CHART, DASHBOARD, NOTEBOOK, or COHORT (uppercase).
    userIds: Login IDs (emails) to add as viewers. Resolve with get_amp_user_data include='org'.
    userId: Singular login ID alias for userIds.
    message: Optional notification message.
    shareRole: CAN_EDIT (editor), CAN_VIEW (viewer), or NOT_ADDED (remove).
    emails: Email addresses to invite.
    orgRole: Org role to grant. Defaults to VIEWER.
    nextAppUrl: Optional absolute URL the invite email should send users to.
    isSetupRequest: Whether this invite is from a first-time setup flow.
    defaultProjectId: Optional default project/app ID for the invited users.
    assignedProjectIds: Optional project/app IDs to assign when using projectRoleUuid.
    projectRoleUuid: Optional RBAC role UUID to assign across assignedProjectIds.
    projectRoles: Optional legacy project role map keyed by project/app ID. Values are VIEWER, MEMBER, MANAGER, or ORG_ADMIN.
    permGroupIds: Optional permission group IDs to add invited users to.
    initialObjectPermissions: Optional chart permissions granted when the invite is accepted.
- name: manage_amp_entities
  description: 'Create a shared (team) space, rename a space or change its members, or move charts, dashboards, notebooks, or cohorts into a shared space. Opens a confirmation card the user approves. Selected by `route`.


    ROUTES:

    - `create_space`: create a new shared space. Opens a compact form prefilled with the proposed name and members (`spaceName`, `members`).

    - `manage_space`: update an existing shared space''s name, description, or members. Requires `spaceId`.

    - `move_to_space`: move charts, dashboards, notebooks, or cohorts into an existing shared space. Renders a destination picker over the entities you pass.

    - `search_members`, `validate_confirmation`, and `commit`: reserved for the confirmation card. Do not call them yourself.


    SPACE MANAGEMENT:

    - This is the only tool for creating, updating, or moving content into shared spaces.

    - If the needed destination does not exist, use `create_space` first. Do not create a destination inside `move_to_space`.


    INSTRUCTIONS:

    - For `move_to_space`, prefer `objects` and pass each entity''s id plus the display name already established in the conversation or source tool output. This is especially important for unnamed chart edits: preserve the useful name you gave the chart instead of showing "Untitled chart". Do not use one title for multiple objects.

    - Resolve entity ids with `search_amp_entities`, or pass chart edit ids straight from `query_amplitude_data`. `objectIds` and `objectId` remain compatibility fallbacks when no display name is available.

    - `objectType` is optional for charts (saved vs unsaved is detected from the id) and required for dashboards, notebooks, and cohorts.

    - Set `title` to a short line explaining why the app opened, in the user''s own words.

    - Nothing is written when a launch route returns. The user confirms in the app, which applies the change and reports back.


    DO NOT USE FOR:

    - Archiving flags or cohorts: no archive route exists yet.

    - Sharing individual charts or dashboards, or org invites: use `share_amp_entities`.'
  params:
    route: 'Discriminator: determines which set of parameters applies (create_space | manage_space | move_to_space | search_members | validate_confirmation | commit)'
    title: Short heading explaining why the app opened, in the user's words.
    spaceName: Suggested space name to prefill in the app.
    members: Org teammate login emails to preselect. The user can change them before confirming.
    spaceDescription: Suggested space description to prefill in the app.
    spaceId: Existing shared space to update.
    objects: Preferred move input. Pair every entity id with its established display name so the confirmation stays recognizable.
    objectIds: Entity ids to act on. Saved entity ids, or chart edit ids from query_amplitude_data.
    objectId: Singular alias for objectIds.
    objectType: CHART, DASHBOARD, NOTEBOOK, or COHORT (uppercase). Optional for charts; required for the others.
    confirmationToken: ''
    query: ''
    selectedIds: Entity ids the user left selected.
    targetSpaceId: Existing space to move the selection into.
    newSpace: Space details submitted by the create_space app route.
    spaceUpdate: Update the token-bound shared space.
- name: search_amp_entities
  description: 'Search for dashboards, charts, notebooks, experiments, docs, and other content in Amplitude.


    INSTRUCTIONS:

    - Use this as your primary tool to discover and explore available analytics content before diving into specific analyses.

    - If you are not sure what to search for, use the default search query.

    - Do not specify appIds/projectIds in the input unless the user explicitly asks to search within a specific app/project.

    - To search Amplitude''s official product documentation (SDK setup guides, API reference, help articles), include ''AMPLITUDE_DOCS'' in entityTypes. This searches the public docs corpus — NOT your org''s content — and returns doc pages with browsable URLs. Pair it with a natural-language query (e.g. "how to track revenue in the browser SDK").


    DO NOT USE FOR:

    - AI agent results, agent analyses, or agent runs → use ''get_agent_results'' instead

    - Getting full dashboard definitions with chart details → use ''get_dashboard'' with the IDs from search results

    - Running queries or analysis → use ''query_dataset'' or ''query_charts''


    ADDITIONAL INFORMATION:

    - Results are personalized to the user you are making the request on behalf of.

    - Results do not include the full object definition. You will need to use other tools to get the full object definition when needed.

    - Best practice is to query for a single entity type, unless the user''s request is open ended.

    - The response includes an isOfficial flag in contentMeta to identify content that has been marked as official by the organization.'
  params:
    spaceIds: Restrict content to these owning spaces and their descendant folders. Resolve shared-space IDs with get_context(include:["spaces"]). Shortcuts into these spaces do not qualify.
    appIds: Array of app/project IDs to search within. If not provided, search will be for all apps the user has access to.
    queries: Array of search query strings. If not provided or empty, search will return results based on relevance to the user. Multiple queries are executed in parallel and results are deduplicated using Reciprocal Rank Fusion (RRF).
    entityTypes: 'Types of entities to search for. Will be converted to camelCase internally for entityRef field access. ''AMPLITUDE_DOCS'' is special: it searches Amplitude''s public product documentation (via the docs search endpoint) instead of your org''s content, and can be combined with org entity types in a single call.'
    includeArchived: Whether to include archived entities
    includeGenerated: Whether to include AI-generated entites
    owners: Filter by owners (array of login IDs)
    excludeOwners: Filter out content by specific owners (array of login IDs)
    sortOrder: Sort order for results
    isOfficial: Filter by official content only
    limitPerQuery: Maximum number of results to return per query. Results from multiple queries are deduplicated before being returned. We recommend starting with the default of 50, even if you are using multiple queries.
    sortDirection: Sort direction for results
    lastModifiedAfter: Filter to entities modified after this epoch timestamp (in seconds). Useful for finding recently active content, e.g. charts modified in the last 7 days.
    lastViewedBefore: Filter to entities last viewed before this epoch timestamp (in seconds). Useful for finding stale or unused content.
    semanticSearch: Whether to use semantic search in addition to keyword search
    search_goal: 'What you are looking for and what you plan to do with the results. Example: "Find the main retention dashboard to answer a question about churn."'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: search_amp_data_taxonomy
  description: "Semantic search over a project's data taxonomy: discover events, properties, and property values by describing what you're looking for in natural language. Batches many searches into ONE call.\n\nINSTRUCTIONS:\n- Use get_amplitude_context FIRST to get the projectId.\n- Use this tool to FIND entities when you don't know the exact name: results are ranked, not exhaustive. When you know the name, need a complete list, or need current status or recency, read get_amp_taxonomy instead — search to find, get to confirm.\n- Batch your entire discovery plan into a single call (one search per concept, up to 16) instead of calling this tool repeatedly.\n- Populate each search based on its kind:\n  - \"events\": set 'description' to one event concept (e.g. \"user completes a purchase\").\n  - \"properties\": set 'descriptions' to 1-2 concise phrasings of the property (e.g. [\"subscription plan\", \"pricing tier\"]).\n  - \"property_values\": set 'propertyName' to the EXACT property name (find it with a \"properties\" search first); set 'eventType' when it is an event property.\n- Per-search 'limit' is 1-50 hits (default 10). Raise it only for broad concepts where the default may miss the right entity; larger limits cost context.\n\nUSING THE RESULTS:\n- Results come back in the same order as the input searches. A failed search returns an 'error' entry without failing the others.\n- Hits are semantically ranked; the top hit is not guaranteed to be correct. Use the returned names EXACTLY as spelled — never guess variants.\n- An 'ambiguity' block on a result means several hits scored similar confidence — surface those candidates and ask which the user means rather than silently picking one, whenever the choice is load-bearing for the answer.\n- Reason from whatever extra signal a hit carries instead of taking rank 1 on faith: 'query_volume' (how often the org actually queries it) is the strongest tiebreaker between similar names, 'last_seen' (live for events; see \"stats\" below) shows whether an entity is still arriving, and a property's 'scope' (event vs. user vs. group) decides where a filter belongs.\n- Report taxonomy quality problems back to the user — near-duplicate events for one concept, several casing variants of the same value, hits with no recent volume, or an 'ambiguity' block you had to guess past. Say which one you picked and why. These are fixable data issues, and staying silent means every later answer quietly inherits the same ambiguity.\n- 'detail' controls response verbosity — pick the cheapest level that answers the question:\n  - \"compact\" (default): names, descriptions, ranking hints only — cheapest, right for most lookups.\n  - \"stats\": adds usage/recency metrics per hit. 'volume' (+ *_30d/*_180d) = ingested event counts; 'query_volume' = how often the org uses it in charts/queries (the strongest tiebreaker between similar hits); event 'first_seen'/'last_seen' are live when the hit's 'recency' is \"live\". 'volume', 'query_volume' and any hit with 'recency: \"snapshot\"' come from a periodic snapshot — 'metrics_as_of' gives its time. Read get_amp_taxonomy before recommending a delete or answering exactly when something started or stopped arriving for a snapshot hit.\n  - \"full\": nothing stripped (tags, category, importance scores, all stats) — most tokens, only when you need governance metadata.\n- Need just one or two stat fields? Stay on \"compact\" and name them in 'extraFields' (e.g. [\"query_volume\"]) — cheaper than \"stats\" or \"full\".\n- Use 'maxResponseChars' to hard-cap the payload when context is tight; results are truncated per search so every search stays represented.\n\nEXAMPLES:\n- Ground a funnel: {\"projectId\": \"123456\", \"searches\": [{\"kind\": \"events\", \"description\": \"user signs up\"}, {\"kind\": \"events\", \"description\": \"user completes checkout\"}]}\n- Find a property then its values: {\"projectId\": \"123456\", \"searches\": [{\"kind\": \"properties\", \"descriptions\": [\"subscription plan\"]}]} then {\"projectId\": \"123456\", \"searches\": [{\"kind\": \"property_values\", \"propertyName\": \"plan_type\", \"eventType\": \"Subscription Started\"}]}\n- Rank by usage: {\"projectId\": \"123456\", \"searches\": [{\"kind\": \"events\", \"description\": \"purchase\"}], \"detail\": \"stats\"}\n- Compact but keep one stat: {\"projectId\": \"123456\", \"searches\": [{\"kind\": \"events\", \"description\": \"purchase\"}], \"extraFields\": [\"query_volume\"]}\n- Tight context budget: {\"projectId\": \"123456\", \"searches\": [{\"kind\": \"events\", \"description\": \"purchase\"}], \"maxResponseChars\": 4000}\n\nNOTES:\n- Hits are already ranked by a hybrid of semantic and keyword search — a single ranking, not two lists to reconcile.\n- 'source' says which backend served the batch. 'langley' is the normal path. 'unisearch_fallback' means that backend was unreachable, so results are keyword-only and lower quality; the response carries a 'degradedReason', the fallback cannot serve 'property_values' searches, and it ignores 'detail' and 'extraFields' (always compact hits). Treat a fallback answer as provisional and say so when it materially affects your conclusion."
  params:
    projectId: Amplitude project ID to search within (required).
    searches: 1-16 searches, run in parallel in one call. Batch the whole discovery plan (all event concepts, properties, and value lookups) instead of calling this tool repeatedly.
    detail: 'Response verbosity. ''compact'' (default): names, descriptions, and ranking hints only — right for most lookups. ''stats'': adds usage/recency metrics per hit (''volume'', ''query_volume'', ''first_seen'', ''last_seen'' + *_30d/*_180d windows) — use when ranking similar candidates. Event first_seen/last_seen are live; volumes are a snapshot dated by metrics_as_of. ''full'': nothing stripped (also tags, category, importance scores) — most tokens; only for governance metadata.'
    extraFields: Keep only these normally-stripped hit fields while staying compact — cheaper than detail='stats'/'full' when you need one or two extras (e.g. ["query_volume"]). Ignored when detail='full'.
    maxResponseChars: Hard cap on total response size in characters (0 = uncapped; server default ~90000). When the cap binds, hits are dropped per search so every search stays represented. Set it when your context budget is tight.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_from_url
  description: 'Retrieve objects from Amplitude URLs


    WHEN TO USE:

    - CRITICAL: Only use this tool for full Amplitude app URLs on supported hosts (app.amplitude.com, app.eu.amplitude.com, apps.stag2.amplitude.com, local.amplitude.com)

    - You have an Amplitude URL and want to get the full object definition

    - User shares a link to a dashboard, chart, notebook, experiment, etc.


    INSTRUCTIONS:

    - Provide the full Amplitude URL (e.g., https://app.amplitude.com/analytics/myorg/chart/456 or https://app.eu.amplitude.com/analytics/myorg/chart/456)

    - The tool will parse the URL, validate the organization, and return the full object

    - Works with charts, dashboards, notebooks, experiments, flags, cohorts, metrics, opportunities, and Agent Analytics sessions, evaluators and eval runs

    - Agent Analytics session URLs (/agent-analytics/{org}/sessions?convId=...&project=...) return the session transcript

    - Agent Analytics evaluator URLs (/agent-analytics/{org}/evals?evaluatorId=...&project=...) return the evaluator definition

    - Agent Analytics eval run URLs (/agent-analytics/{org}/runs/{runId}?project=...) return the run and its per-evaluator summaries

    - /chart/new/{id} URLs may refer to a chart draft or a temporary chart edit (from query tools); both are resolved automatically

    - Agent session URLs (/agents/session/{id}) are not resolvable here — use get_agent_results with the session_id instead'
  params:
    url: Full Amplitude URL to retrieve the object from
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_amp_session_replay_info
  description: 'Unified entry point for session replay data: find replays and inspect what happened in them. Replaces get_session_replays, list_session_replays, get_session_replay_events, and get_session_replay_timeline.


    ACTIONS:

    - `search` (default): find replays by event / user-property / cohort filters, by Amplitude user (`userId`), by ID (`sessionReplayIds`), or sample recent sessions with no filters (random slice from the last 24 hours).

    - `list`: simple paginated time-range listing via the public Session Replay API (`start_time`/`end_time`/`page_size`/`page_token`). Use `search` instead when filtering by events or user properties.

    - `events`: processed rrweb interaction timeline for one replay (`sessionReplayId`) — page navigations, clicks, inputs, scrolls.

    - `timeline`: full analytics event timeline for one replay (`sessionReplayId`) — every event the user fired during and around the session. PREFER THIS over user-timeline tools when you have a replay ID.


    REQUIRED FOLLOW-UP — render_amp_session_replay:

    - After `search`/`list` return replay IDs, you MUST call `render_amp_session_replay` in the SAME turn whenever the user''s request implies viewing the replays ("show me", "let me see", "pull up", "watch", "play", "open", or any phrasing where seeing the replays is the deliverable). A list of IDs alone is not the answer the user wants.

    - ONLY skip the render call for raw data extraction ("just count them", "export the IDs"). When in doubt, render.


    INSTRUCTIONS:

    - Provide `projectId` for every action.

    - Replay IDs use the "<device_id>/<session_id>" format — pass them verbatim between actions.

    - search: filters are ANDed; reference real event names (call get_events first if unsure). `userId` and `sessionReplayIds` are mutually exclusive with each other and with filters.

    - list: use the returned next_page_token to fetch subsequent pages; keep sort_order consistent across pages. The list response''s start/end times describe the analytics session window, NOT the recorded replay length.

    - events vs timeline: `events` shows what the user DID in the recording (clicks/inputs/navigation from rrweb); `timeline` shows which analytics EVENTS fired (with properties). For "walk me through this session" prefer `timeline`.


    EXAMPLES:

    - Sample recent sessions: { "projectId": "12345" }

    - Users who hit checkout errors: { "action": "search", "projectId": "12345", "events": [{ "name": "Checkout", "withProperty": { "name": "error_type", "exists": true } }] }

    - Replays for a user yesterday: { "action": "search", "projectId": "12345", "userId": "98765", "since": "yesterday" }

    - Paginated listing: { "action": "list", "projectId": "12345", "page_size": 50, "sort_order": "desc" }

    - What the user did in a replay: { "action": "events", "projectId": "12345", "sessionReplayId": "device-abc/1773235450374" }

    - Events fired during a replay: { "action": "timeline", "projectId": "12345", "sessionReplayId": "device-abc/1773235450374", "includeEventProperties": true }


    NOTES:

    - search defaults: 10 results; 30-day window for filtered queries, 24 hours otherwise. If a filtered search is empty, widen the window or relax filters instead of retrying unchanged.

    - list defaults to the last 48 hours when no time range is provided.

    - Cohort filters take numeric IDs only — resolve names with get_cohorts first.'
  params:
    action: 'Session replay operation: ''search'' | ''list'' | ''events'' | ''timeline''. Defaults to search.'
    projectId: The Amplitude project ID (appId) as a string (e.g. "12345", "678910"). To find the project ID, check the URL or project context.
    since: Start of the search window. ISO 8601 ("2025-01-15T00:00:00Z"), Unix epoch ms or seconds, or a relative phrase ("yesterday", "7 days ago", "last week"). Defaults to 30 days ago for filtered queries; 24 hours ago for direct-ID lookups and the no-conditions sample.
    until: End of the search window. Same flavors as `since`. Defaults to now.
    'on': 'Single-day shorthand: "YYYY-MM-DD" or relative ("yesterday", "today"). Expands to a 24-hour window centered on that day. Mutually exclusive with `since`/`until`.'
    userId: Fetch sessions for one Amplitude user (the numeric `amplitude_id`). Mutually exclusive with `sessionReplayIds` and with filters.
    sessionReplayIds: 'search: fetch specific replays by "device_id/session_id" (max 100; mutually exclusive with userId and filters). list: filter the listing to these replay IDs (mutually exclusive with amplitude_id and page_token).'
    events: Filter to sessions where the user performed these events. Each entry is ANDed within the same session by default (see `matchScope`).
    userProperties: Filter to sessions whose user matches these property conditions. Each entry is ANDed.
    cohorts: Filter to users in these cohorts. Accepts numeric cohort IDs only — call get_cohorts to resolve a cohort name to its ID first.
    limit: Max sessions to return. Defaults to 10.
    randomize: Shuffle results before returning. Use true for analysis sampling. Implied (with a 24-hour window) when no filters and no direct selectors are supplied.
    matchScope: How to interpret multiple `events`. "session" (default) returns only replays where every event occurred in the same session — what users typically mean by "find sessions with X and Y". "user" returns all replays of users who satisfied the filters somewhere in the time window, even if a given replay doesn't contain every event. Has no effect when `events` is empty.
    start_time: 'list: ISO 8601 lower bound (e.g. "2024-01-01T00:00:00Z"). Defaults to 48 hours ago.'
    end_time: 'list: ISO 8601 upper bound. Defaults to now.'
    page_size: 'list: results per page (1-200, default 50).'
    page_token: 'list: opaque pagination cursor from a previous response.'
    sort_order: 'list: "asc" (oldest first) or "desc" (newest first, default).'
    amplitude_id: 'list: filter replays to a specific Amplitude user ID. Mutually exclusive with sessionReplayIds.'
    sessionReplayId: 'events/timeline: replay ID in "<device_id>/<session_id>" format, as returned by search/list.'
    version: 'events: recording format version, 3 (default) or 2 (legacy). Allowed values: 2, 3.'
    event_limit: 'events: max interaction events to return (default 500).'
    eventLimit: 'timeline: max events to return (default 100, max 1000).'
    includeEventProperties: 'timeline: include full event properties (default false).'
    includeExperimentEvents: 'timeline: include [Experiment] assignment events (default false).'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_session_replay_timeline
  description: APP SUPPORT ONLY. Do not call this tool from the LLM or agent. The session replay app calls this tool to hydrate the events panel and user identities. Use get_amp_session_replay_info (action timeline) for user-facing tasks.
  params:
    projectId: The Amplitude project ID (appId) as a string (e.g. "12345", "678910")
    sessionReplayId: Session replay ID in the format "<device_id>/<session_id>", e.g. "0c650142-4a68-4f82-ad6a-4f154fee5265/1773235450374"
    eventLimit: Max number of events to return (default 100, max 1000)
    includeEventProperties: Whether to include full event properties (default false for concise output)
    includeExperimentEvents: Whether to include [Experiment] assignment events (default false)
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: render_amp_session_replay
  description: 'Render an interactive session replay player UI for one or more session replays. This is the ONLY way to actually show a session replay to the user — text descriptions are not a substitute.


    WHEN TO USE (call this tool whenever the user wants to SEE a replay):

    - Any user request with a viewing verb: "show me", "render", "play", "watch", "let me see", "pull up", "open", "display", "view", "I want to see", "can I see" + "session replay(s)" / "session(s)" / "recording(s)" / "the replay" / "those sessions".

    - Any time the user asks to look at, observe, or visually inspect session activity, even without an explicit verb (e.g. "the session for jane@acme.com", "that recording", "those replays from yesterday").

    - Immediately after a session replay search returns replay IDs in response to such a request — chain directly into render_amp_session_replay with the returned IDs. Do NOT stop at listing IDs in text when the user asked to see the replays.

    - If the user asks to see replays but you don''t have IDs yet, FIRST find them with the session replay search tool available to you (`get_amp_session_replay_info`, else `get_session_replays` / `list_session_replays`), THEN call this tool with the results — in the same turn.

    - Call ONCE with a list of IDs to render multiple replays the user can switch between — do NOT call this tool separately per replay.


    WHEN NOT TO USE:

    - The user is asking for a count, summary, or analysis of replay events without wanting to watch them ("how many replays…", "what did the user do in…", "summarize…"). Use the timeline / events tools instead.


    INSTRUCTIONS:

    - Provide projectId and one or more sessionReplayIds.

    - sessionReplayId format is "<device_id>/<session_id>" (e.g. "0c650142-4a68-4f82-ad6a-4f154fee5265/1773235450374") — use the ids returned from the search/list tools verbatim.

    - This tool is an MCP App: it ships the player manifest through structuredContent/_meta, so hosts treat it as a UI render rather than a data read.

    - Maximum 20 IDs per call. The UI hydrates the rrweb player on demand for each replay.

    - Set `title` to a short, human-readable summary of WHY you''re rendering these replays based on the user''s request (3–8 words). This is shown as the heading above the player. Examples: "Recent web sessions for nvidia.com", "Sessions where users hit checkout errors", "Top 3 longest sessions yesterday". Do NOT echo IDs or device info — that lives in the player itself. If the user gave no specific framing, omit `title`.


    EXAMPLES:

    - Single replay: { "projectId": "678910", "sessionReplayIds": ["0c650142-4a68-4f82-ad6a-4f154fee5265/1773235450374"], "title": "Most recent session for jane@acme.com" }

    - Multiple replays: { "projectId": "678910", "sessionReplayIds": ["abc/111", "def/222"], "title": "Sessions where users abandoned checkout" }

    - No framing context: { "projectId": "678910", "sessionReplayIds": ["abc/111"] }


    NOTES:

    - The UI plays the replay inline (rrweb-based) with a tree-style event list — the model does NOT need to summarize that data in text.

    - This tool is UI-only. Do not rely on its response for reasoning about the replays.'
  params:
    projectId: The Amplitude project ID (appId) as a string (e.g. "12345", "678910") the replays belong to
    sessionReplayIds: List of session replay IDs in the format "<device_id>/<session_id>". Returned from the session replay search tools.
    title: 'Short, human-readable heading for the player UI describing WHY these replays are being shown (3–8 words). Examples: "Recent web sessions for nvidia.com", "Sessions where users hit checkout errors". Omit if there is no specific framing.'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_session_replay_stream
  description: 'APP SUPPORT ONLY. Do not call this tool from the LLM or agent.


    The session replay app calls this tool to stream rrweb events for inline playback. The response is base64-encoded gzipped NDJSON and is not useful for text reasoning.


    If you need to understand what happened in a replay, use get_session_replay_events instead.


    APP INSTRUCTIONS:

    - First call: pass projectId + sessionReplayId. Response includes durationMs, events (file 0), and nextCursor.

    - Continue with nextCursor until it is null.

    - For duration-only hydration, pass metadataOnly: true.'
  params:
    projectId: The Amplitude project ID (appId) as a string (e.g. "12345", "678910") the replay belongs to
    sessionReplayId: Session replay ID in "<device_id>/<session_id>" format. Returned from list_session_replays / get_session_replays.
    cursor: Opaque cursor returned by the previous call as `nextCursor`. Omit on the first call.
    metadataOnly: If true, return only durationMs (no event chunks). Used by the sessions panel to hydrate per-row durations cheaply.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_session_replay_duration
  description: 'APP SUPPORT ONLY. Do not call this tool from the LLM or agent.


    The session replay app calls this tool to hydrate replay duration metadata without downloading the full replay. Prefer list_session_replays, get_session_replays, get_session_replay_events, or render_amp_session_replay for user-facing tasks.


    APP INSTRUCTIONS:

    - Provide projectId and sessionReplayId in "<device_id>/<session_id>" format (as returned by list_session_replays / get_session_replays).

    - Returns durationMs: last event timestamp minus first event timestamp.

    - Returns null durationMs for empty or single-frame recordings.'
  params:
    projectId: The Amplitude project ID (appId) as a string (e.g. "12345", "678910") the replay belongs to
    sessionReplayId: Session replay ID in "<device_id>/<session_id>" format. Returned from list_session_replays / get_session_replays.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: manage_amp_events
  description: 'Write to a project''s tracking-plan events — raw ingested events, custom events, and labeled (autotrack) events — in one tool selected by `action` + `kind`. Reading events lives in `get_amp_taxonomy`.


    KINDS:

    - `event` (default): raw ingested / planned event types in the tracking plan (Purchase, Page Viewed, …). Identified by `eventTypes`.

    - `custom`: virtual events composed of one or more raw source events with optional filters (`isAutotrack=false`). Identified by `customEventNames` / `customEventIds`.

    - `labeled`: autotrack / labeled events (`isAutotrack=true`). Same identifiers as custom. Update and delete — MCP cannot create labeled events.


    ACTION + KIND MATRIX (key params per combo):

    - create + event → `events: [{ name, isUnexpected, … }]` (isUnexpected: true adds an already-ingested unexpected event to the plan; false creates a brand-new planned event)

    - create + custom → `name` + `definition` (raw source events)

    - update + event → maps keyed by exact raw event `name` (`descriptions`, `newNames`, `categories`, `sources`, `tags`, `visibility`, `owners`, …)

    - update + custom|labeled → maps keyed by id / display name / ce:<name> (`descriptions`, `newNames`, `categories`, `isOfficial`, `eventDefinitions`)

    - delete + event → `eventTypes`; mark as deleted (ingested) / removed (planned); two-step with `confirmed`

    - delete + custom|labeled → `customEventNames` / `customEventIds`; permanently removed (same as UI); two-step with `confirmed`

    - restore + event only → `eventTypes` (custom/labeled cannot be restored)

    - merge + event only → `eventTypes` (source events) + `target`; or `propertyValues` + `property` + `target` to record each event''s source. update_merge → `transformationId` plus any of `addEventTypes`, `removeEventTypes`, `propertyValues`, `property`, `target`. undo_merge → `transformationId`. All three are two-step with `confirmed` + `previewFingerprint` (see MERGING EVENTS).


    NAMING:

    - Before proposing, creating or renaming an event, read the project''s naming conventions with `get_amp_taxonomy` (`action: workspace`, setting `eventNC`: casing + structure such as noun_past). They are the customer''s Data → Settings and take precedence over naming rules in AI Context; if the two disagree, follow the settings and tell the user.


    COMMON MISTAKES (seen in production — avoid these):

    - Using `eventTypes` with kind custom/labeled, or `customEventNames` with kind event. Raw events → `eventTypes`; custom/labeled → `customEventNames`/`customEventIds`.

    - Sending `kind: "all"`. It is no longer a valid kind here — it only ever meant "custom and labeled together" on a read. Use `get_amp_taxonomy` (`action: events`) to read both, or pick `custom` or `labeled` for a write.

    - Omitting `action`. It is required now; it used to default to `get`, which no longer exists on this tool.

    - Putting `ce:<name>` values in a custom event `definition` — source events must be raw event types; custom events cannot nest, and labeled events as sources are not supported yet.

    - create + event failing with "name already exists": the event was likely already ingested (unexpected) — retry with `isUnexpected: true` to add it to the plan instead.

    - Setting `description`/`category`/`isOfficial` on an event with `isUnexpected: true` — add to plan first, then update.

    - update + event on events not yet in the tracking plan — only planned/live events can be updated; add unexpected events to the plan first.

    - Creating a custom event whose definition duplicates an existing one — the API rejects duplicates and returns the existing event; reuse it instead.


    EVENTS WITH NAMES YOU CANNOT RETYPE:

    - Some ingested names contain U+FFFD, control characters, or JSON-significant glyphs (quotes, braces, backslashes). `get_amp_taxonomy` returns a `encodedName` value for those events — an ASCII-only encoding of the exact name.

    - When an event has one, copy it verbatim and use it wherever this tool takes that event''s name: in `eventTypes`, and as the key of `descriptions` / `newNames` / `categories` / `isOfficial` / `sources` / `removeSources` / `tags` / `removeTags` / `isActiveAction` / `visibility` / `owners`. Never retype the raw name into tool arguments.

    - Use one form per event — the same event keyed both literally and as an encoded name is rejected rather than silently resolved.


    HOW TO FIND THE EVENTS YOU ARE ABOUT TO CHANGE:

    1. Discover names with `search` (`entityTypes: ["EVENT"]` or `["CUSTOM_EVENT"]`). That is the primary path.

    2. Hydrate them with `get_amp_taxonomy` (`action: events`) before writing — it returns status, category, activity, visibility, and ingestion timestamps, and confirms the exact name to key update maps by.


    DELETE / RESTORE:

    - For kind:event, delete is a two-step confirmation gate for every target — mark as deleted and remove alike. Never skip confirmation.

    - Marking as deleted stops ingestion immediately on main; on any other tracking-plan branch, ingest is unchanged until merge. Removing a planned event does not stop ingestion (the event was never ingested).

    - Restore: on main, ingestion resumes immediately; on any other branch, the restore is staged until merge. Only events that were marked as deleted can be restored; removed planned events must be recreated.

    - Custom/labeled delete is permanent and does not use this branch-ingest rule.


    MERGING EVENTS (merge / update_merge / undo_merge, kind event only):

    - A merge makes charts and queries treat its source events as the target event. It is a Data taxonomy transformation, not a custom event and not a source or destination transformation. Read existing merges with `get_transformations`.

    - It applies to the whole project immediately, including past data, and is not reviewed on a branch: no branchId / branchName.

    - Sources must be events the project has received; a planned event that was never ingested is refused. The target can be planned or new; a new target is created, and it stays if the merge is later undone. An event can be in only one merge: if the target already has a merge, add to it with update_merge.

    - To also record which source each merged event came from, pass `propertyValues: [{ event, value }]` (instead of `eventTypes`) and `property`, the event property that holds the value.

    - Two-step: the first call returns `confirmation_required` with a preview (each event''s status, last seen, 30-day volume, whether the target will be created, possible conflicts) and a `previewFingerprint`, and writes nothing. Show the preview to the user, then call again with `confirmed: true` and that `previewFingerprint`. A changed request returns `preview_stale` with a new preview.

    - update_merge: pass only what changes. Sources you do not mention stay in the merge. A new target keeps the old target as a source unless you list it in `removeEventTypes`.

    - `conflict` means nothing was written; relay the reasons.

    - A merge has no description of its own. To document it, set the target event''s description with `update`; a successful merge''s `nextStep` gives the exact calls.

    - Undoing a merge restores the sources as separate events in charts.


    RENAMING A LIVE EVENT:

    - To rename an event that has been ingested so that past and future data shows under the new name, `merge` it into the new name (eventTypes: [old], target: new).


    TYPICAL FLOWS:

    - Add raw events on a branch: get_amp_taxonomy workspace (naming conventions, mainProtected) → manage_amp_taxonomy create_branch (if main protected) → create with kind event + branchName → update metadata as needed.

    - Build a custom event: get_amp_taxonomy for the raw source events → create with kind custom + definition (source events).

    - Delete raw events (not custom/labeled): delete with kind event (confirmation_required first), then confirmed: true after the user acknowledges the buckets and branch. Ingested events are marked as deleted (restorable); planned events are removed (not restorable).

    - Permanently remove a custom/labeled event: delete with kind custom|labeled + customEventNames/Ids (confirmation_required first), then confirmed: true. Cannot be restored.

    - Restore a deleted raw (not custom/labeled) event: get_amp_taxonomy with `action: events` + `includeDeleted: true` to find it, then restore with its exact `eventTypes`.


    PROJECT ID:

    - Pass numeric `projectId`. Get it from `get_amplitude_context` if needed.

    - If omitted and the user has exactly one accessible project, that project is used automatically.


    DO NOT USE FOR:

    - Reading events → `get_amp_taxonomy` (`action: events`)

    - Fuzzy discovery → `search`

    - Properties → `manage_amp_properties` (writes) / `get_amp_taxonomy` (reads)

    - Branch governance, including merging a branch → `manage_amp_taxonomy` (or legacy branch tools)'
  params:
    action: Event write operation. Required — reads live in get_amp_taxonomy.
    kind: event = raw tracking-plan events (default). custom / labeled = custom-or-labeled surface.
    projectId: Numeric Amplitude project ID (e.g. "123456"). Optional only when the user has exactly one accessible project.
    eventTypes: 'delete / restore kind=event: exact ingested event names to act on. merge: source events to merge into target; they must have been ingested.'
    customEventIds: 'update / delete kind=custom|labeled: custom/labeled event ids.'
    customEventNames: 'update / delete kind=custom|labeled: exact display names (include punctuation/brackets as shown in UI).'
    events: 'create kind=event: array of { name, isUnexpected?, description?, category?, isOfficial? }. `name` is the exact ingested event name (same as get_events `name`).'
    name: 'create kind=custom: display name for the new custom event.'
    definition: 'create kind=custom: source events [{ event_type, filters? }, …]. At least one required.'
    description: 'create kind=custom: optional description.'
    category: 'create kind=custom: optional category.'
    isOfficial: 'create kind=custom: boolean official flag. update: map of exact raw event name or custom id_or_name → boolean.'
    descriptions: 'update: descriptions map (raw event name or custom id_or_name).'
    newNames: 'update: rename map.'
    categories: 'update: category map.'
    sources: 'update kind=event: source IDs to add (use get_tracking_plan_sources).'
    removeSources: 'update kind=event: source IDs to remove.'
    tags: 'update kind=event: tags to add.'
    removeTags: 'update kind=event: tags to remove.'
    isActiveAction: 'update kind=event: name -> boolean active/inactive state. Same field name as `isActiveAction` on get_amp_taxonomy output.'
    visibility: 'update kind=event: name -> { hiddenFromDropdowns?, hiddenFromPersonaResults?, hiddenFromPathfinderAndJourneys?, hiddenFromEventStreams? }. Omitted flags remain unchanged. get_amp_taxonomy returns read-shaped `hiddenFrom` surface lists; use these flags to change visibility.'
    owners: 'update kind=event: name -> owner login ID (typically the user email). Same identifier as get_amp_taxonomy `owner`; values are trimmed and lowercased. Assigns the tracking-plan owner; does not clear an existing owner. Not supported for custom/labeled events or properties.'
    eventDefinitions: 'update kind=custom|labeled: id_or_name → SourceEvent[] definition replacements.'
    branchId: 'create/update/delete/restore kind=event: optional branch id (mutually exclusive with branchName).'
    branchName: 'create/update/delete/restore kind=event: optional branch name (mutually exclusive with branchId).'
    confirmed: 'delete kind=event|custom|labeled, merge, update_merge, undo_merge: set true only after the user acknowledges the prior confirmation_required response. Required for every delete — not only ingested events marked as deleted. Merges also need previewFingerprint.'
    target: 'merge, update_merge: event that survives the merge. Created if it does not exist yet.'
    transformationId: 'update_merge, undo_merge: id of the merge, from get_transformations or a prior merge result.'
    addEventTypes: 'update_merge: source events to add to the merge.'
    removeEventTypes: 'update_merge: source events to take out of the merge.'
    propertyValues: 'merge, update_merge: for a merge that records which source each event came from — source events, each with its value. On merge, use instead of eventTypes. On update_merge, adds sources or changes their values.'
    property: 'merge, update_merge: event property, written on merged events, that records which source each came from. Goes with propertyValues.'
    previewFingerprint: 'merge, update_merge, undo_merge: the previewFingerprint from the preview the user approved. Required with confirmed: true.'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: manage_amp_properties
  description: 'Write to a project''s tracking-plan properties — event, user, and group properties — in one tool selected by `action` + `propertyType`. Reading properties lives in `get_amp_taxonomy`.


    PROPERTY TYPES:

    - `event` (default): properties on ingested events. Global (plan-wide, shared across the tracking plan) or event-scoped (attached to one event type). When the user does not say which scope they mean, ask.

    - `user`: user-level properties. Stored with a `gp:` prefix internally — pass either `plan_tier` or `gp:plan_tier`.

    - `group`: properties describing a group type (company_name, plan_tier, …). Create only.

    - `persisted`: event-to-user persisted properties (merchandising = persisted with bindingProperty + bindingEvents on definition). Not on the tracking-plan branch model — omit branch selectors.

    - `derived`, `lookup`, `channel`: cannot be written via MCP. Read them with `get_amp_taxonomy`.


    ACTION + PROPERTY TYPE MATRIX (key params per combo):

    - create + event|user|group → `properties: [{ name, type, … }]`; group also takes `groupType`. Regex is allowed on event and user creates (string type). `isRequired` is event only (create and update). create + event also attaches an existing property to an event: pass only `{ name, eventType }`. `linked` means the event now follows the plan-wide definition; `already_linked` means it was already there, nothing was written, and any event-level definition is unchanged.

    - create + persisted → `properties: [{ name, definition, … }]` (definition required). Merchandising bindings live on definition.

    - update + event|user → maps keyed by property name (`descriptions`, `types`, `enumValues`, `constValues`, `isArrayType`, `regex`, `isHidden`, …); event also takes `isRequired` and requires `metadataScope`. `revertOverrides` drops an event''s override so the property follows the plan again (metadataScope `event` only)

    - update + persisted → `definitions` (merged with the stored definition; null clears bindingProperty, expiryEvents, or lookbackWindow), `descriptions`, `displayNames`, `isHidden`, `isOfficial`

    - delete + event|user → `targets: [{ name, eventType? }]`; two-step with `confirmed`

    - delete + persisted → `targets: [{ name }]`; two-step with `confirmed` (no branches)

    - restore + event|user|persisted → `targets: [{ name, eventType? }]` (eventType event only)

    - merge + event → `sources`, `target`; update_merge + event → `transformationId` plus any of `addSources`, `removeSources`, `target`; undo_merge + event → `transformationId`. All three are two-step with `confirmed` + `previewFingerprint` (see MERGING EVENT PROPERTIES).


    BRANCH SELECTION:

    - Writes are branch-aware. Omit both selectors for the default branch, or pass exactly one of `branchId` / `branchName`.


    IDENTIFYING PROPERTIES FOR delete / restore:

    - `targets` is used for BOTH event and user properties: `[{ name, eventType? }]`.

    - `eventType` is only valid when `propertyType` is `event`. Present → scope to that one event. Omitted → applies plan-wide across all events. These are different operations; be explicit about which the user asked for.

    - One call may mix scopes: `[{ name: "a", eventType: "Purchase" }, { name: "b" }]`.


    CREATE VS UPDATE (unexpected properties):

    - `update` only touches properties already in the tracking plan (status planned / live / blocked). Unexpected properties (auto-detected from ingested data, `isPlanned: false`) are skipped.

    - To edit an unexpected property, first add it to the plan: `create` with `properties: [{ name, isUnexpected: true }]`, then `update`.


    NAMING:

    - Before proposing, creating or renaming a property, read the project''s naming conventions with `get_amp_taxonomy` (`action: workspace`, setting `propertyNC`: casing). They are the customer''s Data → Settings and take precedence over naming rules in AI Context; if the two disagree, follow the settings and tell the user.


    COMMON MISTAKES (avoid these):

    - Omitting `action`. It is required now; it used to default to `get`, which no longer exists on this tool — reads moved to `get_amp_taxonomy`.

    - Sending a read filter (`fields`, `limit`, `cursor`, `includeDeleted`, `includeHidden`, `includeBlocked`, `includeTransformations`, `groupTypes`, `names`, `derivedPropertyType`, `configurationFilter`, `lookupTableName`). None of them exist here any more; they belong to `get_amp_taxonomy`.

    - Using `targets` with `create`, or `properties` with `delete`/`restore`. Create takes the rich `properties` array; delete/restore take `targets`.

    - Passing `eventType` inside `targets` when `propertyType` is `user` — user properties are not event-scoped.

    - `update` + `event` without `metadataScope`. Pick `global` (shared definition) or `event` (one event type, and then `eventType` is required).

    - Expecting a global write to change an event that has an event-scoped override. The event-scoped value wins, so read the property back with `eventType` set to see what is in effect.

    - `isRequired` on user or group properties — required is event-properties only.

    - Trying to `create` a derived, lookup, or channel property — those cannot be written via MCP.

    - Passing `branchId` / `branchName` for persisted properties — they are not branch-scoped.

    - Setting metadata on a `create` entry with `isUnexpected: true` — add to plan first, then update.

    - Passing type, description or other definition fields when attaching an existing property to an event — that item fails. Attach with `{ name, eventType }` only, then `update` with `metadataScope: "event"` if that event needs its own definition.


    PROPERTIES OR EVENTS WITH NAMES YOU CANNOT RETYPE:

    - Some ingested names contain U+FFFD, control characters, or JSON-significant glyphs (quotes, braces, backslashes). `get_amp_taxonomy` returns `encodedName` for such a property, and `encodedEventType` for the event an event property hangs off — ASCII-only encodings of the exact names.

    - When one is present, copy it verbatim and use it wherever this tool takes that name on `update`, `delete` and `restore` (`create` authors a name rather than matching one and rejects an encoding): as a key in any name-keyed map (`descriptions`, `newNames`, `categories`, `isOfficial`, `isRequired`, `types`, `enumValues`, `constValues`, `isArrayType`, `regex`, `isHidden`), as an entry in `revertOverrides`, as `targets[].name`, and as `eventType` or `targets[].eventType`. Never retype the raw name into tool arguments.

    - Use one form per property — the same property keyed both literally and as an encoded name is rejected rather than silently resolved.


    HOW TO FIND THE PROPERTIES YOU ARE ABOUT TO CHANGE:

    1. Discover names with `search`, or `get_amp_taxonomy` (`action: events`) to find the event first. That is the primary path.

    2. Hydrate them with `get_amp_taxonomy` (`action: properties`) before writing — it confirms the exact name, scope, and current status.

    3. Before an event-property delete, pass `includeDeleted: true` when looking up which events are using the property so deleted attachments are also included.


    DELETE / RESTORE:

    - Delete is a two-step confirmation gate for every target — mark as deleted and remove alike. Never skip confirmation.

    - Marking as deleted stops ingestion immediately on main; on any other tracking-plan branch, ingest is unchanged until merge. Removing a planned property does not stop ingestion (the property was never ingested).

    - Restore: on main, ingestion resumes immediately; on any other branch, the restore is staged until merge. Only properties that were marked as deleted can be restored; removed planned properties must be recreated.


    MERGING EVENT PROPERTIES (merge / update_merge / undo_merge, propertyType event only):

    - A merge makes charts and queries treat its source properties as the target property. It is a Data taxonomy transformation, not a source or destination transformation. Read existing merges with `get_transformations`.

    - It applies to the whole project immediately, including past data, and is not reviewed on a branch: no branchId / branchName.

    - Sources must be properties the project has received; a planned property that was never ingested is refused. The target can be new; it is then created, and it stays if the merge is later undone.

    - Two-step: the first call returns `confirmation_required` with a preview (each property''s status, last seen, 30-day query count, events, possible conflicts) and a `previewFingerprint`, and writes nothing. Show the preview to the user, then call again with `confirmed: true` and that `previewFingerprint`. A changed request returns `preview_stale` with a new preview.

    - update_merge: pass only what changes. Sources you do not mention stay in the merge.

    - `conflict` means nothing was written; relay the reasons. Cart properties can''t be merged here.

    - A merge has no description of its own. To document it, set the target property''s description with `update`; a successful merge''s `nextStep` gives the exact calls.

    - Undoing a merge restores the sources as separate properties in charts.


    RENAMING A LIVE PROPERTY:

    - A property that has been ingested can''t be renamed in place. Create the new property (`create`), then `merge` the old one into it (sources: [old], target: new). Past and future data under the old name then shows under the new one.


    TYPICAL FLOWS:

    - Add properties on a branch: get_amp_taxonomy workspace (naming conventions, mainProtected) → manage_amp_taxonomy create_branch (if main protected) → create with `branchName` → update metadata as needed.

    - Delete properties: delete (confirmation_required first), then `confirmed: true` after the user acknowledges the buckets and branch.

    - Restore a deleted property: `get_amp_taxonomy` with `includeDeleted: true` to find it, then restore with its exact name.


    PROJECT ID:

    - Pass numeric `projectId`. Get it from `get_amplitude_context` if needed.

    - If omitted and the user has exactly one accessible project, that project is used automatically.


    DO NOT USE FOR:

    - Reading properties → `get_amp_taxonomy` (`action: properties`)

    - Fuzzy discovery → `search`

    - Events themselves (not their properties) → `manage_amp_events` (writes) / `get_amp_taxonomy` (reads)

    - Branch governance, including merging a branch → `manage_amp_taxonomy`

    - Merging events → `manage_amp_events`

    - Group types themselves → `get_group_types` / `create_group_types`'
  params:
    action: Property write operation. Required — reads live in get_amp_taxonomy.
    propertyType: event = event properties (default). user / group / persisted = writable. derived / lookup / channel cannot be written via MCP — read them with get_amp_taxonomy.
    projectId: Numeric Amplitude project ID (e.g. "123456"). Optional only when the user has exactly one accessible project.
    eventType: 'update propertyType=event: required when metadataScope is "event".'
    properties: 'create: properties to create. Not used by delete/restore — those take targets.'
    groupType: 'create propertyType=group: group type name (e.g. "Company"). Omit to create global group properties.'
    metadataScope: 'update propertyType=event: "global" for shared plan-wide definitions, "event" for one event type (then eventType is required). Required for event updates.'
    descriptions: 'update: property name -> description.'
    displayNames: 'update propertyType=persisted: property name -> display name.'
    newNames: 'update: property name -> new name. Renames are destructive; only include properties the user explicitly asked to rename. Event properties: global scope only.'
    categories: 'update: property name -> category. Pass null (or an empty string) to clear.'
    isOfficial: 'update: property name -> official flag. Event properties: global scope only.'
    types: 'update: property name -> new base data type.'
    enumValues: 'update: enum property name -> allowed values.'
    constValues: 'update: const property name -> fixed value.'
    isArrayType: 'update: property name -> whether it is an array.'
    regex: 'update: string property name -> validation regex. Pass an empty string to clear. Not supported on arrays. propertyType event and user only.'
    isRequired: 'update propertyType=event: property name -> required flag. Both metadataScope values. Advisory: events missing it still ingest.'
    isHidden: 'update: property name -> visibility. true hides the property from dropdowns.'
    revertOverrides: 'update propertyType=event, metadataScope=event: property names whose event-level override to drop, returning them to the plan-wide definition. Drops the whole override (description, category and required together), not one field. Cannot be combined with a value to set for the same property.'
    targets: 'delete/restore: properties to act on, as [{ name, eventType? }]. eventType is event-properties only.'
    branchId: Optional branch id (mutually exclusive with branchName).
    branchName: Optional branch name (mutually exclusive with branchId).
    confirmed: 'delete, merge, update_merge, undo_merge: set true only after the user acknowledges the prior confirmation_required response. Required for mark as deleted and remove alike. Merges also need previewFingerprint.'
    sources: 'merge: event property names to merge into target. They must have been ingested.'
    target: 'merge, update_merge: event property that survives the merge. Created if it does not exist yet.'
    transformationId: 'update_merge, undo_merge: id of the merge, from get_transformations or a prior merge result.'
    addSources: 'update_merge: event property names to add to the merge.'
    removeSources: 'update_merge: event property names to take out of the merge.'
    previewFingerprint: 'merge, update_merge, undo_merge: the previewFingerprint from the preview the user approved. Required with confirmed: true.'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_amp_taxonomy
  description: 'Read a project''s tracking plan: the events it defines, the properties on them, what a branch changes relative to main, who changed what when, its branches and naming conventions, and a CSV download of the plan.


    # WHEN TO USE — answer questions like:

    - "What events exist in project 12345?" → { action: "events", projectId: "12345" }

    - "List the custom events" → { action: "events", kind: "custom", projectId }

    - "Show custom and labeled events together" → { action: "events", kind: "all", projectId }

    - "Which properties are on the Purchase event?" → { action: "properties", propertyType: "event", eventType: "Purchase", projectId }

    - "Which events use button_name?" → { action: "properties", propertyType: "event", names: ["button_name"], projectId }

    - "Is price on the Purchase event?" → { action: "properties", propertyType: "event", eventType: "Purchase", names: ["price"], projectId } (absent names come back in `missing`)

    - "What user properties are tracked?" → { action: "properties", propertyType: "user", projectId }

    - "Which events haven''t arrived since June?" → { action: "events", where: { lastSeen: { end: "2026-05-31" } }, fields: ["name", "lastSeen"], projectId }

    - "Which event properties has nobody queried in 90 days?" → { action: "properties", propertyType: "event", lookbackWindow: 90, where: { queries: { is: 0 } }, fields: ["name", "queries"], projectId }

    - "What branches are in project 12345?" / "what naming convention does this project use?" / "is main protected?" → { action: "workspace", projectId: "12345" }

    - "What does branch feature/v2 change?" / "review this branch before merging" → { action: "branch_changes", branchName: "feature/v2", projectId }

    - "What changed in the tracking plan last week?" / "who deleted that event?" → { action: "activity", since: "2026-09-01T00:00:00Z", projectId }

    - "Why can''t I chart Purchase?" / "Purchase is missing or looks wrong in charts" / "why isn''t this event arriving?" / "is Purchase blocked?" → read BOTH { action: "events", eventTypes: ["Purchase"], projectId } and { action: "filters", eventTypes: ["Purchase"], projectId }

    - "Is user 123''s data being dropped?" → { action: "filters", dropValues: ["123"], projectId }

    - "Export the tracking plan as CSV" / "download user properties" → { action: "tracking_plans", exportType: "user_properties", projectId }

    - Discovering valid event or property names before building a query_dataset filter or group_by


    This is a fast schema lookup, except action "tracking_plans", which returns the whole plan as a CSV file. Do NOT run query_dataset to discover which events or properties exist, and do NOT rebuild a tracking-plan CSV from an events or properties read.


    # DO NOT USE FOR:

    - Metrics, counts, trends, funnels, retention → use ''query_dataset''

    - Creating, updating or deleting taxonomy → use ''manage_amp_events'' / ''manage_amp_properties''


    ACTIONS:

    | action | What it returns | Key params |

    |---|---|---|

    | events | Events in the tracking plan, with status and metadata. `kind` picks the surface: `event` (default, raw), `custom`, `labeled`, or `all` (custom + labeled together). | kind; raw: eventTypes, fields, lookbackWindow, where, includeDeleted, includeDescriptionImages, branchId/branchName; custom/labeled: customEventNames, customEventIds; both: limit, cursor |

    | properties | Properties by surface. propertyType selects which: event, user, group, derived, lookup, channel, persisted. | propertyType, eventType, names, sources, groupTypes, fields, lookbackWindow, where (event and user only), includeDeleted, includeHidden, includeBlocked, includeTransformations, branchId/branchName |

    | branch_changes | What a branch adds, removes or updates vs main — events, properties, templates, group types. Use before approving or merging: review_branch reports only a count. `detail` adds per-field before/after; `detailFor` expands only the entities you name. | branchId/branchName, includeMainDrift, detail, detailFor |

    | activity | Change history: who changed which taxonomy entity and when, newest first. Use for activity logs, "what changed since X", and per-person attribution. `detail` adds stored before/after values. | since, until, entityTypes, changeActions, loginIds, detail, limit, cursor, branchId/branchName |

    | filters | Block filters (stop ingestion from now on) and drop filters (hide stored data) from Data → Filters, for every environment of the project''s workspace. Read it for any event or property that is missing, can''t be charted, or looks wrong — these rules cause exactly that, and most of them never show on the event itself. Not branch-scoped. Pass eventTypes to leave out rules that cannot apply to those events, and dropValues to check whether specific values are in a drop filter''s list. | eventTypes, dropValues |

    | suggestions | Data Assistant cleanup suggestions, each item''s validation on a branch, and the existing tool or api-server endpoint that applies a supported item. The list itself is not branch-scoped; validation and apply arguments are. | branchId/branchName, locale |

    | workspace | The project''s Data → Settings governance: event and property naming conventions (`eventNC` / `propertyNC`: casing and structure), approval workflow and `mainProtected`, environments, and every tracking-plan branch with its id. Read it to find a branch to review, and before proposing, creating, renaming or reviewing event or property names. | — |

    | tracking_plans | The tracking plan as a CSV file. The text is a short summary; the CSV is an embedded file. `exportType` "events" (default) includes events, property groups, and event properties. "user_properties" is user properties only. `lookbackDayCount` (default 30, events only) sets the volume-column window. | exportType, lookbackDayCount, includeDeleted, branchId/branchName |


    INSTRUCTIONS:

    - Use get_amplitude_context first to get project IDs. If the user has not specified a project, prompt them to decide.

    - When the user asks to inspect or analyze a screenshot embedded in a raw event description, pass `includeDescriptionImages: true`. It resolves `ampl://` image references to attached image bytes; it is off by default.

    - Raw events and custom/labeled events take different identifiers: `eventTypes` for raw, `customEventNames` / `customEventIds` for custom and labeled. Passing the wrong one is rejected rather than ignored.

    - Only raw-event reads are branch-aware and take `fields`; custom and labeled events are neither branch-scoped nor field-projected.

    - An event or property whose ingested name contains U+FFFD, control characters, or JSON-significant glyphs (quotes, braces, backslashes) comes back with a `encodedName` field: an ASCII-only encoding of the exact name. Event-property rows additionally carry `encodedEventType` when the event they hang off has such a name. Copy these verbatim and pass them wherever that name is taken — `eventTypes` / `eventType` / `names` here, and the identifiers and update map keys of `manage_amp_events` and `manage_amp_properties`. Never retype the raw name into tool arguments; show the raw name to the user, not the encoded one. Rows without the field have ordinary names.

    - Where branch-aware, omit branchId/branchName for the default branch; otherwise pass exactly one selector.

    - Event and property semantics are unchanged from the tools this replaces — same statuses, same transformation folding, same field projection via fields.

    - Event status says whether an event has data to chart: "live" and "unexpected" events have been ingested and are queryable; "planned" has never been ingested. "unexpected" only means the event is not in the tracking plan — on its own it never stops an event from charting.

    - `firstSeen` / `lastSeen` on events and properties are live from ingestion. search_amp_data_taxonomy''s event ''first_seen'' / ''last_seen'' match these on hits marked `recency: "live"`; on hits marked `recency: "snapshot"` they come from a periodic snapshot dated by `metrics_as_of`, so when the two disagree, trust these. Use search_amp_data_taxonomy to find candidates when you don''t know the exact name, then read them here before calling one stale, recommending a delete, or saying when it started or stopped arriving.

    - `where` keeps only the rows that match every field you set: usage (`volume`, `queries`, both over `lookbackWindow`) and first or last ingestion (`firstSeen`, `lastSeen`, UTC). Use it rather than listing everything and filtering the rows yourself. It works on raw events and on event and user properties only. Raw events also filter on metadata: `status`, `state`, `category`, `tags`, `sources`, `official`, `activity`, `visibility` and `owner`. Properties take only `queries`, `firstSeen` and `lastSeen` for now (no `volume`). A row without a value for a field never matches it, so an event that was never ingested matches no `lastSeen` range.

    - activity reports current state nowhere: use it for "what changed", and events/properties for "what exists now".

    - activity is NOT a complete audit of everything that changed — say so rather than implying it is. Custom, labeled and autotrack event edits deliberately write no activity record; transformations live in a separate service with no activity log; derived and computed properties are not tracking-plan entities; and newly ingested unexpected events and properties never appear (read `firstSeen` from an events or properties read instead). Passing entityTypes or changeActions narrows further, dropping changes whose activity type has no mapping — sources, tags, group types, and edits made through the API — so an unfiltered query is the only complete view.

    - activity history belongs to the Data workspace, not the project, so every project sharing that workspace (its dev, staging and EU environments) returns the same rows. The response echoes workspaceId and branch — state that scope.

    - Diagnosing why an event or property can''t be charted, is missing, or looks wrong: read the event (or property) AND action "filters" with eventTypes, then name the block or drop rule that matches it, or say that none does. Read filters even when the event''s status is not "blocked" — status reflects exact-name block rules only, not prefix, numeric, or event-with-properties rules, and never drop filters. When the question is about specific values (a user, an org, a property value), also pass them in dropValues. Do not run query_dataset or another chart query in place of reading filters.

    - filters: never conflate block and drop. Rules come from sibling environments too, each tagged with its environment — never report one environment''s rule as another''s. An environment with accessible: false was not read, so its rules are unknown, not absent. Rows with target "unrecognized" are rules this tool could not interpret; report them.

    - Block rows group values: a name matches if it equals (exact) or starts with (prefix) ANY entry in `values`, case-sensitively — check the whole list. numeric: every character of the name is a digit (no sign, decimal point or spaces). with_properties: an event is blocked when its properties match every entry in properties.

    - eventType "_all" or "$ANY_EVENT" means every event; any other value is one exact event name, and "" on a block rule matches nothing. A drop filter with an empty eventType applies to every event.

    - A drop filter''s conditions are in propertyDefinitions. Each value list is cut to its first 20 values (100 when eventTypes is passed), with dropPropertyValuesTotal beside a cut list. When the response would hold more than 2000 drop values in all, the longest lists are cut further. A value missing from a cut list may still be dropped — never conclude it is not.

    - To check specific values ("is user 123 dropped?"), pass them in dropValues. Each condition with a value list then carries dropPropertyValuesMatched: the given values its FULL list contains, compared exactly and case-sensitively. An empty list means none of them are listed. A match only means the value is listed: apply the filter''s operator, event and time windows yourself — for operators such as contains or glob match, entries are patterns and an exact lookup can miss values they cover.

    - eventTypes scopes the read: pass raw ingested names (for a merge target, add its mergedFrom names). Every rule that could apply is kept — names match case-insensitively here, so still check each kept rule — and `omitted` counts what was left out (block: values, or whole rules without values; drop: filters).

    - `encodedValues` maps a value that cannot be retyped to its handle, and `encodedEventType` does the same for eventType. Pass handles verbatim to other taxonomy tools; show the raw name to the user.

    - branch_changes requires exactly one branch selector, and always reports a `comparison` field. "3-way" compares against the point the branch was cut and also returns `mainDrift` and `conflicts`; "2-way" is used when no review is open, may include changes main made after the branch was cut, and cannot report drift or conflicts. Relay that caveat rather than presenting a 2-way result as the branch''s own edits.

    - Naming conventions in `workspace` settings are the customer''s Data → Settings and take precedence over naming rules written in AI Context. When they disagree, follow the settings and tell the user about the conflict. AI Context still applies to everything the settings don''t cover (description wording, categories, required properties, allowed values).

    - Reviewing a branch: list branches with `workspace`, read `branch_changes` for the branch, and check every added or renamed name against the `workspace` naming conventions.'
  params:
    action: 'Which part of the tracking plan to read: "events", "properties", "branch_changes", "activity", "filters", "suggestions", "tracking_plans" (CSV file), or "workspace" (branches and naming conventions).'
    projectId: Numeric Amplitude project ID. Optional only when the user has exactly one accessible project.
    propertyType: 'properties: which property surface to read. Defaults to "event".'
    exportType: 'tracking_plans: "events" (default) is events + property groups + event properties. "user_properties" is the user-properties CSV only.'
    lookbackDayCount: 'tracking_plans + exportType=events: day lookback for volume and query columns. Defaults to 30. Ignored for user_properties.'
    kind: 'events: which event surface. "event" (default) = raw tracking-plan events. "custom" / "labeled" = the custom-or-labeled surface. "all" = custom and labeled together. Same vocabulary as manage_amp_events.'
    eventTypes: 'events + kind=event: exact event names to filter to (raw events only). filters: scope rules to these events; rules that apply to every event are always kept. Pass an event''s `encodedName` value verbatim, when it has one, instead of the raw name.'
    dropValues: 'filters: property or field values to look up in every drop condition''s full value list, past any cut. Matches come back as dropPropertyValuesMatched on each condition. Use for "is this value dropped?".'
    customEventIds: 'events + kind=custom|labeled|all: filter by custom/labeled event ids.'
    customEventNames: 'events + kind=custom|labeled|all: filter by exact display names (include punctuation/brackets as shown in the UI).'
    eventType: 'properties + propertyType=event: scope to one event; omit to list project-wide. Pass the event''s `encodedName` (or a property row''s `encodedEventType`) value verbatim when it has one, instead of the raw name.'
    sources: 'properties + propertyType=user: filter by property source.'
    groupTypes: 'properties + propertyType=group: filter to these group types.'
    derivedPropertyType: 'properties + propertyType=derived: narrow to one level.'
    names: 'properties, any propertyType: exact case-sensitive property names (1-100). Names that match nothing come back in `missing`. An `encodedName` value may be passed verbatim in place of a raw name. For event: alone, each row lists the events that use it; with eventType, returns only those properties on that event. For lookup, matches displayName or columnHeader.'
    name: Removed. Use names.
    configurationFilter: 'properties + propertyType=lookup: configuration status.'
    lookupTableName: 'properties + propertyType=lookup: filter to one lookup table.'
    fields: Select response row fields. Valid values depend on the action and propertyType; omit for that surface’s defaults. For action=events the default is the slim set name, displayName, description, status — pass fields to widen it. For action=events, include volume and/or queries for ingested volume and query counts. For event and user properties, include queries for query counts; event/user rows also support isSplit, cartChildPropertyNames, and cartParentPropertyNames.
    lookbackWindow: 'events: days of history for volume and queries. properties + propertyType=event|user: days of history for queries. One of 1, 30, 90, 180, or 365. Default 30. Allowed values: 1, 30, 90, 180, 365.'
    where: 'events + kind=event, and properties + propertyType=event|user: keep only rows that match every field set. volume and queries count over lookbackWindow; firstSeen and lastSeen are UTC. Events also take status, state, category, tags, sources, official, activity, visibility and owner; properties take only queries, firstSeen and lastSeen (no volume).'
    since: 'activity: inclusive start of the change window, ISO 8601 timestamp.'
    until: 'activity: inclusive end of the change window, ISO 8601 timestamp.'
    entityTypes: 'activity: restrict to these entity types. Omit for every recorded change — filtering drops changes whose activity type has no entity mapping (sources, tags, group types, API edits).'
    changeActions: 'activity: restrict to these change kinds. Omit for every recorded change; same mapping caveat as entityTypes.'
    loginIds: 'activity: only changes attributed to these Amplitude login IDs.'
    limit: Page size. Prefer exact-name filters over exhaustive listing. action=activity caps at 200.
    cursor: Pagination cursor.
    includeDeleted: Include deleted rows. Defaults false. Pass true before recommending or executing an event-property delete so deleted event–property links are also surfaced.
    includeDescriptionImages: 'events + kind=event: resolve every ampl:// image in returned event descriptions to bytes and attach the image content. Use only when the user asks to inspect or analyze those images — it adds Orbit + download cost. Defaults false.'
    includeHidden: 'properties: include hidden rows. Defaults true.'
    includeBlocked: 'properties: include blocked rows. Defaults true.'
    includeTransformations: 'properties + propertyType=event|user: include transformations. Defaults true.'
    branchId: Optional branch id (mutually exclusive with branchName).
    branchName: Optional branch name (mutually exclusive with branchId).
    locale: 'suggestions: locale for suggestion copy. Defaults to en-US. Ignored by other actions.'
    includeMainDrift: 'branch_changes: also list the entities main changed since the branch was cut, not just the count. Off by default — on a long-lived branch this can exceed the branch''s own diff.'
    detail: 'branch_changes: include per-field before/after for updated entities, plus tag, source and property-group deltas. activity: include each change’s stored before/after values. Off by default on both.'
    detailFor: 'branch_changes: expand only these entities, by name or id, across every bucket. Use the ids or names from a previous summary. Implies detail, and is not capped — use this when the unfiltered expansion truncates. Unresolvable names come back in detailForUnmatched.'
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: create_group_types
  description: 'Create one or more group types in a project, OR add already-ingested group types with status "unexpected" to the tracking plan.


    A group type is a category of group that users can belong to (for example "Company", "Account", "Team", "Workspace", "Organization"). The Amplitude Accounts add-on lets you analyse product usage at the group level rather than per individual user. NOTE: group TYPES are the categories themselves — use create_properties with propertyType "group" to add attributes (e.g. company name, plan tier) to an existing group type.


    When a user says "create a group type" without further qualification, or "add to plan" for an unexpected group type, use this tool. Specify whether each item is unexpected with `isUnexpected`. If `isUnexpected` is true, the group type must already exist in the project as observed-but-unexpected and will be added to the tracking plan. If false (default), a brand-new entry is created.


    INSTRUCTIONS:

    - Use get_context to get available project IDs first.

    - Use get_group_types to check which group types already exist before creating new ones.

    - If the user has not specified a project, prompt the user to decide. Don''t decide for them.


    EXAMPLES:

    - Minimal: {"projectId": "123456", "groupTypes": [{"name": "Company"}]}

    - With description: {"projectId": "123456", "groupTypes": [{"name": "Team", "description": "Engineering teams within a company"}]}

    - Mixed batch (one fresh, one add-to-plan, on a feature branch): {"projectId": "123456", "branchName": "marketing-edits", "groupTypes": [{"name": "Account"}, {"name": "Workspace", "isUnexpected": true}]}


    # Response

    Each input item is reported individually in `groupTypes[]` with a `result` of `"created"`, `"addedToPlan"`, or `"failed"` (with a `reason`). Partial successes are preserved: a failure on one item never discards the results of others in the same batch.


    PERMISSIONS:

    - This tool requires the "Update Tracking Plan" permission and may fail with a 403. Don''t pre-warn the user; if it fails, surface the error and note that an admin may need to grant access.


    # Workspace warnings

    Be sure you have information on the workspace settings and environments from get_workspace_context (or get_amp_taxonomy action workspace) before using this tool. If the workspace has more than one environment, warn the user that the change will apply across multiple environments. If the main branch is protected (workspace setting approvalWF is "Required"), let the user know that changes cannot be made on the default branch and they will have to first create a new branch and make changes on that.


    NOTES:

    - A group type with the same name cannot already exist on the targeted branch — that item will be marked as failed.

    - Branch targeting: unless specified, the default branch is used. Pass either branchId or branchName, not both.

    - `description` is only allowed on brand-new group types (isUnexpected: false). Unexpected items added to the plan cannot include metadata at the same time — add them first, then use a follow-up tool call to set the description.


    USER-INTERFACING LANGUAGE:

    When relaying results to the user, do not surface internal mechanics.

    - Refer to the default branch as "main", not "default branch".

    - Say "unexpected group types" not "isUnexpected group types".

    - Say "added to the tracking plan" rather than using field names like "addedToPlan".

    - Say "branch approval setting" not "approvalWF".

    - Do not mention "mutations", "versionId", "stagingVersionId", "propertyPath", branch IDs, or GraphQL details to the user.'
  params:
    projectId: Project ID to create the group types in. If the user has not specified a project, prompt the user to decide. Dont decide for them.
    groupTypes: Array of group types to create or add to plan
    branchId: Optional branch ID to target a non-default branch. If omitted, the project's default branch is used. Mutually exclusive with branchName.
    branchName: Optional branch name to target a non-default branch (e.g. "my-edits-branch"). If omitted, the project's default branch is used. Mutually exclusive with branchId.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_transformations
  description: 'Retrieve data transformations from a project. Transformations are data cleaning operations that merge events, merge properties, or map property values.


    WHEN TO USE:

    - Use this tool to see what transformations are configured for a project.

    - Use this tool to understand how events or properties are being merged or remapped.

    - Use this tool to audit data cleaning rules applied to a project.


    WHAT IT RETURNS:

    - A list of transformations with their type, name, description, and configuration details.

    - Transform types include: merge (merge events), merge_events_derived_prop (merge events with derived property), merge_event_properties, merge_user_properties, map_event_property_values, map_user_property_values.

    - description is the transformation''s stored text, usually the backend''s default ("merge events into X"). To document a merge, the transformation write tools put the description on the target in the tracking plan instead: the target event''s description (get_events, update_event) for event merges, the target property''s (get_properties, update_properties) for property merges.


    INSTRUCTIONS:

    - Get the project ID from the context tool.

    - Optionally filter by transform type to narrow results.

    - Use pagination to retrieve large lists of transformations.'
  params:
    projectId: Project ID to get transformations from. If the user has not specified a project, prompt the user to decide. Dont decide for them.
    transformType: 'Optional filter by transformation type. Values: merge, merge_events_derived_prop, merge_event_properties, merge_user_properties, map_event_property_values, map_user_property_values.'
    limit: Maximum number of transformations to return (1-500). Use this in conjunction with cursor to paginate through results.
    cursor: Pagination cursor for retrieving the next page of results. Use this in conjunction with limit to paginate through results.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: get_tracking_plan_sources
  description: 'List the sources configured on a project''s tracking plan (e.g. iOS, Android, Web, Server).


    WHEN TO USE:

    - You need source IDs before adding sources to an event in the tracking plan.

    - The user asks what sources are configured on their tracking plan.


    INSTRUCTIONS:

    - Pass projectId.

    - Returns each source''s id and name. Use the id when modifying event sources.


    NOTES:

    - The Sources UI merges tracking-plan labels with pipeline connections, but this tool returns only the tracking-plan catalog (id + name) for assigning sources to events. Use use_amplitude_data_connections for ingestion status, volumes, and warehouse/import connections.'
  params:
    projectId: Project ID to list tracking plan sources for. If the user has not specified a project, prompt the user to decide. Don't decide for them.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: track_ui_render_response
  description: 'Internal telemetry tool used by MCP UI components to report render latency and errors.


    NOT FOR DIRECT MODEL USE.'
  params:
    uiComponent: UI component identifier (e.g., amplitude-chart)
    renderLatency: UI render latency in milliseconds
    renderStatus: 'Render status: "success", an error message, or "client-error: <message>" for a crash inside the app iframe'
    chartId: Chart ID or edit ID associated with the render
    chartType: Chart definition type (e.g., eventsSegmentation, funnel, retention)
    projectName: Amplitude project name
    clientStack: Client exception stack. Logged only, not sent to analytics.
    componentStack: React component stack. Logged only, not sent to analytics.
    interaction: Recent clicks and the latest hover. Logged only, not sent to analytics.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
- name: use_amplitude_ai_feedback
  description: 'Read Amplitude AI Feedback (customer VoC) for a project — surveys, support tickets, app reviews, and grouped themes.


    This is CUSTOMER product feedback (what users said in connected sources). NOT for:

    - AI/LLM agent session quality, transcripts, or agent analytics → use get_amplitude_agent_analytics_info

    - Reporting that you (the agent) are stuck → use report_agent_feedback (requires user approval)


    Set `facet` to choose what to read:

    - `sources` → connected feedback integrations + sourceIds (call first when you need sourceIds for filters)

    - `comments` → raw feedback comments with search, categories, pagination

    - `insights` → grouped themes (requests, complaints, loved features, …) sorted by popularity

    - `mentions` → drill into comments behind ONE insightId or trendId (do not call for every insight)

    - `trends` → saved themes tracked over time


    TYPICAL WORKFLOWS:

    1. Bootstrap: facet=sources → facet=comments or facet=insights

    2. Themes: facet=insights → facet=mentions with insightId when user asks for examples

    3. Tracked themes: facet=trends → facet=mentions with trendId


    EXAMPLES:

    - Connected sources: {"facet": "sources", "projectId": "123456"}

    - Complaints this month: {"facet": "insights", "projectId": "123456", "types": ["complaint"], "dateStart": "2026-06-01", "dateEnd": "2026-06-30"}

    - What are customers saying about pricing: {"facet": "comments", "projectId": "123456", "search": ["pricing", "price"]}

    - Show comments behind insight 42: {"facet": "mentions", "projectId": "123456", "insightId": 42}'
  params:
    facet: 'Discriminator: determines which set of parameters applies (sources | comments | insights | mentions | trends)'
    projectId: The project ID (appId) to get feedback sources for
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
    sourceIds: 'Optional source IDs to scope comments to specific feedback sources (default: all sources). Get IDs from get_feedback_sources.'
    categories: Optional insight categories (e.g. ["complaint","request"]). Keeps only comments with an extracted point in one of these categories. Pass all categories to keep only actionable comments (drop noise with no insights).
    dateStart: Optional start date for filtering comments (ISO date string)
    dateEnd: Optional end date for filtering comments (ISO date string)
    page: 'Optional page number for pagination (default: 1)'
    pageSize: 'Optional page size for pagination (default: 50, max: 50)'
    search: Search term(s) to filter comments by body text. Multiple terms are OR-matched. Pass granular synonyms for better recall.
    labelFilters: Optional label filters as "labelKey:valueKey" tokens (e.g. ["product_area:onboarding_flow", "severity:high"]). Multiple values for the same labelKey are OR-matched; different labelKeys are AND-matched. Use the value keys returned in a comment's labels field, not display names.
    types: Array of insight types to filter by
    orderDirection: 'Optional sort direction by mention count (default: desc)'
    ampId: Optional Amplitude user ID to filter insights by specific amplitude user
    insightId: The insight ID to retrieve mentions for (required if trendId not provided)
    trendId: The trend ID to retrieve mentions for (required if insightId not provided)
    sourceId: Source ID to filter mentions by - should match get_feedback_insights query
    category: Optional category filter (e.g., request, complaint, lovedFeature). Legacy values (bug, painPoint, takeaway) are still accepted for backwards compatibility.
- name: get_amplitude_agent_analytics_info
  description: 'Single read entry point for Amplitude Agent Analytics (AI/LLM session investigation).


    NOT FOR: Customer product feedback (use use_amplitude_ai_feedback) or browser Session Replay.


    Set `view` to choose the read route (each view has its own parameters in the tool schema):

    - `schema` — fields, rubrics, taxonomy, filter_options. Use only when an exact filter identifier is not already known; request only the needed filterOptionTypes.

    - `sessions` — filtered session lists and groupBy aggregations (replaces metrics/timeseries tools).

    - `conversation` — full transcript; sessionId is required.

    - `spans` — per-operation trace; sessionId or traceId is required (no org-wide scans).

    - `tool_reliability` — metrics enum is only tool_stats | tool_definitions.


    REMOVED (use sessions filters instead):

    - search_agent_analytics_conversations (ILIKE scans)

    - query_agent_analytics_metrics quality/cost/topics/timeseries enums


    EXAMPLES:

    - Agent names: { "view": "schema", "projectId": "12345", "include": ["filter_options"], "filterOptionTypes": ["agent_names"] }

    - Failed sessions: { "view": "sessions", "projectId": "12345", "hasTechnicalFailure": true, "agentNames": ["global-chat"] }

    - Transcript: { "view": "conversation", "projectId": "12345", "sessionId": "abc-123" }

    - Tool reliability: { "view": "tool_reliability", "projectId": "12345", "metrics": ["tool_stats","tool_definitions"], "agentNames": ["global-chat"] }'
  params:
    view: 'Discriminator: determines which set of parameters applies (schema | sessions | conversation | spans | tool_reliability)'
    include: 'Sections to return. Enum: fields | rubrics | taxonomy | filter_options. Pass a JSON array, not a string.'
    filterOptionTypes: 'Filter option catalogs to fetch. Enum: agent_names | tool_names | evaluators | datasets. Request only the catalogs needed; omitted returns all.'
    projectId: Amplitude project id to scope filter_options to. Required. Call get_amplitude_context with no arguments first to list the projects you can access, then pass an id from that list — do NOT guess project ids.
    rationale: Brief explanation of why you are calling this tool and what you expect to learn from the result.
    startDate: ISO 8601 start date (e.g., "2026-01-01"). Defaults to 7 days ago, or to all time when sessionIds or a dataset is given.
    endDate: ISO 8601 end date (e.g., "2026-02-01"), inclusive; a date-only value covers that whole UTC day. Defaults to now.
    agentNames: Filter by agent names (e.g., ["global-chat", "Chart Agent"])
    toolNames: Filter by tool names used in sessions. Use get_agent_analytics_schema to discover available names.
    customerOrgIds: Filter by customer org IDs (string IDs, e.g., ["12345"])
    userIds: Filter by user IDs (e.g., ["user@example.com"])
    cohortIds: Filter to sessions whose user belongs to ANY of these Amplitude cohort IDs. Requires projectId.
    userIntents: Filter by OOTB User Intent L1 labels from [Agent] Session Record (e.g. ["Information Request", "Task Execution"]). NOT Topic Intelligence clusters — use clusterStableId for those.
    clusterStableId: Filter to sessions in this Topic Intelligence L1 cluster. Requires clusterRunId from query_topic_clusters.
    subStableClusterId: Filter to sessions in this Topic Intelligence L2 subtopic. Requires clusterRunId.
    clusterRunId: Topic Intelligence clustering run id. Required when using clusterStableId or subStableClusterId.
    sessionIds: Filter by specific session IDs
    datasetId: Filter to sessions in a specific gold dataset (by dataset ID). Use get_agent_analytics_schema to discover dataset IDs and names.
    datasetName: Filter to sessions in a gold dataset by name (case-insensitive exact match, else first substring match). Resolves to a dataset ID.
    includeAnnotations: Attach per-session human "comments" (notes) and "labels" (tags) to each returned session. Fetched for up to 100 returned sessions.
    parentAgentName: Filter by parent agent name (for sub-agent delegation sessions)
    status: Filter by session status (e.g., "open", "closed")
    closeReason: DEPRECATED — will error. Use evalFilters instead.
    emailDomain: DEPRECATED — will error.
    primaryTopics: DEPRECATED — will error. Use evalFilters instead.
    overallOutcomes: DEPRECATED — will error. Use evalFilters instead.
    hasTaskFailure: Filter sessions with task failures (compat shim → task_failure eval)
    hasNegativeFeedback: Filter sessions with negative feedback (compat shim → negative_feedback eval)
    hasTechnicalFailure: Filter sessions with/without technical failures (system-level crashes/exceptions)
    evalFilters: 'Primary filter: modular evaluator results. Example for GAE2 data mismatch: [{"evaluatorId":"01KS3TGK1732EXA7EP0AAFVPN6","evaluatorType":"categorical","values":["RESP_DATA_RESPONSE_MISMATCH"]}]'
    evalSuiteId: Restrict to sessions evaluated by any evaluator in this suite
    minCostUsd: Minimum total cost in USD
    maxCostUsd: Maximum total cost in USD
    minQualityScore: DEPRECATED — will error. Use evalFilters instead.
    maxQualityScore: DEPRECATED — will error. Use evalFilters instead.
    minSentimentScore: DEPRECATED — will error. Use evalFilters instead.
    maxSentimentScore: DEPRECATED — will error. Use evalFilters instead.
    minDurationMs: Minimum session duration in milliseconds
    maxDurationMs: Maximum session duration in milliseconds
    minTurnCount: DEPRECATED — will error.
    maxTurnCount: DEPRECATED — will error.
    customerName: Filter by customer org name (fuzzy match, e.g., "eBay" matches "eBay Inc"). Resolves name to org IDs.
    topicClassifications: DEPRECATED — will error. Use evalFilters instead.
    groupBy: 'Group by session-level field for aggregations. Options: agent_name, customer_org_id, user_id, project_id, parent_agent_name, source_system.'
    orderBy: DEPRECATED for enrichment sorts (quality_score, sentiment_score). Default ordering is session_start DESC.
    searchQuery: 'Search filter: partial user_id match or exact session_id match. Prefix with - to exclude.'
    responseFormat: '''concise'' returns session summaries. ''detailed'' includes full enrichment data. Default: concise.'
    evaluatorResultFormat: 'Controls evaluator_results per session. ''none'' skips them, ''summary'' returns compact outcomes, and ''full'' returns complete result JSON. Default: full for backward compatibility.'
    evaluatorResultIds: Return evaluator_results only for these evaluator IDs (each session carries a result per evaluator, so full results for every evaluator are large). Does not filter which sessions are returned.
    limit: Max sessions per page (1-50, default 50). Use cursor for additional pages.
    cursor: Pagination cursor from previous response
    sessionId: The session ID to get conversation turns for (required)
    includeCategories: Include per-turn category annotations (e.g., topic, intent)
    roles: Only return turns with these roles (e.g. ["user","assistant"]). Omit to return every turn, tool turns included.
    traceId: Only return turns from this trace ID.
    includeTurnMetadata: Include each turn's metadata. Set false to shrink the response when metadata is not needed.
    componentType: Filter by span component type
    toolName: Filter by tool name
    modelName: Filter by model name
    toolDefinitionsHash: Filter spans that used this tool-definitions hash
    metrics: Only tool_stats and/or tool_definitions (not quality, cost, or timeseries — use view=sessions for those).
