name: Brave Search
entryKey: brave-search
serverUserType: singleUser
shortDescription: Search the web, news, images, videos, and places with the Brave Search API
description: |
  Search the web through the [Brave Search API](https://brave.com/search/api/) with Brave's own [MCP server](https://github.com/brave/brave-search-mcp-server).

  ## Features
  - **Web search**: Web results with freshness, country, and language filters
  - **News, image, and video search**: Recent articles, pictures, and videos on a topic
  - **LLM context**: Pre-extracted page content for grounding answers, instead of plain links
  - **Local and place search**: Businesses and points of interest with addresses, ratings, and hours
  - **Summarizer**: AI summaries of web search results with inline references

  ## What you'll need to connect

  **Required:**
  - **Brave Search API key**: Create one in the [Brave Search API dashboard](https://api-dashboard.search.brave.com/). Every request counts against that key's plan.

  ## Important considerations
  - Local search, extra snippets, and the summarizer need a paid plan; on a plan without them, those tools return an error or fall back to web search.
  - Search queries are sent to Brave. Don't search for confidential information.
metadata:
  categories: Retrieval & Search
icon: https://brave.com/static-assets/images/brave-logo-sans-text.svg
repoURL: https://github.com/brave/brave-search-mcp-server
runtime: npx
npxConfig:
  package: "@brave/brave-search-mcp-server@2.1.4"
  egressDomains:
    - api.search.brave.com
config:
  - key: BRAVE_API_KEY
    name: Brave Search API Key
    required: true
    sensitive: true
    description: Your Brave Search API key, from https://api-dashboard.search.brave.com/
    usage: env
toolPreview:
- name: brave_web_search
  description: "Performs web searches using the Brave Search API and returns comprehensive search results with rich metadata.\n\n    When to use:\n        - General web searches for information, facts, or current topics\n        - Location-based queries (restaurants, businesses, points of interest)\n        - News searches for recent events or breaking stories\n        - Finding videos, discussions, or FAQ content\n        - Research requiring diverse result types (web pages, images, reviews, etc.)\n\n    Returns a JSON list of web results with title, description, and URL.\n    \n    When the \"results_filter\" parameter is empty, JSON results may also contain FAQ, Discussions, News, and Video results."
  params:
    query: Search query (max 400 chars, 50 words)
    country: Search query country, where the results come from. The country string is limited to 2 character country codes of supported countries.
    search_lang: Search language preference. The 2 or more character language code for which the search results are provided.
    ui_lang: The language of the UI. The 2 or more character language code for which the search results are provided.
    count: Number of results (1-20, default 10). Applies only to web search results (i.e., has no effect on locations, news, videos, etc.)
    offset: Pagination offset (max 9, default 0)
    safesearch: 'Filters search results for adult content. The following values are supported: ''off'' - No filtering. ''moderate'' - Filters explicit content (e.g., images and videos), but allows adult domains in search results. ''strict'' - Drops all adult content from search results. The default value is ''moderate''.'
    freshness: 'Filters search results by when they were discovered. The following values are supported: ''pd'' - Discovered within the last 24 hours. ''pw'' - Discovered within the last 7 days. ''pm'' - Discovered within the last 31 days. ''py'' - Discovered within the last 365 days. ''YYYY-MM-DDtoYYYY-MM-DD'' - Timeframe is also supported by specifying the date range e.g. 2022-04-01to2022-07-30.'
    text_decorations: Whether display strings (e.g. result snippets) should include decoration markers (e.g. highlighting characters).
    spellcheck: Whether to spellcheck the provided query.
    result_filter: Result filter (default ['web', 'query'])
    goggles: Goggles act as a custom re-ranking on top of Brave's search index. The parameter supports both a url where the Goggle is hosted or the definition of the Goggle. Multiple goggle URLs and/or definitions can be provided in an array. For more details, refer to the Goggles repository (i.e., https://github.com/brave/goggles-quickstart).
    units: The measurement units. If not provided, units are derived from search country.
    extra_snippets: A snippet is an excerpt from a page you get as a result of the query, and extra_snippets allow you to get up to 5 additional, alternative excerpts. Only available under Free AI, Base AI, Pro AI, Base Data, Pro Data and Custom plans.
    summary: This parameter enables summary key generation in web search results. This is required for summarizer to be enabled.
- name: brave_local_search
  description: "Brave Local Search API provides enrichments for location search results. Access to this API is available only through the Brave Search API Pro plans; confirm the user's plan before using this tool (if the user does not have a Pro plan, use the brave_web_search tool). Searches for local businesses and places using Brave's Local Search API. Best for queries related to physical locations, businesses, restaurants, services, etc.\n    \n    Returns detailed information including:\n        - Business names and addresses\n        - Ratings and review counts\n        - Phone numbers and opening hours\n\n    Use this when the query implies 'near me', 'in my area', or mentions specific locations (e.g., 'in San Francisco'). This tool automatically falls back to brave_web_search if no local results are found."
