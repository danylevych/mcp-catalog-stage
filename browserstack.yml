name: BrowserStack
entryKey: browserstack
serverUserType: singleUser
shortDescription: Run tests on real browsers and devices, manage test cases, and review results with BrowserStack's official MCP server
description: |
  Test web and mobile apps and manage testing work through [BrowserStack's hosted MCP server](https://github.com/browserstack/mcp-server).

  See BrowserStack's [MCP server documentation](https://github.com/browserstack/mcp-server) for setup instructions, the [tool reference](https://github.com/browserstack/mcp-server/blob/main/docs/TOOLS.md), and current capabilities.

  ## Features
  - **Testing on real browsers and devices**: Start live and automated sessions for web and mobile apps
  - **Test Management**: Create and update projects, folders, test cases, test plans, and test runs, and record results
  - **Test Reporting and Analytics**: Review builds, failures, and flaky tests
  - **Visual and accessibility testing**: Review Percy visual changes and run accessibility scans
  - **Capability catalog**: Find and run any BrowserStack capability through the core tools (`listProducts`, `searchCapability`, `describeCapability`, `invokeCapability`)

  ## What you'll need to connect
  - A BrowserStack account with access to the products you want to use.

  When you connect, BrowserStack asks you to sign in and authorize Obot. Tool calls use your BrowserStack identity and its permissions.

  ## Important considerations
  - The hosted server cannot reach apps behind a VPN, a firewall, or on localhost: BrowserStack Local testing needs the local MCP server, which this entry does not run.
  - Tools that upload files from your computer (such as generating test cases from a requirements file) are not available on the hosted server.
  - Several tools change or archive Test Management data. Review what the agent proposes before confirming bulk edits.
metadata:
  categories: Developer Tools, Automation & Browsers
icon: https://avatars.githubusercontent.com/u/1119453?v=4
repoURL: https://github.com/browserstack/mcp-server
runtime: remote
remoteConfig:
  fixedURL: https://mcp.browserstack.com/mcp
toolPreview:
- name: accessibilityExpert
  description: Answer accessibility, a11y, and WCAG questions using BrowserStack's accessibility knowledge base.
  params:
    query: Any accessibility, a11y, WCAG, or web accessibility question
- name: startAccessibilityScan
  description: Scan a web page URL for accessibility issues and get a CSV report. For a mobile app, run it on App Automate with accessibility on (setupBrowserStackAppAutomateTests), then fetchAccessibilityIssues.
  params:
    name: Name of the accessibility scan
    pageURL: The web page URL to scan for accessibility issues
    authConfigId: Optional auth config ID for authenticated scans
    advancedRules: Run the advanced accessibility rules (default true).
    wcagVersion: WCAG version and level to check against, e.g. "wcag22aa", or "rgaa41" for RGAA 4.1 (default "wcag21aa").
    bestPractices: Also report best-practice issues (default false).
    needsReview: Also report "needs review" issues to check by hand (default true).
    experimentalRules: Run the experimental accessibility rules (default true).
- name: createAccessibilityAuthConfig
  description: Create an authentication configuration for accessibility scans. Supports both form-based and basic authentication.
  params:
    name: Name for the auth configuration
    type: 'Authentication type: ''form'' for form-based auth, ''basic'' for HTTP basic auth'
    url: URL of the authentication page
    username: Site username; omit to have it requested from the user.
    password: Site password; omit to have it requested from the user.
    usernameSelector: CSS selector for username field (required for form auth)
    passwordSelector: CSS selector for password field (required for form auth)
    submitSelector: CSS selector for submit button (required for form auth)
- name: getAccessibilityAuthConfig
  description: 'Retrieve an existing authentication configuration by ID. Id: from createAccessibilityAuthConfig, or askBrowserStackAI with product "a11y" to find one.'
  params:
    configId: ID of the auth configuration to retrieve
- name: fetchAccessibilityIssues
  description: 'Fetch accessibility issues from one source: scanId+scanRunId, buildId, workflowReportId, appReportId or reportUrl. Ids: a link, startAccessibilityScan, or web_accessibility lists (searchCapability).'
  params:
    scanId: 'Website Scanner scan id: from startAccessibilityScan or list_website_scanner_scans (searchCapability).'
    scanRunId: 'Website Scanner run id: from startAccessibilityScan, or list_website_scanner_scan_runs (searchCapability).'
    buildId: 'Web or App Accessibility build id: the SDK''s testhub id, a link''s thBuildId, or one listed via searchCapability.'
    workflowReportId: 'Workflow Analyzer report id: from its link, or list_workflow_analyzer_reports (searchCapability).'
    appReportId: Manual App Accessibility report id (a UUID), from its /report/ link or a report listed via searchCapability.
    reportUrl: A web or app report dashboard link (scan, build, manual report), a scanner share link, or an (App) Automate link.
    cursor: 'Character offset for pagination (default: 0); with compareWith, how many issues are already listed.'
    pageUrl: Only the issues on this page URL, counted as the dashboard's page view counts them.
    compareWith: '"previous", or an older scanRunId of the same scan, or an earlier app build''s id or link; lists new and resolved issues.'
    exportTaskId: Continue a CSV export that an earlier call said is still being generated.
- name: setupBrowserStackAutomateTests
  description: 'Set up and run automated web-based tests on BrowserStack using the BrowserStack SDK. Use this tool for functional or integration test setup on BrowserStack only. For any visual testing or Percy integration, use the dedicated Percy setup tool. Example prompts: run this test on browserstack; set up this project for browserstack.'
  params:
    projectName: A single name for your project to organize all your tests.
    detectedLanguage: ''
    detectedBrowserAutomationFramework: ''
    detectedTestingFramework: ''
    devices: 'Device objects array. Use the object format directly - no transformation needed. Add only when user explicitly requests devices. Examples: [{ platform: ''windows'', osVersion: ''11'', browser: ''chrome'', browserVersion: ''latest'' }] or [{ platform: ''android'', deviceName: ''Samsung Galaxy S24'', osVersion: ''14'', browser: ''chrome'' }].'
    accessibility: 'Run Accessibility (WCAG) checks during the tests: writes accessibility: true in browserstack.yml.'
- name: managePercyBuildApproval
  description: Approve or reject a Percy build
  params:
    buildId: The ID of the Percy build to approve or reject.
    action: The action to perform on the Percy build.
- name: runAppLiveSession
  description: Open a manual App Live session for the user to operate by hand; the agent cannot drive it. To tap, type or read the app yourself, use a mobiledevicecontrol session via invokeCapability.
  params:
    desiredPhone: 'The full name of the device to run the app on. Example: ''iPhone 12 Pro'' or ''Samsung Galaxy S20'' or ''Google Pixel 6''. Always ask the user for the device they want to use, do not assume it.'
    desiredPlatformVersion: Specifies the platform version to run the app on. For example, use '12.0' for Android or '16.0' for iOS. If the user says 'latest', 'newest', or similar, normalize it to 'latest'. Likewise, convert terms like 'earliest' or 'oldest' to 'oldest'.
    desiredPlatform: 'Which platform to run on, examples: ''android'', ''ios''. Set this based on the app path provided.'
    browserstackAppUrl: BrowserStack app URL (bs://... format). Upload your .ipa or .apk file to BrowserStack and use the returned URL here.
- name: runBrowserLiveSession
  description: Open a manual Live browser session for the user to operate by hand; the agent cannot drive it. To click, type or read the page yourself, use a devicecontrol session via invokeCapability.
  params:
    platformType: Must be 'desktop' or 'mobile'
    desiredURL: The URL to test
    desiredOS: Desktop OS ('Windows' or 'OS X') or mobile OS ('android','ios','winphone')
    desiredOSVersion: The OS version must be specified as a version number (e.g., '10', '14.0') or as a keyword such as 'latest' or 'oldest'. Normalize variations like 'newest' or 'most recent' to 'latest', and terms like 'earliest' or 'first' to 'oldest'. For macOS, version names (e.g., 'Sequoia') must be used instead of numeric versions.
    desiredBrowser: Browser for desktop (Chrome, IE, Firefox, Safari, Edge)
    desiredBrowserVersion: Browser version for desktop (e.g. '133.2', 'latest'). If the user says 'latest', 'newest', or similar, normalize it to 'latest'. Likewise, convert terms like 'earliest' or 'oldest' to 'oldest'.
    desiredDevice: Device name for mobile
- name: createProjectOrFolder
  description: Create a project and/or folder in BrowserStack Test Management. Creating a project needs no identifier. Creating a folder inside an EXISTING project needs that project's identifier (PR-*); no tool here lists projects, so use the capability functions to look it up.
  params:
    project_name: Name of the project to create.
    project_description: Description for the new project.
    project_identifier: Existing project identifier to use for folder creation.
    folder_name: Name of the folder to create.
    folder_description: Description for the new folder.
    parent_id: Parent folder ID; if omitted, folder is created at root.
- name: createTestCase
  description: Use this tool to create a test case in BrowserStack Test Management. Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return.
  params:
    project_identifier: The ID of the BrowserStack project where the test case should be created. If no project identifier is provided, ask the user if they would like to create a new project using the createProjectOrFolder tool.
    folder_id: The ID of the folder within the project where the test case should be created. If not provided, ask the user if they would like to create a new folder using the createProjectOrFolder tool.
    name: Name of the test case.
    description: Brief description of the test case.
    owner: Email of the test case owner.
    preconditions: Any preconditions (HTML allowed).
    test_case_steps: List of steps and expected results.
    issues: List of the linked Jira, Asana or Azure issues ID's. This should be strictly in array format not the string of json.
    issue_tracker: ''
    tags: Tags to attach to the test case. This should be strictly in array format not the string of json
    custom_fields: Map of custom field NAME to value; use an array for multi-select fields.
    automation_status: Automation status of the test case. Common values include 'not_automated', 'automated', 'automation_not_required'.
    priority: Priority of the test case. Accepts either display name (e.g. 'Critical', 'High', 'Medium', 'Low') or internal name (e.g. 'medium'). If omitted, the project default (usually 'Medium') is applied. Valid values are per-project and discoverable via the form-fields endpoint.
    case_type: Test case type display or internal name (per-project). Omit for project default.
    template: 'System template slug only: ''test_case_steps'' or ''test_case_bdd''. For a custom template, use template_id instead.'
    template_id: Numeric ID of a custom template (from listTestCaseTemplates); applies that template. Overrides 'template'.
- name: updateTestCase
  description: 'Update an existing test case in BrowserStack Test Management. Any subset of the following fields may be changed: name, description, preconditions, test_case_steps, owner, priority, case_type, automation_status, status, tags, issues, custom_fields. Only the supplied fields are modified. Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return.'
  params:
    project_identifier: The ID of the BrowserStack project containing the test case to update.
    test_case_identifier: The ID of the test case to update. This can be found using the listTestCases tool.
    name: Updated name of the test case.
    description: Updated brief description of the test case.
    preconditions: Updated preconditions for the test case.
    test_case_steps: Updated list of test case steps with expected results.
    owner: Email of the test case owner.
    priority: Updated priority. Accepts either display name (e.g. 'Medium', 'Critical', 'High', 'Low') or internal name (e.g. 'medium'). Valid values are per-project and discoverable via the form-fields endpoint.
    case_type: Updated test case type. Accepts either display name (e.g. 'Functional', 'Regression', 'Smoke & Sanity') or internal name (e.g. 'functional', 'smoke_sanity'). Valid values are per-project.
    automation_status: Updated automation status. Use internal name such as 'not_automated', 'automated', 'automation_not_required', 'cannot_be_automated', or 'obsolete'.
    status: Updated review status of the test case (e.g. 'active', 'draft', 'in_review', 'outdated', 'rejected').
    tags: Replacement list of tags for the test case.
    issues: Replacement list of linked Jira/Asana/Azure issue IDs for the test case.
    custom_fields: Map of custom field NAME to value; use an array for multi-select fields.
- name: listTestCases
  description: 'List test cases in a project, optionally scoped to a specific folder. Omit folder_id to list all test cases in the project; provide folder_id (discoverable via listFolders) to list only that folder''s cases. Supports filters: case_type, priority, pagination. Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return.'
  params:
    project_identifier: Identifier of the project to fetch test cases from. This id starts with a PR- and is followed by a number.
    folder_id: Optional. If provided, only return test cases in this folder. If omitted, returns all test cases in the project. Folder ids can be discovered via listFolders.
    case_type: Comma-separated list of case types (e.g. functional,regression).
    priority: Comma-separated list of priorities (e.g. critical,medium,low).
    p: Page number.
- name: listFolders
  description: List folders in a BrowserStack Test Management project, returning each folder's id and name (plus case counts and sub-folder counts). Pass parent_id to list sub-folders under a specific folder instead of top-level folders. Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return.
  params:
    project_identifier: Identifier of the project to fetch folders from (starts with PR- followed by a number).
    parent_id: If provided, list sub-folders under this parent folder id. If omitted, lists top-level folders.
    p: Page number.
- name: listTestCaseTemplates
  description: List test-case templates with their numeric template_id. Use the id with createTestCase to apply a custom template (the 'template' slug only selects system templates).
  params:
    name: Case-insensitive substring filter on template name.
- name: createTestRun
  description: Create a test run in BrowserStack Test Management. Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return.
  params:
    project_identifier: Identifier of the project in which to create the test run.
    test_run: ''
- name: listTestRuns
  description: List test runs in a project with optional filters (date ranges, assignee, state, etc.) Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return.
  params:
    project_identifier: Identifier of the project to fetch test runs from (usually starts with PR-).
    run_state: Return all test runs with this state (comma-separated)
- name: updateTestRun
  description: Update a test run's metadata and/or add test cases to it. Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return.
  params:
    project_identifier: Identifier of the project (Starts with 'PR-')
    test_run_id: Test run identifier (e.g., TR-678)
    test_run: ''
- name: addTestResult
  description: Add a test result to a specific test run via BrowserStack Test Management API. Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return.
  params:
    project_identifier: Identifier of the project (Starts with 'PR-')
    test_run_id: Identifier of the test run (e.g., TR-678)
    test_result: ''
    test_case_id: Identifier of the test case, e.g., 'TC-13'.
- name: createLCASteps
  description: Generate Low Code Automation (LCA) steps for a test case in BrowserStack Test Management using the Low Code Automation Agent. Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return.
  params:
    project_identifier: ID of the project (Starts with 'PR-')
    test_case_identifier: Identifier of the test case (e.g., 'TC-12345')
    base_url: Base URL for the test (e.g., 'google.com')
    requires_authentication: Set true if the test case requires login.
    credentials: Login credentials; omit to have them requested from the user.
    local_enabled: Whether local testing is enabled
    test_name: Name of the test
    test_case_details: Test case details including steps
    wait_for_completion: 'Whether to wait for LCA build completion (default: true)'
- name: listTestPlans
  description: 'List test plans in a BrowserStack Test Management project. Returns each plan''s identifier (TP-*), name, status, description, dates, and active/closed test-run counts. Supports pagination. Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return. Creating a test plan or sub-plan, and linking or unlinking test runs on one, are not available as tools here: use the capability functions, which reach Test Management''s own API for these operations. They ask you to confirm before changing anything.'
  params:
    project_identifier: Identifier of the project to fetch test plans from (starts with PR- followed by a number).
    p: Page number.
- name: getTestPlan
  description: 'Fetch a test plan by identifier (TP-*) from BrowserStack Test Management. Returns plan metadata, the full list of linked test runs, total test-case count across runs, and a status summary — suitable for generating test documentation or QA status reports. Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return. Requires a test plan identifier (TP-*). Call listTestPlans first if you do not have it. Creating a test plan or sub-plan, and linking or unlinking test runs on one, are not available as tools here: use the capability functions, which reach Test Management''s own API for these operations. They ask you to confirm before changing anything.'
  params:
    project_identifier: Identifier of the project (starts with PR- followed by a number).
    test_plan_identifier: Identifier of the test plan (starts with TP- followed by a number).
- name: listSubTestPlans
  description: 'List sub-test-plans under a parent test plan (TP-*) in a Test Management project. Supports pagination. Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return. Requires a test plan identifier (TP-*). Call listTestPlans first if you do not have it. Creating a test plan or sub-plan, and linking or unlinking test runs on one, are not available as tools here: use the capability functions, which reach Test Management''s own API for these operations. They ask you to confirm before changing anything.'
  params:
    project_identifier: Project identifier (PR-*).
    parent_test_plan_identifier: Parent test plan identifier (TP-*).
    p: Page number.
- name: getSubTestPlan
  description: 'Fetch a sub-test-plan (STP-*) under a parent plan (TP-*). Returns metadata and linked test runs. Requires a project identifier (PR-*). No tool here lists projects, so if you do not have one, use the capability functions to list the Test Management projects, then retry this tool with the identifier they return. Requires a test plan identifier (TP-*). Call listTestPlans first if you do not have it. Creating a test plan or sub-plan, and linking or unlinking test runs on one, are not available as tools here: use the capability functions, which reach Test Management''s own API for these operations. They ask you to confirm before changing anything.'
  params:
    project_identifier: Project identifier (PR-*).
    parent_test_plan_identifier: Parent test plan identifier (TP-*).
    sub_test_plan_identifier: Sub-test-plan identifier (STP-*).
- name: takeAppScreenshot
  description: Use this tool to take a screenshot of an app running on a BrowserStack device. This is useful for visual testing and debugging.
  params:
    desiredPhone: 'The full name of the device to run the app on. Example: ''iPhone 12 Pro'' or ''Samsung Galaxy S20''. Always ask the user for the device they want to use.'
    desiredPlatformVersion: The platform version to run the app on. Use 'latest' or 'oldest' for dynamic resolution.
    desiredPlatform: Platform to run the app on. Either 'android' or 'ios'.
    browserstackAppUrl: BrowserStack app URL (bs://... format). Upload your app to BrowserStack and use the returned URL here.
- name: runAppTestsOnBrowserStack
  description: Execute pre-built native mobile test suites (Espresso for Android, XCUITest for iOS) by direct upload to BrowserStack. ONLY for compiled .apk/.ipa test files. This is NOT for SDK integration or Appium tests. For Appium-based testing with SDK setup, use 'setupBrowserStackAppAutomateTests' instead.
  params:
    devices: 'Tuples describing target mobile devices. Add device only when user asks explicitly for it. Defaults to [] . Example: [[''android'', ''Samsung Galaxy S24'', ''14''], [''ios'', ''iPhone 15'', ''17'']]'
    project: Project name for organizing test runs on BrowserStack.
    detectedAutomationFramework: The automation framework used in the project, such as 'espresso' (Android) or 'xcuitest' (iOS).
    accessibility: App Accessibility checks on screens the tests touch (Android 11+, iOS 14+); suite must be built with BrowserStack's SDK.
    browserstackAppUrl: BrowserStack app URL (bs://... format). Upload your application file to BrowserStack and use the returned URL here.
    browserstackTestSuiteUrl: BrowserStack test suite URL (bs://... format). Upload your test suite file to BrowserStack and use the returned URL here.
- name: setupBrowserStackAppAutomateTests
  description: Set up BrowserStack App Automate SDK integration for Appium-based mobile app testing. ONLY for Appium based framework . This tool configures SDK for various languages with appium. For pre-built Espresso or XCUITest test suites, use 'runAppTestsOnBrowserStack' instead.
  params:
    detectedFramework: 'The mobile automation framework configured in the project. Example: ''appium'''
    detectedTestingFramework: 'The testing framework used in the project. Be precise with framework selection Example: ''testng'', ''behave'', ''pytest'', ''robot'''
    detectedLanguage: 'The programming language used in the project. Supports Java and C#. Example: ''java'', ''csharp'''
    devices: 'Tuples describing target mobile devices. Add device only when user asks explicitly for it. Defaults to [] . Example: [[''android'', ''Samsung Galaxy S24'', ''14''], [''ios'', ''iPhone 15'', ''17'']]'
    appPath: Path to the mobile app file (.apk for Android, .ipa for iOS). Can be a local file path or a BrowserStack app URL (bs://)
    project: Project name for organizing test runs on BrowserStack.
    accessibility: Run App Accessibility (WCAG) checks on the screens the tests touch; Android 11+ or iOS 14+.
- name: getFailureLogs
  description: Fetch logs, or the session video URL, for an Automate/App Automate session. Requires a session id. listSessions lists them for a build; if you do not have the build either, getBuildId or listBuildId resolves one from a project and build name.
  params:
    sessionType: Type of BrowserStack session. Must be explicitly provided by the user.
    sessionId: The BrowserStack session ID. Must be explicitly provided by the user.
    buildId: App Automate build ID. Optional — resolved from the session if omitted.
    logTypes: The types of logs to fetch.
- name: fetchAutomationScreenshots
  description: Fetch screenshots captured during an Automate/App Automate session.
  params:
    sessionId: The BrowserStack session ID to fetch screenshots from
    sessionType: Type of BrowserStack session
- name: listSessions
  description: 'List sessions for a hashed Automate/App Automate build: session IDs, status, OS, browser/device, dashboard URL.'
  params:
    sessionType: Type of BrowserStack session
    buildId: Hashed build id from the dashboard, or the observability build id from getBuildId.
    limit: Max sessions to return. Defaults to 10.
    offset: Pagination offset for the REST session list.
    status: Optional session status filter (e.g. done, running, error). Applied client-side.
- name: fetchSelfHealedSelectors
  description: Fetch BrowserStack self-healed selectors plus the test source code for the run. Provide exactly one of `sessionId` (single Automate / App-Automate session) or `buildUuid` (full self-healing report for a build). Pass the returned locator pairs to `prepareSelfHealingPlan` to plan edits. Requires a session id. listSessions lists them for a build; if you do not have the build either, getBuildId or listBuildId resolves one from a project and build name.
  params:
    sessionId: Session ID. Mutually exclusive with buildUuid.
    sessionType: Used with sessionId. Defaults to automate.
    buildUuid: Build UUID. Fetches the build's self-healing report.
- name: prepareSelfHealingPlan
  description: 'Build a self-healing edit plan that bundles locator pairs with test source code for the calling LLM to apply with its own editing tools. This tool does NOT modify files — it returns structured context so the LLM can edit only the relevant call sites (avoids blind find/replace across shared ids/classes). `sessions` accepts the canonical shape `[{sessionId, locators: [{original, healed, thought?}]}]`, a single session object, an envelope `{sessions: [...]}`, the raw report `{healing_logs: [...]}` (with `healed_selectors` aliasing `locators`), and snake_case keys (`session_id`, `original_locator`, `healed_locator`, `healing_thought`). Requires a session id. listSessions lists them for a build; if you do not have the build either, getBuildId or listBuildId resolves one from a project and build name.'
  params:
    sessions: Sessions to plan edits for. See tool description for accepted shapes.
- name: fetchBuildInsights
  description: Fetch build details and quality gate results. Includes hashed_id and session_type for listSessions.
  params:
    buildId: The build UUID of the BrowserStack build
- name: fetchRCA
  description: Fetch AI Root Cause Analysis for the current user's failed BrowserStack Automate/App-Automate tests. Suggests fixes only; never auto-apply, require explicit user approval. Requires test ids. Call listTestIds first if you do not have it.
  params:
    testId: Array of integer test IDs to fetch RCA data for (maximum 3 IDs). These must be numeric test IDs, not session IDs or strings. If not provided, use the listTestIds tool to get all failed testcases. If more than 3 IDs are provided, only the first 3 will be processed.
- name: getBuildId
  description: Get the BrowserStack build ID for a given project and build name, scoped to the current user's builds.
  params:
    browserStackProjectName: BrowserStack project name from the test run config (e.g. browserstack.yml). Exact match; no default.
    browserStackBuildName: BrowserStack build name from the test run config (e.g. browserstack.yml). Exact match; no default.
- name: listBuildId
  description: Get the latest build ID for a project and build name, across all users (no user filter).
  params:
    browserStackProjectName: BrowserStack project name from the test run config (e.g. browserstack.yml). Exact match; no default.
    browserStackBuildName: BrowserStack build name from the test run config (e.g. browserstack.yml). Exact match; no default.
- name: listTestIds
  description: List all tests of a BrowserStack build (each with its status and session id); optional status filter. Requires a BrowserStack build id. Call getBuildId or listBuildId first if you do not have it.
  params:
    buildId: The Browserstack Build ID of the test run. If not known, use the getBuildId tool to fetch it using project and build name
    status: Filter tests by status. If not provided, all tests are returned. Example for RCA usecase always use failed status
    includeFailureDetail: Add per-test failure signature for clustering. Default false.
- name: askBrowserStackAI
  description: '(Alpha, limited availability. Enabled per account and per product; if it is not enabled the call returns an entitlement error, nothing runs, and you should complete the task with the individual tools instead. To request access, the user should contact their BrowserStack account owner.) Use this when no other BrowserStack tool here fits the task, or when the ones you tried did not get you there. Prefer a specific tool whenever one fits: it is faster and more predictable than handing the job to an agent. Otherwise, describe what you want in plain language and BrowserStack''s agent decides which calls to make, then returns its answer plus the steps it took. Anything that would change data pauses and asks you to confirm it first; deletes are refused outright. Put that confirmation to the user and answer with what THEY say — never decide on their behalf. If it cannot be put to anyone, the run is read-only and everything it wanted to change comes back in `needs_approval` instead. One task per call.'
  params:
    product: 'Which product to work in: tm (Test Management), a11y (Accessibility), tra (Test Reporting & Analytics).'
    query: What you want, in plain language. One thing per call.
    run_id: '`run_id` from a needs_approval result.'
    perm_id: '`perm_id` from that same result.'
    decision: The user's answer. Never assume allow — ask them.
- name: listProducts
  description: 'List the BrowserStack products this surface can reach: what each one does, the entities it models, and a line saying what each entity is. START HERE — searchCapability needs a product, and this is what tells you which one. If two products could both fit the task, ask the user rather than choosing for them. ALWAYS pass the user''s request, in their own words, as `query`: the answer then says outright whether the products clash over the words in it. WHEN IT REPORTS A CLASH — two products claiming the same word for different things — ASK THE USER WHICH PRODUCT THEY MEAN AND WAIT FOR THEIR ANSWER BEFORE SEARCHING OR INVOKING ANYTHING. The response carries the question to put to them and what the shared word means in each product. Choosing for them, or searching each product in turn and merging the results, is the failure this call exists to prevent.'
  params:
    query: The user's request, in their own words. With it the response carries a `routing` block saying whether the products share the vocabulary this request uses — and, when they do, the question to put to the user before searching either product.
- name: describeEntity
  description: 'Describe one entity: what it is, what identifies it, what it relates to, and the vocabulary the product uses for it. Read this before filtering or writing, because ids and field values usually have to be resolved first.'
  params:
    product: 'Which product the entity belongs to: app_accessibility, devicecontrol, loadtesting, mobiledevicecontrol, tm, tra, web_accessibility.'
    entity: Entity name, as listProducts returns it.
- name: searchCapability
  description: 'Find endpoints this surface can call, by plain language, within ONE product. CALL listProducts FIRST, passing the user''s request as its `query`: it names the products, says whether they clash over the words in that request, and gives you the question to ask when they do. You need it anyway — `product` here takes a name exactly as listProducts spells it. Where two products use the same word for different things, ask the USER and wait for an answer rather than picking. Search matches the product''s OWN words, not synonyms. When your words are not the product''s, the response says so: `weak_match: true` with a `suggested_vocabulary` map of the product''s entities and their aliases. Results are still returned, but treat them as unconfirmed — pick the closest entity from that map and search again using its vocabulary, or call describeEntity on it for the fuller picture. That one extra round trip is far cheaper than invoking the wrong capability. Narrowing further with `entity` sharpens results. THIS IS A SHORTLIST, NOT A CONTRACT. Each result carries only what you need to CHOOSE: `name` (the handle), `product`, `mode` (whether it writes), `intent` and `guidance` (what it does and what goes wrong), and `method`/`path` for products that publish no name yet. It does NOT carry parameters or response shapes. Once you have picked one, call describeCapability for its full contract, then invokeCapability. Fetching the contract only for the one you chose is the difference between ~1k and ~8.6k tokens a search. Results are ranked and capped. TO SEE EVERYTHING rather than search, pass query=''*'' — that lists the product (honouring `entity` and `mode`) in a stable order instead of ranking it, which is what you want when the task is ''what can this product do'' rather than a lookup. TO PAGE, send `offset`: every response carries `offset` and, when more matched, `next_offset` — resend the SAME query with that value. `next_offset` is absent on the last page, so walk until it stops rather than comparing counts.'
  params:
    query: 'What you are trying to do, in plain language. Pass ''*'' (or ''all'') to BROWSE instead of search: every capability in the product, in a stable order, paginated — use it when you want to see the surface rather than find one thing.'
    entity: Restrict to one entity (listProducts names them).
    product: Which product to search, named exactly as listProducts spells it. Call listProducts with the user's request to get the name — and to find out whether the products clash over it, in which case ask the user first.
    routing_token: The `routing_token` from the last listProducts call or product_ambiguous refusal — it carries what that step concluded about the user's request, signed. Always pass the most recent one. When it reports a clash, send the user's answer in `user_words` alongside it; neither works alone.
    user_words: The USER'S OWN words, verbatim, that settle which product this is — either the product's name or a term only one product uses ('quality gate', 'test plan'). Quote them; do not paraphrase, and do not write words the user did not say. When a query could mean either product this is what lifts the refusal, because it is checked against the index rather than taken on trust.
    mode: Restrict to reads or writes. Omit to let the query decide.
    limit: Max results (default 8).
    offset: Skip this many results — send the `next_offset` from the previous response with the SAME query to get the next page. Omit for the first page.
- name: describeCapability
  description: 'The full contract for ONE capability you picked from searchCapability: its parameters grouped into path_params / query / body under the spec''s own names, what it returns, and its declared response shapes fully expanded. Call this after search and before invokeCapability — search deliberately omits all of it, because it is only needed for the one capability you actually call. Identify it by `name`, exactly as search returned it; only when a result carries no `name` (some products publish none yet) pass `method` and `path` instead. Every parameter lists its type, whether it is required, its allowed values where the set is closed, and any limits the product declares — obey those before calling rather than discovering them from a rejected request.'
  params:
    name: The capability's published name, exactly as searchCapability returned it.
    method: HTTP method — only for capabilities returned without a `name`.
    path: Path with {placeholders} intact — only for capabilities returned without a `name`.
    product: Which product owns it (app_accessibility, devicecontrol, loadtesting, mobiledevicecontrol, tm, tra, web_accessibility). searchCapability returns it on every result; required only when two products share a name or a path.
    include_responses: 'Which declared responses to expand: ''success'' (default, the 2xx shape), ''all'' (adds the error shapes — several times larger, and near-identical across endpoints), or ''none''.'
- name: invokeCapability
  description: Call a capability whose contract you have from describeCapability. Pass `name` exactly as given — that is the handle; only when a result carries no `name` pass `method` and `path` instead. Arguments go in path_params / query / body under the spec's own names. One call makes one request and returns the product's response as sent; `select` narrows it only where the contract carries `narrowable`, and reports what it narrowed. When `completed` is false there is another page, fetched with the capability's own page parameter. If the mode is 'write' you MUST ask the user first, then resend with user_permission='granted' and a change_summary; both are recorded. Capabilities whose mode is 'destructive' are refused outright — archiving, closing and merging are ordinary writes and DO run, so read the mode and intent before confirming with the user.
  params:
    name: The capability's published name, exactly as returned (e.g. 'create_test_run_by_integer_id'). Preferred over method/path.
    method: HTTP method — only for capabilities returned without a `name`.
    path: Path with {placeholders} intact — only for capabilities returned without a `name`.
    path_params: Values for the {placeholders}.
    query: Query parameters.
    body: Body fields, under the spec's names.
    product: Which product owns the capability (app_accessibility, devicecontrol, loadtesting, mobiledevicecontrol, tm, tra, web_accessibility). searchCapability returns it on every result; required only when two products share a name or a path.
    user_permission: Set to 'granted' only after the user has confirmed a write.
    change_summary: What will change. Required for writes.
    select: 'Only for a capability whose contract carries `narrowable`: narrows the response to those fields and reports what it narrowed.'
- name: submitFeedback
  description: Report a blocker, tool error, missing capability, or user feedback to BrowserStack. Never include PII or credentials.
  params:
    message: What you tried, what happened, what you expected
    category: Kind of report
    toolName: Tool the report is about, if any
    intent: What the user was trying to achieve
- name: help-asset-upload
  description: Generate a curl command and guidance for uploading assets (apps, test suites) to BrowserStack services. For screenshots, use app-live-upload.
  params:
    file_path: Path to the file to upload
    asset_type: Type of asset to upload
