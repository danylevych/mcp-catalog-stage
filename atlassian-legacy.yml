      contentType: "Type of content: page or blog post"
      customContentId: Custom content ID to include
      pageId: "Page or blog post ID, or a Confluence tiny link ID (the encoded part from /wiki/x/ URLs, e.g., Fc1bBw)"
      parentCommentId: Parent comment ID for replies
  - name: createConfluenceInlineComment
    description: "Create an inline comment on specific text in a page or blog post. For top-level comments, provide pageId and inlineCommentProperties (text selection + match counts). For replies, provide parentCommentId only (no pageId or inlineCommentProperties). You must first fetch the page content (e.g. using getConfluencePage) to find the exact text and count how many times it appears. Incorrect or missing inlineCommentProperties can result in a 400 error from the Confluence API."
    params:
      body: "Page/comment body. When contentFormat is \"html\", use standard HTML for headings (<h1>-<h6>), paragraphs (<p>), tables (<table>/<thead>/<tbody>/<tr>/<th>/<td>), links (<a href=\"URL\">), code (<pre><code class=\"language-python\">), and lists (<ul>/<ol>/<li>). Confluence-specific HTML+ uses data-type attributes, not CSS classes: panels <div data-type=\"panel-info|panel-warning|panel-note|panel-success|panel-error\"><p>text</p></div>; status <span data-type=\"status\" data-color=\"green|red|yellow|blue|neutral|purple\">Label</span>; task list <ul data-type=\"task-list\"><li data-type=\"task-item\"><input type=\"checkbox\"> Item</li></ul>; decision list <ul data-type=\"decision-list\"><li data-type=\"decision-item\" data-state=\"DECIDED|UNDECIDED\">text</li></ul>; expand <details><summary>Title</summary><p>content</p></details>; layout <section data-type=\"layout-two-equal|layout-three-equal\"><div data-type=\"column\"><p>Column</p></div></section>; inline card <a href=\"URL\" data-card-appearance=\"inline\">text</a>; date <time datetime=\"YYYY-MM-DD\">label</time>; mention <span data-type=\"mention\" data-user-id=\"ACCOUNT_ID\">@Name</span>; inline placeholder <span data-type=\"placeholder\">prompt</span>; macro/extension <div data-type=\"extension|bodied-extension|multi-bodied-extension\" data-extension-key=\"KEY\" data-extension-type=\"TYPE\" data-parameters=\"JSON\"></div>; sync block <div data-type=\"sync-block|bodied-sync-block\" data-resource-id=\"ID\"></div>; media group <div data-type=\"media-group\"><div data-type=\"media\" data-media-type=\"file\" data-id=\"MEDIA_ID\" data-collection=\"COLLECTION\">file.pdf</div></div>; inline media <span data-type=\"media-inline\" data-media-id=\"MEDIA_ID\" data-media-collection=\"COLLECTION\">file.pdf</span>. For native Confluence macros use data-extension-type=\"com.atlassian.confluence.macro.core\" and never storage XML (<ac:structured-macro>). Omit macroId. Do not invent opaque IDs: only copy data-user-id, data-id, data-collection, data-media-id, data-media-collection, data-resource-id, and data-local-id from existing content or tool output; omit data-local-id on new nodes. Preserve existing data-local-id when editing fetched HTML. Tables support data-number-column, data-layout=\"default|center|wide|full-width\", data-display-mode=\"fixed\", data-width, row/col spans, data-colwidth, and cell data-background. Breakout supports data-breakout=\"wide|full-width\" on details, pre, section, and sync blocks. Follow ADF nesting: task/decision items, headings, and captions are inline-only; list items cannot contain headings/tables/panels/expands; panels cannot contain tables/expands/blockquotes/panels; table cells can contain headings, panels, lists, media, blockquote, decision list, and nested expand (<details data-type=\"nested-expand\">) but not nested tables or normal expand. Never wrap content in <html>, <head>, or <body> tags."
      cloudId: Cloud ID (UUID or site URL)
      contentFormat: "Content format for page/comment body. Use \"html\" to write or read Confluence content as structured HTML. HTML supports standard blocks plus Confluence HTML+ data-type nodes: panels, status, task/decision lists, expands, layouts, cards, media, dates, mentions, macros/extensions, and sync blocks. HTML is round-trip safe and preserves inline comments and existing local IDs. It must follow valid ADF nesting rules: inline-only task/decision items, headings, and captions; no self-nesting panels, expands, tables, or blockquotes. Invalid HTML will be rejected with a descriptive error so you can retry. Use \"markdown\" for simplified plain text. Defaults vary by tool when omitted."
      contentType: "Type of content: page or blog post"
      inlineCommentProperties: "Required for top-level inline comments (not replies). Provide textSelection, textSelectionMatchCount (total occurrences on the page), and textSelectionMatchIndex (0-based, must be < textSelectionMatchCount)."
      pageId: "Page or blog post ID, or a Confluence tiny link ID (the encoded part from /wiki/x/ URLs, e.g., Fc1bBw). Use for top-level inline comments only; do not provide with parentCommentId."
      parentCommentId: "Parent comment ID for replies. When provided, this creates a reply to an existing inline comment thread. Do not provide pageId or inlineCommentProperties."
  - name: searchConfluenceUsingCql
    description: "Search Confluence content (pages, blog posts, comments, attachments) using CQL (Confluence Query Language). CQL is specific to Confluence and is not interchangeable with JQL."
    params:
      cloudId: Cloud ID (UUID or site URL)
      cql: "CQL (Confluence Query Language) query string. CQL is specific to Confluence and is not JQL. Common fields: title, text, space, type, creator, contributor, label, ancestor, parent, lastmodified, created, mention, watcher, space.title, space.key. Use space key (not name) for the space field; use space.title ~ \"name\" for name search. Content types: page, blogpost, comment, attachment. Escape inner quotes with backslash: title ~ \"Q2 \\\"planning\\\" review\". Examples: title ~ \"meeting notes\" AND type = page | space.title ~ \"Engineering\" AND lastmodified >= now(\"-2w\") AND type = page | creator = currentUser() AND type = page | text ~ \"Q2 \\\"planning\\\" review\" AND type = page"
      cqlcontext: "CQL context for narrowing search scope (e.g., spaceKey)"
      cursor: Pagination cursor
      expand: Properties to expand
      limit: "Max results (default: 25, max: 250)"
      next: Include next page link
      prev: Include previous page link
  - name: getJiraIssue
    description: Get issue details
    params:
      cloudId: Cloud ID (UUID or site URL)
      expand: "Additional issue details to expand in the response (for example, renderedFields or names)."
      failFast: Whether to fail quickly when some fields cannot be loaded instead of partially returning data.
      fields: "Issue fields to return. When omitted or empty, defaults to: summary, description, status, issuetype, priority, labels, components, assignee, reporter, created, updated, resolution, project. Pass \"*all\" to return every field (including custom fields). Include \"comment\" to fetch issue comments in fields.comment.comments."
      fieldsByKeys: Whether fields in the request are referenced by field keys instead of IDs.
      issueIdOrKey: "Issue ID or key (e.g., PROJ-123 or 10000)"
      properties: Issue property keys to include in the response.
      responseContentFormat: "Content format for body content. Use \"markdown\" for simplified plain text. Use \"adf\" (Atlassian Document Format, JSON) for full programmatic fidelity. Defaults vary by tool when omitted."
      updateHistory: "Whether to update the user's recently viewed projects/history for this issue request."
  - name: createJiraIssue
    description: "Create a Jira issue. Use additional_fields to set any Jira field that does not have its own parameter (e.g. custom fields, priority, components)."
    params:
      additional_fields: "REQUIRED for custom fields. This is the ONLY parameter to set priority, labels, custom fields, components, fix versions, or any other Jira fields not listed above. Pass a JSON object with field names as keys. Examples: {\"components\": [{\"name\": \"Backend\"}]}, {\"fixVersions\": [{\"name\": \"v1.2\"}]}, {\"priority\": {\"name\": \"High\"}}, {\"labels\": [\"bug\"]}, {\"customfield_10001\": \"value\"}."
      assignee_account_id: Assignee ID
      cloudId: Cloud ID (UUID or site URL)
      contentFormat: "Content format for body content. Use \"markdown\" for simplified plain text. Use \"adf\" (Atlassian Document Format, JSON) for full programmatic fidelity. Defaults vary by tool when omitted."
      description: "Issue description. With contentFormat \"markdown\" (default), pass plain text or Markdown as a string. With contentFormat \"adf\", pass an ADF JSON string or a document object with type \"doc\"."
      issueTypeName: "Type (Task, Bug, Story)"
      parent: Parent for subtasks
      projectKey: Project key
      responseContentFormat: "Content format for body content. Use \"markdown\" for simplified plain text. Use \"adf\" (Atlassian Document Format, JSON) for full programmatic fidelity. Defaults vary by tool when omitted."
      summary: Issue summary/title
      transition: "Optional workflow transition to apply during creation. Use getTransitionsForJiraIssue to find valid transition IDs. Placed at top level of Jira API request, not inside fields."
  - name: editJiraIssue
    description: "Update issue. After updating, returns the issue using the same default read fields as getJiraIssue (summary, description, status, issuetype, priority, labels, components, assignee, reporter, created, updated, resolution, project). Use getJiraIssue with fields [\"all\"] or a custom list if you need more."
    params:
      cloudId: Cloud ID (UUID or site URL)
      contentFormat: "Content format for body content. Use \"markdown\" for simplified plain text. Use \"adf\" (Atlassian Document Format, JSON) for full programmatic fidelity. Defaults vary by tool when omitted."
      fields: "Fields to set, keyed by field name or customfield_* ID. To CLEAR a field, pass an explicit null, e.g. { \"resolution\": null }. Clearing the resolution is the fix when a reopened issue is blocked from transitioning because it still has a Resolution set."
      issueIdOrKey: "Issue ID or key (e.g., PROJ-123 or 10000)"
      responseContentFormat: "Content format for body content. Use \"markdown\" for simplified plain text. Use \"adf\" (Atlassian Document Format, JSON) for full programmatic fidelity. Defaults vary by tool when omitted."
  - name: addCommentToJiraIssue
    description: Add or update a comment on a Jira issue
    params:
      cloudId: Cloud ID (UUID or site URL)
      commentBody: Comment body
      commentId: "ID of an existing comment to update. If omitted, a new comment is added."
      commentVisibility: "Restrict visibility to a group or role with type ('group', 'role') and value (group/role name)"
      contentFormat: "Content format for body content. Use \"markdown\" for simplified plain text. Use \"adf\" (Atlassian Document Format, JSON) for full programmatic fidelity. Defaults vary by tool when omitted."
      issueIdOrKey: "Issue ID or key (e.g., PROJ-123 or 10000)"
      responseContentFormat: "Content format for body content. Use \"markdown\" for simplified plain text. Use \"adf\" (Atlassian Document Format, JSON) for full programmatic fidelity. Defaults vary by tool when omitted."
  - name: addWorklogToJiraIssue
    description: "Add or update a worklog on a Jira issue. When worklogId is provided, updates that worklog;"
    params:
      cloudId: Cloud ID (UUID or site URL)
      commentBody: Comment body
      contentFormat: "Content format for body content. Use \"markdown\" for simplified plain text. Use \"adf\" (Atlassian Document Format, JSON) for full programmatic fidelity. Defaults vary by tool when omitted."
      issueIdOrKey: "Issue ID or key (e.g., PROJ-123 or 10000)"
      started: "When the work was started (ISO 8601 date-time, e.g. 2026-03-09T09:00:00.000+0000). If omitted, the worklog is booked at the current date/time."
      timeSpent: "Time spent (e.g. 2h, 30m, 4d). Required for new worklogs; use to set or change time when updating."
      visibility: "Restrict visibility to a group or role with type ('group', 'role') and value (group/role name)"
      worklogId: "ID of an existing worklog to update. If omitted, a new worklog is created."
  - name: getJiraIssueRemoteIssueLinks
    description: Get remote links
    params:
      cloudId: Cloud ID (UUID or site URL)
      globalId: "An identifier for the remote item (e.g., 'appId=456&pageId=123'). When provided, returns only the link with this global ID"
      issueIdOrKey: "Issue ID or key (e.g., PROJ-123 or 10000)"
  - name: getIssueLinkTypes
    description: "Get available Jira issue link types (e.g. Blocks, Duplicate, Clones, Relates). For createIssueLink: inwardIssue = blocker, outwardIssue = blocked (e.g. \"A is blocked by B\" → inwardIssue: B, outwardIssue: A)."
    params:
      cloudId: Cloud ID (UUID or site URL)
  - name: createIssueLink
    description: "Create a link between two Jira issues. For directional link types (e.g. Blocks): inwardIssue = issue that blocks, outwardIssue = issue that is blocked (e.g. \"A is blocked by B\" → inwardIssue: B, outwardIssue: A). Use getIssueLinkTypes if link type is unknown."
    params:
      cloudId: Cloud ID (UUID or site URL)
      comment: Optional comment on the outward issue.
      contentFormat: "Content format for body content. Use \"markdown\" for simplified plain text. Use \"adf\" (Atlassian Document Format, JSON) for full programmatic fidelity. Defaults vary by tool when omitted."
      inwardIssue: Inward issue key (e.g. HSP-1).
      outwardIssue: Outward issue key (e.g. MKY-1).
      type: "Link type name (e.g. Duplicate, Blocks, Clones, Relates). Use getIssueLinkTypes to list available types."
  - name: getTransitionsForJiraIssue
    description: Get transitions
    params:
      cloudId: Cloud ID (UUID or site URL)
      expand: Additional properties to expand
      includeUnavailableTransitions: Whether to include transitions that are not available to the current user
      issueIdOrKey: "Issue ID or key (e.g., PROJ-123 or 10000)"
      skipRemoteOnlyCondition: Whether to skip remote-only conditions
      sortByOpsBarAndStatus: Whether to sort transitions by ops bar and status
      transitionId: Filter to specific transition
