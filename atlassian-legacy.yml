    params:
      cloudId: Cloud ID (UUID or site URL)
      fields: Additional fields to update during transition
      historyMetadata: Additional history metadata for the transition
      issueIdOrKey: "Issue ID or key (e.g., PROJ-123 or 10000)"
      transition: "Transition object with id (required) - use 'getTransitionsForJiraIssue' to find available transitions"
      update: Operations to perform on issue fields (list of operations per field)
  - name: getVisibleJiraProjects
    description: Get projects
    params:
      action: "Filter by permission type (view, browse, edit, create) - default: create"
      cloudId: Cloud ID (UUID or site URL)
      expandIssueTypes: Include additional information about issue types (default - true)
      maxResults: "Maximum items to return per page (max: 50, default: 50)"
      searchString: Filter using literal string. Projects with matching key or name are returned (case insensitive)
      startAt: "Index of first item to return (page offset, default - 0)"
  - name: getJiraProjectIssueTypesMetadata
    description: Get issue types
    params:
      cloudId: Cloud ID (UUID or site URL)
      maxResults: "Maximum items to return per page (max: 200, default: 50)"
      projectIdOrKey: Project ID or key
      startAt: "Index of first item to return (page offset, default - 0)"
  - name: getJiraIssueTypeMetaWithFields
    description: Get field metadata
    params:
      cloudId: Cloud ID (UUID or site URL)
      issueTypeId: The ID of the issue type
      maxResults: "Maximum items to return per page (max: 200, default: 50)"
      projectIdOrKey: The ID or key of the project
      requiredFieldsOnly: "When true (default), returns only the fields that are required to create an issue of this type, reducing response size. Set to false to return all available fields (both required and optional)."
      startAt: "Index of first item to return (page offset, default - 0)"
  - name: searchJiraIssuesUsingJql
    description: "Search issues with JQL, total counts only when explicitly requested."
    params:
      cloudId: Cloud ID (UUID or site URL)
      fields: "Issue fields to return. When omitted or empty, defaults to: summary, description, status, issuetype, priority, labels, components, assignee, reporter, created, updated, resolution, project. Pass \"*all\" to return every field (including custom fields). Include \"comment\" to fetch issue comments in fields.comment.comments."
      jql: JQL query
      maxResults: Max (50-100)
      nextPageToken: Page token
      responseContentFormat: "Content format for body content. Use \"markdown\" for simplified plain text. Use \"adf\" (Atlassian Document Format, JSON) for full programmatic fidelity. Defaults vary by tool when omitted."
      searchResultMode: "Default \"issues\". Never count for normal search or if nextPageToken used. If total for same query is known, reuse it. Use \"count\" only when no trusted count exists and either the user asks or a downstream step needs it. Use \"all\" only if both count and issues required."
  - name: lookupJiraAccountId
