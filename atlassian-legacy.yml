name: Atlassian Legacy
entryKey: atlassian-legacy
serverUserType: singleUser
shortDescription: "Manage Jira issues, Confluence pages, and Compass services with AI assistance"
description: |
  A Model Context Protocol (MCP) server that bridges between your Atlassian Cloud site and compatible external tools. Once configured, it enables those tools to interact with Jira, Compass, and Confluence data in real-time.

  ## Features
  - **Smart Jira Management**: Create, update, search, and transition issues with AI assistance, manage comments, worklogs, and issue links
  - **Intelligent Confluence Operations**: Search content using CQL, create and update pages, manage comments (footer, inline, and replies), and navigate page hierarchies
  - **Compass Integration**: Query service dependencies and manage your service landscape
  - **Rovo Search & Fetch**: Powerful unified search across Jira and Confluence, fetch resources by ARI (Atlassian Resource Identifier)
  - **Advanced Filtering**: Use JQL for Jira issues and CQL for Confluence content with AI-powered natural language queries
  - **Zero Configuration**: OAuth flow handles authentication automatically - no API tokens or local setup needed
  - **Enterprise Ready**: Respects existing user permissions and access controls across all Atlassian products

  ## What you'll need to connect

  **No Setup Required**: Authentication is handled automatically through OAuth2 workflow.

  **Important for Admins**: To enable OAuth with Agentic Coworker, your Atlassian admin must add the Agentic Coworker callback URL domain:
  1. Go to [Atlassian Administration](https://admin.atlassian.com) and select your organization
  2. Navigate to **Apps > AI settings > Rovo MCP server**
  3. Add your Agentic Coworker domain (e.g., `https://your-agentic-coworker-domain/**`)

  ## Example Usage

  Ask your AI assistant to:

  - **Jira Management** - "Update Jira ticket PROJ-123 status to In Progress" or "Log 2h of work on ticket PROJ-123"
  - **Confluence Search** - "Find our OKR guide in Confluence and summarize it" or "Search for authentication documentation"
  - **Content Creation** - "Create a tech design doc for XYZ feature in the Engineering space"
  - **Issue Filtering** - "Show me all urgent bugs assigned to me from last week"
  - **Cross-Product Linking** - "Link Jira ticket ABC-456 to DEF-789 as Blocks"
  - **Compass Integration** - "What services depend on the api-gateway component?"

metadata:
  categories: "Developer Tools"
  allow-multiple: "true"
icon: https://avatars.githubusercontent.com/u/168166?s=200&v=4
repoURL: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/getting-started-with-the-atlassian-remote-mcp-server/
runtime: remote
remoteConfig:
  fixedURL: https://mcp.atlassian.com/v1/mcp
toolPreview:
  - name: atlassianUserInfo
    description: Get current user info
    params: {}
  - name: getAccessibleAtlassianResources
    description: "Get cloudId to make tool calls. When a link is provided (e.g. https://site.atlassian.net/*), try passing the site hostname (e.g. site.atlassian.net) as cloudId to other tools first; if that fails, use this tool to list accessible resources."
    params: {}
  - name: search
    description: "Search Jira and Confluence using Rovo Search, ALWAYS use this tool to search for Jira and Confluence content unless the word CQL or JQL is used in the context"
    params:
      cloudId: Not needed for this tool — cloudId is derived from your access token automatically
      query: The search query to use for Rovo Search
  - name: fetch
    description: "Get details of a Jira issue or Confluence page by ARI (Atlassian Resource Identifier), if the id is not an ARI, then use a different tool to fetch the content"
    params:
      cloudId: Not needed for this tool — cloudId is extracted from the ARI automatically
      id: "Atlassian Resource Identifier (ARI) from search results, e.g., \"ari:cloud:jira:cloudId:issue/10107\" or \"ari:cloud:confluence:cloudId:page/123456789\""
  - name: getConfluenceSpaces
    description: Get spaces
    params:
      cloudId: Cloud ID (UUID or site URL)
      expand: Properties to expand
      favoritedBy: User favorites
      favourite: Favorite spaces only
      ids: Space IDs
      keys: Space keys
      labels: Space labels
      limit: "Max results (default: 25, max: 250)"
      start: Start index
      status: Space status
      type: Space type
  - name: getConfluencePage
    description: "Get a Confluence page or blog post by ID, including body content."
    params:
      cloudId: Cloud ID (UUID or site URL)
      contentFormat: "Content format for page/comment body. Use \"html\" to write or read Confluence content as structured HTML. HTML supports standard blocks plus Confluence HTML+ data-type nodes: panels, status, task/decision lists, expands, layouts, cards, media, dates, mentions, macros/extensions, and sync blocks. HTML is round-trip safe and preserves inline comments and existing local IDs. It must follow valid ADF nesting rules: inline-only task/decision items, headings, and captions; no self-nesting panels, expands, tables, or blockquotes. Invalid HTML will be rejected with a descriptive error so you can retry. Use \"markdown\" for simplified plain text. Defaults vary by tool when omitted."
      contentType: "Type of content: page or blog post"
      pageId: "Page or blog post ID, or a Confluence tiny link ID (the encoded part from /wiki/x/ URLs, e.g., Fc1bBw)"
  - name: getPagesInConfluenceSpace
    description: Get pages or blog posts in a space
    params:
      cloudId: Cloud ID (UUID or site URL)
      contentFormat: "Content format for body content. Use \"markdown\" for simplified plain text. Use \"adf\" (Atlassian Document Format, JSON) for full programmatic fidelity. Defaults vary by tool when omitted."
      contentType: "Type of content: page or blog post"
      cursor: Pagination cursor
      limit: "Max results (default: 25, max: 250)"
      sort: Sort order
      spaceId: Space ID
      status: Page status
      title: Title filter
  - name: getConfluencePageDescendants
    description: Get child pages of specified page
    params:
      cloudId: Cloud ID (UUID or site URL)
      cursor: Pagination cursor
      depth: Max depth
      limit: Max descendants
      pageId: "Page or blog post ID, or a Confluence tiny link ID (the encoded part from /wiki/x/ URLs, e.g., Fc1bBw)"
  - name: createConfluencePage
    description: Create a Confluence page or blog post
    params:
      body: "Page/comment body. When contentFormat is \"html\", use standard HTML for headings (<h1>-<h6>), paragraphs (<p>), tables (<table>/<thead>/<tbody>/<tr>/<th>/<td>), links (<a href=\"URL\">), code (<pre><code class=\"language-python\">), and lists (<ul>/<ol>/<li>). Confluence-specific HTML+ uses data-type attributes, not CSS classes: panels <div data-type=\"panel-info|panel-warning|panel-note|panel-success|panel-error\"><p>text</p></div>; status <span data-type=\"status\" data-color=\"green|red|yellow|blue|neutral|purple\">Label</span>; task list <ul data-type=\"task-list\"><li data-type=\"task-item\"><input type=\"checkbox\"> Item</li></ul>; decision list <ul data-type=\"decision-list\"><li data-type=\"decision-item\" data-state=\"DECIDED|UNDECIDED\">text</li></ul>; expand <details><summary>Title</summary><p>content</p></details>; layout <section data-type=\"layout-two-equal|layout-three-equal\"><div data-type=\"column\"><p>Column</p></div></section>; inline card <a href=\"URL\" data-card-appearance=\"inline\">text</a>; date <time datetime=\"YYYY-MM-DD\">label</time>; mention <span data-type=\"mention\" data-user-id=\"ACCOUNT_ID\">@Name</span>; inline placeholder <span data-type=\"placeholder\">prompt</span>; macro/extension <div data-type=\"extension|bodied-extension|multi-bodied-extension\" data-extension-key=\"KEY\" data-extension-type=\"TYPE\" data-parameters=\"JSON\"></div>; sync block <div data-type=\"sync-block|bodied-sync-block\" data-resource-id=\"ID\"></div>; media group <div data-type=\"media-group\"><div data-type=\"media\" data-media-type=\"file\" data-id=\"MEDIA_ID\" data-collection=\"COLLECTION\">file.pdf</div></div>; inline media <span data-type=\"media-inline\" data-media-id=\"MEDIA_ID\" data-media-collection=\"COLLECTION\">file.pdf</span>. For native Confluence macros use data-extension-type=\"com.atlassian.confluence.macro.core\" and never storage XML (<ac:structured-macro>). Omit macroId. Do not invent opaque IDs: only copy data-user-id, data-id, data-collection, data-media-id, data-media-collection, data-resource-id, and data-local-id from existing content or tool output; omit data-local-id on new nodes. Preserve existing data-local-id when editing fetched HTML. Tables support data-number-column, data-layout=\"default|center|wide|full-width\", data-display-mode=\"fixed\", data-width, row/col spans, data-colwidth, and cell data-background. Breakout supports data-breakout=\"wide|full-width\" on details, pre, section, and sync blocks. Follow ADF nesting: task/decision items, headings, and captions are inline-only; list items cannot contain headings/tables/panels/expands; panels cannot contain tables/expands/blockquotes/panels; table cells can contain headings, panels, lists, media, blockquote, decision list, and nested expand (<details data-type=\"nested-expand\">) but not nested tables or normal expand. Never wrap content in <html>, <head>, or <body> tags."
      cloudId: Cloud ID (UUID or site URL)
      contentFormat: "Content format for page/comment body. Use \"html\" to write or read Confluence content as structured HTML. HTML supports standard blocks plus Confluence HTML+ data-type nodes: panels, status, task/decision lists, expands, layouts, cards, media, dates, mentions, macros/extensions, and sync blocks. HTML is round-trip safe and preserves inline comments and existing local IDs. It must follow valid ADF nesting rules: inline-only task/decision items, headings, and captions; no self-nesting panels, expands, tables, or blockquotes. Invalid HTML will be rejected with a descriptive error so you can retry. Use \"markdown\" for simplified plain text. Defaults vary by tool when omitted."
      contentType: "Type of content: page or blog post"
      isPrivate: Make private
      parentId: "ID of the parent to nest the new page under. Accepts the ID of any container that can hold a page — a page, folder, whiteboard, database, embed, or slide (smart links surface as embeds). Applies to pages only; ignored for blog posts."
      spaceId: "Numeric space ID (a Long, e.g. \"131073\"). A space key (e.g. \"ENG\") or personal-space key (e.g. \"~712020abc\") is also accepted and resolved to the numeric ID automatically."
      status: Status (draft for unpublished)
      subtype: "Page subtype (pages only, ignored for blogs)"
      title: Page or blog post title
