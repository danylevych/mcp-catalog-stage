    description: Create a footer comment on a page or blog post
    params:
      attachmentId: Attachment ID to include
      body: "Page/comment body. When contentFormat is \"html\", use standard HTML for headings (<h1>-<h6>), paragraphs (<p>), tables (<table>/<thead>/<tbody>/<tr>/<th>/<td>), links (<a href=\"URL\">), code (<pre><code class=\"language-python\">), and lists (<ul>/<ol>/<li>). Confluence-specific HTML+ uses data-type attributes, not CSS classes: panels <div data-type=\"panel-info|panel-warning|panel-note|panel-success|panel-error\"><p>text</p></div>; status <span data-type=\"status\" data-color=\"green|red|yellow|blue|neutral|purple\">Label</span>; task list <ul data-type=\"task-list\"><li data-type=\"task-item\"><input type=\"checkbox\"> Item</li></ul>; decision list <ul data-type=\"decision-list\"><li data-type=\"decision-item\" data-state=\"DECIDED|UNDECIDED\">text</li></ul>; expand <details><summary>Title</summary><p>content</p></details>; layout <section data-type=\"layout-two-equal|layout-three-equal\"><div data-type=\"column\"><p>Column</p></div></section>; inline card <a href=\"URL\" data-card-appearance=\"inline\">text</a>; date <time datetime=\"YYYY-MM-DD\">label</time>; mention <span data-type=\"mention\" data-user-id=\"ACCOUNT_ID\">@Name</span>; inline placeholder <span data-type=\"placeholder\">prompt</span>; macro/extension <div data-type=\"extension|bodied-extension|multi-bodied-extension\" data-extension-key=\"KEY\" data-extension-type=\"TYPE\" data-parameters=\"JSON\"></div>; sync block <div data-type=\"sync-block|bodied-sync-block\" data-resource-id=\"ID\"></div>; media group <div data-type=\"media-group\"><div data-type=\"media\" data-media-type=\"file\" data-id=\"MEDIA_ID\" data-collection=\"COLLECTION\">file.pdf</div></div>; inline media <span data-type=\"media-inline\" data-media-id=\"MEDIA_ID\" data-media-collection=\"COLLECTION\">file.pdf</span>. For native Confluence macros use data-extension-type=\"com.atlassian.confluence.macro.core\" and never storage XML (<ac:structured-macro>). Omit macroId. Do not invent opaque IDs: only copy data-user-id