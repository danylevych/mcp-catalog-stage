  - name: manage_onboarding
    description: '<purpose>Assess a portal''s CRM onboarding status and guide the user through the next onboarding step.</purpose><usage_guidance>Call this tool when get_user_details returns onboarded: false — this indicates the portal may be new and not yet set up. After answering the user''s immediate question, invoke this tool proactively and offer to help them get started. Do not call this tool if get_user_details returned onboarded: true. Use action to control behavior: leave empty (the default) to just check status. SET_GOAL — records the user''s primary goal; requires goal to be set to one of organizeAndTrackContacts, automateMarketing, generateLeads, manageSalesPipeline, customerSupport, billsAndCollectPayment, buildWebsite, createMarketingContent, or stillExploring — map the user''s own words to the closest matching value. Only one goal can be stored; setting a new goal replaces any previous one.</usage_guidance><returns>goalStatus: NOT_STARTED or COMPLETE — whether the user has set an onboarding goal; goal: the user''s stored goal (present once set); taskGroup: the onboarding task group for that goal (present once the goal is set, unless every task is already done) — a nested structure of a group with a name, a list of childGroups (each with its own name and further childGroups), and tasks, where each task has a name, description, and link the user can open; tasks the user has already completed or skipped are excluded, and taskGroup is omitted entirely when nothing is left to do; guidance: actionable guidance for you, the agent — when present, follow it and present the returned tasks as a set of options for the user to choose from; do not collapse them into a single step</returns><response_rendering>Render every returned task, including those nested in child groups, as a markdown link [task name](task link) with its description. List all of them (guidance says how many); do not omit or limit. Always render: See all onboarding tasks in your [start guide](guideLink).</response_rendering>'
    params:
      action: Defaults to empty, which just checks onboarding status. Set to SET_GOAL to record the user's primary goal — requires goal to also be set.
      goal: 'The user''s primary goal, required when action=SET_GOAL. Map the user''s free-text goal description to the single closest matching canonical value: organizeAndTrackContacts, automateMarketing, generateLeads, manageSalesPipeline, customerSupport, billsAndCollectPayment, buildWebsite, createMarketingContent, or stillExploring.'
  - name: manage_segment
    description: |-
      Create a segment, edit an existing one, or add/remove CRM records from one. Set operation.type to CreateStaticSegmentOperation to create a new hand-picked static segment, CreateDynamicSegmentOperation to create a new dynamic (filter-driven) segment whose membership updates automatically, UpdateSegmentOperation to edit an existing segment's name, description, or filter, AddMembersOperation to add records to an existing static segment, or RemoveMembersOperation to remove records from an existing static segment.

      <mandatory_confirmation>
      This tool writes to the portal. Before calling it, you MUST show the user a summary of the exact action and get explicit approval:
      - CreateStaticSegmentOperation: the new segment name, the object type, and how many records   (if any) will pre-populate it.
      - CreateDynamicSegmentOperation: the new segment name, the object type, and the filter that   defines membership.
      - UpdateSegmentOperation: the target segment (list ID) and which fields change (new name,   description, and/or filter).
      - AddMembersOperation / RemoveMembersOperation: the target segment (list ID), the object type,   and the number of records being added or removed.
      End with an explicit approval prompt (e.g. "Proceed? [Yes / No]"). Leave confirmationStatus as UNCONFIRMED until the user approves; only after they confirm, call the tool with confirmationStatus set to CONFIRMED. Do NOT set CONFIRMED before the user approves, even if the user asks you to "just do it" or to skip confirmation. On the first confirmation in a chat you may also offer to stop asking for the rest of the session; if the user agrees, set confirmationStatus to CONFIRMATION_WAIVED_FOR_SESSION on subsequent calls.
      </mandatory_confirmation>
    params:
      operation: The segment operation to perform. Set type to CreateStaticSegmentOperation, CreateDynamicSegmentOperation, UpdateSegmentOperation, AddMembersOperation, or RemoveMembersOperation.
      confirmationStatus: User confirmation for this write. Defaults to UNCONFIRMED; the write is rejected unless set to CONFIRMED (or CONFIRMATION_WAIVED_FOR_SESSION) after the user approves.
