- name: updateConfluenceContent
  description: 'Update Confluence docs, whiteboards, or databases. Before choosing body.format or authoring an edit, call getContentFormatGuide through execute with name=getContentFormatGuide and inputs={toolName}. Use updateConfluencePage for pages, blog posts, and live docs; updateConfluenceWhiteboard for whiteboards; or updateConfluenceDatabase for databases. Space instructions describe how to author content in a Confluence space. Apply relevant guidance to the content you create or update. Follow this decision rule: 1. Before authoring, call getConfluenceSpace for the target space unless getConfluenceContent returned metadata.hasSpaceInstructions=false for content in that space. If getConfluenceSpace already returned for the same cloudId and space during the current task, reuse its spaceInstructions and do not call it again. 2. When the value is true or unknown and instructions have not been loaded, you must call getConfluenceSpace once before authoring through execute with name=getConfluenceSpace, top-level cloudId, and inputs={spaceIdOrKey}. 3. Apply any returned spaceInstructions. If a successful response omits them, no instructions are configured; author with defaults and do not block. After a successful getConfluenceSpace call, do not make a separate getConfluenceSpaceInstructions call.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    contentId: Numeric Confluence content ID. One of contentId or contentUrl is required.
    contentUrl: Full URL of the Confluence content. One of contentId or contentUrl is required. Clear Confluence URLs for pages/live docs (/pages/{id}), blogs (/blog/{id}), whiteboards (/whiteboard/{id}), databases (/database/{id}), and folders (/folder/{id}) are normalized to their numeric content ID before the update is sent, so URLs copied from the product should work directly.
    snapshotToken: Opaque token from a prior getConfluenceContent response. Required for doc-type updates that mutate page/blog/live_doc content or contentWidth. Not used for whiteboard svg or database csv object updates.
    title: New title for the content. 1-255 characters. Omit to keep existing title.
    body: 'Before composing this body, follow the space-instruction decision rule in the tool description. Reuse known instruction state and do not repeat the space lookup per write. Body update object with format and value. Doc types accept format html or markdown. Markdown is for simple text; when richer structure would improve the document, re-read it as HTML and preserve existing rich content in the HTML update. Whiteboards accept format svg and should include context.content with the current SVG when applying a patch. Databases accept format csv and should include context.content with the current CSV when applying an edit envelope. Put the raw patch/envelope directly in value; do not wrap it in an extra JSON object or {"content": "..."} wrapper. For whiteboards, value is a patch, not a full SVG replacement. For databases, value is an edit envelope, not a create payload. Mutually exclusive with edits.'
    edits: Granular edit operations. Array of tool-call objects, each with name (replaceNode, insertNodeAfter, insertNodeBefore, deleteNode, removeNodes, moveNode, appendNodeToEnd, setAttrs), localId, value, and arguments. Mutually exclusive with body.
    dryRun: If true, validate and preview the result without persisting. For edits, returns the resulting HTML. For body replacement, echoes the input.
    draft: If true, update the draft version instead of current. Only supported for page and blogpost doc edits.
    versionMessage: Optional version comment/message for the content update.
    minorEdit: Whether to mark the new content version as a minor edit.
    ownerId: Atlassian account ID of the new owner to transfer page ownership to. Optional. This is an account ID (e.g. 5b10ac8d82e05b22cc7d4ef5), never an email/username or a content ID. The new owner must already have edit permission.
    contentWidth: 'Optional page width for doc types only: page, live_doc, and blogpost. Accepted values are narrow, wide, and max. The default width is narrow. Omit to keep the existing content width unchanged. A width-only update is valid and requires snapshotToken, but does not require title, body, or edits. Non-doc content types do not support this field.'
- name: updateFocusArea
  description: Update one or more fields on an existing Focus area. Provide at least one of name, owner, startDate, or description — identifier-only calls fail upstream. Omitted fields are unchanged. Use createFocusAreaStatusUpdate for status, health, target date, or status summary changes. Multiple fields become separate mutations — a later failure can leave earlier fields already applied.
  params:
    focusAreaIdentifier: The focus area to update. Accepts a focus area UUID, a Mercury focus area ARI, or a Focus focus area page URL. Prefer values from a prior lookup over fabricating them. When reusing an identifier from an earlier response, pass its uuid field — not its id field.
    name: Optional new name for the focus area.
    owner: Optional Atlassian account ID (AAID) of the new focus area owner.
    startDate: 'Optional new projected start date. Object shape: { "date": "YYYY-MM-DDTHH:mm", "confidence": "DAY" | "MONTH" | "QUARTER" }. Both fields required when startDate is set. Example date: 2026-08-10T00:00 — bare calendar dates like 2026-08-10 are not accepted; append T00:00 when only the day is known. Requires focusAreaIdentifier to be a Mercury focus area ARI; UUID or URL identifiers fail this field — call getFocusArea and pass the returned ari.'
    description: Optional new about/description content in plain text or Markdown. An empty string clears the existing content. Value will overwrite existing content. Maximum 25,000 characters.
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: updateLoomVideoPermissions
  description: Change who can access a Loom video by setting its visibility to OWNER (only you), WORKSPACE (anyone in your workspace), or PUBLIC (anyone with the link). The change is immediate and permanent. To notify specific people about a video instead of changing its visibility, use shareLoomVideo. Identify the video by ARI or share URL.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    videoAri: ARI of the Loom video, formatted as ari:cloud:loom:{siteId}:video/activation/{activationId}/{videoId}. Provide this or videoUrl.
    videoUrl: Loom share URL for the video, for example https://www.loom.com/share/{videoId}. Used when videoAri is not supplied; a supporting action resolves the URL to an ARI.
    visibility: Requested visibility for the video. One of OWNER (only the owner), WORKSPACE (anyone in the workspace), or PUBLIC (anyone with the link).
- name: updateLoomVideoTitle
  description: Rename a Loom video. The change is immediate and visible to all viewers. Identify the video by ARI or share URL. To change who can access the video instead of its title, use updateLoomVideoPermissions.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    videoAri: ARI of the Loom video, formatted as ari:cloud:loom:{siteId}:video/activation/{activationId}/{videoId}. Provide this or videoUrl.
    videoUrl: Loom share URL for the video, for example https://www.loom.com/share/{videoId}. Used when videoAri is not supplied; a supporting action resolves the URL to an ARI.
    title: New title for the video. Must be non-empty.
- name: updateTalentPositionFocusAreaMappings
  description: 'Allocate Talent positions to focus areas, or clear the focus area a position is allocated to. Each mapping sets the focus area of ONE position and REPLACES the focus area that position is allocated to now — a position is allocated to one focus area at a time, so this is not additive and it cannot add a second focus area to a position. Omit focusAreaId in a mapping to clear the allocation and leave that position unallocated. Every mapping is applied as a single all-or-nothing change, so one rejected ARI fails the whole call — keep batches small. Do not guess either ARI: take a position ARI from a searchTalentPositions result''s id or a getTalentPositionsByEntity result''s entityId, and take a focus area ARI from getTalentFields for the focus area field, or from searchFocusAreas. To see which positions a focus area is staffed by before or after the change, call getTalentPositionsByEntity with entity=focusArea.'
  params:
    mappings: 'The allocations to apply, one object per position. Array of objects shaped { "positionId": "ari:cloud:radar:<cloudId>:position/<workspaceId>/<positionId>", "focusAreaId": "<focus area ARI>" }, where positionId is required and focusAreaId is optional. A mapping that omits focusAreaId clears the focus area of that position. Name each position once — two mappings for the same position leave the outcome undefined.'
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: updateTeam
  description: Update one Atlassian team through exactly one operation. Use update_details with displayName, description, or membershipSettings; add_members with accountIds and/or add-only emails; or remove_members with accountIds. Metadata and membership changes cannot be mixed. Removing members can remove access.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    teamId: Team UUID or ari:cloud:identity::team/{teamId}.
    operation: Selects exactly one downstream write and its mutually exclusive input shape.
    displayName: New name for update_details.
    description: New description for update_details.
    membershipSettings: New membership policy for update_details.
    accountIds: Up to 50 account IDs for add_members or remove_members.
    emails: Email addresses for add_members only. Combined account IDs and emails are limited to 50.
- name: uploadAttachmentToJiraIssue
  description: 'Attach a single local file to a Jira issue. Two phases: (1) call with filePath only to get a local uploadCommand; run it from your shell to upload the bytes and obtain a fileId; (2) call again with that fileId to attach the file to the issue. To instead embed the uploaded file inline in a body, stop after phase 1 and pass the fileId (with its collection) to editJiraIssue/addOrEditJiraIssueComment via inlineFileId (appends at the end) or an HTML body media node (for positional placement) — do not also run phase 2 for the same file.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    issueIdOrKey: Issue key (e.g. PROJ-123) or a Jira issue URL
    filePath: Local path of the file to attach (absolute, or relative to where uploadCommand is run). Provide for phase 1 to get an uploadCommand. Ignored when fileId is supplied.
    fileId: Media file ID returned by running the phase-1 uploadCommand. Provide for phase 2 to attach the uploaded file to the issue.
