- name: listLoomVideosSharedWithMe
  description: List the Loom videos that other people have shared with you, most recent first. Returns each video's ARI, name, and description so you can pass the ARI to getLoomVideo, getLoomVideoDownloadUrl, or any video action. Always scoped to the current user — there is no user parameter. Optionally filter by the video's creation date with the ISO-8601 createdAtFrom / createdAtTo bounds (this filters on when the video was created, not when it was shared with you) and paginate with limit / offset. To list videos you own, use listLoomVideos.
