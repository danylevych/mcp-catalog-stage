- name: listLoomVideos
  description: 'List the Loom videos you own (that you created), most recent first. This is a primary entry point for finding a video: it returns each video''s ARI, name, and description, which you can pass to getLoomVideo, getLoomVideoDownloadUrl, or any video action. Always scoped to the current user — there is no user parameter. Optionally filter by the video''s creation date with the ISO-8601 createdAtFrom / createdAtTo bounds, and paginate with limit / offset. To find videos other people shared with you, use listLoomVideosSharedWithMe.'
