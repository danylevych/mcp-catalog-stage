    type: Optional board type filter. Use all to omit Jira's type filter, CMPScrum for company-managed Scrum boards, CMPKanban for company-managed Kanban boards, and TMP for Jira's "simple" boards. TMP can include both team-managed Scrum and team-managed Kanban boards; inspect board features/details when you need to distinguish them.
    name: Optional partial board name filter.
    projectKeyOrId: Optional project key or numeric ID used to find boards relevant to a project.
    includePrivate: When true, append private boards to the end of the result list.
    negateLocationFiltering: When true, negates location-based filters such as project or project type.
    orderBy: Optional sort order. Supported values are name, -name, or +name.
    expand: Optional comma-separated expand tokens such as admins or permissions.
    projectTypeLocation: Optional list of project type locations such as software or service_desk.
    filterId: Optional filter ID used to find boards relevant to a Jira filter.
- name: listJiraDashboards
  description: Returns Jira dashboards visible to the current user for discovery and linking workflows. Use this to find dashboard IDs, names, and links that can be shared or opened. This tool is intentionally lightweight and does not fetch dashboard gadget data. Page with startAt until isLast is true.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    dashboardName: Optional dashboard name filter (maps to Jira dashboardName).
    accountId: Optional owner account ID filter (preferred over deprecated owner username).
    groupname: Optional group name filter for shared dashboards (prefer groupId when available).
    groupId: Optional group ID filter for dashboards shared to a specific group. Do not combine with groupname.
    projectId: Optional project ID filter for dashboards shared to a specific project.
    status: Optional status filter. Allowed values are active, archived, or deleted.
    orderBy: Optional sort order. Supported values include name, -name, owner, -owner, +owner, favorite_count, -favorite_count, +favorite_count, id, -id, +id, description, -description, +description, is_favorite, -is_favorite, and +is_favorite.
    startAt: Index of the first result to return (page offset). Defaults to 0.
    maxResults: Maximum results to return per page (default 50, max 100).
- name: listJiraFilters
  description: Search saved Jira filters visible to the current user, returning their IDs and JQL. To get the matching issues, run a filter's jql through searchJiraIssuesUsingJql; to build a board, pass its id as createJiraBoard's filterId. projectId finds filters shared with that project, not filters whose JQL mentions it.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    filterName: Optional filter name to match. Partial matches are returned unless isSubstringMatch is false. Must be 255 characters or fewer.
    projectId: Optional numeric project ID used to return filters scoped to a project. Use listJiraProjects to resolve a project key to its ID.
    accountId: Optional owner account ID used to return filters owned by that user.
    id: Optional list of specific filter IDs to return. Jira accepts at most 200 IDs per call (`id=10000&id=10001`).
