    include: 'Optional focus area details to include. Shape: { "aboutContent": true, "latestDraftUpdate": true, "statusUpdates": {}, "subFocusAreas": {}, "linkedGoals": {}, "linkedWork": {} }. aboutContent and latestDraftUpdate are booleans (both default to false). latestDraftUpdate includes the current user''s latest saved draft status update for this focus area, if one exists. statusUpdates and subFocusAreas are objects, not booleans — pass an empty object ({}) to include one with its defaults. statusUpdates.first defaults to 3 (max 20); statusUpdates.after paginates via statusUpdates.pageInfo.endCursor; statusUpdates.includeTransitions defaults to true. subFocusAreas returns direct children — subFocusAreas.query is optional plain text; subFocusAreas.first defaults to 10 (max 50); subFocusAreas.after paginates via subFocusAreas.pageInfo.endCursor; subFocusAreas.sort is an array like [{ "field": "targetDate", "direction": "asc" }], where field is one of name, status, health, targetDate, focusAreaType and direction is asc or desc. linkedGoals and linkedWork are objects, not booleans — pass {} to include defaults. linkedGoals.first defaults to 10 (max 50) and linkedGoals.after paginates via linkedGoals.pageInfo.endCursor. linkedWork supports optional query plus first/after pagination (first defaults to 10, max 50). linkedWork.sort is an array like [{ "field": "targetDate", "direction": "asc" }], where field is one of name, key, status, type, source, sourceStatus, applicationName, targetDate and direction is asc or desc. linkedWork results are filtered to the resolved cloud ID input. include.linkedGoals requires focusAreaIdentifier to be a focus area ARI; if only a UUID or URL is known, call getFocusArea first and pass the returned ari. include.linkedWork also requires a focus area ARI; if only a UUID or URL is known, call getFocusArea first and pass the returned ari.'
