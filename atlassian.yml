- name: setConfluenceContentRestrictionState
  description: 'Sets the high-level restriction state for a single Confluence content entity. Provide `state` as one of: OPEN — "Open, Anyone in this space can edit": everyone with space access can VIEW and EDIT. EDIT_RESTRICTED — "Open, Anyone in this space can view": everyone with space access can VIEW; only Specific access update principals can edit. VIEW_RESTRICTED — "Restricted, Only specific people can view or edit": only Specific access read/update principals can VIEW; only update principals can edit. HOW GENERAL AND SPECIFIC ACCESS WORK TOGETHER: the state is the General access baseline. Moving away from OPEN removes broad access. Permission grants are Specific access exceptions that add access for individual users or groups; they do not remove General access or make content private by themselves. A principal has exactly ONE Specific access level — update, read, or none — and update includes read/view. Changing the state does not create or modify Specific access grants. SELF-LOCKOUT: when leaving OPEN, the caller must retain `update`; `read` is not sufficient for editing. Private creation already performs the safe VIEW_RESTRICTED + creator update setup. Existing-state and self-lockout validation belongs to the Confluence monolith, and this tool never disables it.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    contentId: Numeric ID of the Confluence content whose restriction state should be set.
    state: New General access state. OPEN = anyone in the space can edit; EDIT_RESTRICTED = anyone in the space can view; VIEW_RESTRICTED = only Specific access principals can view or edit.
