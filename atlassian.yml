- name: listCapacityPlanNonProjectWork
  description: 'Search the non-project work items on a site. "Non-project work" is the user-facing name for a custom contribution target - the buckets of time that are not a Jira issue or an Atlas project, such as Leave, Run the Business (RtB), on-call, or training. Non-project work is an entity that belongs to Capacity Planning: it is defined and stored in Capacity Planning itself, and exists nowhere else in Atlassian. Capacity can be allocated to three kinds of work item - Jira issues, Atlas projects, and non-project work - and only the third is owned by Capacity Planning, so it can only be found through this tool. There is no Jira or Confluence equivalent to look up instead. USE WHEN you need the ARI of a non-project work item before allocating someone to it, or when the user asks what non-project work categories exist. The returned ari is what feeds workId on updateCapacityPlanAllocations and workDataIds on getCapacityPlanAllocations - resolve it here rather than fabricating one. The query is case-insensitive and matches on name; omit it to list everything. Paginate with first/after or last/before.'
  params:
    query: Case-insensitive name filter for non-project work items, e.g. "leave". Omit to list every item on the site.
    first: Page size for forward pagination. Mutually exclusive with last; pair with after for subsequent pages.
    after: Cursor for forward pagination. Pass pageInfo.endCursor from the previous response.
    last: Page size for backward pagination. Mutually exclusive with first; pair with before for previous pages.
    before: Cursor for backward pagination. Pass pageInfo.startCursor from the previous response.
