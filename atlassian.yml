    phaseStatus: Lifecycle phase or in-progress health status of the Project.
    targetDate: Updated target date with date and confidence (DAY, MONTH, or QUARTER).
    notes: Additional context for the update. Provide one item with an optional title and required Markdown-capable body.
    highlights: Learnings, risks, or decisions. Each item has type, summary, and Markdown-capable description.
