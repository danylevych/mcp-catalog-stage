- name: linkToFocusArea
  description: 'Link one of either goals, work items, or sub-focus areas to a focus area. Add exactly one connection type per call. Prefer identifiers from a prior lookup, or call a lookup to get them; do not fabricate ARIs. Useful lookup helpers: getGoal for goal ARIs, getJiraIssue for Jira work ARIs, and getProject for Atlassian project ARIs. In this tool, WORK_ITEM means one of the supported work ARI families: Jira/JPD issues or Atlassian projects. focusAreaIdentifier accepts a focus area UUID, ARI, or page URL. Linking GOAL or WORK_ITEM requires focusAreaIdentifier to be a focus area ARI; if only a UUID or URL is known, call getFocusArea and pass the returned ari. connection must specify exactly one type: GOAL with goalAris, WORK_ITEM with workAris, or FOCUS_AREA with focusAreaIdentifiers.'
  params:
    focusAreaIdentifier: Exact focus area UUID, ARI, or page URL identifying the focus area that will receive the new connections. Linking GOAL or WORK_ITEM requires a focus area ARI; if only a UUID or URL is known, call getFocusArea and pass the returned ari. This requirement applies only for GOAL and WORK_ITEM connections; FOCUS_AREA connections accept UUID, ARI, or URL for focusAreaIdentifier.
    connection: 'The connection to add. Provide exactly one type per call: GOAL, WORK_ITEM, or FOCUS_AREA. Include only the fields for that type. Exactly one of goalAris, workAris, or focusAreaIdentifiers must be present, matching connection.type; all other target fields must be omitted. For GOAL or WORK_ITEM, see focusAreaIdentifier requirements. Shape: { "type": "GOAL", "goalAris": ["ari:cloud:townsquare:{siteId}:goal/{goalUuid}"] } OR { "type": "WORK_ITEM", "workAris": ["ari:cloud:jira:{siteId}:issue/{issueId}" | "ari:cloud:townsquare:{siteId}:project/{projectUuid}"] } OR { "type": "FOCUS_AREA", "focusAreaIdentifiers": ["<uuid|ari|url>"] }. Arrays must be non-empty and deduplicated. For GOAL use only goal ARIs (use getGoal to look them up when needed); for WORK_ITEM use only supported work ARIs: Jira/JPD issue ARIs (ari:cloud:jira:{siteId}:issue/{issueId}), or Atlassian project ARIs (ari:cloud:townsquare:{siteId}:project/{projectUuid}) — for example from getJiraIssue or getProject. For FOCUS_AREA, focusAreaIdentifiers must not include focusAreaIdentifier.'
