- name: createCapacityPlanNonProjectWork
  description: 'Create a non-project work item in Individual Capacity Planning. "Non-project work" is a bucket of time that is not a Jira issue or an Atlas project, such as Leave, Run the Business (RtB), on-call, or training. USE WHEN the user asks to create a new non-project work item, or a category of work that does not already exist as a Jira issue or Atlas project. Search first with listCapacityPlanNonProjectWork to avoid creating a duplicate - the match is on name and is case-insensitive. Non-project work is owned by Capacity Planning and exists nowhere else in Atlassian, so it can only be created through this tool. A contributor must be supplied: the new work item is created together with a work association for that person, so it is immediately allocatable to them. Allocate additional people or set the effort per period afterwards with updateCapacityPlanAllocations, using the ARI returned here as workId. On success, nonProjectWork contains the created item''s name and ari - use that ari as workId for updateCapacityPlanAllocations rather than fabricating one.'
  params:
    name: Display name for the new non-project work item, e.g. "Leave" or "Run the Business". Search first with listCapacityPlanNonProjectWork to avoid creating a duplicate of an existing item.
    contributorDataId: ARI of the contributor to associate the new work item with, in the form ari:cloud:identity::user/{accountId} where {accountId} is an Atlassian account ID (e.g. ari:cloud:identity::user/5ea00a99d31fdf0c0d783dd5). The work item is created with a work association for this person so it is immediately allocatable to them.
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: createConfluenceAttachment
  description: Prepare a Confluence attachment upload and return a local curl command
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    contentId: Numeric ID of the Confluence content that will own the attachment. Confluence content IDs are int64 values (max 19 digits).
    localFilePath: Absolute or relative local file path to upload. This is used only to build uploadCommand; it is not sent to Confluence during prepare.
    fileSize: Optional local file size in bytes. Used by Confluence to fail fast if the file is too large.
    comment: Optional attachment version comment to include in the returned uploadCommand.
- name: createConfluenceComment
  description: Create or reply to a comment on a Confluence page or blog post
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    contentId: Page or blog post ID. Required for top-level comments. Omit for replies.
    commentType: 'Top-level comment type: "footer" for page-level comments or "inline" for anchored comments. Required for top-level comments; inferred for replies.'
    body: 'Comment body object. Use { "format": "markdown" | "html", "value": "..." }. format is required and must be "markdown" or "html"; value is required, non-empty, and at most 4096 characters.'
    inlineSelection: 'Required only for top-level inline comments. Omit for replies. Object shape: { "selectedText": "...", "matchIndex": 0, "matchCount": 1 }. selectedText is required and non-empty; matchIndex is required and zero-based; matchCount is required and must be at least 1.'
    parentCommentId: ID of a top-level comment to reply to. Required for replies. Must reference a top-level comment, not a reply. When set, omit contentId and commentType.
- name: createConfluenceContent
  description: 'Create a new Confluence page, blog post, live doc, whiteboard, database, embed, smart link, or folder. Before choosing body.format or authoring a body, call getContentFormatGuide through execute with name=getContentFormatGuide and inputs={toolName}. Use createConfluencePage for pages, blog posts, and live docs; createConfluenceWhiteboard for whiteboards; or createConfluenceDatabase for databases. Space instructions describe how to author content in a Confluence space. Apply relevant guidance to the content you create or update. Follow this decision rule: 1. Before authoring, call getConfluenceSpace for the target space unless getConfluenceContent returned metadata.hasSpaceInstructions=false for content in that space. If getConfluenceSpace already returned for the same cloudId and space during the current task, reuse its spaceInstructions and do not call it again. 2. When the value is true or unknown and instructions have not been loaded, you must call getConfluenceSpace once before authoring through execute with name=getConfluenceSpace, top-level cloudId, and inputs={spaceIdOrKey}. 3. Apply any returned spaceInstructions. If a successful response omits them, no instructions are configured; author with defaults and do not block. After a successful getConfluenceSpace call, do not make a separate getConfluenceSpaceInstructions call.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    parent: 'Parent destination for the new content. Use { "spaceId": "<numeric-space-id>" } to create at the homepage / sidebar root. Use { "spaceId": "<numeric-space-id>", "parentContentId": "<numeric-content-id>" } to create under an existing content item. Use { "parentContentId": "<numeric-content-id>" } when the parent content ID should be resolved to its space before creation. Use { "parentContentUrl": "<confluence-content-url>" } when the parent content URL should be resolved before creation. Supported parentContentUrl paths include /pages/{id}, /blog/{id}, /whiteboard/{id}, /database/{id}, and /folder/{id}. If the destination is described only by space key or title, resolve it first to one of the supported parent shapes above.'
    contentType: 'Type of content to create. One of: page, live_doc, blogpost, whiteboard, database, embed, smart_link, folder, slide.'
    title: Title for the new content. 1-255 characters.
    body: 'Before composing this body, follow the space-instruction decision rule in the tool description. Reuse known instruction state and do not repeat the space lookup per write. Body content. For whiteboard and database it is technically optional, but only omit it when the user explicitly asked for an empty/blank board or database. Never omit body as a fallback because you could not load the authoring guidance — load it first via getContentFormatGuide through the generic operation runner (execute) as name=getContentFormatGuide, inputs={toolName} (createConfluencePage / createConfluenceWhiteboard / createConfluenceDatabase), then build a real body. A blank whiteboard (no shapes, stickies, connectors, or layout) is almost never the intended result. For doc types (page, live_doc, blogpost): format is html or markdown, value is the content string. Markdown is for simple text; use HTML when richer structure would improve the document. For embed and smart_link: format must be url, value must be the URL to embed (e.g. https://example.com/design). For whiteboard: format must be svg and value must be the complete initial SVG document with root width, height, and viewBox. For database: format must be csv and value must be the complete initial CSV payload. For a synced (Smart) Folder (contentType=folder): format must be url and value must be the https URL of the external Google Drive, OneDrive, or SharePoint folder to sync from. Requires the confluence_smart_folders_milestone_1 experiment; otherwise the create returns FEATURE_NOT_ENABLED. Do not pass patches, edit envelopes, or context on create. Omit for a plain folder (no sync source) and for slide.'
    draft: If true, create the content as a draft instead of publishing it. Only supported when contentType is page or blogpost.
    private: 'If true, the created content is private to the caller: only the creator has view and edit access. Supported for page, live_doc, blogpost, whiteboard, database, and folder, including creation at the homepage / sidebar root. Private creation is not supported for embed, smart_link, or slide. This sets General access to VIEW_RESTRICTED and gives the creator one Specific access grant, update (Can edit), which already includes read/view. Do not add a separate read grant for the creator. Omit or pass false for default visibility.'
    contentWidth: 'Optional page width for doc types only: page, live_doc, and blogpost. Omit unless the user explicitly requests a width; omission creates a narrow page. Do not infer wide or max from body content or layout. Accepted values are narrow, wide, and max. Non-doc content types do not support this field.'
- name: createConfluenceSpace
  description: Create a Confluence space. Successful responses include id, key, and homepageId (the homepage / sidebar root content ID).
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    name: Display name for the new Confluence space.
    key: Optional short unique key for the new space. Provide either key or alias; alias is required when key is omitted.
    alias: Optional alias used as the space identifier in Confluence page URLs. Provide either alias or key; key is required when alias is omitted.
    description: Optional plain-text description for the new space.
    roleAssignments: Exact initial RBAC role assignments for the new space. When provided, default space roles are not applied and at least one Admin role assignment is required. Do not combine with createPrivateSpace or copySpaceAccessConfiguration.
    createPrivateSpace: Set to true only when the user explicitly asks for a private space. Do not combine with roleAssignments or copySpaceAccessConfiguration.
    copySpaceAccessConfiguration: Existing numeric space ID to copy access configuration from. Do not combine with roleAssignments or createPrivateSpace.
    templateKey: Optional Confluence space template key.
- name: createFocusArea
  description: Create a new Focus area in a workspace. Call getFocusAreaTypes first and use an enabled type UUID for focusAreaTypeId — do not fabricate it. Optionally set parentFocusAreaIdentifier (UUID, ARI, or Focus page URL); if set, the parent's type must be a higher hierarchy level than the type being created. Optionally set startDate and targetDate as { date, confidence } where date is YYYY-MM-DDTHH:mm (e.g. 2026-08-10T00:00; bare dates are not accepted) and confidence is DAY, MONTH, or QUARTER. Omit owner to default to the creating user. Returns the created focus area (identifiers, type, owner, parent, dates, status, health, timestamps). Use getFocusArea for expansions such as aboutContent, statusUpdates, or subFocusAreas. When passing both cloudId and a parent ARI, they must refer to the same site.
  params:
    focusAreaTypeId: UUID of an enabled Focus area type in the target workspace. Fetch a valid value first with getFocusAreaTypes rather than fabricating it — via execute as name=getFocusAreaTypes when it is not a top-level tool.
    name: Name of the new focus area.
    parentFocusAreaIdentifier: Optional parent focus area (UUID, ARI, or Focus page URL). If omitted, the new focus area has no parent. When set, the parent's type must be a higher hierarchy level than focusAreaTypeId (see getFocusAreaTypes).
    startDate: 'Projected start date. Object shape: { "date": "YYYY-MM-DDTHH:mm", "confidence": "DAY" | "MONTH" | "QUARTER" }. Both fields required when startDate is set. Example date: 2026-08-10T00:00 — bare calendar dates like 2026-08-10 are not accepted; append T00:00 when only the day is known.'
    targetDate: 'Projected target date. Object shape: { "date": "YYYY-MM-DDTHH:mm", "confidence": "DAY" | "MONTH" | "QUARTER" }. Both fields required when targetDate is set. Example date: 2026-08-10T00:00 — bare calendar dates like 2026-08-10 are not accepted; append T00:00 when only the day is known.'
    owner: Optional Atlassian account ID (AAID) of the focus area owner. Defaults to the creating user when omitted.
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: createFocusAreaStatusUpdate
  description: 'Create a status update on a focus area, or save it as a draft. Set isDraft to true to save without publishing; retrieve a saved draft later with getFocusArea and include.latestDraftUpdate. To publish a draft (or publish a new update), call this tool again without isDraft: true. Supply at least one of statusTransition, summary, or newTargetDate — passing only focusAreaIdentifier still posts a visible, empty update when publishing, so never call this tool speculatively. Use getFocusArea or searchFocusAreas to resolve focusAreaIdentifier if unknown. Field-level behavior for transitions, summary, target date, and draft constraints is documented on the inputs.'
  params:
    focusAreaIdentifier: The focus area to post the update on. Accepts a focus area UUID, a focus area ARI, or a focus area page URL. Saving a draft (isDraft true) requires a focus area ARI; UUID and URL cannot be used. If only a UUID or URL is known, call getFocusArea first and pass the returned ari. When reusing an identifier from an earlier response, pass its uuid field — not its id field — unless you need the ARI for a draft.
    isDraft: When true, save the status update as a draft instead of publishing it. Drafts do not change the focus area's live status, health, or target date; transition and target-date values are stored on the draft until published. Requires focusAreaIdentifier to be a focus area ARI. Defaults to false (publish).
    statusTransition: 'Optional status transition to apply as part of this update. Each value sets both status and health: ON_TRACK, AT_RISK, and OFF_TRACK set health to that value and set status to IN_PROGRESS; PENDING, PAUSED, and COMPLETED set that status and clear health. Omit to leave the current status and health unchanged. See isDraft for draft behavior.'
    summary: Optional progress summary as plain text or Markdown; it is converted to rich content. Maximum 25,000 characters.
    newTargetDate: 'Optional new target date for the focus area. Object shape: { "date": "YYYY-MM-DDTHH:mm", "confidence": "DAY" | "MONTH" | "QUARTER" }. Both fields required when newTargetDate is set. Example date: 2025-07-05T00:00 — bare calendar dates like 2025-07-05 are not accepted; append T00:00 when only the day is known. Omit to leave the existing target date unchanged. See isDraft for draft behavior.'
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: createGoal
  description: Create an Atlassian Goal or Success Measure using an enabled Goal Type.
  params:
    name: Name of the Goal.
    goalTypeId: ARI of an enabled Goal Type returned by getGoalTypes.
    description: Optional Goal description in plain text or Markdown.
    ownerAccountId: Atlassian account ID of the owner. Defaults to the current user.
    parentGoalId: ARI of the parent Goal. Required when the selected Goal Type requires a parent.
    targetDate: Projected target date with date and confidence (DAY, MONTH, or QUARTER).
    accessLevel: Goal visibility and editing access. Defaults to the site's Goal access setting.
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: createGoalUpdate
  description: Create a progress update for an existing Atlassian Goal.
  params:
    goalId: ARI of the Goal receiving the update.
    summary: Progress summary in plain text or Markdown. Rendered text is limited to 280 characters.
    phaseStatus: Lifecycle phase or in-progress health status of the Goal.
    score: Exact progress score. The score determines the resulting health status.
    targetDate: Updated target date with date and confidence (DAY, MONTH, or QUARTER).
    notes: Notes to include. Each item has an optional title and required body in plain text or Markdown.
    metricUpdates: Metric measurements for this update. Provide one item with targetId, value, and optional measuredAt.
    highlights: Learnings, risks, or decisions. Each item has type, summary, and Markdown-capable description.
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: createJiraBoard
  description: 'Create a new company-managed Jira Software board (scrum or kanban) from an existing filter. Requires a filter ID the user can view. When location is omitted, the board is filed in the single company-managed project from the filter''s JQL. Team-managed (TMP) locations are always rejected: TMP projects are 1:1 project to board (one built-in board at project creation, no way to add another). User locations are also rejected. The response includes a url that opens the board. The filter decides which issues the board shows; location only decides where the board is filed in navigation.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    name: Display name for the new board. Must be less than 255 characters.
    type: 'Company-managed board type: scrum or kanban.'
    filterId: ID of a Jira filter the user can view. This filter's JQL determines which issues appear on the board — pick or create one that targets the intended project, since location does not restrict the issue set. Board sharing follows the filter's sharing; without Create shared objects permission a private board may be created instead.
    location: 'Optional board container, controlling only where the board is filed in navigation — not which issues it shows. When omitted (or {}), defaults to the single project in the filter''s JQL. Object with type "project" and projectKeyOrId set to a company-managed project key or numeric ID. Team-managed (TMP) locations are always rejected (TMP is 1:1 project to board). User locations are also rejected. Example: {"type":"project","projectKeyOrId":"PROJ"}.'
- name: createJiraIssue
  description: 'Create a new Jira issue. Custom fields go in additional_fields: keyed by field name, values are resolved automatically, so no field lookup is needed first (user fields take accountIds); keyed by customfield_* ID, pass the value in Jira''s format. A rejected create returns a repairHint and names the field at fault where there is one, with its allowedValues when known, so retry from that. If sprint assignment fails, the response still has the new issue''s key and sprintAssignment.assigned: false — do not create it again.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    projectKey: Project key (e.g. PROJ).
    summary: Issue summary / title.
    issueType: Issue type name (e.g. Bug, Task, Story, Epic). Use listJiraProjectIssueTypesMetadata to list valid types for this project if unsure.
    description: Issue description in markdown, or HTML with contentFormat html. Converted to Jira ADF automatically.
    contentFormat: 'Body format for description. Defaults to markdown; html adds panels, tables and status lozenges. For HTML body shapes, first get the format guide via the generic operation runner (execute) as name=getContentFormatGuide, inputs={toolName: "createJiraIssue"}. Inline media needs an existing issue: create first, then embed with editJiraIssue. When the HTML content-format feature is disabled the call is rejected rather than downgraded, because markdown would store the HTML tags as literal text.'
    priority: Priority name (e.g. High, Medium, Low, Highest, Lowest).
    assignee: Account ID of the assignee. Resolve a name with listJiraIssueAssignableUsers, which returns only users who can be assigned in this project; lookupJiraAccountId resolves any user and does not check that.
    labels: List of label strings (e.g. ["bug", "needs-triage"]).
    parent: Parent issue key for sub-tasks or child issues (e.g. PROJ-10).
    additional_fields: 'Additional Jira fields. Keys can be human-readable field names or raw customfield_* IDs. Values can be human-readable (resolved automatically) or already-correct Jira shapes. Examples: {"Story Points": 8} ← number field by name {"Team": "Backend"} ← option/select by name {"Reviewers": ["alice@acme.com", "bob@acme.com"]} ← multi-user by accountId {"Component Area": "Platform / Auth"} ← cascading select as "Parent / Child" {"customfield_10010": 8} ← raw ID (no resolution needed, fastest) {"components": [{"name": "Backend"}]} ← system array field (raw shape) {"fixVersions": [{"name": "v2.0"}]} ← system array field (raw shape) On error, the response includes allowedValues and a repairHint for self-correction.'
    assignToSprint: Optional sprint assignment after the issue is created. Accepts a numeric sprint ID, an exact sprint name, or "active" to resolve an active sprint. Numeric sprint IDs assign directly and do not need board lookup. When omitted, createJiraIssue behaves exactly as before and does not make sprint calls.
- name: createJiraIssueLink
  description: 'Create a link between two existing issues — blocks, duplicates, clones, relates. Hierarchy is not a link: a parent or epic is the issue''s parent field. To link an issue to anything outside Jira — a page, a document, any URL — use createJiraIssueRemoteIssueLink.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    linkType: Link type name e.g. Blocks, Relates, Duplicates. Use listJiraIssueLinkTypes for valid names.
    inwardIssue: Inward issue key e.g. PROJ-1. The link reads inwardIssue to outwardIssue using the link type's outward description, so with linkType "Blocks" inwardIssue blocks outwardIssue.
    outwardIssue: Outward issue key e.g. PROJ-2. With linkType "Blocks" this is the issue that is blocked by inwardIssue.
    comment: Optional comment on the outward issue (plain text or markdown, converted to ADF automatically).
- name: createJiraIssueRemoteIssueLink
  description: Create a native web link in a Jira issue's Web links section for a Confluence page or external HTTP(S) URL. Not a URL custom field; for an issue-to-issue dependency use createJiraIssueLink.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    issueIdOrKey: Target Jira issue key or ID, for example PROJ-123
    url: Absolute HTTP or HTTPS URL to add to the issue
    title: Optional display text; defaults to the URL when omitted or blank
    summary: Optional short summary of the linked content
    relationship: Optional relationship label; Jira uses "links to" when omitted or blank
- name: createLoomFolder
  description: Create a new folder in the current Loom workspace, optionally nested under a parent folder or placed in a space. Returns the new folder's id, which you can pass to moveLoomVideoToFolder. To list existing folders instead of creating one, use listLoomFolders.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    name: Name for the new folder.
    parentFolderId: Optional ARI of an existing folder to nest this one under, ari:cloud:loom:{siteId}:folder/activation/{activationId}/{folderId}.
    spaceId: Optional ARI of a Loom space to create the folder in, ari:cloud:loom:{siteId}:space/activation/{activationId}/{spaceId}.
    visibility: Optional, top-level folders only. One of owner or workspace. Ignored for space or nested folders.
- name: createLoomVideoComment
  description: 'Post a comment on a Loom video, anchored to a specific point in the video. The timestamp is in SECONDS (for example 90 for the 1:30 mark). Use this to leave feedback or a note at a moment in the recording. To read existing comments use getLoomVideo with expand: ["comments"]; to add an emoji reaction instead of a text comment use createLoomVideoReaction. Identify the video by ARI or share URL. NOTE: the returned timestamp is remapped onto the video''s current (post-trim) timeline, so for a video with trimmed/edited ranges the echoed value can come back up to 1 second lower than the value sent (never higher); for videos with no trims it always matches exactly.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    videoAri: ARI of the Loom video, formatted as ari:cloud:loom:{siteId}:video/activation/{activationId}/{videoId}. Provide this or videoUrl.
    videoUrl: Loom share URL for the video, for example https://www.loom.com/share/{videoId}. Used when videoAri is not supplied; a supporting action resolves the URL to an ARI.
    timestamp: Position in the video in seconds at which to anchor the comment, for example 90 for 1:30. Must be greater than or equal to 0.
    content: Plain-text content of the comment. Maximum 5000 characters.
- name: createLoomVideoReaction
  description: Add an emoji reaction to a Loom video, anchored to a specific point in the video. The timestamp is in SECONDS (for example 90 for the 1:30 mark), the same unit as createLoomVideoComment. Use a Loom-native reaction name (joy, love, wow, nervous, yay, up, down) or an extended emoji slug. To leave a text comment instead, use createLoomVideoComment. Identify the video by ARI or share URL.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    videoAri: ARI of the Loom video, formatted as ari:cloud:loom:{siteId}:video/activation/{activationId}/{videoId}. Provide this or videoUrl.
    videoUrl: Loom share URL for the video, for example https://www.loom.com/share/{videoId}. Used when videoAri is not supplied; a supporting action resolves the URL to an ARI.
    timestamp: Position in the video in seconds at which to place the reaction, for example 90 for 1:30. Must be greater than or equal to 0. Same unit as createLoomVideoComment's timestamp.
    reactionName: The emoji reaction to add. For Loom-native reactions use one of joy, love, wow, nervous, yay, up, down. For extended emoji reactions use an emoji slug, for example heart_eyes, +1, raised_hands, optionally suffixed with a skin-tone modifier such as heart_eyes::skin-tone-2.
    reactionType: The type of reaction. Use LOOM for Loom-native reactions or EXTENDED for standard emoji slugs. Defaults to LOOM if not provided.
    category: Optional reaction category. Use super to mark a super reaction. Defaults to no category if not provided.
- name: createLoomVideoUpload
  description: Step 1 of 2 for uploading a new video to Loom. Creates an upload and returns a ready-to-run local script (plus raw upload endpoints) that transfers the file's bytes. After the script reports the upload is complete, call publishLoomVideo (step 2) with the returned completionPayload to finalize and get the share URL. This does not publish the video by itself.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    fileName: Name of the file being uploaded, including its extension, for example Loom Live Sizzle.mp4. The extension is required; uploads without a recognizable file extension never finish transcoding.
    contentType: MIME type of the file, for example video/mp4. Defaults to video/mp4 if omitted.
    fileSizeBytes: Optional advisory file size in bytes. When supplied, the returned upload script is annotated with a size hint so the agent knows whether the single-PUT or multipart path will be used. The script re-checks size at runtime.
- name: createProject
  description: Create an Atlassian Project.
  params:
    name: Name of the Project.
    description: Content for the Project About tab. Supported fields are what, why, and measurement; plain text and Markdown are accepted.
    ownerAccountId: Atlassian account ID of the owner. Defaults to the current user.
    startDate: Planned start date in YYYY-MM-DD format.
    targetDate: Projected completion date with date and confidence (DAY, MONTH, or QUARTER).
    private: Whether the Project is restricted to its contributors.
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: createProjectUpdate
  description: Post a progress update on an existing Atlassian Project, or save it as an unposted draft with isDraft. Posting is immediately visible on the Project and notifies its followers, so only post when the user asked to; use isDraft to leave it for them to review and post themselves. The response carries isDraft so you can tell which happened, and a draft returns fewer fields than a posted update.
  params:
    projectId: ARI of the Project receiving the update.
    isDraft: 'When true, save the update as an unposted draft instead of publishing it. Nothing becomes visible on the Project and no followers are notified. Omit it to post the update immediately, which cannot be undone. A Project holds one draft per update period and saving never overwrites it: if a draft already exists the save is rejected. There is no way to amend a draft from here, so tell the user to post or discard the existing one in Atlas; read it first with getProject include=draftUpdate if they want to see what it says. The rejection can come back as an empty result rather than an error, so treat an empty response to a draft save as "a draft already exists" rather than success.'
