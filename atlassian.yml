  description: Get the issues on a Jira board, its backlog, or all of them, with optional count and JQL filtering. For an issue search that is not scoped to a board, use searchJiraIssuesUsingJql. For one sprint's issues with progress metrics, use getJiraBoardSprintData — on a Scrum board dataset "board" spans current and future sprints, not just the active one.
