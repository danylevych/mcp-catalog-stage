- name: getConfluenceContentPermissions
  description: 'Lists the explicit content-level permission grants on a single Confluence content entity. Each grant pairs an operation (read or update) with a principal (a user or a group). Optionally filter by operation, principal-type, or principal-id, and paginate with cursor and limit. Use this to audit who has been granted read or update access before adding, replacing, or removing grants. To read the higher-level restriction state (OPEN / EDIT_RESTRICTED / VIEW_RESTRICTED), use getConfluenceContentRestrictionState instead. Specific access rows: `read` = Can view and `update` = Can edit (which already includes view). Each principal has one level: read, update, or none. These grants add principal access; they do not restrict other people or change General access. General access is controlled by the restriction state, not direct grants.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    contentId: Numeric ID of the Confluence content entity (page, blog post, whiteboard, database, folder, etc.) whose permission grants should be listed.
    operation: 'Filter by operation. One of: read, update.'
    principal-type: 'Filter by principal type. One of: user, group.'
    principal-id: Filter by principal ID. For users this is the Atlassian account ID; for groups it is the group ID.
    cursor: Opaque pagination cursor returned in _links.next by a previous call. Omit to start from the first page.
    limit: Max number of grants to return per page (1–250). Defaults to 100.
- name: getConfluenceContentRestrictionState
  description: 'Reads General access for a single Confluence content entity. The restriction states are: OPEN — "Open, Anyone in this space can edit". EDIT_RESTRICTED — "Open, Anyone in this space can view"; only Specific access update principals can edit. VIEW_RESTRICTED — "Restricted, Only specific people can view or edit"; Specific access read/update grants determine access. Use this for a quick read of the overall restriction posture; use getConfluenceContentPermissions to enumerate the individual user/group grants.'
  params:
