- name: getTalentPositionsByEntity
  description: 'List the Talent positions attached to an entity — the direct reports of a manager position (entity=position with that manager''s ARI as fieldValue), or the positions rolled up to a focus area (entity=focusArea). This is the tool for walking the org chart and for breaking staffing down across focus areas or reporting lines, because it is the only one that can scope to those entities; it returns the underlying positions, paginated forward with after + endCursor. The two entities are scoped by DIFFERENT inputs: entity=position scopes with fieldValue, entity=focusArea scopes with rql. fieldValue is ignored when entity=focusArea, so a focus area passed there returns every row unfiltered — use rql "focusArea = ''<focus area ARI>''" for that one area, or rql "focusAreaParent = ''<focus area ARI>''" for its direct children. Use getTalentGroupMetrics INSTEAD when you want counts grouped by a position FIELD and not the positions themselves, and searchTalentPositions INSTEAD for a flat attribute filter that is not entity-scoped. Each returned position carries both an entityId and an id: entityId is the position identifier to pass to getTalentPosition, while id identifies the row within this connection and is NOT accepted as a position ARI. Field IDs and RQL values are workspace-specific and must not be guessed — resolve them with getTalentFields; focusArea and focusAreaParent are standard field IDs and are safe to use exactly as written. Useful built-ins are positionWorker, team, positionJobTitle, positionRole, positionStatus, aiMonthlyUsageCostSelfTotal and aiMonthlyUsageTokenSelfTotal.'
  params:
    entity: Entity to scope the positions by. Use position for a reporting-line search, focusArea for a focus-area search. Defaults to position. Each value is scoped by a different input — position scopes with fieldValue, focusArea scopes with rql.
    fieldValue: ID of the specific entity to scope to. Honored only when entity=position — pass a manager's position ARI to return that manager's direct reports, or omit to return top-level positions that have no manager. IGNORED when entity=focusArea, where passing it returns every row unfiltered; scope a focus area through rql instead.
    rql: Radar Query Language filter and ordering applied to the positions returned. Field IDs and values are workspace-specific — resolve them with getTalentFields rather than guessing. For entity=focusArea this is the ONLY way to scope to an area, because fieldValue is ignored there. Use focusArea = '<focus area ARI>' to match that one area, or focusAreaParent = '<focus area ARI>' to match its direct children. Both are standard field IDs, so use them exactly as written, and quote the ARI with single quotes.
    aggregateRql: Radar Query Language filter applied to aggregate fields requested through fieldIdIsIn, such as AI usage period, provider or model filters.
    count: Maximum number of positions to return in this page, 1-100. Defaults to 25.
    after: Forward pagination cursor from a previous response's endCursor.
    before: Backward pagination cursor from a previous response's startCursor. Prefer forward paging with after — backward paging is accepted by the backend but has been observed to return an empty page.
    fieldIdIsIn: Array of position field ID strings to return for each position, as returned by getTalentFields. When omitted, a small default set of human-readable fields is returned. Useful field IDs include positionWorker, team, positionJobTitle, aiMonthlyUsageCostSelfTotal and aiMonthlyUsageTokenSelfTotal.
