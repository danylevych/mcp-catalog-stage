    reviewers: Reviewer list for request. Do not infer or reuse reviewers from earlier conversation context; if the user has not explicitly provided a reviewer for this approval request, ask for one before calling this tool. Each reviewer is a user and includes an account ID. Include displayName when known so responses can use names instead of only IDs. Use 1-10 unique reviewers; reviewer ids must be non-blank strings of at most 128 characters.
    addReviewers: Users to add when action=update. Include displayName when known so responses can say who was added.
    removeReviewers: Users to remove when action=update. Include displayName when known so responses can say who was removed.
    message: Optional request message or replacement message for reviewers.
    dueDate: Optional date-only due date, formatted as YYYY-MM-DD. Use with action=update to set or replace the due date.
