    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    boardId: Numeric ID of the board. Get from listJiraBoards.
    dataset: 'Which issues to return. "board": issues on the active board (for scrum boards, those in current/future sprints). "backlog": backlog issues (for scrum boards, those with no sprint). "all": every issue on the board and backlog. Kanban boards have no backlog.'
    searchResultMode: Never count for a normal listing or if nextPageToken is used. If the total for the same board/dataset/JQL is already known, reuse it. Use "count" only when no trusted count exists and either the user asks or a downstream step needs it. Use "all" only if both count and issues are required.
    jql: Optional JQL to further filter the issues, e.g. "status = 'In Progress' AND assignee = currentUser()". To filter by epic, add ("Epic Link" = <epicId> OR parent = <epicId>); OR-join one such clause per epic for multiple epics. To filter for no epics, use ("Epic Link" is EMPTY AND parent is EMPTY). If the tool returns a repairHint, follow it and retry.
    maxResults: Maximum number of issues to return (default 50, max 100).
    fields: 'Fields per issue (e.g. ["summary", "status", "customfield_10010"]). customfield_* IDs are site-specific — discover the correct id for story points etc. on this Cloud site. Honoured exactly when supplied. Values map to issues[].fields.customFields (human labels), not raw customfield_* keys. The default "compact" view omits custom fields; use view: "evidence" (fetches and maps all custom fields) or pass explicit customfield_* IDs.'
    nextPageToken: Pagination token from a previous response to fetch the next page.
    responseContentFormat: Format for rich-text bodies (description, environment, comments) when the view returns them. Defaults to markdown; html is lossless for a later editJiraIssue. Issues holding anything markdown cannot represent (media, panels, expands, statuses, @mentions) are returned as HTML automatically, decided per issue. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence", "full". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: getJiraBoardSprintData
  description: Resolve a Jira board plus its sprint data in one call. Supports board lookup by name, sprint lookup by name, and defaults to the active sprint when sprintId and sprintName are omitted. Returns the board, the resolved sprint, all sprint metadata on that board, and — unless includeIssues is false — the sprint's issues with computed focus and progress slices such as assigned-to-me and at-risk items. If the requested sprint name or ID is not found, the tool returns the resolved board plus the available sprint names to help the agent repair the request. To only list a board's sprints or filter them by state, use listJiraBoardSprints. For board or backlog issues that are not scoped to a single sprint, use getJiraBoardIssueData.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    boardId: Jira board ID. Preferred when already known because it avoids board-name ambiguity.
    boardName: Jira board name to resolve when boardId is unknown. Uses an exact case-insensitive name match when possible; narrow with projectKeyOrId or boardType if multiple boards share a similar name.
    projectKeyOrId: Optional Jira project key or numeric project ID used to narrow board lookup.
    boardType: Optional board type filter for board lookup. Use all to omit Jira's type filter, CMPScrum for company-managed Scrum boards, CMPKanban for company-managed Kanban boards, and TMP for Jira's "simple" boards. TMP can include both team-managed Scrum and team-managed Kanban boards; inspect board features/details when you need to distinguish them.
    sprintId: Specific sprint ID to resolve on the selected board.
    sprintName: Specific sprint name to resolve on the selected board. When omitted, the tool resolves the board's active sprint by default.
    includeIssues: When true (default), also fetch every issue in the resolved sprint and compute assigned-to-me, at-risk, and progress metrics. Pass false for a lighter metadata-only response.
- name: getJiraCurrentUser
  description: Get the calling user's own Jira profile. Use it to turn "me" or "my" into an accountId, and to read the user's time zone before resolving relative dates. For a JQL search, skip this tool and write assignee = currentUser() in the query instead. For anyone else use lookupJiraAccountId or getJiraUser.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    expand: 'Comma-separated list of extra data to include. Options: groups (all groups you belong to) and applicationRoles (application roles you are assigned). Example: "groups,applicationRoles". Both are omitted from the response unless requested here.'
- name: getJiraEntityProperty
  description: 'Returns a single property (technical key/value store) from a specific Jira entity (issue, issueComment, issueWorklog, dashboardItem, user), or lists all its property keys when propertyKey is omitted. With propertyKey it returns {key, value} with the stored JSON, null-valued fields generally dropped except assignee; without one, {keys: [...]} — key names only, no values.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    entityType: Which Jira entity to read the property from. Determines the required identifier(s). Irrelevant identifiers are ignored.
    propertyKey: The exact property key to fetch (a single known key; no wildcards). Omit to list all property keys on the entity instead.
    issueIdOrKey: Issue key (PROJ-123) or a Jira issue URL. Required for entityTypes "issue" and "issueWorklog".
    commentId: ID of an existing comment. Required when entityType is "issueComment".
    worklogId: ID of a worklog for a specific issue. Required when entityType is "issueWorklog".
    dashboardId: ID for a dashboard. Required when entityType is "dashboardItem".
    itemId: Dashboard gadget/item ID. Required when entityType is "dashboardItem".
    accountId: User account ID. Required when entityType is "user" (including for the calling user's own properties)
- name: getJiraIssue
  description: Get a Jira or JSM issue by key or ID. Use for one known issue; use searchJiraIssuesUsingJql to find or list many issues. Reports how many comments an issue has, not the comments themselves — for those use listJiraIssueComments. View "evidence" also returns the issue's links to other issues.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    issueIdOrKey: Issue key (PROJ-123), numeric ID, or a Jira issue URL
    fields: 'Custom Jira field IDs to fetch (e.g. ["customfield_10010", "customfield_10020"]). Overrides the view''s fetch strategy. For custom fields in normal use, prefer view: "evidence", which fetches and maps them automatically. Use ["*all"] to fetch every field (expensive — prefer view: "full" instead).'
    includeEditableFields: 'When true, also return compact metadata for fields the authenticated user can edit on this issue, including type, allowed values, and operations. Omit unless preparing an edit: this makes an extra Jira REST call.'
    fieldsByKeys: When true, each entry in `fields` is interpreted as a Jira field key (e.g. "summary", "description") instead of a field id. Matches the Jira REST `fieldsByKeys` query parameter. Ignored when `fields` is omitted (default field list uses ids).
    expand: Additional Jira expand tokens (comma-separated), e.g. "renderedFields,changelog". Merged with any expand the server adds for custom-field mapping (e.g. "names"); duplicate tokens removed. Note "changelog" here returns only the newest page, sorted newest-first, and it accepts startAt/maxResults then ignores them — so it cannot be paged and reports a longer history as complete. Use listJiraIssueChangelogs to read all of it (oldest-first); do not mix their orderings.
    properties: Issue entity property keys to return (Jira `properties` query param, repeated per key). Omit unless you rely on app-specific issue properties.
    failFast: When true, forwards Jira's `failFast` query flag for this GET. Omit for Jira default behavior.
    responseContentFormat: 'Format for rich-text bodies — description and environment, plus any comment bodies the view returns. Defaults to markdown. Set html to receive HTML, which is lossless, so you can pass it straight back to editJiraIssue/addOrEditJiraIssueComment with contentFormat: html. Bodies holding anything markdown cannot represent — inline media, panels, expands, layouts, statuses, @mentions, dates, emoji — are returned as HTML automatically, because markdown would drop those nodes or turn them into literal text on write-back. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.'
    actionSource: Optional invocation attribution. Jira MCP cards set jira_mcp_card; omit for model/tool-loop calls.
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence", "full". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: getJiraIssueTypeMetaWithFields
  description: 'Returns the schema and field metadata for a specific issue type in a project, useful for creating issues with correct fields. Get issueTypeId from listJiraProjectIssueTypesMetadata first. Each entry in fields gives the fieldId, its name, whether it is required, schema.type — with schema.items naming the element type on arrays — and allowedValues on fields whose value must come from a predefined list. Only required fields are returned unless you pass requiredFieldsOnly: false.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    projectIdOrKey: Project ID or key (e.g. PROJ or 10000)
    issueTypeId: Issue type ID
    startAt: Index of the first field to return (page offset). Defaults to 0.
    maxResults: Maximum fields to return per page (max 200, default 50).
    requiredFieldsOnly: When true (default), returns only the fields that are required to create an issue of this type, reducing response size. Set to false to return all available fields (both required and optional).
- name: getJiraProjectVersionRelatedWork
  description: 'List the related work on a Jira project version (release): the designs, test plans, runbooks and change records teams attach to it. Use an item''s relatedWorkId to edit it with manageJiraProjectVersionRelatedWork; Jira''s own release-note item has no relatedWorkId and cannot be edited.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    versionId: ID of the version. Use getJiraProjectVersions to find the ID.
- name: getJiraProjectVersions
  description: List a Jira project's releases/versions (pass projectIdOrKey), or fetch a single version (pass versionId) — provide exactly one. Results come back in a paginated envelope (values[]); in single-version mode the list-only inputs (startAt, maxResults, query, status, orderBy) are ignored. Optionally set include to add the "driver" and/or "approvers" to every version returned, but leave it unset unless the user explicitly asks for them. To create, update, or release a version, use manageJiraProjectVersion instead.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    projectIdOrKey: The project key (e.g. PROJ) or numeric project ID to list versions for. Use listJiraProjects to find the key if not known. Provide either projectIdOrKey or versionId (not both); required when versionId is omitted.
    versionId: The numeric ID of a single version (release) to fetch. Provide either versionId or projectIdOrKey (not both); required when projectIdOrKey is omitted. In this mode the pagination/filter inputs are ignored and a single-entry envelope is returned.
    startAt: Pagination offset (default 0). List mode only; ignored when versionId is provided.
    maxResults: Maximum results per page (default 50). List mode only; ignored when versionId is provided.
    query: Filter versions by name or description (case-insensitive substring match). List mode only.
    status: 'Filter by version status. Array of any of: "released", "unreleased", "archived". Example: ["released", "unreleased"]. List mode only.'
    orderBy: 'Order results by a field. Options: description, name, releaseDate, sequence, startDate. Prefix with ''-'' for descending. Example: ''-releaseDate''. List mode only.'
    include: 'Extra sections to add to every version returned. Allowed values: "driver" (the resolved driver display name) and "approvers" (approvers with displayName, status, description, declineReason). Only set this when the user explicitly asks for the driver or approvers; otherwise omit it. In list mode one call enriches all versions, so never call per version.'
- name: getJiraUser
  description: Get a Jira user's profile by account ID, including time zone, locale and active status, plus groups and application roles when asked for via expand. If you do not have the accountId, use lookupJiraAccountId or listJiraIssueAssignableUsers first. For the calling user's own profile use getJiraCurrentUser instead.
  params:
