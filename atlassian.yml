- name: manageJiraProjectVersion
  description: 'Create, update, release, or archive a Jira project version (release or fix version). create returns the version id the other actions need. If release uses moveUnfixedIssuesTo, setting released: false later does not move those issues back. Otherwise release and archive change only the version, not its issues, and update can reverse either. To view or list versions, or read their release driver and approvers, use getJiraProjectVersions.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    action: The version operation to perform.
    projectIdOrKey: Project key (e.g. "PROJ") or numeric ID. Required for "create".
    versionId: ID of the version. Required for "update", "release", "archive".
    name: Version name (e.g. "v2.1.0"). Required for "create", optional for "update".
    description: Description of what this version includes. Used by "create" and "update".
    releaseDate: Release date in yyyy-mm-dd format (ISO 8601). Used by "create", "update", and "release".
    startDate: Start date in yyyy-mm-dd format (ISO 8601). Used by "create" and "update".
    released: Whether the version is released. Used by "create" and "update".
    archived: Whether the version is archived. Used by "create" and "update".
