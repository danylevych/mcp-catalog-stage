toolPreview:
- name: addBitbucketRepoPullRequestComment
  description: Add a comment to a Bitbucket pull request
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    prId: Pull request ID
    content: Comment text (markdown)
    parentCommentId: Reply to an existing comment thread by its ID
    pending: Create as a pending/draft review comment instead of publishing immediately
    inlinePath: File path to anchor an inline or file-level comment. Path only (no line) = file-level comment.
    inlineToLine: Line on the new (added/modified) side. Requires inlinePath. Mutually exclusive with inlineFromLine.
    inlineFromLine: Line on the old (original/deleted) side. Requires inlinePath. Mutually exclusive with inlineToLine.
    inlineToLineStart: Start line for a multi-line comment on the new side. Requires inlineToLine; must be <= inlineToLine.
    inlineFromLineStart: Start line for a multi-line comment on the old side. Requires inlineFromLine; must be <= inlineFromLine.
- name: addConfluenceContentPermissions
  description: 'Adds one or more content-level permission grants to a single Confluence content entity. Existing grants for other principals are preserved; to replace the full set, use replaceConfluenceContentPermissions instead. These are Specific access grants: operation `read` = Can view; `update` = Can edit and already includes view. A principal has exactly ONE level, so assigning `read` to a principal who currently has `update` is a downgrade to view-only. Never include the same principal under both operations. Adding a grant does NOT restrict others, make content private, or change General access; use setConfluenceContentRestrictionState for that baseline. Private creation already gives the creator `update`. Do not add `read` for that creator, because update already includes view. Existing-state and self-lockout rules are enforced by the Confluence monolith. Each grant pairs an operation with a list of principals. Pass the grants via the `permissions` input, an array of objects shaped exactly like: [ { "operation": "read", "principals": [ { "principalType": "user", "principalId": "<atlassian-account-id>" }, { "principalType": "group", "principalId": "<group-id>" } ] } ] Enums: operation is one of read | update; principalType is one of user | group. For a user, principalId is the Atlassian account ID; for a group, principalId is the group ID.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    contentId: Numeric ID of the Confluence content entity (page, blog post, whiteboard, database, folder, etc.) to add permission grants to.
    permissions: 'Permission grants to add. Array of objects, each with an `operation` (read | update) and a `principals` array. Each principal has a `principalType` (user | group) and a `principalId` (Atlassian account ID for a user, group ID for a group). A principal must appear under only one operation across the entire request. Example: [{ "operation": "read", "principals": [{ "principalType": "user", "principalId": "5b10a..." }] }].'
- name: addConfluenceReaction
  description: Add emoji reaction to Confluence content
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    contentId: Numeric Confluence content ID (page, blog post, or comment).
    emojiId: Emoji ID as hex codepoint (e.g. 1f44d for 👍, 1f624 for 😤) or custom emoji UUID.
