    maxResults: Maximum results to return per page. Jira defaults to 50.
    expand: Comma-separated expand tokens on GET /rest/api/3/filter/search. jql, owner, and description are expand-only. Defaults to description,jql,owner.
- name: listJiraIssueAssignableUsers
  description: List the users who can actually be assigned work in a project or on an issue. Filters by assign permission, which a plain name search does not, so prefer it when choosing an assignee for editJiraIssue or createJiraIssue.
  params:
    project: Project key (e.g. PROJ) whose assignable users to list. Pass this or issueKey — with neither, Jira rejects the request.
    query: Narrow the result to users whose display name or email matches this term. Omit it to list every assignable user. Only assignable users are searched — for a site-wide search by name or email, use lookupJiraAccountId.
    issueKey: Issue key (e.g. PROJ-123) whose assignable users to list. More accurate than project for an issue that already exists, because permission and security-level rules are evaluated against that issue.
    actionSource: Optional invocation attribution. Jira MCP cards set jira_mcp_card; omit for model/tool-loop calls.
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: listJiraIssueChangelogs
  description: 'Get a Jira issue''s field-change history — field edits only — paginated oldest-first with no ordering options. For the current value or most recent change, read total (which counts entries, not items) and request startAt = max(0, total - your page size); for counts or patterns across the history, page from startAt 0. A field''s original value is in the first item that changed it; fields never changed leave no trace, and the log starts at the first edit, not at creation. On an item, from/to are IDs or raw values and are absent on text and array fields; fromString/toString are display text, and on array fields like labels each side is the complete set (space-joined, sorted) — diff the two sides, never read one as a delta. Jira omits from and fromString together when the field had no previous value, and to and toString together when it was cleared (so an assignee item with no to/toString is an unassignment). Match items on field, not position: order within an entry varies. Do not infer automation from author.accountType — a script running under a person''s token reads "atlassian".'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    issueIdOrKey: Issue key (PROJ-123), numeric ID, or a Jira issue URL
    startAt: Zero-based index of the first changelog entry to return (for pagination). Defaults to 0.
    maxResults: Maximum changelog entries per page (1-50). Defaults to 20; larger pages risk exceeding the client's token limit and failing the call. Use maxResults=1 as a cheap probe to read total before jumping to the end of the history.
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: listJiraIssueComments
  description: 'Get a paginated list of comments for a Jira issue. Use this instead of getJiraIssue when an issue has many comments — getJiraIssue embeds at most 20 and cannot page them. Page with startAt until isLast is true; total is the full comment count. Each comment reports any visibility restriction on it and, on JSM, whether it is internal (jsdPublic: false) — check both before quoting or summarising a comment. Comments are returned as a flat list: a non-null parentId means the comment is a reply, and parentId identifies its root/parent comment. Group comments by parentId to reconstruct threads. Set reactionDetail when emoji reaction data is needed. For the issue''s own fields, use getJiraIssue.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    issueIdOrKey: Issue key (PROJ-123), numeric ID, or a Jira issue URL
    startAt: Zero-based index of the first comment to return (for pagination). Defaults to 0.
    maxResults: 'Maximum number of comments to return per page (1-100). Defaults to 100. Read total from the response for the full count. With view: "full" the page is capped at 20, because a larger full-view page can exceed the client''s token limit and fail the whole call; the response echoes the effective value.'
    orderBy: Order comments by created date — "created"/"+created" (oldest first) or "-created" (newest first).
    expand: Comma-separated list of extra data to include on each comment, e.g. "renderedBody" (HTML-rendered body) or "properties".
    responseContentFormat: 'Format for comment bodies. Defaults to markdown. Set html to receive HTML, which is lossless, so a body can be passed straight back to addOrEditJiraIssueComment with contentFormat: html. Fetch as html before editing any comment, since markdown drops images, panels and expands and returns statuses/@mentions as literal text. A page holding any such comment is returned as HTML automatically. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.'
    reactionDetail: Reaction enrichment level. "none" (default) returns comments only, with no Reactions API call. "summary" adds emoji counts and whether the current user reacted. "users" also names who reacted — ask for it only when attribution is requested, since it costs an extra request per distinct emoji and reports when it could not expand every one.
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence", "full". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: listJiraIssueLinkTypes
  description: List the issue link types configured on this site, each with its name and its inward and outward wording (name "Blocks", inward "is blocked by", outward "blocks"). Call it before createJiraIssueLink, which takes the name, when the user has described a link by its inward/outward wording. Issue linking must be enabled site-wide; where it is turned off this operation and createJiraIssueLink both fail.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: listJiraIssueRemoteIssueLinks
  description: 'List the Confluence pages and external URLs linked from an issue''s Web links section. These are not issue-to-issue links: for those call getJiraIssue with view "evidence", which returns fields.issuelinks. Check here before calling createJiraIssueRemoteIssueLink: the same URL added twice becomes two separate links, and no operation removes one.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    issueIdOrKey: Issue key like PROJ-123
    globalId: Return only the link with this globalId — the creating system's identifier for the remote item, e.g. "appId=456&pageId=12345" for a Confluence page. It is not the id this tool returns, and the response never includes a globalId, so pass one only when the user supplied it. Pass it raw — the value is URL-encoded for you.
- name: listJiraIssueTransitions
  description: 'List the workflow transitions this issue can take right now, for the calling user. Pass a transition''s id to transitionJiraIssue. A transition''s name and the status it leads to are separate fields: when the user names a target status, match the status a transition leads to, not the transition''s name. For every status a project defines, rather than this issue''s currently valid moves, use listJiraStatuses.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    issueIdOrKey: Issue key (e.g. PROJ-123) or numeric ID
    transitionId: Return only the transition with this ID
    expand: Comma-separated expand tokens for extra detail. Use "transitions.fields" to include the fields shown on each transition's screen (for use with transitionJiraIssue).
    skipRemoteOnlyCondition: When true, include transitions hidden by the "Hide From User" condition (default false)
    includeUnavailableTransitions: When true, include transitions that currently fail a condition (default false)
    sortByOpsBarAndStatus: When true, sort by ops-bar sequence then status category (Todo, In Progress, Done); otherwise by ops-bar sequence only (default false)
    actionSource: Optional invocation attribution. Jira MCP cards set jira_mcp_card; omit for model/tool-loop calls.
- name: listJiraIssueWorklogs
  description: Get a paginated list of worklogs (logged time) for a Jira issue. Ordered by worklog creation time, not by when the work started — so the last page is not the most recent work. To find recent work, filter with startedAfter/startedBefore, or read every page and sort by `started`.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    issueIdOrKey: Issue key (PROJ-123), numeric ID, or a Jira issue URL
    startAt: Zero-based index of the first worklog to return (for pagination). Defaults to 0.
    maxResults: 'Maximum number of worklogs to return per page (1-100). Defaults to 100. Read total from the response for the full count. With view: "full" the page is capped at 20, because a larger full-view page can exceed the client''s token limit and fail the whole call; the response echoes the effective value.'
    startedAfter: 'Only return worklogs whose work started at or after this time, as a UNIX timestamp in milliseconds. Inclusive: a worklog starting exactly on this timestamp is returned.'
    startedBefore: 'Only return worklogs whose work started strictly before this time, as a UNIX timestamp in milliseconds. Exclusive: a worklog starting exactly on this timestamp is not returned. Pairs with startedAfter as a half-open range, so [dayStart, dayStart+86400000) is exactly one day with no double-counting or gaps between adjacent windows.'
    expand: Extra data to include on each worklog. The only supported value is "properties" (worklog properties).
    responseContentFormat: 'Format for worklog notes. Defaults to markdown. Set html to receive HTML, which is lossless, so a note can be passed straight back to addOrEditJiraIssueWorklog with contentFormat: html. A page holding any note markdown cannot represent (media, panels, statuses, @mentions) is returned as HTML automatically. An explicit markdown request is overridden for those bodies, with a warning saying so; appliedContentFormat in the response reports the format you actually got.'
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence", "full". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: listJiraProjectComponents
  description: List a Jira project's components with their ids, names, lead and assignee settings, and issueCount — 0 means no issues use a Jira component; Compass results list only components already linked to issues. realAssignee is who actually receives issues when the configured assignee cannot be used. Use it to find a valid component name before setting components on createJiraIssue or editJiraIssue.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    projectIdOrKey: Jira project key or numeric project ID whose components should be listed.
    query: Optional case-insensitive literal filter that matches component name or description.
