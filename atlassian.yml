- name: getCapacityPlanAllocations
  description: 'Find who is allocated to what work in Individual Capacity Planning, across ALL capacity plans - not scoped to a single plan. USE WHEN the user asks what someone is working on, who is working on an issue or project, whether a contributor is on a given work item, how loaded or available someone is, or how staffed a work item is. People are contributors, not assignees: allocation is independent of the Jira assignee field - use the Jira tools for assignees. Pass contributorDataIds for the work those people are allocated to, workDataIds for who is allocated to those items, or both to check one contributor against one item. At least one is required; resolve non-project work ARIs with listCapacityPlanNonProjectWork rather than fabricating them. Returns contributor-work associations with contributor and work names/keys. expand adds ''contributions'' (allocated value per period), ''contributorAggregations'' (a contributor''s total contribution AND availability across all plans - "how loaded is X") and ''workAggregations'' (total effort across all contributors on an item - "how staffed is PROJ-42"); both aggregations come back as separate top-level objects, and all three can be combined. IMPORTANT: contributionStartDate and contributionEndDate do NOT filter which associations are returned - they only set the window for the contribution and aggregation figures. To check whether a contributor is allocated during a period, request contributions for that window and see whether any come back. A baseline 40-hour working week means 5 days, 40 hours and 100 percent are the same amount - say so when reporting days or percentages.'
  params:
    contributorDataIds: Contributor ARIs shaped ari:cloud:identity::user/{accountId}, where {accountId} is an Atlassian account ID (e.g. ari:cloud:identity::user/5ea00a99d31fdf0c0d783dd5). Maximum 20. Finds the work these people are allocated to. At least one of contributorDataIds or workDataIds is required, and expand's contributorAggregations requires this one.
    workDataIds: 'Work item ARIs, maximum 20. Supported forms: Jira issues (ari:cloud:jira:{cloudId}:issue/{issueId}), Atlas projects (ari:cloud:townsquare:{cloudId}:project/{projectId}), and non-project work / custom contribution targets (ari:cloud:capacity-planning::custom-contribution-target/activation/{activationId}/{targetId}). Finds who is allocated to these items. At least one of contributorDataIds or workDataIds is required, and expand''s workAggregations requires this one.'
    contributionStartDate: 'Start of the window for the returned contribution and aggregation figures, as YYYY-MM-DD. Does NOT filter which associations are returned. Default window: no dates = one year either side of today, start only = two years forward, end only = two years back; when both are given they must be in order and span at most two years. The window also sets the default reporting period: weekly up to three months, monthly up to a year, quarterly beyond that.'
    contributionEndDate: End of that same window, as YYYY-MM-DD. Does NOT filter which associations are returned. See contributionStartDate for the default windows and the two-year limit.
    expand: 'Array of extras to include: ''contributions'' (allocated value per period in the contribution window, per allocation), ''contributorAggregations'' (per contributor, total contribution and availability across ALL capacity plans; requires contributorDataIds), and ''workAggregations'' (per work item, total contribution effort across ALL contributors; requires workDataIds, and carries totalContribution only, since work items have no availability). Both aggregations are returned as separate top-level objects. Combine freely, but omit expand entirely when the association itself is the answer, e.g. "is Chris on PROJ-42?" - each value costs extra work upstream.'
    contributionFormatOptions: 'Unit for every effort value returned - per-allocation contributions, contributor totals and availability, and work totals. Shape: { "valueType": "PERCENTAGE" | "HOURS" | "DAYS" }, default PERCENTAGE. Use HOURS or DAYS when the user asks about effort, PERCENTAGE for utilisation or how much of someone''s time is taken up. The response echoes the unit in its top-level valueType field. Applies whenever expand is set.'
    timeScale: 'Bucket granularity for the aggregation figures. Omitted means adaptive from the contribution window: weekly up to three months, monthly up to a year, quarterly beyond that. Only applies when expand includes contributorAggregations or workAggregations - per-allocation contributions always use the adaptive scale.'
    first: Page size for forward pagination. Mutually exclusive with last; pair with after for subsequent pages.
    after: Cursor for forward pagination. Pass pageInfo.endCursor from the previous response.
    last: Page size for backward pagination. Mutually exclusive with first; pair with before for previous pages.
    before: Cursor for backward pagination. Pass pageInfo.startCursor from the previous response.
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: getCodeFile
  description: 'Read the full contents of a single file in a connected source-control repository at a specific commit. Use this to inspect a file surfaced by searchCode: pass matchedFiles[].workspace, repo, path, and version (as commitHash) from that result. Returns the file''s text and a link to it.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    workspace: Repository owner — a Bitbucket workspace or GitHub organization. Use workspace (not namespace). Pass the matched file workspace from searchCode; do not infer it from the search filter.
    repo: Pass the matched file repo slug, e.g. example-repo, not example-org/example-repo; supply the owner separately in workspace.
    path: Repository-relative path to the file.
    commitHash: Commit to read the file at. A searchCode result's matchedFiles[].version, or a listCodeDirectory entry's commitHash, supplies one.
- name: getConfluenceApproval
  description: Get Confluence page approval availability, approval status, reviewers, and optional progress or history. For a general page status request, also call getConfluenceContentStatus; for approval status, use this tool only.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
