- name: getTalentFields
  description: 'Discover the workspace''s queryable Talent fields, or resolve the valid filter values for a specific field. Call BEFORE authoring RQL: with no fieldId it lists the available field IDs (including custom fields), grouped by what they describe (position, worker, team, skill, focus area, focus area type, proposal, proposed movement and view fields), excluding hidden fields; with a fieldId it returns that field''s valid values, paginated. Field IDs and values are workspace-specific and must not be guessed.'
  params:
    fieldId: ID of a single Talent field whose distinct values should be listed, as returned by this tool's list mode. Omit to list the workspace's configured field IDs instead.
    count: Values mode only — maximum number of field values to return in this page. 1-100, defaults to 100. Ignored when fieldId is omitted.
    rql: Values mode only — optional RQL filter restricting which positions contribute field values. Ignored when fieldId is omitted.
    cursor: Values mode only — forward pagination cursor from a previous response's endCursor. Ignored when fieldId is omitted.
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: getTalentGroupMetrics
  description: 'Aggregate Talent positions into COUNTS grouped by one to four position field IDs — headcount by country, by status, by level, by job family, by manager, or any nesting of those. Returns only the grouped counts and their field values, never the positions themselves: when the underlying list is wanted use searchTalentPositions, and when the breakdown is by reporting line or focus area use getTalentPositionsByEntity, which groups by entity rather than by field. Grouping field IDs are workspace-specific, must be groupable, and must not be guessed — call getTalentFields to resolve them. The common built-ins are positionCountry, positionStatus, positionLevel, positionRole, positionJobFamily, positionJobTitle, positionEmploymentType, positionManager and team.'
  params:
    groupingFieldIds: Ordered array of one to four unique groupable field ID strings to group the counts by, as returned by getTalentFields. Always pass an array, even for a single field, for example ["positionStatus"]. Supplying more than one produces nested groupings, for example ["positionCountry", "positionLevel"]. Passing more than four returns an empty result rather than an error, so keep to four or fewer.
    rql: Radar Query Language filter that scopes which positions are aggregated over. Field IDs and values are workspace-specific — resolve them with getTalentFields rather than guessing. Omit to group across all positions the caller can see.
    first: Maximum number of grouped rows to return, 1-100. Defaults to 50.
    after: Forward pagination cursor from a previous response's endCursor.
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: getTalentPosition
  description: 'Read a single Talent position by its ARI, returning its selected position field values and, optionally, field values for the worker filling it. Use this only when you already have the position ARI: take it from a searchTalentPositions result''s id, or from a getTalentPositionsByEntity result''s entityId — NOT that tool''s id, which is a connection node identifier and is not accepted here. To FIND a position rather than read a known one, use searchTalentPositions. To identify the worker filling the position, request positionWorker in positionFieldIdIsIn — that yields the worker''s id, name and accountId. Do not rely on workerFieldIdIsIn for more than that: the backing action accepts it but does not currently return the requested worker field values, so attributes like skills or email will not come back here. Field IDs are workspace-specific and must not be guessed — call getTalentFields to resolve them. Common position built-ins are positionJobTitle, positionCountry, positionLevel, positionStatus, positionManager and positionWorker.'
  params:
    positionAri: ARI of the Talent position to fetch. Take it from a searchTalentPositions result's id, or from a getTalentPositionsByEntity result's entityId. Do NOT pass a getTalentPositionsByEntity result's id — that identifies the row within its connection and returns an empty result here.
    positionFieldIdIsIn: Array of position field ID strings to return, as returned by getTalentFields. When omitted, a default set of position fields is returned.
    workerFieldIdIsIn: Array of worker field ID strings for the position's worker, as returned by getTalentFields. Accepted by the backing action but currently ineffective — the requested values are not returned, so expect only the worker id, name and accountId that positionWorker already provides. Omit unless you are deliberately probing this.
