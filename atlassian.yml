- name: updateCapacityPlanAllocations
  description: 'Allocate people to a single work item over one or more time periods in Individual Capacity Planning. USE WHEN the user asks to put someone on a work item for a period, to change how much of their time it takes, to book leave, or to clear an allocation. Every person in contributorDataIds is assigned to the work item automatically, so it does not need to be assigned to them first, and every allocation is applied to every person - the number of writes is contributorDataIds x allocations, which must not exceed 100. Only one work item per call. Resolve a non-project work ARI with listCapacityPlanNonProjectWork rather than fabricating one. Each allocation covers a period and carries the TOTAL effort for that period, of any length. To express a RATE, send one allocation per interval: "2 days a week for three weeks" is three allocations of 2, NOT one allocation of 2 spanning three weeks. A single allocation spanning all of September means "this much effort across September", which the plan spreads over the weeks in it. Re-running the same periods REPLACES those allocations rather than adding to them, so the call is safe to repeat; set value to 0 to clear a period. Because value is the TOTAL for the period and re-running replaces it, any RELATIVE change - "add a day", "bump Chris to 3 days", "halve it" - needs the current figure first. Call getCapacityPlanAllocations with the same contributorDataIds and workDataIds, the same date window, and expand: ["contributions"], then send the new total. Writing the relative amount directly overwrites the existing allocation instead of adding to it. An absolute request ("put Chris on PROJ-42 at 50% in September") needs no prior read. This does NOT add anyone to a capacity plan and cannot create work items - contributors and work items are global, so an allocation written here shows up on every plan they belong to, matching the UI. Add ''contributions'' to expand to return the value written per period and confirm what landed, ''contributorAggregations'' for each person''s total contribution and availability across ALL their work in the allocated window (use this to report whether the change has pushed someone over capacity), and ''workAggregations'' for the work item''s total effort across ALL contributors. Both aggregations come back as separate top-level objects. Omit expand when a simple confirmation is enough - each value costs extra work upstream. Capacity plans assume a baseline 40-hour working week, so 5 DAYS, 40 HOURS, and 100 PERCENTAGE are all the same amount - say so when reporting days or percentages.'
  params:
    contributorDataIds: Array of contributor ARIs identifying the people to allocate, in the form ari:cloud:identity::user/{accountId} where {accountId} is an Atlassian account ID (e.g. ari:cloud:identity::user/5ea00a99d31fdf0c0d783dd5). Each person is assigned to the work item if not already, and every allocation is applied to every person. Maximum 100, and contributorDataIds x allocations must not exceed 100.
    workId: 'ARI of the single work item to allocate to. Supported forms: Jira issues (ari:cloud:jira:{cloudId}:issue/{issueId}), Atlas projects (ari:cloud:townsquare:{cloudId}:project/{projectId}), and non-project work / custom contribution targets (ari:cloud:capacity-planning::custom-contribution-target/activation/{activationId}/{targetId}). One work item per call - allocating the same people to a second work item needs a second call.'
    allocations: 'The periods to allocate, each applied to every person in contributorDataIds. Array of objects shaped { "startDate": "YYYY-MM-DD", "endDate": "YYYY-MM-DD", "value": 2 } - all three fields required, startDate not after endDate, value a number >= 0 where 0 clears that period. value is the TOTAL effort for the period in the unit given by valueType, so send one object per interval to express a rate. Periods must be distinct; two objects covering the same period is an error. Maximum 100, and contributorDataIds x allocations must not exceed 100.'
    valueType: Unit for every value in allocations and for all returned effort figures. Defaults to PERCENTAGE. Use PERCENTAGE when the request is about utilisation or how much of someone's time is taken up, HOURS or DAYS when it is about effort. A baseline working week is 40 hours, so 5 DAYS, 40 HOURS, and 100 PERCENTAGE are all the same amount.
    expand: 'Optional extra data to return after the write, as an array of strings. Supported values: ''contributions'' (the value written per period, per allocation, so the result can be confirmed back to the user), ''contributorAggregations'' (per person allocated, total contribution and availability across ALL of their work for the allocated window - returned as a separate top-level object; use it to report whether the change left someone over-allocated), and ''workAggregations'' (the work item''s total contribution effort across ALL contributors on it - a separate top-level object with totalContribution only). Combine freely, or omit when a simple confirmation is enough.'
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: updateCapacityPlanNonProjectWork
  description: Rename an existing non-project work item in Individual Capacity Planning. "Non-project work" is a bucket of time that is not a Jira issue or an Atlas project, such as Leave, Run the Business (RtB), on-call, or training. USE WHEN the user asks to rename an existing non-project work item. This only changes the item's name; it does not move allocations, add contributors, or delete anything. To change who is allocated or how much effort a period carries, use updateCapacityPlanAllocations instead. Resolve the item's id first with listCapacityPlanNonProjectWork rather than fabricating one. Returns whether the update succeeded and any errors.
  params:
