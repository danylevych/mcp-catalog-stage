- name: listJiraProjects
  description: Find the Jira projects the calling user can see — use it to resolve the projectKey that createJiraIssue requires, or the project a JQL search filters on. For a project's releases use getJiraProjectVersions; for its statuses, use listJiraStatuses.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    query: Filter results by a literal string matching project key or name (case insensitive).
    action: 'Filter by the action the user can perform on the project: view, browse, edit, or create. Defaults to view when omitted.'
    startAt: Index of the first result to return (page offset). Defaults to 0.
    maxResults: Maximum results to return per page (max 100, default 50).
    expand: 'Comma-separated list of extra data to include per project. Options: description, url, projectKeys, lead (project lead account), issueTypes (issue types available in the project), insight (total issue count and last update time). Example: "issueTypes,lead".'
- name: listJiraStatuses
  description: List the statuses a Jira issue can be in — for a project (per work type), for one status looked up by ID or name, or across the whole site by name or category. Takes a PROJECT key (or project ID), not an issue key. For what a specific issue can do right now, use listJiraIssueTransitions instead; a status existing in a project does not mean a given issue can move to it.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    mode: Which question to answer. "project" lists a project's statuses per work type (e.g. what statuses a Bug can be in for PROJ) — pass issueType to narrow to one work type. "status" resolves a single status you saw elsewhere (changelog, JQL, user phrasing) to its ID, name, and category. "site" searches statuses across the site by nameContains and/or statusCategory, returning ID and name only — use mode "status" for the full detail on any one of them.
    projectKey: Project key (e.g. PROJ) or numeric project ID — not an issue key. Required when mode is "project".
    issueType: Only with mode "project". Narrows the result to one work type, matched by name or ID (e.g. "Bug"), so the statuses returned are exactly that work type's. Omit to get every work type in the project.
    statusIdOrName: Only with mode "status". Numeric status ID (preferred) or status name. Names are not unique in Jira, so a name returns one match with a warning — use mode "site" with nameContains to see every status sharing a name.
    nameContains: Only with mode "site". Case-insensitive substring match on the status name. Combine with statusCategory to narrow further. Omitting both filters returns a capped sample of the site's statuses rather than all of them.
    statusCategory: 'Only with mode "site". Restricts results to one status category: "new" (not started), "indeterminate" (in progress), or "done".'
