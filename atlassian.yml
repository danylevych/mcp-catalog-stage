- name: getBitbucketRepoPullRequestMergeability
  description: 'Reports current mergeability checks without performing a merge or triggering custom checks. Each check has status and blocking: use blocking=true to identify current blockers; FAILED or PENDING alone is not enough. A required pending custom_pre_merge_check blocks until it completes; a pending custom_on_merge_check with blocking=false allows the merge attempt and runs during it, so do not wait for that on-merge check. UNKNOWN means the check could not be evaluated, not that it passed. No current blockers is not a guarantee the subsequent merge will succeed: refs, permissions, and check results can change, and custom on-merge checks can still fail during the merge. Use mergeBitbucketRepoPullRequest to attempt the merge and handle any errors from that attempt.'
  params:
    workspaceId: Workspace slug or UUID
    repoId: Repository slug or UUID
    prId: Pull request ID
    excludeGitMergeabilityCheck: 'When true, omit the git merge conflict check, the most expensive one to compute. Defaults to false: omitted or false includes the check. When this check is excluded, no returned blockers does not establish that the PR is conflict-free or fully mergeable.'
    excludeMaximumCommitsBehind: 'When true, omit the check that the source branch is not too far behind the destination. Defaults to false: omitted or false includes the check. When this check is excluded, no returned blockers does not establish full mergeability.'
