- name: convertJiraIssueHierarchy
  description: 'Convert an existing Jira issue across hierarchy levels: a standard issue (Task, Bug, Story) into a sub-task under a parent, or a sub-task back into a standard issue. Mirrors Jira''s Move / Convert-to-sub-task wizard: preview destination compatibility (mode=preview_step1), preview field retain/remap/drop (mode=preview_step2), then execute (mode=confirm). Do not use this for same-level type edits such as Bug → Story — use editJiraIssue for those. Task → Sub-task: always ask the user for parentIssueKey before calling. Do not search for, infer, or pick a parent. If they did not name a parent, ask them instead of calling this tool. The parent must be a standard issue. If this result has CHILD_ISSUES_WILL_REPARENT, those children will get the same new parent — ask the user to accept that, then confirm with acknowledgeChildReparent=true. If this result has SOURCE_HAS_SUBTASKS, the convert is blocked; tell the user that. Do not mention another project style. If preview execution.method is bulk-move, or confirm returns MOVE_CONFIRMATION_REQUIRED, this is Jira''s Move wizard: list the destination project, statusMapping, and fieldPlan.dropped to the user and ask them to accept that status change and that those fields will be dropped. Do not convert until they accept, then retry with mode=confirm and acknowledgeMove=true. If they decline, stop. Sub-task → Task: no parent needed; confirm clears the parent. After convert, reply with this issue''s key, new type, and parent. If appliedChanges.dropped is present, also name those dropped fields. If appliedChanges.status is present, also name that status change. Do not mention bulk-move permissions or project-style notes.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    issueIdOrKey: Issue key or ID to convert (e.g. PROJ-123).
    targetIssueType: Destination issue type name or ID. Use a sub-task type to demote a standard issue, or a standard type (Task, Bug, Story) to promote a sub-task. Same-level changes (Bug → Story) are rejected.
    parentIssueKey: Parent issue key required when converting a standard issue into a sub-task. The user must provide this key — do not search for, infer, or pick a parent, including from other issues in the same project. The parent must be a standard issue in the destination project. Ignored when promoting a sub-task to a standard type.
    targetProjectKey: Optional destination project key. Omit to convert in the issue's current project. A different project uses Jira's bulk move API for this single issue (requires global Bulk change plus Move/Create issue permissions).
    fieldRemap: Optional values for fields that are required on the destination type and empty or incompatible on the source. Keys may be field names or customfield_* IDs. Call mode=preview_step2 first to see fieldPlan.requiresInput.
    mode: preview_step1 (default) returns destination compatibility without converting. preview_step2 adds the field retain/remap/drop plan. confirm executes the conversion. Omitting mode never mutates.
    confirm: When true, executes the conversion (same as mode=confirm). Prefer mode=confirm. Preview modes never convert, even if confirm is false.
    acknowledgeChildReparent: Required as true on mode=confirm when converting a team-managed issue that already has child sub-tasks. Those children become sub-tasks of the same new parentIssueKey (Jira does not nest sub-tasks). After preview, show CHILD_ISSUES_WILL_REPARENT and only set this after the user accepts that. Ignored on company-managed projects (those conversions are blocked) and when the source has no children.
    acknowledgeMove: Required as true on mode=confirm when this conversion uses Jira's Move instead of a direct issue edit (preview execution.method is bulk-move, or confirm returned MOVE_CONFIRMATION_REQUIRED). After preview, show the destination project, statusMapping, and any fieldPlan.dropped names and only set this after the user accepts that status change and that those fields will be dropped. Not needed when a same-project convert succeeds via a direct issue edit.
- name: copyConfluenceContent
  description: Copy a Confluence page, whiteboard, database, folder, or embed to a new parent
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    contentId: ID of the source Confluence content entity to copy. Numeric content ID (up to 19 digits).
    title: Explicit title for the copied content (1–255 chars).
    parentContentId: ID of the parent content entity to copy under. Provide this OR destinationSpaceKey, not both. Numeric content ID (up to 19 digits).
    destinationSpaceKey: Key of the destination space to copy to the root of. Provide this OR parentContentId, not both.
