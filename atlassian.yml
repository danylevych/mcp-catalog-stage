    content_url: 'Required when content_id is omitted. Full URL of the Confluence content. Supported: pages/live docs (/pages/{id}), blog URLs (/blog/{id}), whiteboards (/whiteboard/{id}), databases (/database/{id}), folders (/folder/{id}), and TinyUrl (/wiki/x/{key}). Prefer this for URLs copied from Confluence. One of content_id or content_url is required.'
