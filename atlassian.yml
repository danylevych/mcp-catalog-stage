    connection: 'Connection type and targets to add. Provide { "type": "<type>", "targets": [...] }. Supported types are TAG, FOLLOWER, TEAM, PROJECT, and JIRA_WORK_ITEM. TAG targets contain exactly one tag id or name. FOLLOWER targets contain an Atlassian account id. All other targets contain the target ARI in id.'
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
- name: addConnectionsToProjects
  description: Add one type of connection to one or more Atlassian Projects.
  params:
    projectIds: Project ARIs to connect. The number of Projects multiplied by the number of targets must not exceed 50.
