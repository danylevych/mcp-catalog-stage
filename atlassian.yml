- name: replaceConfluenceContentPermissions
  description: 'Replaces ALL content-level permission grants on a single Confluence content entity with the supplied set. Grants not present in the request are removed, so this can revoke access — prefer addConfluenceContentPermissions when you only intend to add grants. Pass the full desired grant set via the `permissions` input, an array of objects shaped exactly like: [ { "operation": "update", "principals": [ { "principalType": "user", "principalId": "<atlassian-account-id>" }, { "principalType": "group", "principalId": "<group-id>" } ] } ] Enums: operation is one of read | update; principalType is one of user | group. For a user, principalId is the Atlassian account ID; for a group, principalId is the group ID. operation `read` = can view, `update` = can edit (edit includes view). A principal has only ONE effective level, so listing a principal under `read` when they should keep editing leaves them view-only — list them under `update` to preserve edit. Never list the same principal under both operations. Replacing Specific access does not change General access. Because this REPLACES the whole set, always include yourself with `update` if the content is (or is becoming) EDIT_RESTRICTED / VIEW_RESTRICTED. The server protects against locking the current user out of their own content.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    contentId: Numeric ID of the Confluence content entity (page, blog post, whiteboard, database, folder, etc.) whose permission grants should be fully replaced.
    permissions: 'The complete desired set of permission grants. Array of objects, each with an `operation` (read | update) and a `principals` array. Each principal has a `principalType` (user | group) and a `principalId` (Atlassian account ID for a user, group ID for a group). Grants not listed here are removed. A principal must appear under only one operation across the entire request. Example: [{ "operation": "update", "principals": [{ "principalType": "group", "principalId": "<group-id>" }] }].'
