    propertyKey: The full property key to set. Must be namespaced under "atlassian-mcp." prefix (e.g. "atlassian-mcp.config") or call is rejected. This keeps MCP-written properties isolated from app-written keys.
    value: 'Full property value to store; replaces any existing value for the key. Accepts any valid JSON — object, array, string, number, or boolean (e.g. {"enabled": true, "level": 3}, [1, 2, 3], "dark", or 42). Must be non-empty: null and blank strings are rejected.'
