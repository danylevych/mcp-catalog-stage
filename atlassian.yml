  description: Sets a single property (technical key/value store) on a specific Jira entity (issue, issueComment, issueWorklog, dashboardItem, user), creating or overwriting it. Returns {key, entityType, status}, status being "created" or "updated"; the value you wrote is not returned — read it back with getJiraEntityProperty.
