- name: getLoomVideo
  description: 'Reads a Loom video''s core metadata and optionally its transcript, comments, AI agent briefs, AI-extracted meeting action items, or attached links in one call via the expand input. USE WHEN the user asks about a specific Loom video — its title, description, duration, owner, view/comment/reaction counts, what was said in it (pass expand: ["transcript"]), what feedback or comments people left on it (pass expand: ["comments"]), what the AI summarised as key points (pass expand: ["agentBriefs"]), or what follow-up tasks or action items the AI extracted from a meeting recording (pass expand: ["meetingActionItems"]), or which links are attached to it (pass expand: ["links"]). DO NOT USE to get the downloadable MP4 file — use getLoomVideoDownloadUrl for that. To find a video''s ARI first, use listLoomVideos or listLoomVideosSharedWithMe.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    videoAri: ARI of the Loom video, formatted as ari:cloud:loom:{siteId}:video/activation/{activationId}/{videoId}. Provide this or videoUrl.
    videoUrl: Loom share URL for the video, for example https://www.loom.com/share/{videoId}. Used when videoAri is not supplied; a supporting action resolves the URL to an ARI.
    expand: Optional list of extra data to include in the response, in addition to core metadata. Any subset of "transcript", "comments", "agentBriefs", "meetingActionItems", "links". Omit for core metadata only — nothing is included by default.
    transcriptFormat: Transcript response shape when expand includes "transcript". Use "text" for summaries, extraction, implementation instructions, and general "what was said" questions. Use "phrases" only when timestamps, speaker/chunk structure, or quote-to-time answers are needed. Use "both" only when the caller explicitly needs both representations.
    commentsFirst: Maximum number of comments to return when comments is included via expand (1-100).
    commentsAfter: Pagination cursor to fetch the next page of comments when comments is included via expand.
    linksFirst: Maximum number of links to return when links is included via expand (1-50).
    linksAfter: Pagination cursor to fetch the next page of links when links is included via expand.
- name: getLoomVideoDownloadUrl
  description: 'Get a time-limited signed URL to download the actual MP4 file of a Loom video. This is the tool to use when the user wants the video file itself (to download, re-upload, or process), not its transcript or metadata (use getLoomVideo for those). MP4 generation is asynchronous: the response includes a status and, when not yet ready, a retryAfterSeconds hint — poll this tool until status is READY, then use the returned url before expiresAt. Identify the video by ARI or share URL.'
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    videoAri: ARI of the Loom video, formatted as ari:cloud:loom:{siteId}:video/activation/{activationId}/{videoId}. Provide this or videoUrl.
    videoUrl: Loom share URL for the video, for example https://www.loom.com/share/{videoId}. Used when videoAri is not supplied; a supporting action resolves the URL to an ARI.
- name: getMyWork
  description: Read the signed-in user's recent Jira, Confluence, Goals, Projects and Loom activity on one site. Returns things worked on or viewed, newest activity first, with titles, URLs and activity timestamps. Uses Activity Platform with no enriched graph-context or Cypher calls. Assigned work is not part of this feed. The lookback is configurable and defaults to 90 days.
  params:
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
    type: Which activity type to fetch. One call returns one type.
    product: Filter worked-on activity to Goals or Projects. Omit for the shared multi-product feed. Cannot be combined with viewed activity.
    limit: Maximum number of activity items to request (1-50).
    sinceDays: Include activity from this many days before the first page's request (1-3650). Keep this value unchanged when continuing with a cursor.
    cursor: Opaque nextCursor from the previous response for the same site, user, activity type, product and sinceDays. Preserves the first page's absolute lookback boundary. Invalid or legacy cursors require restarting without a cursor.
    view: 'Output view preset. Default: "compact". Options: "compact", "evidence", "full". compact = minimal fields for scanning; evidence = decision-relevant detail; full = complete response.'
- name: getProject
  description: Retrieve one Atlassian Project by its exact Project ARI or key, with optional related details.
  params:
    identifier: Exact Project ARI or key. A key may contain multiple hyphens and must end in a numeric segment.
    cloudId: Site UUID or Jira/Confluence URL for this operation's Atlassian site. cloudId is never silently auto-resolved or reused for you — call getAccessibleAtlassianResources ONCE per session, cache the returned cloudId, and pass it explicitly on this and every subsequent call, since most operations need it. `execute` and its read/write/destructive variants strictly require it for cloudId-scoped operations and fail without it. Not needed for cloudId-less operations (e.g. Bitbucket), which ignore this field.
