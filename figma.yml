name: Figma
entryKey: figma
shortDescription: Read Figma file layout, styles, components, and design tokens to implement designs in code
description: |
  Read Figma designs through the Figma REST API: layout, content, styles, and component information for files, frames, and nodes, simplified so a coding agent can implement the design in any framework.

  See the [Figma Context MCP documentation](https://github.com/GLips/Figma-Context-MCP#readme) for setup instructions and current capabilities. This is a community server that authenticates with a Figma personal access token, not Figma's official remote MCP server.

  ## Features
  - **Design data**: Fetch layout, text, fills, strokes, effects, and component metadata for a whole file or a single node
  - **Link support**: Pass a Figma file key and node ID taken from a design URL
  - **Compact output**: Design data is simplified to cut token usage compared with the raw Figma API response

  ## What you'll need to connect

  **Required:**
  - **Figma API Key**: A Figma personal access token. In Figma, open your account menu, then **Settings > Security > Personal access tokens** and select **Generate new token**. Grant the **File content: Read-only** scope, and **Current user: Read-only** if offered. The token is shown only once, so copy it immediately.

  The token can read every file its owner can open. Usage telemetry is turned off for this server.
metadata:
  categories: "Business"
icon: https://img.icons8.com/?size=100&id=zfHRZ6i1Wg0U&format=png&color=000000
repoURL: https://github.com/GLips/Figma-Context-MCP
runtime: npx
npxConfig:
  package: figma-developer-mcp@0.13.2
  args:
    - --stdio
    - --no-telemetry
    - --skip-image-downloads
toolPreview:
  - name: get_figma_data
    description: Get comprehensive Figma file data including layout, content, visuals, and component information
    params:
      depth: How many levels deep to traverse the node tree. Only set it if the user asks for it
      fileKey: The key of the Figma file, taken from the URL (figma.com/design/<fileKey>/...)
      nodeId: The ID of a node to fetch, like 1234:5678, taken from the node-id URL parameter. Fetches the whole file when omitted
config:
  - name: Figma API Key
    key: FIGMA_API_KEY
    description: Your Figma personal access token. Create one under Settings > Security > Personal access tokens with the File content read-only scope.
    sensitive: true
    required: true
    usage: env
